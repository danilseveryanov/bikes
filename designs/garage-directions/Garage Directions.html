<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гараж — три направления</title>
<style>
:root{
  --page:#101014; --page2:#17171c; --edge:#26262e; --ink:#f2f2f5; --ink2:#9b9ba6; --ink3:#6a6a76;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono",monospace;
  --b1:#3987e5; --b2:#d95926; --b3:#199e70; --b4:#c98500; --b5:#d55181;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding:28px 24px 80px;-webkit-font-smoothing:antialiased}

/* ── шапка канвы ── */
.top{max-width:1400px;margin:0 auto 26px}
.top h1{font-size:26px;font-weight:800;letter-spacing:-.03em}
.top p{color:var(--ink2);font-size:14px;margin-top:6px;max-width:70ch}
.knobs{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.knob{background:var(--page2);border:1px solid var(--edge);color:var(--ink);
  padding:9px 14px;font:600 13px/1 var(--mono);cursor:pointer}
.knob[aria-pressed="true"]{background:var(--ink);color:var(--page);border-color:var(--ink)}

/* ── раскладка артбордов ── */
.canvas{display:flex;gap:26px;max-width:1400px;margin:0 auto;align-items:flex-start;
  overflow-x:auto;padding-bottom:12px}
.art{flex:0 0 auto;width:430px}
.art > figcaption{margin-bottom:12px}
.art .tag{font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.art .nm{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:7px}
.art .desc{font-size:13px;color:var(--ink2);margin-top:5px;line-height:1.45;min-height:56px}
.frame{width:430px;height:932px;overflow:hidden;position:relative;border:1px solid var(--edge)}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden}
.scroller::-webkit-scrollbar{width:0}

/* режим цен */
body[data-money="off"] .money{visibility:hidden}

/* ══════════════════════════════════════════ A · МАСТЕРСКАЯ ══ */
.a{--bg:#0a0a0c;--sf:#141417;--sf2:#1c1c21;--ln:#26262c;--tx:#f4f4f6;--tx2:#9e9ea8;--tx3:#6a6a74;--ac:#2dd4bf;--dg:#fb7185;
  background:var(--bg);color:var(--tx);min-height:100%;font-size:16px;padding-bottom:70px}
.a .hd{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:14px 18px 12px}
.a .hd h2{font-size:24px;font-weight:750;letter-spacing:-.035em}
.a .hd .sub{font-size:13.5px;color:var(--tx2);margin-top:2px}
.a .scene{height:190px;position:relative;overflow:hidden;
  background:linear-gradient(#0c1a2f 0%,#182d49 40%,#2f5279 72%,#20395c 100%)}
.a .strip{position:absolute;bottom:8px;left:0;right:0;display:flex;gap:6px;padding:0 14px;align-items:flex-end}
.a .road{position:absolute;bottom:0;left:0;right:0;height:44px;background:linear-gradient(#2f4a6b,#263d59);border-top:2px solid rgba(255,255,255,.14)}
.a .lbl{font:700 11px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--tx2);
  border-left:2px solid #34343d;padding-left:10px;margin:24px 18px 10px;display:flex;gap:9px;align-items:center}
.a .lbl b{background:var(--sf2);color:var(--tx);padding:1px 7px;font-size:11px;letter-spacing:0;font-weight:700}
.a .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 18px;margin-top:16px}
.a .kpi{background:var(--sf);border-top:4px solid var(--ac);padding:13px 12px}
.a .kpi .k{font:700 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.a .kpi .v{font:700 22px/1.1 var(--mono);letter-spacing:-.04em;margin-top:6px;display:block}
.a .kpi .s{font-size:11px;color:var(--tx3);margin-top:4px;display:block}
.a .card{background:var(--sf)}
.a .att{display:flex;align-items:center;gap:12px;padding:14px 16px}
.a .att .dot{width:7px;height:7px;border-radius:50%;background:var(--b2);flex:none}
.a .att .t1{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a .att .t2{font:12.5px/1.4 var(--mono);color:var(--tx2);margin-top:3px}
.a .chip{font:700 11.5px/1 var(--mono);padding:4px 8px;background:var(--dg);color:#20060c;flex:none}
.a .bike{display:flex;background:var(--sf);margin-bottom:10px}
.a .bar{width:8px;flex:none}
.a .bbody{flex:1;min-width:0;padding:15px 16px;display:flex;gap:13px;align-items:center}
.a .ph{width:54px;height:54px;background:var(--sf2);flex:none;display:flex;align-items:center;justify-content:center;font-size:23px}
.a .bn{font-size:16.5px;font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a .bm{font-size:13px;color:var(--tx2);margin-top:3px}
.a .bs{font:12.5px/1 var(--mono);color:var(--tx3);margin-top:7px;display:flex;gap:8px}
.a .nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid #34343d;padding:5px 4px 8px}
.a .nav i{flex:1;text-align:center;font:600 10px/1 var(--mono);color:var(--tx3);padding:9px 0;font-style:normal}
.a .nav i.on{color:var(--ac)}
.a .nav i span{display:block;font-size:17px;margin-bottom:5px;font-style:normal}

/* ══════════════════════════════════════════ B · НАБЕРЕЖНАЯ ══ */
.b{--bg:#070a10;--sf:rgba(255,255,255,.045);--tx:#eef2f8;--tx2:#93a1b5;--ac:#7fd4c1;
  background:var(--bg);color:var(--tx);min-height:100%;position:relative}
.b .sky{position:absolute;top:0;left:0;right:0;height:520px;
  background:linear-gradient(#060a12 0%,#0d1a2e 34%,#1b3a5c 62%,#2b5a80 82%,#16283d 100%)}
.b .moon{position:absolute;top:78px;right:52px;width:54px;height:54px;border-radius:50%;
  background:#f4e9c8;box-shadow:0 0 60px 22px rgba(244,233,200,.16)}
.b .sil{position:absolute;top:236px;left:0;right:0;height:120px}
.b .water{position:absolute;top:356px;left:0;right:0;height:150px;background:linear-gradient(#12304d,#0a1a2c)}
.b .water i{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.07);font-style:normal}
.b .bhero{position:absolute;top:392px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.b .title{position:relative;padding:74px 24px 0;text-align:center}
.b .title h2{font:800 40px/1.02 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.045em}
.b .title p{font:12.5px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--tx2);margin-top:12px}
.b .sheet{position:relative;margin-top:330px;background:rgba(9,13,20,.86);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  border-top:1px solid rgba(255,255,255,.1);border-radius:26px 26px 0 0;padding:10px 20px 90px;min-height:520px}
.b .grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:0 auto 20px}
.b .urgent{background:linear-gradient(100deg,rgba(217,89,38,.2),rgba(217,89,38,.05));
  border:1px solid rgba(217,89,38,.38);border-radius:16px;padding:16px 18px}
.b .urgent .k{font:700 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#e6a184}
.b .urgent .t{font-size:16px;font-weight:650;margin-top:9px;line-height:1.3}
.b .urgent .s{font:12.5px/1.5 var(--mono);color:var(--tx2);margin-top:6px}
.b .row3{display:flex;gap:20px;margin:26px 2px 0}
.b .row3 div{flex:1}
.b .row3 .k{font:11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx2)}
.b .row3 .v{font:300 30px/1 -apple-system,sans-serif;letter-spacing:-.03em;margin-top:9px}
.b .sect{font:11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tx2);margin:34px 2px 14px}
.b .brow{display:flex;align-items:center;gap:15px;padding:15px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
.b .swatch{width:3px;height:38px;flex:none;border-radius:2px}
.b .bn{font-size:16px;font-weight:600;letter-spacing:-.015em}
.b .bm{font:12px/1.4 var(--mono);color:var(--tx2);margin-top:3px}
.b .go{margin-left:auto;color:var(--tx2);font-size:19px}
.b .nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:9px;padding:14px}
.b .nav i{font-style:normal;font:600 11px/1 var(--mono);color:var(--tx2);padding:11px 15px;
  background:rgba(255,255,255,.06);border-radius:22px}
.b .nav i.on{background:var(--ac);color:#06231d}

/* ══════════════════════════════════════════ C · СЕРВИСНАЯ КНИЖКА ══ */
.c{--pa:#12110f;--pa2:#1a1917;--rule:#2b2926;--tx:#efece5;--tx2:#98928a;--ac:#c8a951;--dg:#c25c4a;
  background:var(--pa);color:var(--tx);min-height:100%;
  background-image:repeating-linear-gradient(transparent 0 33px,rgba(255,255,255,.028) 33px 34px)}
.c .top{display:flex;align-items:flex-start;gap:14px;padding:20px 18px 16px;border-bottom:2px solid var(--rule)}
.c .stamp{width:62px;height:62px;border:2px solid var(--ac);flex:none;position:relative;
  display:flex;align-items:center;justify-content:center;transform:rotate(-4deg)}
.c .stamp svg{width:44px;height:32px}
.c .top h2{font:800 21px/1.1 var(--mono);letter-spacing:-.03em}
.c .top .meta{font:11.5px/1.6 var(--mono);color:var(--tx2);margin-top:7px;letter-spacing:.04em}
.c .band{display:flex;border-bottom:2px solid var(--rule)}
.c .band div{flex:1;padding:13px 14px;border-right:1px solid var(--rule)}
.c .band div:last-child{border-right:0}
.c .band .k{font:11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx2)}
.c .band .v{font:700 24px/1 var(--mono);margin-top:8px;letter-spacing:-.03em}
.c .sec{font:700 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--ac);
  padding:22px 18px 10px;display:flex;align-items:center;gap:11px}
.c .sec::after{content:"";flex:1;height:1px;background:var(--rule)}
.c .warn{margin:0 18px;border-left:3px solid var(--dg);padding:12px 14px;background:rgba(194,92,74,.09)}
.c .warn .t{font-size:15px;font-weight:650;line-height:1.3}
.c .warn .s{font:12px/1.5 var(--mono);color:var(--tx2);margin-top:6px}
.c .entry{display:flex;gap:14px;padding:16px 18px;border-bottom:1px solid var(--rule);align-items:baseline}
.c .no{font:700 13px/1 var(--mono);color:var(--ac);flex:none;width:26px;letter-spacing:.02em}
.c .en{font-size:16px;font-weight:650;letter-spacing:-.015em}
.c .em{font:12px/1.5 var(--mono);color:var(--tx2);margin-top:4px}
.c .tick{margin-left:auto;font:11px/1 var(--mono);color:var(--tx2);flex:none;text-align:right}
.c .sold{opacity:.45}
.c .tabs{position:absolute;top:0;right:0;bottom:0;width:34px;display:flex;flex-direction:column;
  border-left:2px solid var(--rule);background:var(--pa2)}
.c .tabs i{flex:1;writing-mode:vertical-rl;font:700 10px/34px var(--mono);letter-spacing:.2em;
  text-transform:uppercase;color:var(--tx2);text-align:center;border-bottom:1px solid var(--rule);font-style:normal}
.c .tabs i.on{background:var(--ac);color:#1a1509}
.c .pad{padding-right:34px}
</style>
</head>
<body data-money="off">

<div class="top">
  <h1>Гараж — три направления</h1>
  <p>Один экран, ваши настоящие данные, 430×932. Первый вариант — нынешний, доведённый. Два других отходят по всем четырём осям: характер, компоновка, движение и сама сцена. Прокрутите каждый макет внутри рамки.</p>
  <div class="knobs">
    <button class="knob" id="money" aria-pressed="false">Показать цены</button>

<div class="canvas">

    </figcaption>
    <div class="frame"><div class="scroller"><div class="a">

        <div class="road"></div>
        <div class="strip">
          <span style="flex:0 0 auto;text-align:center">

      </div>
      <div class="kpis">

      <div class="card">

  </figure>

  <!-- ═══════════ B ═══════════ -->
  <figure class="art" data-screen-label="B · Набережная">
    <figcaption>
      <div class="tag">Направление B · смелое</div>
      <div class="nm">Набережная</div>
      <div class="desc">Сцена занимает весь первый экран, содержимое поднимается поверх неё панелью. Ночной город, крупная лёгкая типографика, минимум рамок. Движение: панель едет при прокрутке.</div>
    </figcaption>
    <div class="frame"><div class="scroller"><div class="b">
      <div class="sky"></div><div class="moon"></div>
      <svg class="sil" viewBox="0 0 400 120" preserveAspectRatio="none">
        <path d="M0 120V96h34v24z M46 120V92l16-6 16 6v28z M92 120V94h24v26z M98 94V76h12v18z M104 12l6 64h-12z
                 M136 120V92h56v28z M152 92V72h24v20z M152 72a12 12 0 0124 0z M161 60h6v-5h-6z
