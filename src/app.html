:root{
  --disp:"Unbounded",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono","Cascadia Mono",monospace;
  --ease:cubic-bezier(.22,.68,0,1);
  --b1:#4a90e2; --b2:#e2703a; --b3:#2ba676; --b4:#d9a441; --b5:#d8608f;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --r-card:16px; --r-in:12px; --r-ctl:11px;
  --spring:cubic-bezier(.34,1.4,.64,1);
}
:root,[data-part="night"]{

  --s1:#05070c;--s2:#0a1220;--s3:#132234;--s4:#1d3247;--s5:#0e1a28;

  --bg:#08090c;--surface:#0e1116;--surface2:#161a20;
  --panel1:rgba(14,17,22,.90);--panel2:rgba(10,12,16,.97);
  --ink:#f4f1ea;--ink2:#9aa4b2;--ink3:#5f6875;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --accent:#e5bd6a;--accent-dim:rgba(229,189,106,.15);--kicker:#8ea3bd;
  --danger:#f0805e;--danger-dim:rgba(240,128,94,.15);
  --warn:#e5bd6a;--warn-dim:rgba(229,189,106,.14);
  --ok:#5fbf92;--ok-dim:rgba(95,191,146,.14);
  --grainO:.5;--shadow:0 -30px 70px rgba(0,0,0,.6);--onAcc:#20180a;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
button,a,summary,.it,.att,.kpi,.bikecard,.glyph{touch-action:manipulation;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
/* Две гарнитуры на две роли. Моноширинная — не приём, а язык предмета:
   приложение состоит из артикулов (CS-M8200), пределов износа (1.5 мм),
   интервалов и дат. В моноширинном они выравниваются по разрядам и читаются
   как спецификация, а не как проза. */
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(72px + var(--safe-b));
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;}
.num,.mono{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.lbl{font-family:var(--mono);}
th{font-family:var(--mono);}
.chip{font-family:var(--mono); letter-spacing:-.01em;}
.kpi .k{font-family:var(--mono);}
.glyph .tagname{font-family:var(--mono);}
.tiny .chip{letter-spacing:-.01em;}

/* ============================================================ header */
header{
  position:relative; z-index:6; background:none;
  border-bottom:1px solid var(--line2);
  padding:calc(var(--safe-t) + 12px) calc(var(--safe-r) + 18px) 12px calc(var(--safe-l) + 18px);
}
.hrow{display:flex; align-items:center; gap:12px;}
h1{margin:0; font-size:24px; font-weight:750; letter-spacing:-.035em; flex:1; min-width:0; text-wrap:balance;
   overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hrow{gap:8px;}
#mbtn{
  flex:none; min-height:44px; padding:0 12px; border:1px solid var(--line2); background:var(--surface);
  cursor:pointer; display:flex; align-items:center; gap:7px; color:var(--ink);
  font-size:13.5px; font-weight:700;
}
#mbtn.on{background:var(--accent); border-color:var(--accent); color:#04201d;}
#mbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
#mbtn:active,#sbtn{
  flex:none; min-height:44px; padding:0 13px; border:1px solid var(--line2); background:var(--surface);
  cursor:pointer; display:flex; align-items:center; gap:8px; position:relative; color:var(--ink);
  font-size:13.5px; font-weight:700;
}
#sbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;}
#sdot{width:8px; height:8px; border-radius:50%; background:var(--ink3); flex:none;}
#sdot.on{background:var(--ok);} #sdot.dirty{background:var(--warn);} #sdot.err{background:var(--danger);}
.sub{margin:2px 0 0; font-size:13.5px; color:var(--ink2);}


/* ============================================================ каркас
   Сцена — фон всей страницы, содержимое поднимается над ней панелью.
   Панель наезжает на линию земли, поэтому шва между ними нет. */
#scene-slot{position:absolute;top:0;left:0;right:0;z-index:0;pointer-events:none}
#scene-slot .scene{margin:0}
header{
  position:relative;z-index:6;background:none;border:0;
  padding:calc(var(--safe-t) + 26px) calc(var(--safe-r) + 20px) 0 calc(var(--safe-l) + 20px);
}
h1{margin:0;font:700 38px/.98 var(--disp);letter-spacing:-.045em;color:var(--ink);
  text-shadow:0 2px 40px color-mix(in srgb,var(--bg) 55%,transparent)}
.sub{margin:12px 0 0;font:12.5px/1.6 var(--mono);color:var(--kicker);letter-spacing:.04em}
.hrow{display:flex;align-items:flex-start;gap:10px}
main{
  position:relative;z-index:5;margin-top:318px;padding:0;max-width:none;
  background:linear-gradient(var(--panel1),var(--panel2));
  -webkit-backdrop-filter:blur(26px) saturate(130%);backdrop-filter:blur(26px) saturate(130%);
  border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  box-shadow:var(--shadow);min-height:70vh;
}
main .wrap{padding:24px calc(var(--safe-r) + 20px) 40px calc(var(--safe-l) + 20px);max-width:1180px;margin:0 auto}
main::before{content:"";display:block;width:36px;height:4px;border-radius:2px;
  background:color-mix(in srgb,var(--ink) 20%,transparent);margin:12px auto 0}
body{padding-bottom:calc(76px + var(--safe-b))}

/* ============================================================ layout */

.view{display:none;} .view.on{display:block;}
/* Подпись раздела — штамп на сервисной карте: моноширинный, разрядка,
   тонкая черта. Раньше это была толстая цветная полоса, спорившая со сценой. */
.lbl{
  font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink2); margin:28px 0 10px; display:flex; align-items:center; gap:9px;
  border-left:2px solid var(--line2); padding-left:10px; line-height:1.6;
}
.lbl:first-child{margin-top:0;}
.lbl .n{ background:var(--surface2); color:var(--ink); padding:1px 7px; font-size:11px; letter-spacing:0; }
.card{background:var(--surface); overflow:hidden;}
.card + .card{margin-top:10px;}
.pad{padding:16px;}
.muted{color:var(--ink2); font-size:14px; line-height:1.5;}
.tiny{color:var(--ink3); font-size:12.5px; line-height:1.45;}
.spread{display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
.hero{font-family:var(--mono); font-size:34px; font-weight:700; letter-spacing:-.045em; line-height:1.05;}
.stack{display:flex; flex-direction:column; gap:10px;}

/* ============================================================ chips */
.chip{
  display:inline-flex; align-items:center; gap:5px; background:var(--surface2);
  color:var(--ink2); padding:3px 8px; font-size:11.5px; font-weight:700;
  white-space:nowrap;
}
.chip.danger{background:var(--danger); color:#20060c;}
.chip.warn{background:var(--warn); color:#231800;}
.chip.ok{background:var(--ok); color:#04210f;}
.chip.accent{background:var(--accent-dim); color:var(--accent);}
.dotc{width:7px;height:7px;border-radius:50%;flex:none;}

/* ============================================================ controls */
.btn{
  min-height:48px; padding:0 18px; border-radius:var(--r-ctl); border:1px solid var(--line2);
  background:var(--surface); color:var(--ink); font-size:15px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:7px; width:100%;
  transition:transform .12s var(--spring);
}
.btn:active{transform:scale(.975);}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#04201d; font-weight:700;}
.btn.sm{min-height:44px; font-size:14px; padding:0 14px; width:auto;}
.btn.ghost{background:none; border-color:var(--line);}
label{display:block; font-size:13px; font-weight:600; color:var(--ink2); margin:16px 0 6px;}
input,select,textarea{
  width:100%; min-height:48px; padding:12px 14px; border:1px solid var(--line2);
  border-radius:var(--r-ctl); background:var(--surface2); -webkit-appearance:none; appearance:none;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent;}
select{
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 19px) 22px,calc(100% - 14px) 22px;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:40px;
}
textarea{min-height:78px; resize:vertical;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.grid2 > div > label{margin-top:16px;}
.seg{
  display:flex; background:var(--surface2); border-radius:var(--r-ctl); padding:3px;
  margin-bottom:16px; overflow-x:auto; scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none;}
.seg button{
  flex:1 0 auto; min-height:44px; border:0; border-radius:9px; background:none; color:var(--ink2);
  font-size:13.5px; font-weight:600; cursor:pointer; padding:0 14px; white-space:nowrap;
}
.seg button.on{background:var(--ink); color:var(--bg);}

/* ============================================================ tabbar */
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
  border-top:1px solid var(--line2);
  padding:5px calc(var(--safe-r) + 4px) calc(var(--safe-b) + 5px) calc(var(--safe-l) + 4px);
}
nav button{
  flex:1; min-height:50px; border:0; background:none; cursor:pointer; color:var(--ink3);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:10px; font-weight:600; padding:2px; position:relative;
}
nav button.on{color:var(--accent);}
.navfoot{display:none;}
@media (min-width:900px){ .navfoot{display:block;} }
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
nav .badge{
  position:absolute; top:2px; right:50%; margin-right:-20px; min-width:17px; height:17px;
  border-radius:9px; background:var(--danger); color:#fff; font-size:10.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; padding:0 4px;
}

/* ============================================================ bike card */

.bikecard:active{transform:scale(.985);}


.ph{
  width:54px; height:54px; flex:none; overflow:hidden;
  display:flex; align-items:center; justify-content:center; font-size:23px;
  background:var(--surface2);
}
.ph img{width:100%;height:100%;object-fit:cover;}





/* ============================================================ attention */
.att{display:flex; align-items:center; gap:12px; padding:14px 16px; width:100%;
  border:0; background:none; cursor:pointer; text-align:left; min-height:48px;}
.att + .att{border-top:1px solid var(--line);}
.att .txt{flex:1; min-width:0;}
/* ellipsis needs a block box — a bare inline span just overflows onto the chip */
.att .t1{display:block; font-size:15px; font-weight:600; line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.att .t2{display:block; font-size:12.5px; color:var(--ink2); margin-top:3px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.att .chip{flex:none;}
.att .arw{color:var(--ink3); font-size:19px; flex:none;}
.calm{padding:26px 18px; text-align:center;}
.calm .ic{font-size:30px;}
.calm .t{font-size:15px; font-weight:600; margin-top:8px;}
.calm .s{font-size:13px; color:var(--ink2); margin-top:4px; line-height:1.5;}

/* ============================================================ rows / tables */
.row{display:flex; align-items:center; gap:12px; padding:13px 16px; min-height:48px;}
.row + .row{border-top:1px solid var(--line);}
.row .rl{flex:1; min-width:0;}
.row .rt{font-size:14.5px; line-height:1.3;}
.row .rs{font-size:12.5px; color:var(--ink2); margin-top:2px;}
.att .t2{font-family:var(--mono); letter-spacing:-.01em;}
.row .rv{font-size:14.5px; font-weight:600; text-align:right; white-space:nowrap; flex:none;}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
table{border-collapse:collapse; width:100%; font-size:13px;}
th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
th{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink3); font-weight:700;}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums;}
tr:last-child td{border-bottom:0;}
td.wrap{white-space:normal; min-width:190px;}
.spec tr.gr td{background:var(--surface2); font-weight:800; font-size:11px;
  text-transform:uppercase; letter-spacing:.07em; border-bottom:0;}
.spec tr.tot td{background:var(--ink); color:var(--bg); font-weight:800; border-bottom:0;}
.spec td{vertical-align:top;}
.spec tr.ed{cursor:pointer;}
@media (hover:hover){ .spec tr.ed:hover td{background:var(--surface2);} }

/* ============================================================ charts */
.track{height:10px; background:var(--surface2); overflow:hidden; margin-top:7px;}
.fill{height:100%;}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:12px;}
.legend span{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink2);}
.sw{width:11px;height:11px;flex:none;}

/* ============================================================ disclosure */
details{border-top:1px solid var(--line);}
details:first-of-type{border-top:0;}
summary{
  list-style:none; cursor:pointer; padding:14px 16px; min-height:48px;
  display:flex; align-items:center; gap:11px;
}
summary::-webkit-details-marker{display:none;}
summary .arw{color:var(--ink3); font-size:11px; transition:transform .2s; flex:none;}
details[open] summary .arw{transform:rotate(90deg);}
.dbody{padding:0 16px 16px; }

/* ============================================================ checklist */
.it{display:flex; gap:13px; padding:14px 16px; cursor:pointer; align-items:flex-start; min-height:48px;
  width:100%; border:0; background:none; text-align:left; font:inherit; color:inherit;}
.it + .it{border-top:1px solid var(--line);}
.it .box{
  width:25px;height:25px;border:2px solid var(--line2); flex:none; margin-top:1px;
  display:flex;align-items:center;justify-content:center; transition:.18s var(--spring);
}
.it .box svg{width:15px;height:15px;stroke:#04201d;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
.it.done .box{background:var(--accent); border-color:var(--accent);}
/* галочка не появляется, а рисуется — росчерком, как ручкой */
.it.done .box svg{opacity:1; stroke-dasharray:26; stroke-dashoffset:0; animation:tick .32s cubic-bezier(.65,0,.35,1);}
@keyframes tick{ from{stroke-dashoffset:26;} to{stroke-dashoffset:0;} }
.it.done .nm{text-decoration:line-through; color:var(--ink3);}
.it .nm{font-size:15px; line-height:1.3; font-weight:500;}
.it .dt{font-size:13px; color:var(--ink2); margin-top:3px;}
.it .note{font-size:12.5px; color:var(--ink2); margin-top:7px; padding-left:11px;
  border-left:2px solid var(--line2); line-height:1.5;}
.it .pr{margin-left:auto; font-size:13.5px; font-weight:700; text-align:right; white-space:nowrap; flex:none;}
.it .pr small{display:block; font-weight:400; font-size:11px; color:var(--ink3); white-space:normal; max-width:105px;}

/* ============================================================ мир
   Разделы — места по маршруту, из города за город. Небо общее и не едет;
   земля разбита на три плана, каждый смещается со своей скоростью, поэтому
   переключение читается как проезд, а не как подмена картинки. */
.scene{
  position:relative; height:600px; overflow:hidden;
  margin:0 calc(var(--safe-l) * -1 - 18px) 0 calc(var(--safe-r) * -1 - 18px);
}
.sky-base{position:absolute;inset:0;
  background:linear-gradient(var(--s1) 0%,var(--s2) 30%,var(--s3) 54%,var(--s4) 74%,var(--s5) 100%);
  transition:background 1s var(--ease)}
.bloom{position:absolute;left:calc(var(--orbX) - 34%);top:calc(var(--orbY) - 118px);
  width:78%;height:300px;transition:all 1s var(--ease);
  background:radial-gradient(58% 54% at 46% 42%,var(--orbGlow),transparent 72%)}
.orb{position:absolute;left:var(--orbX);top:var(--orbY);width:var(--orbSize);height:var(--orbSize);
  border-radius:50%;transition:all 1s var(--ease);
  background:radial-gradient(circle,var(--orb) 0%,var(--orb) 42%,transparent 72%)}
/* Луна — не тот же тёплый шар: холодный диск с кратерами и затенением снизу. */
[data-part="night"] .orb{
  background:
    radial-gradient(circle at 62% 62%,rgba(120,140,175,.34) 0 6%,transparent 7%),
    radial-gradient(circle at 38% 34%,rgba(120,140,175,.28) 0 8%,transparent 9%),
    radial-gradient(circle at 52% 24%,rgba(120,140,175,.20) 0 4%,transparent 5%),
    radial-gradient(circle at 34% 68%,rgba(120,140,175,.16) 0 5%,transparent 6%),
    radial-gradient(circle at 40% 36%,#f4f7fc 0%,#dfe7f2 62%,#c3cfe1 88%,#b3c1d6 100%);
  box-shadow:0 0 34px 6px rgba(190,212,245,.16),inset -6px -7px 12px -6px rgba(60,78,110,.55);}

.world{position:absolute;left:0;right:0;bottom:0;height:330px;z-index:1;overflow:hidden}
.band{position:absolute;left:0;bottom:0;width:500%;height:100%;display:flex;
  transition:transform 1.05s cubic-bezier(.32,.74,.06,1)}
.band > .place{width:20%;height:100%;position:relative;flex:none}
.band.far {transform:translateX(calc(var(--i,0) * -6%))}
.band.mid {transform:translateX(calc(var(--i,0) * -13%))}
.band.near{transform:translateX(calc(var(--i,0) * -20%))}
.band svg{position:absolute;bottom:0;left:0;width:100%;height:100%}
.far-p{fill:var(--city);opacity:.42;transition:fill 1s var(--ease)}
.mid-p{fill:var(--city);opacity:.78;transition:fill 1s var(--ease)}
.near-p{fill:color-mix(in srgb,var(--city) 88%,black);transition:fill 1s var(--ease)}
.warm{fill:var(--orb);opacity:calc(var(--lamp) * .85);transition:opacity 1s}
.water{position:absolute;left:0;right:0;bottom:0;height:104px;
  background:linear-gradient(var(--w1),var(--w2) 70%,var(--w3));transition:background 1s var(--ease)}
.ground{position:absolute;left:0;right:0;bottom:0;height:74px;
  background:linear-gradient(color-mix(in srgb,var(--city) 55%,#3a3a3a),color-mix(in srgb,var(--city) 80%,#1a1a1a));
  transition:background 1s var(--ease)}
.ground::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
  background:color-mix(in srgb,var(--ink) 18%,transparent)}
.placename{position:absolute;left:calc(var(--safe-l) + 20px);bottom:16px;z-index:4;
  font:700 10px/1 var(--mono);letter-spacing:.26em;text-transform:uppercase;
  color:color-mix(in srgb,var(--ink) 46%,transparent);pointer-events:none}
.grain{position:absolute;inset:0;pointer-events:none;z-index:60;opacity:var(--grainO);
  mix-blend-mode:overlay;transition:opacity 1s}

/* ============================================================ motion */
.view{opacity:1;}
.view.swap{animation:swapin .34s var(--spring) both;}
@keyframes swapin{ from{opacity:0; transform:translateY(9px);} to{opacity:1; transform:none;} }

/* Загрузка страницы — один поставленный проход сверху вниз, а не пять
   независимых эффектов, разбегающихся кто куда. */
@keyframes boot{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }
.booting header{animation:boot .5s cubic-bezier(.32,.72,0,1) both;}
.booting .scene{animation:boot .6s cubic-bezier(.32,.72,0,1) .06s both;}
.booting main{animation:boot .55s cubic-bezier(.32,.72,0,1) .14s both;}
.booting nav{animation:boot .5s cubic-bezier(.32,.72,0,1) .22s both;}
/* город проявляется отдельно и позже — он тут главный */
@keyframes skyrise{ from{opacity:0; transform:translateY(18px);} to{opacity:.96; transform:none;} }
.booting .ridge{animation:skyrise .9s cubic-bezier(.22,.8,.2,1) .18s both;}
.booting .glyph{animation:boot .5s var(--spring) both;}
.booting .glyph:nth-child(1){animation-delay:.30s}
.booting .glyph:nth-child(2){animation-delay:.36s}
.booting .glyph:nth-child(3){animation-delay:.42s}
.booting .glyph:nth-child(4){animation-delay:.48s}
.booting .glyph:nth-child(5){animation-delay:.54s}
.reveal{opacity:0; transform:translateY(11px);}
.reveal.in{opacity:1; transform:none; transition:opacity .42s ease, transform .42s var(--spring);}
.fill{transition:width .65s var(--spring);}
.bikecard{transition:transform .16s var(--spring), background .2s;}
.bikecard:active{transform:scale(.982);}
.bikecard .bar{transition:width .22s var(--spring);}
@media (hover:hover){ .bikecard:hover .bar{width:12px;} }
.att{transition:background .18s;}
.att:active{background:var(--surface2);}
@media (hover:hover){
  .bikecard:hover,.att:hover,.kpi:hover,.it:hover,summary:hover{background:var(--surface2);}
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  .cloud,.rider,.wh,.drop,.gull,.boat,.mosq,.sun{animation:none !important;}
  .booting header,.booting .scene,.booting main,.booting nav,
  .booting .ridge,.booting .glyph{animation:none !important;}
  .it.done .box svg{animation:none;}
  ::view-transition-old(root),::view-transition-new(root){animation:none !important;}
  .sun{left:78%; top:26px;}
  .rain{display:none;}
  .view.swap{animation:none;}
  .reveal{opacity:1; transform:none;}
  .fill{transition:none;}
  .scene .layer{transform:none !important;}
}

/* ============================================================ KPI */
.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:8px;}
.kpi{
  background:var(--surface); border:0; border-top:4px solid var(--accent);
  padding:13px 12px; text-align:left; width:100%; cursor:pointer; display:block;
  min-height:48px; transition:transform .16s var(--spring);
}
.kpi:active{transform:scale(.97);}
/* block boxes: as inline spans these run together on one line */
.kpi .k{display:block; font-size:10.5px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.kpi .v{display:block; font-family:var(--mono); font-size:22px; font-weight:700;
  letter-spacing:-.04em; margin-top:5px; line-height:1.1;}
.kpi .s{display:block; font-size:11px; color:var(--ink3); margin-top:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.rank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  background:var(--ink);color:var(--bg);font-size:11px;font-weight:800;margin-right:7px;flex:none;}
.dots{display:block;letter-spacing:1px;font-size:9px;color:var(--accent);line-height:1;margin-top:2px;}
.strbar{height:8px;margin-top:14px;
  background:linear-gradient(90deg,var(--danger),var(--warn),var(--ok));}
ul.pm{margin:12px 0 0;padding:0;list-style:none;}
ul.pm li{position:relative;padding-left:20px;margin-bottom:7px;font-size:13.5px;line-height:1.5;color:var(--ink2);}
ul.pm li::before{position:absolute;left:0;top:0;font-weight:800;}
ul.pm li.p::before{content:'+';color:var(--ok);}
ul.pm li.m::before{content:'–';color:var(--danger);}

/* ============================================================ переключатель */
.sw-row{display:flex; align-items:center; gap:14px; background:var(--surface);
  padding:14px 16px; margin-top:10px; cursor:pointer; width:100%; border:0; text-align:left;
  border-left:5px solid var(--accent); min-height:48px;}
.sw-row .t{flex:1; min-width:0;}
.sw-row .t b{display:block; font-size:15px; font-weight:800; letter-spacing:-.01em;}
.sw-row .t span{display:block; font-size:12.5px; color:var(--ink2); margin-top:2px;}
.sw-track{
  flex:none; width:64px; height:34px; background:var(--line2); position:relative;
  transition:background .28s var(--spring);
}
.sw-row.on .sw-track{background:var(--accent);}
.sw-knob{
  position:absolute; top:3px; left:3px; width:28px; height:28px; background:var(--bg);
  display:flex; align-items:center; justify-content:center; font-size:15px;
  transition:transform .32s var(--spring);
}
.sw-row.on .sw-knob{transform:translateX(30px);}
@media (prefers-reduced-motion: reduce){ .sw-knob,.sw-track{transition:none;} }

/* ============================================================ десктоп
   На широком экране нижний таббар — ошибка: он рассчитан на большой палец.
   Меню уезжает в колонку слева, контент раскладывается в две колонки. */
@media (min-width: 900px){
  body{padding-bottom:0;}
  nav{
    top:0; bottom:0; right:auto; width:232px; flex-direction:column;
    border-top:0; border-right:1px solid var(--line2); padding:0 0 16px;
    gap:0; align-items:stretch; overflow-y:auto;
  }
  nav::before{
    content:'Велопарк'; display:block; padding:22px 20px 16px;
    font-size:20px; font-weight:800; letter-spacing:-.03em; color:var(--ink);
    border-bottom:1px solid var(--line);
  }
  nav button{
    flex:0 0 auto; flex-direction:row; justify-content:flex-start; gap:13px;
    padding:0 20px; min-height:52px; font-size:14.5px; letter-spacing:0;
    border-left:5px solid transparent;
  }
  nav button.on{background:var(--surface); border-left-color:var(--accent);}
  nav button:hover{background:var(--surface2);}
  nav svg{width:20px;height:20px;}
  nav .badge{position:static; margin:0 0 0 auto;}
  .tip{bottom:24px !important;}
  .navfoot{margin-top:auto; padding-top:12px; border-top:1px solid var(--line);}
  .navact{
    width:100%; min-height:46px; display:flex; align-items:center; gap:13px; padding:0 20px;
    border:0; background:none; color:var(--ink2); font-size:13.5px; font-weight:600; cursor:pointer;
    text-align:left;
  }
  .navact:hover{background:var(--surface2); color:var(--ink);}
  .navact svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .navstate{padding:8px 20px 0; font-size:11.5px; color:var(--ink3); line-height:1.4;}
  #sbtn,#mbtn{display:none;}

  header{margin-left:232px; padding:calc(var(--safe-t) + 24px) 32px 0;}
  /* шапка обязана стоять по одной вертикали с контентом, иначе на 1920
     заголовок уезжает на 222px левее первой карточки */
  header .hrow, header .sub{max-width:1180px; margin-left:auto; margin-right:auto;}
  h1{font-size:46px;}
  main{margin-left:232px;}
  #scene-slot{left:232px}
  main .wrap{padding:26px 32px 56px}
  .wrap{max-width:1180px; margin:0 auto;}


  .strip{justify-content:center; padding:0 32px;}
  .dash{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,240px)); gap:12px;
    align-items:start; justify-content:start;}
  .kpi .s{white-space:normal;}
  .kpis{display:contents;}
  .stack{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .stack > .reveal{display:block;}
  .cols{display:grid; grid-template-columns:1fr; gap:0 28px; align-items:start;}
  .cols > section{min-width:0;}
  .lbl{margin-top:30px;}
  .btn{width:auto; min-width:220px;}
  .seg{width:max-content; max-width:100%;}
  .seg button{flex:0 0 auto; min-width:130px;}
  .btn.wide{width:100%;}
  /* модалка по центру, а не шторка снизу */
  .sheet{align-items:center;}

<script type="application/json" id="DATA">__DATA__</script>
<script>
"use strict";
/* ============================================================ data */
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const BIKES = DATA.bikes, RULES = DATA.maintenance, FRAMES = DATA.frames, CHECKLISTS = DATA.checklists;
const CHOICE = DATA.choice;
const BIKE = Object.fromEntries(BIKES.map(b => [b.id, b]));
const RULE = Object.fromEntries(RULES.map(r => [r.id, r]));
const CATS = {
  drivetrain:  {label:'Трансмиссия'},
  brakes:      {label:'Тормоза'},
  wheels:      {label:'Колёса'},
  suspension:  {label:'Подвеска'},
  consumables: {label:'Расходники'}
};
const EMOJI = {'гравий':'🚵','МТБ хардтейл':'⛰️','детский':'🧒'};
/* one hue per bike, fixed, never reused for anything else */
const HUE = id => 'var(--b' + (BIKE[id] ? BIKE[id].colorSlot : 1) + ')';
const SHORT = (() => {
  const first = {};
  for (const b of BIKES) first[b.name.split(' ')[0]] = (first[b.name.split(' ')[0]] || 0) + 1;
  return Object.fromEntries(BIKES.map(b => {
    const w = b.name.split(' ');
    return [b.id, first[w[0]] > 1 ? (w[1] || w[0]) : w[0]];
  }));
})();

/* ============================================================ utils */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Цены скрыты по умолчанию. Всё денежное в интерфейсе форматируется здесь,
   поэтому переключается одним флагом и ни одна цифра не проскакивает мимо. */
let SHOWMONEY = localStorage.getItem('bikes:money') === '1';


const rub = n => !SHOWMONEY ? '—'
  : (n==null ? '—' : Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ') + ' ₽');
function toggleMoney() {
  SHOWMONEY = !SHOWMONEY;
  localStorage.setItem('bikes:money', SHOWMONEY ? '1' : '0');
  render();
}
const km  = n => (n==null ? '—' : Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ') + ' км');
const slug = s => String(s).toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,48);
const uid = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const YEAR = new Date().getFullYear();
/* Народная единица измерения. Только для крупных сумм, и только шёпотом. */
const SHAVA = 350;
const shavas = n => (SHOWMONEY && n >= SHAVA * 20) ? ` — это ${Math.round(n/SHAVA)} шаверм` : '';

/* ============================================================ storage */
const LS = 'bikes:v1';
/* Адрес хранилища зашит: гость открывает ссылку и сразу видит данные,
   ничего не настраивая. Токен появляется только после входа по паролю. */
const API = 'https://bikes-sync.severyanov.workers.dev';
const TOK_KEY = 'bikes:token';
const blankDoc = () => ({ v:1, mtime:0, odo:{}, annualKm:{}, ownership:{}, parts:{},
                          events:[], checks:{}, photos:{}, migratedAt:null });

let local = { rev:0, doc:blankDoc(), dirty:false, lastSync:null };
try {
  const raw = localStorage.getItem(LS);
  if (raw) { const p = JSON.parse(raw); local = Object.assign(local, p); local.doc = sanitizeDoc(p.doc); }
} catch(e) { /* corrupt cache — start blank, the cloud copy and seed refill it */ }

const DOC = () => local.doc;

/* Документ приходит из облака и из файла резервной копии. Файл пользователь
   может получить откуда угодно, поэтому это недоверенный ввод: числа делаем
   числами, строки — строками, а фото пускаем только как картинку в data:.
   Экранирование при выводе остаётся первой линией; это вторая. */
function sanitizeDoc(d) {
  const str = v => typeof v === 'string' ? v.slice(0, 2000) : (v == null ? null : String(v).slice(0, 2000));
  const num = v => { const n = Number(v); return Number.isFinite(n) ? n : null; };
  const out = blankDoc();
  out.mtime = num(d && d.mtime) || 0;
  out.migratedAt = str(d && d.migratedAt);
  for (const k of ['odo', 'annualKm'])
    for (const [id, v] of Object.entries((d && d[k]) || {})) {
      const n = num(v); if (n != null) out[k][id] = n;
    }
  for (const [id, o] of Object.entries((d && d.ownership) || {}))
    if (o && typeof o === 'object') out.ownership[id] = {
      state: o.state === 'sold' ? 'sold' : 'owned',
      soldDate: str(o.soldDate), soldPrice: num(o.soldPrice)
    };
  for (const [id, v] of Object.entries((d && d.photos) || {}))
    if (typeof v === 'string' && /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]*$/.test(v))
      out.photos[id] = v;
  for (const [bid, map] of Object.entries((d && d.parts) || {})) {
    if (!map || typeof map !== 'object') continue;
    out.parts[bid] = {};
    for (const [pid, o] of Object.entries(map))
      if (o && typeof o === 'object') out.parts[bid][pid] = {
        group: str(o.group), part: str(o.part), spec: str(o.spec),
        purchasePrice: num(o.purchasePrice),
        added: !!o.added, deleted: !!o.deleted
      };
  }
  for (const [key, map] of Object.entries((d && d.checks) || {})) {
    if (!map || typeof map !== 'object') continue;
    out.checks[key] = {};
    for (const [k, v] of Object.entries(map)) out.checks[key][k] = v ? 1 : 0;
  }
  for (const e of (d && d.events) || []) {
    if (!e || typeof e !== 'object' || !e.id) continue;
    out.events.push({
      id: String(e.id).slice(0, 64), mtime: num(e.mtime) || 0,
      bike: str(e.bike), rule: str(e.rule), category: str(e.category),
      date: str(e.date), odo: num(e.odo),
      part: str(e.part), partCost: num(e.partCost) || 0, labourCost: num(e.labourCost) || 0,
      place: str(e.place), note: str(e.note), deleted: !!e.deleted
    });
  }
  return out;
}

function persist(markDirty) {
  if (markDirty !== false) { local.dirty = true; local.doc.mtime = Date.now(); }
  if (!EDITOR) local.dirty = false;        // гость ничего не отправляет на сервер
  try { localStorage.setItem(LS, JSON.stringify(local)); }
  catch(e) { toast('Не хватило места в браузере — уменьшите число фото'); }
  paintSync();
}

function stableId(groupName, itemName){ return slug(groupName) + '/' + slug(itemName); }

/* R1 — positional "gi-ii" ticks resolve only against the UNMODIFIED arrays, so
   this runs before anything touches content. Old keys stay as the only rollback. */
function migrateChecks() {
  if (DOC().migratedAt) return 0;
  let n = 0;
  for (const [key, groups] of Object.entries(CHECKLISTS)) {
    let old = {};
    try { old = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) { old = {}; }
    const map = DOC().checks[key] || (DOC().checks[key] = {});
    groups.forEach((g, gi) => g.items.forEach((it, ii) => {
      if (old[gi + '-' + ii]) { map[stableId(g.g, it.n)] = 1; n++; }
    }));
  }
  DOC().migratedAt = new Date().toISOString();
  persist(n > 0);   // nothing migrated => no fresh mtime, or an empty doc outranks the cloud
  return n;
}

/* Переименования пунктов чек-листа.
   Устойчивый id — это slug(группа)/slug(пункт), поэтому правка текста пункта
   отвязывает поставленную на нём галочку. Каждое переименование записывается
   сюда и переносится при загрузке: сначала переносим, потом уже правим текст.
   Идемпотентно — новый ключ не перезаписывается, старый не удаляется. */
const RENAMES = {
  'speedone-275-checklist-v1': {
    // рама называется Floater, а не Destroyer (уточнено 15.08.2026)
    'куплено-под-этот-проект/рама-speedone-destroyer-27-5':
    'куплено-под-этот-проект/рама-speedone-floater-27-5'
  }
};

function applyRenames() {
  let n = 0;
  for (const [key, map] of Object.entries(RENAMES)) {
    const checks = DOC().checks[key];
    if (!checks) continue;
    for (const [from, to] of Object.entries(map))
      if (checks[from] != null && checks[to] == null) { checks[to] = checks[from]; n++; }
  }
  if (n) persist(true);
  return n;
}

/* R4 — if storage was evicted and we are offline, the committed seed refills history */
function applySeed() {
  const seed = DATA.log || {};
  const d = DOC();
  const have = new Set(d.events.map(e => e.id));
  let n = 0;
  (seed.events || []).forEach(e => { if (!have.has(e.id)) { d.events.push(e); n++; } });
  for (const [k, v] of Object.entries(seed.odo || {})) if (d.odo[k] == null) { d.odo[k] = v; n++; }
  if (n) persist(true);
  return n;
}

/* ============================================================ sync */
let syncTok = localStorage.getItem(TOK_KEY) || '';
let syncState = 'off', syncMsg = '';
let EDITOR = false;                       // право записи приходит с сервера, не из localStorage

function mergeDocs(mine, theirs) {
  const newer = (theirs.mtime || 0) >= (mine.mtime || 0) ? theirs : mine;
  const older = newer === theirs ? mine : theirs;
  const out = Object.assign({}, newer);

  // events: union by id, latest write per id wins (tombstones included, so a
  // delete survives the merge instead of being resurrected by the other side)
  const byId = new Map();
  for (const e of [...(theirs.events||[]), ...(mine.events||[])]) {
    const prev = byId.get(e.id);
    if (!prev || (e.mtime||0) >= (prev.mtime||0)) byId.set(e.id, e);
  }
  out.events = [...byId.values()];

  // Maps merge KEY BY KEY, never wholesale. A device whose storage Safari just
  // evicted boots with empty maps and a fresh mtime — replacing the map wholesale
  // would let it blank out the odometer for every bike in the cloud.
  for (const k of ['odo', 'annualKm', 'photos', 'ownership'])
    out[k] = Object.assign({}, older[k] || {}, newer[k] || {});

  // правки состава сливаются по каждому велосипеду отдельно, иначе правка
  // одного затирала бы правки другого
  out.parts = {};
  for (const id of new Set([...Object.keys(older.parts||{}), ...Object.keys(newer.parts||{})]))
    out.parts[id] = Object.assign({}, (older.parts||{})[id], (newer.parts||{})[id]);

  out.checks = {};
  for (const key of new Set([...Object.keys(older.checks||{}), ...Object.keys(newer.checks||{})]))
    out.checks[key] = Object.assign({}, (older.checks||{})[key], (newer.checks||{})[key]);

  out.migratedAt = mine.migratedAt || theirs.migratedAt || null;
  out.mtime = Math.max(mine.mtime||0, theirs.mtime||0);
  return out;
}

async function pull() {
  const r = await fetch(API + '/doc', syncTok ? { headers:{ 'authorization':'Bearer ' + syncTok } } : undefined);
  if (!r.ok) throw new Error('Сервер ответил ' + r.status);
  const j = await r.json();
  EDITOR = !!j.editor;                    // сервер решает, кто редактор
  return j;
}

async function login(password) {
  const r = await fetch(API + '/login', {
    method:'POST', headers:{ 'content-type':'application/json' },
    body: JSON.stringify({ password })
  });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('Сервер ответил ' + r.status));
  syncTok = j.token;
  localStorage.setItem(TOK_KEY, syncTok);
  EDITOR = true;
  return true;
}

function logout() {
  syncTok = ''; EDITOR = false;
  localStorage.removeItem(TOK_KEY);
  sync(true); render();
}

async function push(rev, doc) {
  const r = await fetch(API + '/doc', {
    method:'PUT',
    headers:{ 'authorization':'Bearer ' + syncTok, 'content-type':'application/json', 'if-match':String(rev) },
    body: JSON.stringify(doc)
  });
  if (r.status === 409) return null;
  if (r.status === 401) { EDITOR = false; throw new Error('Сессия истекла — войдите заново'); }
  if (!r.ok) throw new Error('Сервер ответил ' + r.status);
  return r.json();
}

let syncing = false;
async function sync(silent) {
  if (syncing) return;
  syncing = true; syncState = 'busy'; paintSync();
  try {
    const remote = await pull();
    if (remote.rev !== local.rev || local.dirty) {
      local.doc = remote.doc ? mergeDocs(local.doc, sanitizeDoc(remote.doc)) : local.doc;
      local.rev = remote.rev;
    }
    if (EDITOR && (local.dirty || (remote.doc && JSON.stringify(remote.doc) !== JSON.stringify(local.doc)))) {
      let res = await push(local.rev, local.doc);
      if (res === null) {
        const again = await pull();
        local.doc = mergeDocs(local.doc, again.doc ? sanitizeDoc(again.doc) : blankDoc());
        local.rev = again.rev;
        res = await push(local.rev, local.doc);
        if (res === null) throw new Error('Конфликт записи, попробуйте ещё раз');
      }
      local.rev = res.rev;
    }
    if (EDITOR) local.dirty = false;
    local.lastSync = Date.now(); syncState = 'on'; syncMsg = '';
    try { localStorage.setItem(LS, JSON.stringify(local)); } catch(e){}
    render();
  } catch (err) {
    syncState = 'err'; syncMsg = err.message;
    if (!silent) toast(err.message);
  } finally {
    syncing = false; paintSync();
  }
}

function paintSync() {
  const dot = $('sdot'), lbl = $('slabel');
  if (lbl) lbl.textContent = EDITOR ? 'Профиль' : 'Вход';
  // подвал бокового меню рисуется только в renderNav(), поэтому без этой
  // строки он держал «Режим просмотра» даже во время синхронизации
  const ns = document.querySelector('.navstate');
  if (ns) ns.textContent = syncLine();
  if (!EDITOR) dot.className = '';
  else if (syncState === 'busy') dot.className = '';
  else if (syncState === 'err') dot.className = 'err';
  else if (local.dirty) dot.className = 'dirty';
  else dot.className = 'on';
}

function syncLine() {
  if (!EDITOR) return 'Режим просмотра';
  if (syncState === 'busy') return 'Синхронизирую…';
  if (syncState === 'err') return syncMsg || 'Ошибка синхронизации';
  if (local.dirty) return 'Есть несохранённые изменения';
  const ago = local.lastSync ? Math.round((Date.now() - local.lastSync)/60000) : null;
  return ago == null ? 'Синхронизировано'
    : ago < 1 ? 'Синхронизировано только что'
    : ago < 60 ? 'Синхронизировано ' + ago + ' мин назад'
    : 'Синхронизировано ' + Math.round(ago/60) + ' ч назад';
}

/* ============================================================ aggregation */
const evCost = e => (Number(e.partCost)||0) + (Number(e.labourCost)||0);
const liveEvents = () => DOC().events.filter(e => !e.deleted);
const eventsOf = (bikeId, year) => liveEvents().filter(e =>
  (!bikeId || e.bike === bikeId) && (!year || Number(e.date.slice(0,4)) === year));

/* Ownership: the static file carries the baseline, the synced doc carries the
   user's edits (sale date and price). A sold bike keeps its spend history but
   drops out of maintenance and forecasting — you do not service what you sold. */
function ownershipOf(id) {
  const o = (DOC().ownership || {})[id] || {};
  const base = (BIKE[id] && BIKE[id].ownership) || 'owned';
  return { state: o.state || base, soldDate: o.soldDate || null,
           soldPrice: o.soldPrice == null ? null : Number(o.soldPrice) };
}
const isOwned = id => ownershipOf(id).state === 'owned';
const ownedBikes = () => BIKES.filter(b => isOwned(b.id));
const soldBikes  = () => BIKES.filter(b => !isOwned(b.id));

function yearCost(bikeId, year){ return eventsOf(bikeId, year).reduce((s,e)=>s+evCost(e), 0); }

function categorySplit(bikeId, year) {
  const out = {};
  for (const k of Object.keys(CATS)) out[k] = 0;
  for (const e of eventsOf(bikeId, year)) {
    const c = e.category || (RULE[e.rule] && RULE[e.rule].category) || 'consumables';
    out[c] = (out[c] || 0) + evCost(e);
  }
  return out;
}

/* null, never 0 or Infinity, when the odometer is unset — an unknown ratio is
   not a cheap one. */
function costPerKm(bikeId, year) {
  const odo = Number(DOC().odo[bikeId]);
  if (!odo || odo <= 0) return null;
  return yearCost(bikeId, year) / odo;
}

/* Состав живёт в двух слоях: неизменяемый сид в bikes.json и правки владельца
   в синхронизируемом документе. Ключ — стабильный id детали, а не её название,
   поэтому переименование не рвёт привязку. */
function componentsOf(bikeId) {
  const over = (DOC().parts || {})[bikeId] || {};
  const out = [];
  for (const c of (BIKE[bikeId] && BIKE[bikeId].components) || []) {
    const o = over[c.id];
    if (o && o.deleted) continue;
    out.push(o ? Object.assign({}, c, o) : c);
  }
  for (const [id, o] of Object.entries(over))
    if (o && o.added && !o.deleted) out.push(Object.assign({ id }, o));
  return out;
}

function purchaseTotal(bikeId){
  const b = BIKE[bikeId];
  const list = componentsOf(bikeId);
  const items = list.reduce((s,c)=>s+(Number(c.purchasePrice)||0), 0);
  // велосипед, купленный целиком, не расписан по позициям — у него только сумма
  return items || Number(b.totalSpend) || 0;
}

/* what the bike actually cost: everything put in, minus what it sold for */
function netCost(bikeId) {
  const sold = ownershipOf(bikeId).soldPrice;
  return purchaseTotal(bikeId) + eventsOf(bikeId).reduce((s,e)=>s+evCost(e), 0) - (sold || 0);
}

function forecast(bikeId) {
  if (!isOwned(bikeId)) return [];
  const annual = Number(DOC().annualKm[bikeId]) || 0;
  const rows = [];
  for (const r of RULES) {
    if (!r.bikes.includes(bikeId)) continue;
    const last = eventsOf(bikeId).filter(e => e.rule === r.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    // "каждые N км или M месяцев — что наступит раньше" = whichever trigger fires
    // more often over a year. Backlog already accrued is not a recurring cost.
    const perYear = Math.max(12 / r.interval_months, annual ? annual / r.interval_km : 0);
    const unit = defaultPartCost(bikeId, r) + (Number(r.est_labour_cost) || 0);
    rows.push({ rule:r, times:perYear, cost:perYear * unit, unit, last });
  }
  return rows.sort((a,b)=>b.cost-a.cost);
}

function matchComponent(bikeId, rule) {
  const b = BIKE[bikeId]; if (!b || !rule.part_keywords || !rule.part_keywords.length) return null;
  const list = componentsOf(bikeId);
  for (const kw of rule.part_keywords) {
    const hit = list.find(c => (c.part||'').toLowerCase().includes(kw.toLowerCase()));
    if (hit && hit.purchasePrice) return hit;
  }
  return null;
}

/* A rule with est_part_cost 0 consumes no part — it is an inspection or an
   adjustment. It must never inherit the price of the component it inspects,
   or a headset check gets billed at the price of the frameset. */
function defaultPartCost(bikeId, rule) {
  if (!Number(rule.est_part_cost)) return 0;
  const c = matchComponent(bikeId, rule);
  return c ? Number(c.purchasePrice) : Number(rule.est_part_cost);
}

function dueStatus(bikeId, rule) {
  const odo = Number(DOC().odo[bikeId]);
  const last = eventsOf(bikeId).filter(e => e.rule === rule.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if (!last) return { state:'unknown', text:'нет записей' };
  const lastOdo = Number(last.odo);
  const months = (Date.now() - new Date(last.date).getTime()) / (1000*60*60*24*30.44);
  const byMon = months / rule.interval_months;
  const byKm  = (odo && lastOdo != null) ? (odo - lastOdo) / rule.interval_km : 0;
  const p = Math.max(byMon, byKm);
  const left = (odo && lastOdo != null) ? Math.round(rule.interval_km - (odo - lastOdo)) : null;
  if (p >= 1) return { state:'due',  text:'пора', p, left };
  if (p >= .8) return { state:'soon', text:'скоро', p, left };
  return { state:'ok', text:'в норме', p, left };
}

/* everything that wants doing, worst first — this drives the home screen */
function attention() {
  const out = [];
  for (const b of ownedBikes())
    for (const r of RULES) {
      if (!r.bikes.includes(b.id)) continue;
      const st = dueStatus(b.id, r);
      if (st.state === 'due' || st.state === 'soon') out.push({ bike:b, rule:r, st });
    }
  return out.sort((a,b) => (a.st.state === b.st.state) ? b.st.p - a.st.p
                          : a.st.state === 'due' ? -1 : 1);
}

   Colour encodes the BIKE everywhere — it is this app's entity. Magnitude
   comparisons that are not per-bike use one hue and length, plus a value label
   on every bar and a table underneath. */
function barRows(rows) {
  const max = Math.max(1, ...rows.map(r => r.value));
  return rows.map(r => `
    <div style="padding:12px 16px${r.i ? ';border-top:1px solid var(--line)' : ''}">
      <div class="spread">
        <span style="font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%">${esc(r.label)}</span>
        <span class="num" style="font-size:14.5px;font-weight:700">${esc(r.text)}</span>
      </div>
      ${r.sub ? `<div class="tiny" style="margin-top:2px">${esc(r.sub)}</div>` : ''}
      <div class="track"><div class="fill" style="width:${Math.max(2, r.value/max*100)}%;background:${r.color||'var(--accent)'}"></div></div>
    </div>`).join('');
}

function pinesPath(n, base) {
  let d = "";
  for (let i = 0; i < n; i++) {
    const x = i * (400 / n) + ((i * 37) % 13) - 6, h = base + ((i * 53) % 34);
    d += `M${x} 148V${148 - h/4}z M${x-9} ${148 - h/4}l9 -${h*0.8}l9 ${h*0.8}z `;
  }
  return d;
}

function nearShape(kind, p) {
  if (kind === "bridge") return '<path class="near-p" d="M0 148v-18h300v18z"/>'
    + '<path d="M118 130l32-30M282 130l-32-30" stroke="var(--city)" stroke-width="7" stroke-linecap="round" fill="none"/>'
    + '<path class="near-p" d="M0 130h4v-22h-4z M60 130h4v-22h-4z M340 130h4v-26h-4z M396 130h4v-26h-4z"/>';
  if (kind === "arch") return '<path class="near-p" d="M0 148V26h400v122z M150 148v-72a50 50 0 01100 0v72z" fill-rule="evenodd"/>'
    + (p.win||[]).map(w => `<rect class="warm" x="${w[0]}" y="${w[1]}" width="15" height="19" rx="1"/>`).join("");
  if (kind === "lamps") return '<path class="near-p" d="M0 148v-14h400v14z"/>'

  if (kind === "bench") return '<path class="near-p" d="M0 148v-40h400v40z M30 108V92h150v16z"/>'

function partNow(){ const h = new Date().getHours();
  return h < 5 ? "night" : h < 8 ? "dawn" : h < 17 ? "day" : h < 21 ? "dusk" : "night"; }
let PART = localStorage.getItem("bikes:part") || "auto";
function applyPart(){ document.documentElement.dataset.part = PART === "auto" ? partNow() : PART; }

/* what is still unbought: priced checklist lines nobody has ticked off */
function shoppingList() {
  const out = [];
  for (const [key, groups] of Object.entries(CHECKLISTS)) {
    const checks = DOC().checks[key] || {};
    for (const g of groups)
      for (const it of g.items)
        if (it.p && !checks[stableId(g.g, it.n)])
          out.push({ key, group:g.g, name:it.n, price:it.p, note:it.pn });
  }
  return out.sort((a,b) => b.price - a.price);
}

  /* money */
  h += `<div class="lbl">Затраты</div><div class="card">
    <div class="row"><span class="rl"><span class="rt">Закупка компонентов</span></span><span class="rv num">${rub(spend)}</span></div>
    <div class="row"><span class="rl"><span class="rt">Обслуживание за ${YEAR}</span></span><span class="rv num">${rub(yearCost(id,YEAR))}</span></div>
    <div class="row"><span class="rl"><span class="rt">Стоимость километра</span>
      ${cpk==null?'<span class="rs">нужен пробег</span>':''}</span>
      <span class="rv num">${cpk==null?'—':cpk.toFixed(2)+' ₽/км'}</span></div>
  </div>`;

  /* due now */
  if (own.state === 'owned') {
    const mine = RULES.filter(r => r.bikes.includes(id))
      .map(r => ({ r, st: dueStatus(id, r) }))
      .filter(x => x.st.state === 'due' || x.st.state === 'soon');
    if (mine.length) {
      h += `<div class="lbl">Пора обслужить <span class="n">${mine.length}</span></div><div class="card">`;
      h += mine.map(x => `<button class="att" data-att="${id}|${x.r.id}">
        <span class="txt"><span class="t1">${esc(x.r.task)}</span>
        <span class="t2">${x.st.left!=null ? (x.st.left>0?'через '+km(x.st.left):'просрочено на '+km(-x.st.left)) : 'по календарю'}</span></span>
        <span class="chip ${x.st.state==='due'?'danger':'warn'}">${x.st.text}</span>
        <span class="arw">›</span></button>`).join('');
      h += `</div>`;
    }
  }

  /* велосипед в сборке — покажем, сколько собрано, и уведём в его чек-лист */
  if (b.status === 'в сборке') {
    const key = Object.keys(CHECKLISTS).find(k => k.startsWith(id.replace(/-v?\d*$/, '')) || k.includes(id.split('-')[0]));
    if (key) {
      const gs = CHECKLISTS[key], ch = DOC().checks[key] || {};
      const total = gs.reduce((n,g)=>n+g.items.length,0);
      const done  = gs.reduce((n,g)=>n+g.items.filter(it=>ch[stableId(g.g,it.n)]).length,0);
      const pct = Math.round(done/total*100);
      h += `<div class="lbl">Сборка</div>
      <button class="card pad" data-bkey="${key}" data-tab="build" style="width:100%;text-align:left;border:0;cursor:pointer">
        <div class="spread"><span class="muted">Отмечено по чек-листу</span>
          <span class="num" style="font-weight:700">${done} / ${total}</span></div>
        <div class="track" style="margin-top:10px"><div class="fill" style="width:${Math.max(2,pct)}%;background:var(--accent)"></div></div>
        <div class="tiny" style="margin-top:8px">Открыть чек-лист ›</div>
      </button>`;
    }
  }

  /* спеки: одна таблица — что стоит и сколько стоило, без раскрывашек */
  if (Object.keys(groups).length) {
    const n = componentsOf(id).length;
    h += `<div class="lbl">Текущие спеки <span class="n">${n}</span></div>
    <div class="card scroll"><table class="spec">
      <thead><tr><th>Что стоит</th>${SHOWMONEY?'<th class="n">Цена</th>':''}</tr></thead>
      <tbody>`;
    for (const [g, items] of Object.entries(groups)) {
      const sum = items.reduce((s,c)=>s+(Number(c.purchasePrice)||0),0);
      h += `<tr class="gr"><td>${esc(g)}</td>${SHOWMONEY?`<td class="n">${rub(sum)}</td>`:''}</tr>`;
      h += items.map(c => `<tr${EDITOR?` class="ed" data-part="${esc(id)}|${esc(c.id)}"`:''}>
        <td class="wrap"><b>${esc(c.part)}</b>${c.spec?`<span class="mono" style="display:block;color:var(--ink2);font-size:12.5px">${esc(c.spec)}</span>`:''}</td>
        ${SHOWMONEY?`<td class="n">${c.purchasePrice?rub(c.purchasePrice):'—'}</td>`:''}</tr>`).join('');
    }
    h += `${SHOWMONEY?`<tr class="tot"><td>Итого закупка</td><td class="n">${rub(spend)}</td></tr>`:''}
      </tbody></table></div>
      ${EDITOR?`<div class="tiny" style="margin-top:9px">Нажмите на деталь, чтобы заменить её или поправить цену.</div>
      <div style="margin-top:10px"><button class="btn" data-part="${esc(id)}|new">Добавить деталь</button></div>`:''}`;
  } else {
    h += `<div class="lbl">Текущие спеки</div>
      <div class="card"><div class="empty">Состав не расписан по позициям${b.totalSpend?` — известна только общая сумма ${rub(b.totalSpend)}`:''}</div></div>`;
  }

  /* history */
  const evs = eventsOf(id).sort((a,b)=>b.date.localeCompare(a.date));
  h += `<div class="lbl">История обслуживания${evs.length?` <span class="n">${evs.length}</span>`:''}</div>`;
  h += evs.length
    ? `<div class="card">${evs.map(eventRow).join('')}</div>`
    : `<div class="card"><div class="empty">Пока ничего не записано</div></div>`;
  if (EDITOR) h += `<div style="margin-top:12px"><button class="btn pri" data-addevent="${id}">Записать обслуживание</button></div>`;
  $('v-garage').innerHTML = h;
}

function eventRow(e) {
  const r = RULE[e.rule];
  const cat = e.category || (r && r.category) || 'consumables';
  return `<div class="row">
    <span class="rl">
      <span class="rt">${esc(e.part || (r ? r.task : 'Обслуживание'))}</span>
      <span class="rs">${esc(e.date)}${e.odo?' · '+km(e.odo):''}${e.place?' · '+esc(e.place):''}</span>
      ${e.note?`<span class="rs">${esc(e.note)}</span>`:''}
      <span class="rs"><span class="chip">${esc(CATS[cat].label)}</span></span>
    </span>
    <span style="text-align:right;flex:none">
      <span class="rv num" style="display:block">${rub(evCost(e))}</span>
      <span class="tiny" style="display:block">${rub(e.partCost||0)} + ${rub(e.labourCost||0)} работа</span>
      ${EDITOR?`<button class="btn ghost sm" data-delevent="${e.id}" style="margin-top:8px;font-size:12.5px;min-height:44px">Удалить</button>`:''}
    </span></div>`;
}

/* ---------------------------------------------------------- service */
function viewService() {
  const att = attention();
  const dueN = att.filter(a => a.st.state === 'due').length;
  let h = `<div class="seg">
    <button data-smode="due" class="${serviceMode==='due'?'on':''}">Сейчас${att.length?' · '+att.length:''}</button>
    <button data-smode="all" class="${serviceMode==='all'?'on':''}">Весь регламент</button>
  </div>
  ${EDITOR?'<div style="margin-bottom:16px"><button class="btn pri" data-addevent="">Записать обслуживание</button></div>':''}`;

  if (serviceMode === 'due') {
    if (!att.length) {
      h += `<div class="card"><div class="calm">
        <div class="ic">${liveEvents().length?'✅':'🔧'}</div>
        <div class="t">${liveEvents().length?'Ничего не горит':'Пока нечего показать'}</div>
        <div class="s">${liveEvents().length
          ? 'Все интервалы в норме — можно спокойно ехать в Комарово. Загляните во «Весь регламент», чтобы посмотреть, что предстоит.'
          : 'Сроки считаются от вашей последней записи. Запишите обслуживание — и здесь появится, что подходит к замене.'}</div></div></div>`;
    } else {
      h += `<div class="lbl">${dueN?'Просрочено или пора':'Скоро'} <span class="n">${att.length}</span></div><div class="card">`;
      h += att.map(a => `<button class="att" data-att="${a.bike.id}|${a.rule.id}">
        <span class="dotc" style="background:${HUE(a.bike.id)}"></span>
        <span class="txt"><span class="t1">${esc(a.rule.task)}</span>
          <span class="t2">${esc(a.bike.name)} · ${a.st.left!=null
            ? (a.st.left>0?'через '+km(a.st.left):'просрочено на '+km(-a.st.left)) : 'по календарю'}</span></span>
        <span class="chip ${a.st.state==='due'?'danger':'warn'}">${a.st.text}</span>
        <span class="arw">›</span></button>`).join('');
      h += `</div><div class="tiny" style="margin-top:10px">Нажмите на строку — откроется запись с уже подставленной ценой детали.</div>`;
    }
    $('v-service').innerHTML = h;
    return;
  }

  /* full regimen, grouped, collapsed by default */
  const byCat = {};
  for (const r of RULES) (byCat[r.category] || (byCat[r.category] = [])).push(r);
  h += `<div class="cols wide">`;
  for (const [cat, rules] of Object.entries(byCat)) {
    // section держит подпись и карточку вместе, иначе колонка разорвёт их
    h += `<section><div class="lbl">${esc(CATS[cat].label)} <span class="n">${rules.length}</span></div><div class="card">`;
    h += rules.map(r => {
      const states = r.bikes.filter(isOwned).map(bid => ({ bid, st: dueStatus(bid, r) }));
      const worst = states.some(s=>s.st.state==='due') ? 'due' : states.some(s=>s.st.state==='soon') ? 'soon' : null;
      return `<details><summary><span class="arw">▶</span>
        <span style="flex:1;min-width:0">
          <span style="font-size:14.5px;font-weight:600;display:block;line-height:1.3">${esc(r.task)}</span>
          <span class="tiny">${km(r.interval_km)} или ${r.interval_months} мес</span>
        </span>
        ${worst?`<span class="chip ${worst==='due'?'danger':'warn'}">${worst==='due'?'пора':'скоро'}</span>`:''}
      </summary><div class="dbody">
        <div class="muted"><b>Признак износа.</b> ${esc(r.wear_indicator)}</div>
        <div class="tiny" style="margin-top:10px">
          <span class="chip ${r.source_type==='manufacturer'?'ok':''}">${r.source_type==='manufacturer'?'спецификация производителя':'оценка'}</span>
          <span style="display:block;margin-top:5px">${esc(r.source_note)}</span>
        </div>
        <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px">
          ${states.map(s=>`<span class="chip ${s.st.state==='due'?'danger':s.st.state==='soon'?'warn':s.st.state==='ok'?'ok':''}">
            <span class="dotc" style="background:${HUE(s.bid)}"></span>${esc(SHORT[s.bid])}: ${esc(s.st.text)}</span>`).join('')}
        </div>
        ${EDITOR?`<div style="margin-top:14px"><button class="btn sm" data-addevent="" data-rule="${r.id}" style="width:100%">Записать эту работу</button></div>`:''}
      </div></details>`;
    }).join('');
    h += `</div></section>`;
  }
  h += `</div>`;
  $('v-service').innerHTML = h;
}

/* ---------------------------------------------------------- money */
function viewMoney() {
  if (!SHOWMONEY) {
    $('v-money').innerHTML = `<div class="card"><div class="calm">
      <div class="ic">🙈</div>
      <div class="t">Цены скрыты</div>
      <div class="s">Суммы, закупка и обслуживание сейчас скрыты.<br>
        Выключается там же, где включился — на набережной сидит птица.</div>
    </div></div>`;
    return;
  }
  const sel = moneyBike === 'all' ? null : moneyBike;
  let h = `<div class="seg">
    <button data-mbike="all" class="${moneyBike==='all'?'on':''}">Все</button>
    ${BIKES.map(b=>`<button data-mbike="${b.id}" class="${moneyBike===b.id?'on':''}">${esc(SHORT[b.id])}</button>`).join('')}
  </div>`;

  const total = yearCost(sel, YEAR);
  const evs = eventsOf(sel, YEAR);

  /* Сначала всё, что вложено, потом уже текущий год: раньше вкладка вела
     нулём за год, пока рядом в гараже стояли сотни тысяч закупки. */
  const buyAll = (sel ? [BIKE[sel]] : BIKES).reduce((a,b)=>a+purchaseTotal(b.id), 0);
  const svcAll = eventsOf(sel).reduce((a,e)=>a+evCost(e), 0);
  h += `<div class="card pad">
    <div class="tiny">Вложено всего</div>
    <div class="hero num" style="margin-top:4px">${rub(buyAll + svcAll)}</div>
    <div class="tiny" style="margin-top:5px">закупка компонентов и всё обслуживание${sel?'':' по всему парку'}</div>
  </div>
  <div class="card">
    <div class="row"><span class="rl"><span class="rt">Закупка компонентов</span></span><span class="rv num">${rub(buyAll)}</span></div>
    <div class="row"><span class="rl"><span class="rt">Обслуживание за всё время</span></span><span class="rv num">${rub(svcAll)}</span></div>
    <div class="row"><span class="rl"><span class="rt">Обслуживание за ${YEAR}</span>
      <span class="rs">${evs.length} ${evs.length===1?'запись':evs.length<5?'записи':'записей'}</span></span>
      <span class="rv num">${rub(total)}</span></div>
  </div>`;

  if (!evs.length) {
    h += `<div class="card" style="margin-top:10px"><div class="calm">
      <div class="ic">📋</div><div class="t">Трат за ${YEAR} нет</div>
      <div class="s">Подозрительно. Графики соберутся сами, как только появится первая запись об обслуживании.</div></div></div>`;
    /* ownership summary is still worth showing */
    h += ownershipSummary(sel);
    $('v-money').innerHTML = h; return;
  }

  /* per bike — colour is bike identity */
  if (!sel) {
    const rows = BIKES.map(b => ({ id:b.id, label:b.name, value:yearCost(b.id,YEAR),
                                   text:rub(yearCost(b.id,YEAR)), color:HUE(b.id) }))
      .filter(r=>r.value>0).sort((a,b)=>b.value-a.value).map((r,i)=>Object.assign(r,{i}));
    if (rows.length) h += `<div class="lbl">По велосипедам</div><div class="card">${barRows(rows)}</div>`;
  }

  /* categories — magnitude, one hue, every bar labelled, table underneath */
  const split = categorySplit(sel, YEAR);
  const used = Object.keys(split).filter(k=>split[k]>0).sort((a,b)=>split[b]-split[a]);
  if (used.length) {
    h += `<div class="lbl">По категориям</div><div class="card">${
      barRows(used.map((k,i)=>({ label:CATS[k].label, value:split[k], text:rub(split[k]),
                                 sub:Math.round(split[k]/total*100)+'% от суммы', i })))}</div>`;
  }

  /* cost per km */
  const bl = sel ? [BIKE[sel]] : ownedBikes();
  h += `<div class="lbl">Стоимость километра</div><div class="card">`;
  h += bl.map(b => {
    const c = costPerKm(b.id, YEAR);
    return `<div class="row"><span class="dotc" style="background:${HUE(b.id)}"></span>
      <span class="rl"><span class="rt">${esc(b.name)}</span>
      <span class="rs">${DOC().odo[b.id]?km(DOC().odo[b.id]):'пробег не указан'}</span></span>
      <span class="rv num">${c==null?'—':c.toFixed(2)+' ₽/км'}</span></div>`;
  }).join('');
  h += `</div><div class="tiny" style="margin-top:9px">Где пробега нет, значение пустое, а не ноль — неизвестное не значит дешёвое.</div>`;

  /* biggest line items */
  const top = evs.slice().sort((a,b)=>evCost(b)-evCost(a)).slice(0,8);
  if (top.length) {
    h += `<div class="lbl">Самые дорогие позиции</div><div class="card">${
      barRows(top.map((e,i)=>({
        label: e.part || (RULE[e.rule]?RULE[e.rule].task:'Работа'),
        sub: (sel?'':BIKE[e.bike].name + ' · ') + e.date,
        value: evCost(e), text: rub(evCost(e)), color: HUE(e.bike), i })))}</div>`;
  }

  /* forecast */
  const fb = (sel ? [BIKE[sel]] : ownedBikes()).filter(b => isOwned(b.id));
  const fRows = fb.map(b => ({ b, rows: forecast(b.id).filter(r=>r.cost>0) })).filter(x => x.rows.length);
  if (fRows.length) {
    h += `<div class="lbl">Прогноз на ${YEAR+1}</div>`;
    for (const {b, rows} of fRows) {
      const annual = Number(DOC().annualKm[b.id]) || 0;
      const sum = rows.reduce((s,r)=>s+r.cost,0);
      h += `<div class="card"><div class="pad" style="padding-bottom:10px">
        <div class="spread"><span style="font-weight:700;display:flex;align-items:center;gap:8px">
          <span class="dotc" style="background:${HUE(b.id)}"></span>${esc(b.name)}</span>
          <span class="num" style="font-weight:800">≈ ${rub(sum)}</span></div>
        <div class="tiny" style="margin-top:5px">${annual
          ? 'При годовом пробеге ' + km(annual) + '.'
          : 'Годовой пробег не задан — считаю только по календарным интервалам. Укажите его в карточке, чтобы учитывались километры.'}</div>
        </div>
        <details><summary><span class="arw">▶</span><span style="flex:1;font-size:14px">Из чего складывается</span></summary>
        <div class="dbody"><div class="scroll"><table>
          <thead><tr><th>Работа</th><th class="n">Раз в год</th><th class="n">Стоимость</th></tr></thead>
          <tbody>${rows.slice(0,10).map(r=>`<tr><td class="wrap">${esc(r.rule.task)}</td>
            <td class="n">${r.times.toFixed(1)}</td><td class="n">${rub(r.cost)}</td></tr>`).join('')}</tbody>
        </table></div></div></details></div>`;
    }
  }

  h += ownershipSummary(sel);
  $('v-money').innerHTML = h;
}

function ownershipSummary(sel) {
  const list = sel ? [BIKE[sel]] : BIKES;
  const sold = list.filter(b => !isOwned(b.id));
  if (!sold.length) return '';
  let h = `<div class="lbl">Проданные — итог владения</div><div class="card">`;
  h += sold.map(b => {
    const own = ownershipOf(b.id);
    const inv = purchaseTotal(b.id) + eventsOf(b.id).reduce((s,e)=>s+evCost(e),0);
    return `<div class="row"><span class="dotc" style="background:${HUE(b.id)}"></span>
      <span class="rl"><span class="rt">${esc(b.name)}</span>
      <span class="rs">вложено ${rub(inv)}${own.soldPrice?' · продан за '+rub(own.soldPrice):' · цена продажи не указана'}${own.soldDate?' · '+esc(own.soldDate):''}</span></span>
      <span class="rv num">${rub(netCost(b.id))}</span></div>`;
  }).join('');
  h += `</div><div class="tiny" style="margin-top:9px">Итог — сколько велосипед стоил за всё время: вложено минус выручено. Цену продажи впишите в его карточке.</div>`;
  return h;
}

function viewFrames() {
  const ranked = FRAMES.filter(f => f.total != null).sort((a,b)=>b.total-a.total);
  const excluded = FRAMES.filter(f => f.total == null);
  const cohorts = {};
  for (const f of ranked) (cohorts[f.price_basis || 'frame'] || (cohorts[f.price_basis||'frame'] = [])).push(f);

  let h = `<div class="seg">
    <button data-fmode="short" class="${framesMode==='short'?'on':''}">Шорт-лист</button>
    <button data-fmode="ranked" class="${framesMode==='ranked'?'on':''}">База · рейтинг</button>
    <button data-fmode="excluded" class="${framesMode==='excluded'?'on':''}">Исключено · ${excluded.length}</button>
    <button data-fmode="all" class="${framesMode==='all'?'on':''}">Все · ${FRAMES.length}</button>
  </div>`;

  if (framesMode === 'short') { $('v-frames').innerHTML = h + viewChoice(); return; }

  h += `<div class="warnbox" style="margin-bottom:14px">
    <b>Балл — мой расчёт, а не оценка автора таблицы.</b><br>
    В исходном файле есть легенда с категориями top / ok / nah, но автор не проставил их ни в одной строке — эти заливки встречаются только в самой легенде. Его настоящее мнение — в комментариях, они показаны у каждой рамы.
  </div>
  <div class="tiny" style="margin-bottom:14px">База из ${FRAMES.length} рам: ${ranked.length} в рейтинге, ${excluded.length} исключены из-за TBD.</div>`;

  if (framesMode === 'ranked') {
    const best = ranked[0];
    h += `<div class="lbl">Лучший гравел по расчёту</div>
    <div class="card"><div style="height:3px;background:var(--accent)"></div><div class="pad">
      <div style="font-size:20px;font-weight:800;letter-spacing:-.025em">${esc(best.brand)} ${esc(best.name)}</div>
      <div class="muted" style="margin-top:5px">${best.sum_weight_g?best.sum_weight_g+' г (рама+вилка)':'вес TBD'} · до ${best.tyre_back_mm} мм · ${rub(best.price)}
        <span class="chip">${esc(best.price_basis||'frame')}</span></div>
      ${best.comment?`<div class="muted" style="margin-top:10px"><b>Комментарий автора.</b> «${esc(best.comment)}»</div>`:''}
      <div class="spread" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
        <span class="tiny">Расчётный балл · пропусков ${best.tbd_count}</span>
        <span class="num" style="font-weight:800;font-size:21px">${best.total.toFixed(2)}</span></div>
      ${best.link?`<a href="${esc(best.link)}" target="_blank" rel="noopener"
        style="display:inline-flex;align-items:center;min-height:44px;font-size:13.5px;font-weight:600;margin-top:6px">Сайт производителя ›</a>`:''}
    </div></div>`;

    for (const [basis, list] of Object.entries(cohorts)) {
      h += `<div class="lbl">${basis==='bike'?'Велосипед целиком':basis==='frame+'?'Фреймсет расширенный':'Фреймсет'} <span class="n">${list.length}</span></div>
      <div class="tiny" style="margin:-4px 0 9px">Фреймсеты и целые велосипеды не стоят в одном списке — сравнивать их по одной ценовой шкале нельзя.</div>
      <div class="card scroll"><table>
        <thead><tr><th>Рама</th><th class="n">Балл</th><th class="n">Вес</th><th class="n">Покрышка</th><th class="n">Цена</th><th class="n">TBD</th><th>Комментарий автора</th></tr></thead>
        <tbody>${list.map(frameRow).join('')}</tbody></table></div>`;
    }
    h += `<div class="tiny" style="margin-top:12px">Балл: вес 25%, покрышка 25%, цена 20% (внутри своей ценовой группы), год 15%, каретка 10%, багажный отсек 5%. Без веса, цены или покрышки рама в рейтинг не попадает — иначе она выигрывала бы за счёт отсутствующих данных.</div>`;
  }

  if (framesMode === 'excluded') {
    h += `<div class="lbl">Исключены из рейтинга <span class="n">${excluded.length}</span></div>
    <div class="tiny" style="margin:-4px 0 9px">Не хватает данных для честного сравнения. Медиану вместо TBD не подставляю — это придумало бы цифры, которых нет.</div>
    <div class="card scroll"><table>
      <thead><tr><th>Рама</th><th>Чего не хватает</th><th class="n">Цена</th><th>Комментарий автора</th></tr></thead>
      <tbody>${excluded.map(f=>{
        const miss = [];
        if (!f.sum_weight_g) miss.push('вес');
        if (!f.price) miss.push('цена');
        if (!f.tyre_back_mm) miss.push('покрышка');
        return `<tr><td class="wrap">${esc(f.brand)} ${esc(f.name)}${catTag(f)}</td>
          <td>${miss.join(', ')||'—'}</td><td class="n">${f.price?rub(f.price):'TBD'}</td>
          <td class="wrap">${f.comment?esc(f.comment):'—'}</td></tr>`;
      }).join('')}</tbody></table></div>
    <div class="tiny" style="margin-top:12px">Про вес отдельно: в исходной таблице сумма веса — формула SUM(), которая молча пропускает ячейки с TBD. У Argon 18 Anti Matter вилка TBD, поэтому сумма показывала 950 г — вес одной рамы. Он выглядел бы самым лёгким и выиграл бы по весу. Такие суммы обнулены.</div>`;
  }

  if (framesMode === 'all') {
    h += `<div class="card scroll"><table>
      <thead><tr><th>Рама</th><th class="n">Балл</th><th class="n">Вес</th><th class="n">Цена</th><th>Комментарий автора</th></tr></thead>
      <tbody>${FRAMES.slice().sort((a,b)=>(b.total??-1)-(a.total??-1)).map(f=>
        `<tr><td class="wrap">${esc(f.brand)} ${esc(f.name)}${catTag(f)}</td>
         <td class="n">${f.total!=null?f.total.toFixed(2):'—'}</td>
         <td class="n">${f.sum_weight_g?f.sum_weight_g+' г':'TBD'}</td>
         <td class="n">${f.price?rub(f.price):'TBD'}</td>
         <td class="wrap">${f.comment?esc(f.comment):'—'}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  $('v-frames').innerHTML = h;
}

function catTag(f) {
  if (f.category === 'not_released') return ' <span class="chip">не вышла / устарела</span>';
  if (f.category === 'upcoming') return ' <span class="chip warn">скоро выйдет</span>';
  return '';
}
function frameRow(f) {
  return `<tr><td class="wrap">${esc(f.brand)} ${esc(f.name)}${catTag(f)}</td>
    <td class="n">${f.total.toFixed(2)}</td>
    <td class="n">${f.sum_weight_g?f.sum_weight_g+' г':'TBD'}</td>
    <td class="n">${f.tyre_back_mm?f.tyre_back_mm+' мм':'TBD'}</td>
    <td class="n">${rub(f.price)}${f.price_basis_assumed?' <span class="chip warn">базис не указан</span>':''}</td>
    <td class="n">${f.tbd_count}</td>
    <td class="wrap">${f.comment?esc(f.comment):'—'}</td></tr>`;
}

/* ---------------------------------------------------------- build */
function viewBuild() {
  const groups = CHECKLISTS[buildKey];
  const checks = DOC().checks[buildKey] || {};
  const names = { 'faraoll-g50-checklist-v3':'Faraoll G50', 'speedone-275-checklist-v1':'Speedone 27.5' };
  const total = groups.reduce((n,g)=>n+g.items.length,0);
  const done = groups.reduce((n,g)=>n+g.items.filter(it=>checks[stableId(g.g,it.n)]).length,0);
  const money = groups.reduce((s,g)=>s+g.items.reduce((t,i)=>t+(i.p||0),0),0);
  const pct = Math.round(done/total*100);

  let h = `<div class="seg">${Object.keys(CHECKLISTS).map(k=>
    `<button data-bkey="${k}" class="${k===buildKey?'on':''}">${esc(names[k]||k)}</button>`).join('')}</div>
  <div class="card pad">
    <div class="spread"><span class="tiny">Отмечено</span>
      <span class="num" style="font-size:15px;font-weight:700">${done} / ${total}</span></div>
    <div class="hero num" style="margin-top:2px">${pct}%</div>
    <div class="track" style="height:10px;margin-top:10px"><div class="fill" style="width:${Math.max(2,pct)}%;background:var(--accent)"></div></div>
    ${(money&&SHOWMONEY)?`<div class="spread" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
      <span class="muted">Сумма по чек-листу</span><span class="num" style="font-weight:700">${rub(money)}</span></div>`:''}
  </div>`;

  const shop = shoppingList().filter(x => x.key === buildKey);
  if (shop.length) {
    const sum = shop.reduce((a,x)=>a+x.price, 0);
    h += `<div class="lbl">Надо купить <span class="n">${shop.length}</span></div>
    <div class="card"><div class="pad" style="padding-bottom:12px">
      <div class="spread"><span class="muted">Не отмечено позиций</span>
        <span class="num" style="font-weight:800;font-size:19px">${SHOWMONEY?rub(sum):shop.length}</span></div>
      <div class="tiny" style="margin-top:5px">${shavas(sum) ? shavas(sum).replace(' — это','Это') : 'Отметьте купленное — позиция уйдёт из списка.'}</div>
    </div>
    <details><summary><span class="arw">▶</span><span style="flex:1;font-size:14px">Показать список</span></summary><div>` +
    shop.map(x => `<div class="row"><span class="rl"><span class="rt">${esc(x.name)}</span>
      <span class="rs">${esc(x.group)}</span></span>
      ${SHOWMONEY?`<span class="rv num">${rub(x.price)}</span>`:''}</div>`).join('') +
    `</div></details></div>`;
  }

  h += `<div class="cols">`;
  groups.forEach((g, gi) => {
    const dn = g.items.filter(it=>checks[stableId(g.g,it.n)]).length;
    const isOpen = localStorage.getItem('c:'+buildKey+':'+gi) !== '1';
    h += `<section><div class="lbl">${esc(g.g)} <span class="n">${dn}/${g.items.length}</span></div>
      <div class="card"><details data-gi="${gi}"${isOpen?' open':''}>
      <summary><span class="arw">▶</span><span style="flex:1;font-size:14px;color:var(--ink2)">${dn}/${g.items.length}${dn===g.items.length?' · всё отмечено':''}</span></summary>
      <div>` +
      g.items.map(it => {
        const id = stableId(g.g, it.n);
        return `<${EDITOR?'button type="button"':'div'} class="it${checks[id]?' done':''}"${EDITOR?` data-check="${esc(id)}" aria-pressed="${checks[id]?'true':'false'}"`:' style="cursor:default"'}>
          ${EDITOR
            ? `<span class="box"><svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg></span>`
            : `<span class="box" style="border-color:transparent;background:${checks[id] ? 'var(--accent)' : 'var(--surface2)'}"></span>`}
          <span style="flex:1;min-width:0">
            <span class="nm" style="display:block">${esc(it.n)}${it.x?'<span class="chip warn" style="margin-left:7px">проверить</span>':''}</span>
            ${it.d?`<span class="dt" style="display:block">${esc(it.d)}</span>`:''}
            ${it.note?`<span class="note" style="display:block">${esc(it.note)}</span>`:''}
          </span>
          ${(it.p&&SHOWMONEY)?`<span class="pr">${rub(it.p)}${it.pn?`<small>${esc(it.pn)}</small>`:''}</span>`:''}
        </div>`;
      }).join('') + `</div></details></div></section>`;
  });
  h += `</div>`;
  $('v-build').innerHTML = h;
}

function openEventSheet(bikeId, ruleId) {
  const bid = bikeId || (ownedBikes()[0] || BIKES[0]).id;
  $('sheetbody').innerHTML = `<div class="grab"></div>
    <h3>Запись об обслуживании</h3>
    <p class="tiny">Цена детали подставляется из закупочной цены этого велосипеда, если такая деталь есть в составе.</p>
    <label for="f-bike">Велосипед</label>
    <select id="f-bike">${BIKES.map(b=>`<option value="${b.id}"${b.id===bid?' selected':''}>${esc(b.name)}${isOwned(b.id)?'':' (продан)'}</option>`).join('')}</select>
    <label for="f-rule">Работа по регламенту</label>
    <select id="f-rule"></select>
    <div class="grid2">
      <div><label for="f-date">Дата</label><input id="f-date" type="date" value="${today()}"></div>
      <div><label for="f-odo">Пробег, км</label><input id="f-odo" type="number" inputmode="numeric"></div>
    </div>
    <label for="f-part">Что делали / деталь</label><input id="f-part">
    <div class="grid2">
      <div><label for="f-pc">Цена детали, ₽</label><input id="f-pc" type="number" inputmode="decimal"></div>
      <div><label for="f-lc">Цена работы, ₽</label><input id="f-lc" type="number" inputmode="decimal"></div>
    </div>
    <label for="f-place">Где делали</label><input id="f-place" placeholder="дома / название мастерской">
    <label for="f-note">Заметка</label><textarea id="f-note"></textarea>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn ghost" id="f-cancel">Отмена</button>
      <button class="btn pri" id="f-save">Сохранить</button>
    </div>`;
  const fillRules = () => {
    const b = $('f-bike').value;
    const rs = RULES.filter(r => r.bikes.includes(b));
    $('f-rule').innerHTML = rs.map(r=>`<option value="${r.id}"${r.id===ruleId?' selected':''}>${esc(r.task)}</option>`).join('')
      + '<option value="">— своё, вне регламента —</option>';
    fillDefaults();
  };
  const fillDefaults = () => {
    const b = $('f-bike').value, r = RULE[$('f-rule').value];
    $('f-odo').placeholder = DOC().odo[b] || '';
    if (!r) return;
    const c = matchComponent(b, r);
    $('f-pc').value = defaultPartCost(b, r) || '';
    $('f-lc').value = r.est_labour_cost || '';
    $('f-part').value = c ? c.part + (c.spec ? ' — ' + c.spec : '') : r.task;
  };
  $('f-bike').onchange = fillRules;
  $('f-rule').onchange = fillDefaults;
  fillRules();
  $('f-cancel').onclick = closeSheet;
  $('f-save').onclick = () => {
    const b = $('f-bike').value, r = $('f-rule').value;
    const odo = $('f-odo').value ? Number($('f-odo').value) : (DOC().odo[b] ?? null);
    DOC().events.push({
      id: uid(), mtime: Date.now(), bike: b, rule: r || null,
      category: r ? RULE[r].category : 'consumables',
      date: $('f-date').value || today(), odo,
      part: $('f-part').value.trim(),
      partCost: Number($('f-pc').value) || 0,
      labourCost: Number($('f-lc').value) || 0,
      place: $('f-place').value.trim(),
      note: $('f-note').value.trim()
    });
    if (odo && (!DOC().odo[b] || odo > DOC().odo[b])) DOC().odo[b] = odo;
    persist(); closeSheet(); render(); sync(true);
  };
  $('sheet').classList.add('on');
}
