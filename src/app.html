<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)">
<meta name="description" content="Парк велосипедов: состав, регламент ТО, затраты, обзор гравийных рам 2027 и чек-листы сборки">
<title>Велосипеды — гараж, ТО и затраты</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#f5f5f4;
  --card:#ffffff;
  --ink:#1c1917;
  --ink2:#57534e;
  --ink3:#a8a29e;
  --line:#e7e5e4;
  --box:#d6d3d1;
  --accent:#0f766e;
  --accent2:#14b8a6;
  --warn:#b45309;
  --warn-soft:#fef3c7;
  --bad:#b91c1c;
  --bad-soft:#fee2e2;
  --ok:#15803d;
  --tag:#f5f5f4;
  --hdr:rgba(245,245,244,.82);
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --spring: cubic-bezier(.34,1.56,.64,1);
  /* dataviz — validated categorical slots 1..5 (light) */
  --surface-1:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --seq-1:#cde2fb; --seq-2:#86b6ef; --seq-3:#3987e5; --seq-4:#256abf; --seq-5:#104281;
  --grid:#e7e5e4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c0a09;
    --card:#1c1917;
    --ink:#fafaf9;
    --ink2:#a8a29e;
    --ink3:#78716c;
    --line:#292524;
    --box:#44403c;
    --accent:#14b8a6;
    --accent2:#5eead4;
    --warn:#fbbf24;
    --warn-soft:rgba(251,191,36,.12);
    --bad:#f87171;
    --bad-soft:rgba(248,113,113,.12);
    --ok:#4ade80;
    --tag:#292524;
    --hdr:rgba(12,10,9,.82);
    --shadow:0 1px 2px rgba(0,0,0,.4);
    /* dark steps of the same eight hues, validated against the dark surface */
    --surface-1:#1c1917;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --seq-1:#104281; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#86b6ef;
    --grid:#292524;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg);
  color:var(--ink);
  font:400 17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(76px + var(--safe-b));
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit;}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:50;
  background:var(--hdr);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
  padding:calc(var(--safe-t) + 10px) calc(var(--safe-r) + 16px) 10px calc(var(--safe-l) + 16px);
}
h1{margin:0; font-size:22px; font-weight:700; letter-spacing:-.02em;}
.sub{margin:2px 0 0; font-size:13px; color:var(--ink2);}
.syncbar{
  display:flex; align-items:center; gap:8px; margin-top:8px;
  font-size:12px; color:var(--ink2);
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none;}
.dot.on{background:var(--ok);}
.dot.dirty{background:var(--warn);}
.dot.err{background:var(--bad);}
.syncbar button{
  margin-left:auto; min-height:44px; padding:0 14px;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:10px; font-size:13px; cursor:pointer;
}

/* ---------- layout ---------- */
main{padding:16px calc(var(--safe-r) + 16px) 24px calc(var(--safe-l) + 16px); max-width:900px; margin:0 auto;}
.view{display:none;}
.view.on{display:block;}
h2{font-size:15px;font-weight:600;color:var(--ink2);margin:24px 0 10px;letter-spacing:.01em;}
h2:first-child{margin-top:4px;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden;
}
.pad{padding:14px;}
.muted{color:var(--ink2); font-size:13px; line-height:1.45;}
.tiny{color:var(--ink3); font-size:12px; line-height:1.4;}
.row{display:flex; align-items:center; gap:10px;}
.spread{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
.tag{
  display:inline-block; background:var(--tag); color:var(--ink2);
  border-radius:6px; padding:2px 7px; font-size:11px; font-weight:600;
  white-space:nowrap;
}
.tag.warn{background:var(--warn-soft); color:var(--warn);}
.tag.bad{background:var(--bad-soft); color:var(--bad);}
.tag.ok{background:color-mix(in srgb, var(--ok) 14%, transparent); color:var(--ok);}
.num{font-variant-numeric:tabular-nums;}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em;}

/* ---------- controls ---------- */
.btn{
  min-height:44px; padding:0 16px; border-radius:11px;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  font-size:15px; font-weight:500; cursor:pointer; display:inline-flex;
  align-items:center; justify-content:center; gap:6px;
}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn:active{transform:scale(.97);}
.btn.wide{width:100%;}
label{display:block; font-size:13px; color:var(--ink2); margin:12px 0 5px;}
input,select,textarea{
  width:100%; min-height:44px; padding:10px 12px;
  border:1px solid var(--box); border-radius:10px; background:var(--bg);
  -webkit-appearance:none; appearance:none;
}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
textarea{min-height:70px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid2 label{margin-top:12px;}

/* ---------- tabbar ---------- */
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  display:flex; background:var(--hdr);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);
  padding:6px calc(var(--safe-r) + 4px) calc(var(--safe-b) + 6px) calc(var(--safe-l) + 4px);
}
nav button{
  flex:1; min-height:44px; border:0; background:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  color:var(--ink3); font-size:10px; font-weight:600; padding:2px;
}
nav button.on{color:var(--accent);}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}

/* ---------- bike cards ---------- */
.bike{display:flex; gap:12px; padding:14px; align-items:center; cursor:pointer; width:100%; border:0; background:none; text-align:left; min-height:44px;}
.thumb{
  width:56px;height:56px;border-radius:12px;flex:none;
  background:var(--tag); display:flex;align-items:center;justify-content:center;
  font-size:24px; overflow:hidden;
}
.thumb img{width:100%;height:100%;object-fit:cover;}
.bike .nm{font-weight:600; font-size:16px; letter-spacing:-.01em;}

/* ---------- tables ---------- */
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
table{border-collapse:collapse; width:100%; font-size:13px;}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
th{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink3); font-weight:600;}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums;}
tr:last-child td{border-bottom:0;}
td.wrap{white-space:normal; min-width:200px;}

/* ---------- charts ---------- */
.chart{width:100%; display:block; overflow:visible;}
.legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;}
.legend span{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--ink2);}
.swatch{width:11px;height:11px;border-radius:3px;flex:none;}
.tip{
  position:fixed; z-index:99; pointer-events:none; opacity:0;
  background:var(--ink); color:var(--bg); font-size:12px; line-height:1.35;
  padding:7px 9px; border-radius:8px; max-width:220px;
  transition:opacity .12s;
}
.tip.on{opacity:1;}

/* ---------- checklist ---------- */
.it{display:flex; gap:11px; padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; align-items:flex-start; min-height:44px;}
.it:last-child{border-bottom:0;}
.it .box{
  width:24px;height:24px;border-radius:7px;border:2px solid var(--box);
  flex:none; margin-top:1px; display:flex;align-items:center;justify-content:center;
  transition:.18s var(--spring);
}
.it .box svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
.it.done .box{background:var(--accent); border-color:var(--accent);}
.it.done .box svg{opacity:1;}
.it.done .nm{text-decoration:line-through; color:var(--ink3);}
.it .nm{font-size:15px; line-height:1.3;}
.it .dt{font-size:13px; color:var(--ink2); margin-top:2px;}
.it .note{font-size:12px; color:var(--ink2); margin-top:5px; padding-left:9px; border-left:2px solid var(--line); line-height:1.4;}
.it .pr{margin-left:auto; font-size:13px; font-weight:600; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
.it .pr small{display:block; font-weight:400; font-size:11px; color:var(--ink3); white-space:normal; max-width:110px;}
.ghead{
  width:100%; min-height:44px; display:flex; align-items:center; gap:8px;
  padding:11px 14px; background:none; border:0; cursor:pointer;
  font-size:13px; font-weight:600; color:var(--ink2); text-align:left;
}
.ghead .arw{transition:transform .2s; font-size:10px; color:var(--ink3);}
section.closed .arw{transform:rotate(-90deg);}
section.closed .listwrap{display:none;}
.ghead .cnt{margin-left:auto; font-size:12px; color:var(--ink3); font-weight:500;}

/* ---------- misc ---------- */
.seg{display:flex; gap:0; border:1px solid var(--line); border-radius:11px; overflow-x:auto; overflow-y:hidden; background:var(--card); margin-bottom:14px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.seg::-webkit-scrollbar{display:none;}
.seg button{
  flex:1 0 auto; min-height:44px; border:0; background:none; color:var(--ink2);
  font-size:13px; font-weight:600; cursor:pointer; padding:0 12px; white-space:nowrap;
  border-right:1px solid var(--line);
}
.seg button:last-child{border-right:0;}
.seg button.on{background:var(--accent); color:#fff;}
.sheet{
  position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.4);
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.sheet.on{opacity:1; pointer-events:auto;}
.sheet > div{
  background:var(--bg); width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
  border-radius:18px 18px 0 0; padding:18px calc(var(--safe-r) + 16px) calc(var(--safe-b) + 18px) calc(var(--safe-l) + 16px);
  transform:translateY(20px); transition:transform .25s var(--spring);
  -webkit-overflow-scrolling:touch;
}
.sheet.on > div{transform:none;}
.sheet h3{margin:0 0 4px; font-size:19px;}
.warnbox{
  background:var(--warn-soft); border:1px solid color-mix(in srgb, var(--warn) 30%, transparent);
  border-radius:11px; padding:11px 13px; font-size:13px; color:var(--ink); line-height:1.45; margin-bottom:12px;
}
.empty{padding:26px 16px; text-align:center; color:var(--ink3); font-size:14px;}
a{color:var(--accent);}
</style>
</head>
<body>

<header>
  <h1 id="h1">Гараж</h1>
  <p class="sub" id="sub">5 велосипедов</p>
  <div class="syncbar">
    <span class="dot" id="sdot"></span>
    <span id="stext">—</span>
    <button id="sbtn">Синхронизация</button>
  </div>
</header>

<main>
  <div class="view on" id="v-garage"></div>
  <div class="view" id="v-service"></div>
  <div class="view" id="v-money"></div>
  <div class="view" id="v-frames"></div>
  <div class="view" id="v-build"></div>
</main>

<nav id="nav"></nav>
<div class="sheet" id="sheet"><div id="sheetbody"></div></div>
<div class="tip" id="tip"></div>

<script type="application/json" id="DATA">__DATA__</script>
<script>
"use strict";
/* ============================================================ data */
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const BIKES = DATA.bikes, RULES = DATA.maintenance, FRAMES = DATA.frames, CHECKLISTS = DATA.checklists;
const BIKE = Object.fromEntries(BIKES.map(b => [b.id, b]));
const RULE = Object.fromEntries(RULES.map(r => [r.id, r]));
const CATS = {
  drivetrain:  {label:'Трансмиссия', color:'var(--s1)'},
  brakes:      {label:'Тормоза',     color:'var(--s2)'},
  wheels:      {label:'Колёса',      color:'var(--s3)'},
  suspension:  {label:'Подвеска',    color:'var(--s4)'},
  consumables: {label:'Расходники',  color:'var(--s5)'}
};
const EMOJI = {'гравий':'🚵','МТБ хардтейл':'⛰️','детский':'🧒'};
/* Two bikes are both "Twitter" — fall through to the word that tells them apart. */
const SHORT = (() => {
  const first = {};
  for (const b of BIKES) first[b.name.split(' ')[0]] = (first[b.name.split(' ')[0]] || 0) + 1;
  return Object.fromEntries(BIKES.map(b => {
    const w = b.name.split(' ');
    return [b.id, first[w[0]] > 1 ? (w[1] || w[0]) : w[0]];
  }));
})();

/* ============================================================ utils */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rub = n => (n==null ? '—' : Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ') + ' ₽');
const km  = n => (n==null ? '—' : Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ') + ' км');
const slug = s => String(s).toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,48);
const uid = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const plural = (n, one, few, many) => {
  const a = Math.abs(n) % 10, b = Math.abs(n) % 100;
  return n + ' ' + (a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many);
};
const nBikes = n => plural(n, 'велосипед', 'велосипеда', 'велосипедов');
const today = () => new Date().toISOString().slice(0,10);
const YEAR = new Date().getFullYear();

/* ============================================================ storage
   One synced document. localStorage is the offline cache; the Worker is the
   cross-device copy. Everything the user creates lives in DOC. */
const LS = 'bikes:v1';
const SYNC_URL_KEY = 'bikes:syncUrl', SYNC_TOK_KEY = 'bikes:syncKey';

const blankDoc = () => ({ v:1, mtime:0, odo:{}, annualKm:{}, events:[], checks:{}, photos:{}, migratedAt:null });

let local = { rev:0, doc:blankDoc(), dirty:false, lastSync:null };
try {
  const raw = localStorage.getItem(LS);
  if (raw) { const p = JSON.parse(raw); local = Object.assign(local, p); local.doc = Object.assign(blankDoc(), p.doc); }
} catch(e) { /* corrupt cache — fall through to a blank doc, seed re-applies below */ }

const DOC = () => local.doc;

function persist(markDirty) {
  if (markDirty !== false) { local.dirty = true; local.doc.mtime = Date.now(); }
  try { localStorage.setItem(LS, JSON.stringify(local)); }
  catch(e) { toast('Не хватило места в памяти браузера — уменьшите число фото'); }
  paintSync();
}

/* ---- R1: migrate positional checklist ticks -> stable ids.
   MUST run against the unmodified FARAOLL/SPEEDONE arrays, before any content
   edit. Old keys are never deleted — they are the only rollback. */
function stableId(groupName, itemName){ return slug(groupName) + '/' + slug(itemName); }

function migrateChecks() {
  if (DOC().migratedAt) return 0;
  let n = 0;
  for (const [key, groups] of Object.entries(CHECKLISTS)) {
    let old = {};
    try { old = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) { old = {}; }
    const map = DOC().checks[key] || (DOC().checks[key] = {});
    groups.forEach((g, gi) => g.items.forEach((it, ii) => {
      if (old[gi + '-' + ii]) { map[stableId(g.g, it.n)] = 1; n++; }
    }));
  }
  DOC().migratedAt = new Date().toISOString();
  persist(n > 0);
  return n;
}

/* ---- R4: seed. If storage was evicted, the committed log seeds history back. */
function applySeed() {
  const seed = DATA.log || {};
  const d = DOC();
  const have = new Set(d.events.map(e => e.id));
  let n = 0;
  (seed.events || []).forEach(e => { if (!have.has(e.id)) { d.events.push(e); n++; } });
  for (const [k, v] of Object.entries(seed.odo || {})) if (d.odo[k] == null) { d.odo[k] = v; n++; }
  if (n) persist(true);
  return n;
}

/* ============================================================ sync
   Single JSON document behind a Worker. GET returns {rev,doc}; PUT sends the
   rev we based our edit on and is rejected on mismatch, so a stale device can
   never blow away the other one's writes — it refetches, merges, retries. */
let syncUrl = localStorage.getItem(SYNC_URL_KEY) || '';
let syncTok = localStorage.getItem(SYNC_TOK_KEY) || '';
let syncState = 'off', syncMsg = '';

function mergeDocs(mine, theirs) {
  const newer = (theirs.mtime || 0) >= (mine.mtime || 0) ? theirs : mine;
  const older = newer === theirs ? mine : theirs;
  const out = Object.assign({}, newer);

  // events: union by id, latest write per id wins (tombstones included, so a
  // delete survives the merge instead of being resurrected by the other side)
  const byId = new Map();
  for (const e of [...(theirs.events||[]), ...(mine.events||[])]) {
    const prev = byId.get(e.id);
    if (!prev || (e.mtime||0) >= (prev.mtime||0)) byId.set(e.id, e);
  }
  out.events = [...byId.values()];

  // Maps merge KEY BY KEY, never wholesale. A device whose storage Safari just
  // evicted boots with empty maps and a fresh mtime — replacing the map wholesale
  // would let it blank out the odometer for every bike in the cloud.
  for (const k of ['odo', 'annualKm', 'photos'])
    out[k] = Object.assign({}, older[k] || {}, newer[k] || {});

  out.checks = {};
  for (const key of new Set([...Object.keys(older.checks||{}), ...Object.keys(newer.checks||{})]))
    out.checks[key] = Object.assign({}, (older.checks||{})[key], (newer.checks||{})[key]);

  out.migratedAt = mine.migratedAt || theirs.migratedAt || null;
  out.mtime = Math.max(mine.mtime||0, theirs.mtime||0);
  return out;
}

async function pull() {
  const r = await fetch(syncUrl, { headers:{ 'authorization':'Bearer ' + syncTok } });
  if (r.status === 401) throw new Error('Ключ синхронизации не подошёл');
  if (!r.ok) throw new Error('Сервер ответил ' + r.status);
  return r.json(); // {rev, doc}
}

async function push(rev, doc) {
  const r = await fetch(syncUrl, {
    method:'PUT',
    headers:{ 'authorization':'Bearer ' + syncTok, 'content-type':'application/json', 'if-match':String(rev) },
    body: JSON.stringify(doc)
  });
  if (r.status === 409) return null;           // someone else wrote first
  if (r.status === 401) throw new Error('Ключ синхронизации не подошёл');
  if (!r.ok) throw new Error('Сервер ответил ' + r.status);
  return r.json();                             // {rev}
}

let syncing = false;
async function sync(silent) {
  if (!syncUrl || !syncTok) { syncState = 'off'; paintSync(); return; }
  if (syncing) return;
  syncing = true; syncState = 'busy'; paintSync();
  try {
    const remote = await pull();
    if (remote.rev !== local.rev || local.dirty) {
      local.doc = remote.doc ? mergeDocs(local.doc, remote.doc) : local.doc;
      local.rev = remote.rev;
    }
    if (local.dirty || (remote.doc && JSON.stringify(remote.doc) !== JSON.stringify(local.doc))) {
      let res = await push(local.rev, local.doc);
      if (res === null) {                       // conflict: refetch, merge, one retry
        const again = await pull();
        local.doc = mergeDocs(local.doc, again.doc || blankDoc());
        local.rev = again.rev;
        res = await push(local.rev, local.doc);
        if (res === null) throw new Error('Конфликт записи, попробуйте ещё раз');
      }
      local.rev = res.rev;
    }
    local.dirty = false; local.lastSync = Date.now(); syncState = 'on'; syncMsg = '';
    try { localStorage.setItem(LS, JSON.stringify(local)); } catch(e){}
    render();
  } catch (err) {
    syncState = 'err'; syncMsg = err.message;
    if (!silent) toast(err.message);
  } finally {
    syncing = false; paintSync();
  }
}

function paintSync() {
  const dot = $('sdot'), txt = $('stext');
  if (!syncUrl || !syncTok) {
    dot.className = 'dot'; txt.textContent = 'Только на этом устройстве';
  } else if (syncState === 'busy') {
    dot.className = 'dot'; txt.textContent = 'Синхронизирую…';
  } else if (syncState === 'err') {
    dot.className = 'dot err'; txt.textContent = syncMsg || 'Ошибка синхронизации';
  } else if (local.dirty) {
    dot.className = 'dot dirty'; txt.textContent = 'Есть несохранённые изменения';
  } else {
    dot.className = 'dot on';
    const ago = local.lastSync ? Math.round((Date.now() - local.lastSync)/60000) : null;
    txt.textContent = ago == null ? 'Синхронизировано'
      : ago < 1 ? 'Синхронизировано только что'
      : ago < 60 ? 'Синхронизировано ' + ago + ' мин назад'
      : 'Синхронизировано ' + Math.round(ago/60) + ' ч назад';
  }
}

/* ============================================================ aggregation */
const evCost = e => (Number(e.partCost)||0) + (Number(e.labourCost)||0);
const liveEvents = () => DOC().events.filter(e => !e.deleted);
const eventsOf = (bikeId, year) => liveEvents().filter(e =>
  (!bikeId || e.bike === bikeId) && (!year || Number(e.date.slice(0,4)) === year));

function yearCost(bikeId, year){ return eventsOf(bikeId, year).reduce((s,e)=>s+evCost(e), 0); }

function categorySplit(bikeId, year) {
  const out = {};
  for (const k of Object.keys(CATS)) out[k] = 0;
  for (const e of eventsOf(bikeId, year)) {
    const c = e.category || (RULE[e.rule] && RULE[e.rule].category) || 'consumables';
    out[c] = (out[c] || 0) + evCost(e);
  }
  return out;
}

/* null, never 0 or Infinity, when the odometer is unset — an unknown ratio is
   not a cheap one. */
function costPerKm(bikeId, year) {
  const odo = Number(DOC().odo[bikeId]);
  if (!odo || odo <= 0) return null;
  return yearCost(bikeId, year) / odo;
}

function purchaseTotal(bikeId){
  const b = BIKE[bikeId];
  return (b.components||[]).reduce((s,c)=>s+(Number(c.purchasePrice)||0), 0);
}

/* forecast: for each rule that applies, how many times it comes due within the
   next year, from the interval and the bike's annual mileage. */
function forecast(bikeId) {
  const annual = Number(DOC().annualKm[bikeId]) || 0;
  const rows = [];
  for (const r of RULES) {
    if (!r.bikes.includes(bikeId)) continue;
    const last = eventsOf(bikeId).filter(e => e.rule === r.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    // "каждые N км или M месяцев — что наступит раньше" = whichever trigger fires
    // more often over a year. Backlog already accrued is not a recurring cost.
    const perYear = Math.max(12 / r.interval_months, annual ? annual / r.interval_km : 0);
    const unit = defaultPartCost(bikeId, r) + (Number(r.est_labour_cost) || 0);
    rows.push({ rule:r, times:perYear, cost:perYear * unit, unit, last });
  }
  return rows.sort((a,b)=>b.cost-a.cost);
}

/* "Стоимость замены подтягивается из закупочной цены компонента" — match the
   rule's keywords against this bike's real component list first, fall back to
   the rule's own estimate. */
function matchComponent(bikeId, rule) {
  const b = BIKE[bikeId]; if (!b || !rule.part_keywords || !rule.part_keywords.length) return null;
  for (const kw of rule.part_keywords) {
    const hit = (b.components||[]).find(c => (c.part||'').toLowerCase().includes(kw.toLowerCase()));
    if (hit && hit.purchasePrice) return hit;
  }
  return null;
}
/* A rule with est_part_cost 0 consumes no part — it is an inspection or an
   adjustment. It must never inherit the price of the component it inspects,
   or a headset check gets billed at the price of the frameset. */
function defaultPartCost(bikeId, rule) {
  if (!Number(rule.est_part_cost)) return 0;
  const c = matchComponent(bikeId, rule);
  return c ? Number(c.purchasePrice) : Number(rule.est_part_cost);
}

/* due status from odometer + last event */
function dueStatus(bikeId, rule) {
  const odo = Number(DOC().odo[bikeId]);
  const last = eventsOf(bikeId).filter(e => e.rule === rule.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if (!last) return { state:'unknown', text:'нет записей' };
  const lastOdo = Number(last.odo);
  const months = (Date.now() - new Date(last.date).getTime()) / (1000*60*60*24*30.44);
  const byMon = months / rule.interval_months;
  const byKm  = (odo && lastOdo != null) ? (odo - lastOdo) / rule.interval_km : 0;
  const p = Math.max(byMon, byKm);
  const left = (odo && lastOdo != null) ? Math.round(rule.interval_km - (odo - lastOdo)) : null;
  if (p >= 1) return { state:'due',  text:'пора', p, left };
  if (p >= .8) return { state:'soon', text:'скоро', p, left };
  return { state:'ok', text:'в норме', p, left };
}

/* ============================================================ charts
   Inline SVG, no library. Direct labels on every bar (light-mode contrast WARN
   on three categorical slots obliges visible labels + the table view below). */
function hbar(rows, opts) {
  opts = opts || {};
  const max = Math.max(1, ...rows.map(r => r.value));
  const rowH = 38, padL = 0, w = 100;
  const h = rows.length * rowH;
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" style="height:${h}px" aria-label="${esc(opts.aria||'')}">`;
  rows.forEach((r, i) => {
    const y = i * rowH + 18;
    const bw = Math.max(r.value > 0 ? 1.2 : 0, (r.value / max) * w);
    s += `<rect x="0" y="${y}" width="${bw}" height="12" rx="2.2" fill="${r.color || 'var(--seq-4)'}"></rect>`;
  });
  s += '</svg>';
  // labels ride in HTML above the svg so they never scale with preserveAspectRatio
  let l = '<div style="position:relative">' + s + '<div style="position:absolute;inset:0">';
  rows.forEach((r, i) => {
    l += `<div style="position:absolute;left:0;right:0;top:${i*rowH}px;height:${rowH}px">
      <div class="spread" style="padding:0 1px">
        <span style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%">${esc(r.label)}</span>
        <span class="num" style="font-size:13px;font-weight:600">${esc(r.text)}</span>
      </div></div>`;
  });
  return l + '</div></div>';
}

function stackedBar(bikeId, split, total) {
  if (!total) return '';
  let x = 0, s = '<svg class="chart" viewBox="0 0 100 14" preserveAspectRatio="none" style="height:14px" role="img">';
  for (const [k, v] of Object.entries(split)) {
    if (!v) continue;
    const w = (v / total) * 100;
    // 2px surface gap between segments (mark spec)
    s += `<rect x="${x}" y="0" width="${Math.max(0, w - 0.6)}" height="14" rx="2" fill="${CATS[k].color}"
      data-tip="${esc(CATS[k].label + ' — ' + rub(v))}"></rect>`;
    x += w;
  }
  return s + '</svg>';
}

function legend(keys) {
  return '<div class="legend">' + keys.map(k =>
    `<span><i class="swatch" style="background:${CATS[k].color}"></i>${esc(CATS[k].label)}</span>`).join('') + '</div>';
}

  h += `<h2>Прогноз на ${YEAR+1}</h2>`;
  const fb = sel ? [BIKE[sel]] : BIKES;
  let any = false;
  for (const b of fb) {
    const annual = Number(DOC().annualKm[b.id]) || 0;
    const rows = forecast(b.id).filter(r=>r.cost>0).slice(0,6);
    if (!rows.length) continue;
    any = true;
    const sum = forecast(b.id).reduce((s,r)=>s+r.cost,0);
    h += `<div class="card pad">
      <div class="spread"><span style="font-weight:600">${esc(b.name)}</span><span class="num" style="font-weight:600">≈ ${rub(sum)}</span></div>
      <div class="tiny" style="margin:6px 0 10px">${annual?'При годовом пробеге '+km(annual)+'.':'Годовой пробег не задан — считаю только по календарным интервалам. Укажите его в карточке велосипеда, чтобы прогноз учитывал километры.'}</div>
      <div class="scroll"><table><thead><tr><th>Работа</th><th class="n">Раз в год</th><th class="n">Стоимость</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="wrap">${esc(r.rule.task)}</td><td class="n">${r.times.toFixed(1)}</td><td class="n">${rub(r.cost)}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  }
  if (!any) h += `<div class="card"><div class="empty">Для прогноза укажите пробег велосипедов в их карточках.</div></div>`;

  $('v-money').innerHTML = h;
}

/* ---------------------------------------------------------- frames */
let framesMode = 'ranked';
function viewFrames() {
  const ranked = FRAMES.filter(f => f.total != null).sort((a,b)=>b.total-a.total);
  const excluded = FRAMES.filter(f => f.total == null);
  const cohorts = {};
  for (const f of ranked) (cohorts[f.price_basis || 'frame'] || (cohorts[f.price_basis||'frame'] = [])).push(f);

  let h = `<div class="card pad">
    <div class="spread"><span class="muted">Рам в таблице</span><span class="big num">${FRAMES.length}</span></div>
    <div class="tiny" style="margin-top:8px">${ranked.length} участвуют в рейтинге, ${excluded.length} исключены — у них TBD в весе, цене или покрышке.</div>
  </div>
  <div class="warnbox">
    <b>Балл ниже — мой расчёт, а не оценка автора таблицы.</b><br>
    В исходном файле есть легенда с категориями top / ok / nah, но автор не проставил их <i>ни в одной</i> строке — эти три заливки встречаются только в самой легенде. Выдавать вычисленный балл за его вердикт было бы враньём. Его настоящее мнение — в колонке с комментариями, она показана у каждой рамы.
  </div>
  <div class="seg" id="fseg">
    <button data-fmode="ranked" class="${framesMode==='ranked'?'on':''}">Рейтинг</button>
    <button data-fmode="excluded" class="${framesMode==='excluded'?'on':''}">Исключено (${excluded.length})</button>
    <button data-fmode="all" class="${framesMode==='all'?'on':''}">Все ${FRAMES.length}</button>
  </div>`;

  if (framesMode === 'ranked') {
    const best = ranked[0];
    h += `<h2>Лучший гравел по расчёту</h2>
    <div class="card pad">
      <div style="font-size:19px;font-weight:700;letter-spacing:-.02em">${esc(best.brand)} ${esc(best.name)}</div>
      <div class="muted" style="margin-top:4px">${best.sum_weight_g?best.sum_weight_g+' г (рама+вилка)':'вес TBD'} · до ${best.tyre_back_mm} мм · ${rub(best.price)} <span class="tag">${esc(best.price_basis||'frame')}</span></div>
      ${best.comment?`<div class="muted" style="margin-top:8px"><b>Комментарий автора таблицы.</b> «${esc(best.comment)}»</div>`:''}
      <div class="spread" style="margin-top:10px"><span class="tiny">Расчётный балл</span><span class="num" style="font-weight:700;font-size:20px">${best.total.toFixed(2)}</span></div>
      <div class="tiny" style="margin-top:6px">Пропусков в данных: ${best.tbd_count}</div>
      ${best.link?`<a href="${esc(best.link)}" target="_blank" rel="noopener" class="btn" style="margin-top:10px;font-size:14px">Сайт производителя ›</a>`:''}
    </div>`;

    for (const [basis, list] of Object.entries(cohorts)) {
      h += `<h2>Цена за ${basis==='bike'?'велосипед целиком':basis==='frame+'?'фреймсет расширенный':'фреймсет'} — ${list.length} шт</h2>
      <div class="tiny" style="margin:-4px 0 8px">Фреймсеты и целые велосипеды никогда не стоят в одном списке — сравнивать их ценой по одной шкале нельзя.</div>
      <div class="card scroll"><table>
        <thead><tr><th>Рама</th><th class="n">Балл</th><th class="n">Вес</th><th class="n">Покрышка</th><th class="n">Цена</th><th class="n">TBD</th><th>Комментарий автора</th></tr></thead>
        <tbody>${list.map(f=>frameRow(f)).join('')}</tbody></table></div>`;
    }
    h += `<p class="tiny">Балл: вес 25%, покрышка 25%, цена 20% (в пределах своей ценовой группы), год 15%, каретка 10%, багажный отсек 5%. Рама не может выиграть за счёт отсутствующих данных — без веса, цены или покрышки она вообще не попадает в рейтинг.</p>`;
  }

  if (framesMode === 'excluded') {
    h += `<h2>Исключены из рейтинга</h2>
    <div class="tiny" style="margin:-4px 0 8px">У этих рам не хватает данных для честного сравнения. Медиану вместо TBD не подставляю — это придумало бы цифры, которых нет.</div>
    <div class="card scroll"><table>
      <thead><tr><th>Рама</th><th>Чего не хватает</th><th class="n">Цена</th><th>Комментарий автора</th></tr></thead>
      <tbody>${excluded.map(f=>{
        const miss = [];
        if (!f.sum_weight_g) miss.push('вес');
        if (!f.price) miss.push('цена');
        if (!f.tyre_back_mm) miss.push('покрышка');
        return `<tr><td class="wrap">${esc(f.brand)} ${esc(f.name)}${catTag(f)}</td>
          <td>${miss.join(', ')||'—'}</td><td class="n">${f.price?rub(f.price):'TBD'}</td>
          <td class="wrap">${f.comment?esc(f.comment):'<span class="tiny">—</span>'}</td></tr>`;
      }).join('')}</tbody></table></div>
    <p class="tiny">Отдельно про вес: в исходной таблице сумма веса — это формула SUM(), которая молча пропускает ячейки с TBD. У Argon 18 Anti Matter вилка TBD, поэтому сумма показывала 950 г — вес одной рамы. В таблице он выглядел бы самым лёгким и выиграл бы по весу. Такие суммы обнулены.</p>`;
  }

  if (framesMode === 'all') {
    h += `<div class="card scroll"><table>
      <thead><tr><th>Рама</th><th class="n">Балл</th><th class="n">Вес</th><th class="n">Цена</th><th>Комментарий автора</th></tr></thead>
      <tbody>${FRAMES.slice().sort((a,b)=>(b.total??-1)-(a.total??-1)).map(f=>
        `<tr><td class="wrap">${esc(f.brand)} ${esc(f.name)}${catTag(f)}</td>
         <td class="n">${f.total!=null?f.total.toFixed(2):'<span class="tiny">не ранж.</span>'}</td>
         <td class="n">${f.sum_weight_g?f.sum_weight_g+' г':'TBD'}</td>
         <td class="n">${f.price?rub(f.price)+' <span class="tag">'+esc(f.price_basis||'?')+'</span>':'TBD'}</td>
         <td class="wrap">${f.comment?esc(f.comment):'<span class="tiny">—</span>'}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  $('v-frames').innerHTML = h;
}

function catTag(f) {
  if (f.category === 'not_released') return ' <span class="tag">не вышла / устарела</span>';
  if (f.category === 'upcoming') return ' <span class="tag warn">скоро выйдет</span>';
  return '';
}
function frameRow(f) {
  return `<tr><td class="wrap">${esc(f.brand)} ${esc(f.name)}${catTag(f)}</td>
    <td class="n">${f.total.toFixed(2)}</td>
    <td class="n">${f.sum_weight_g?f.sum_weight_g+' г':'TBD'}</td>
    <td class="n">${f.tyre_back_mm?f.tyre_back_mm+' мм':'TBD'}</td>
    <td class="n">${rub(f.price)}${f.price_basis_assumed?' <span class="tag warn">базис не указан</span>':''}</td>
    <td class="n">${f.tbd_count}</td>
    <td class="wrap">${f.comment?esc(f.comment):'<span class="tiny">—</span>'}</td></tr>`;
}

/* ---------------------------------------------------------- build */
function viewBuild() {
  const groups = CHECKLISTS[buildKey];
  const checks = DOC().checks[buildKey] || {};
  const names = { 'faraoll-g50-checklist-v3':'Faraoll G50', 'speedone-275-checklist-v1':'Speedone 27.5' };
  const total = groups.reduce((n,g)=>n+g.items.length,0);
  const done = groups.reduce((n,g)=>n+g.items.filter(it=>checks[stableId(g.g,it.n)]).length,0);
  const money = groups.reduce((s,g)=>s+g.items.reduce((t,i)=>t+(i.p||0),0),0);

  let h = `<div class="seg">${Object.keys(CHECKLISTS).map(k=>
    `<button data-bkey="${k}" class="${k===buildKey?'on':''}">${esc(names[k]||k)}</button>`).join('')}</div>
  <div class="card pad">
    <div class="spread"><span class="muted">Отмечено</span><span class="big num">${done} / ${total}</span></div>
    ${money?`<div class="spread" style="margin-top:6px"><span class="muted">Сумма по чек-листу</span><span class="num" style="font-weight:600">${rub(money)}</span></div>`:''}
  </div>`;

  groups.forEach((g, gi) => {
    const dn = g.items.filter(it=>checks[stableId(g.g,it.n)]).length;
    h += `<div class="card"><section${localStorage.getItem('c:'+buildKey+':'+gi)==='1'?' class="closed"':''}>
      <button class="ghead" data-collapse="${gi}"><span class="arw">▼</span><span>${esc(g.g)}</span><span class="cnt">${dn}/${g.items.length}</span></button>
      <div class="listwrap">` +
      g.items.map(it => {
        const id = stableId(g.g, it.n);
        return `<div class="it${checks[id]?' done':''}" data-check="${esc(id)}">
          <span class="box"><svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg></span>
          <span class="txt" style="flex:1;min-width:0">
            <span class="nm" style="display:block">${esc(it.n)}${it.x?'<span class="tag" style="margin-left:6px">ПРОВЕРИТЬ</span>':''}</span>
            ${it.d?`<span class="dt" style="display:block">${esc(it.d)}</span>`:''}
            ${it.note?`<span class="note" style="display:block">${esc(it.note)}</span>`:''}
          </span>
          ${it.p?`<span class="pr">${rub(it.p)}${it.pn?`<small>${esc(it.pn)}</small>`:''}</span>`:''}
        </div>`;
      }).join('') + `</div></section></div>`;
  });
  $('v-build').innerHTML = h;
}

/* ============================================================ event sheet */
function openEventSheet(bikeId, ruleId) {
  const bikes = BIKES;
  const bid = bikeId || bikes[0].id;
  const rules = RULES.filter(r => r.bikes.includes(bid));
  const rid = ruleId || (rules[0] && rules[0].id) || '';
  $('sheetbody').innerHTML = `
    <h3>Запись об обслуживании</h3>
    <p class="tiny">Цена детали подставляется из закупочной цены компонента этого велосипеда, если он есть в составе.</p>
    <label for="f-bike">Велосипед</label>
    <select id="f-bike">${bikes.map(b=>`<option value="${b.id}"${b.id===bid?' selected':''}>${esc(b.name)}</option>`).join('')}</select>
    <label for="f-rule">Работа по регламенту</label>
    <select id="f-rule"></select>
    <div class="grid2">
      <div><label for="f-date">Дата</label><input id="f-date" type="date" value="${today()}"></div>
      <div><label for="f-odo">Пробег, км</label><input id="f-odo" type="number" inputmode="numeric" placeholder="${DOC().odo[bid]||''}"></div>
    </div>
    <label for="f-part">Что делали / деталь</label>
    <input id="f-part" placeholder="—">
    <div class="grid2">
      <div><label for="f-pc">Цена детали, ₽</label><input id="f-pc" type="number" inputmode="decimal"></div>
      <div><label for="f-lc">Цена работы, ₽</label><input id="f-lc" type="number" inputmode="decimal"></div>
    </div>
    <label for="f-place">Где делали</label>
    <input id="f-place" placeholder="дома / название мастерской">
    <label for="f-note">Заметка</label>
    <textarea id="f-note" placeholder="—"></textarea>
    <div class="row" style="margin-top:16px;gap:8px">
      <button class="btn" id="f-cancel" style="flex:1">Отмена</button>
      <button class="btn pri" id="f-save" style="flex:1">Сохранить</button>
    </div>`;
  const fillRules = () => {
    const b = $('f-bike').value;
    const rs = RULES.filter(r => r.bikes.includes(b));
    $('f-rule').innerHTML = rs.map(r=>`<option value="${r.id}"${r.id===rid?' selected':''}>${esc(r.task)}</option>`).join('')
      + '<option value="">— своё, вне регламента —</option>';
    fillDefaults();
  };
  const fillDefaults = () => {
    const b = $('f-bike').value, r = RULE[$('f-rule').value];
    if (!r) return;
    const c = matchComponent(b, r);
    $('f-pc').value = defaultPartCost(b, r) || '';
    $('f-lc').value = r.est_labour_cost || '';
    $('f-part').value = c ? c.part + (c.spec ? ' — ' + c.spec : '') : r.task;
    $('f-odo').placeholder = DOC().odo[b] || '';
  };
  $('f-bike').onchange = fillRules;
  $('f-rule').onchange = fillDefaults;
  fillRules();
  $('f-cancel').onclick = closeSheet;
  $('f-save').onclick = () => {
    const b = $('f-bike').value, r = $('f-rule').value;
    const odo = $('f-odo').value ? Number($('f-odo').value) : (DOC().odo[b] ?? null);
    DOC().events.push({
      id: uid(), mtime: Date.now(),
      bike: b, rule: r || null,
      category: r ? RULE[r].category : 'consumables',
      date: $('f-date').value || today(),
      odo,
      part: $('f-part').value.trim(),
      partCost: Number($('f-pc').value) || 0,
      labourCost: Number($('f-lc').value) || 0,
      place: $('f-place').value.trim(),
      note: $('f-note').value.trim()
    });
    if (odo && (!DOC().odo[b] || odo > DOC().odo[b])) DOC().odo[b] = odo;
    persist(); closeSheet(); render(); sync(true);
  };
  $('sheet').classList.add('on');
}

function openSyncSheet() {
  $('sheetbody').innerHTML = `
    <h3>Синхронизация между устройствами</h3>
    <p class="tiny">Адрес хранилища и ключ. Введите их один раз на каждом устройстве — телефон и компьютер будут видеть одни и те же данные. Ключ открывает только этот документ: ни репозиторий, ни аккаунт он не даёт.</p>
    <label for="s-url">Адрес хранилища</label>
    <input id="s-url" value="${esc(syncUrl)}" placeholder="https://…workers.dev/doc" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label for="s-key">Ключ</label>
    <input id="s-key" value="${esc(syncTok)}" placeholder="вставьте ключ" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row" style="margin-top:16px;gap:8px">
      <button class="btn" id="s-cancel" style="flex:1">Отмена</button>
      <button class="btn pri" id="s-save" style="flex:1">Подключить</button>
    </div>
    <h2>Резервная копия файлом</h2>
    <p class="tiny">Работает и без синхронизации: выгрузит всё в файл, который можно положить в Файлы или iCloud.</p>
    <div class="row" style="gap:8px;margin-top:8px">
      <button class="btn" id="s-export" style="flex:1">Выгрузить</button>
      <button class="btn" id="s-import" style="flex:1">Загрузить</button>
      <input type="file" id="s-file" accept="application/json" style="display:none">
    </div>`;
  $('s-cancel').onclick = closeSheet;
  $('s-save').onclick = () => {
    syncUrl = $('s-url').value.trim().replace(/\/+$/,'');
    syncTok = $('s-key').value.trim();
    localStorage.setItem(SYNC_URL_KEY, syncUrl);
    localStorage.setItem(SYNC_TOK_KEY, syncTok);
    closeSheet(); local.dirty = true; sync();
  };
  $('s-export').onclick = () => {
    const blob = new Blob([JSON.stringify(local.doc, null, 1)], {type:'application/json'});
    const file = new File([blob], 'bikes-backup-' + today() + '.json', {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) {
      navigator.share({files:[file], title:'Резервная копия'}).catch(()=>{});
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    }
  };
  $('s-import').onclick = () => $('s-file').click();
  $('s-file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const inc = JSON.parse(rd.result);
        local.doc = mergeDocs(local.doc, Object.assign(blankDoc(), inc));
        persist(); closeSheet(); render(); sync(true);
        toast('Загружено');
      } catch(err) { toast('Файл не читается'); }
    };
    rd.readAsText(f);
  };
  $('sheet').classList.add('on');
}

function closeSheet(){ $('sheet').classList.remove('on'); }

let tipT;
function toast(msg) {
  const t = $('tip');
  t.textContent = msg;
  t.style.left = '50%'; t.style.top = 'auto'; t.style.bottom = 'calc(90px + var(--safe-b))';
  t.style.transform = 'translateX(-50%)';
  t.classList.add('on');
  clearTimeout(tipT); tipT = setTimeout(()=>t.classList.remove('on'), 2600);
}

/* ============================================================ render + events */
function render() {
  renderNav();
  const t = TABS.find(x => x.id === tab);
  $('h1').textContent = openBike && tab === 'garage' ? BIKE[openBike].name : t.title;
  $('sub').textContent = tab === 'garage' ? (openBike ? BIKE[openBike].owner : nBikes(BIKES.length))
    : tab === 'service' ? plural(RULES.length, 'пункт регламента', 'пункта регламента', 'пунктов регламента')
    : tab === 'money' ? YEAR + ' год'
    : tab === 'frames' ? plural(FRAMES.length, 'рама', 'рамы', 'рам')
    : 'Faraoll G50 и Speedone';
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('v-' + tab).classList.add('on');
  ({garage:viewGarage, service:viewService, money:viewMoney, frames:viewFrames, build:viewBuild})[tab]();
  paintSync();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-bike],[data-back],[data-addevent],[data-delevent],[data-mbike],[data-fmode],[data-bkey],[data-check],[data-collapse]');
  if (!t) { if (e.target === $('sheet')) closeSheet(); return; }

  if (t.dataset.tab)      { tab = t.dataset.tab; openBike = null; render(); window.scrollTo(0,0); return; }
  if (t.dataset.bike)     { openBike = t.dataset.bike; render(); window.scrollTo(0,0); return; }
  if (t.dataset.back)     { openBike = null; render(); return; }
  if (t.dataset.mbike)    { moneyBike = t.dataset.mbike; render(); return; }
  if (t.dataset.fmode)    { framesMode = t.dataset.fmode; render(); window.scrollTo(0,0); return; }
  if (t.dataset.bkey)     { buildKey = t.dataset.bkey; render(); return; }
  if (t.hasAttribute('data-addevent')) { openEventSheet(t.dataset.addevent || openBike, t.dataset.rule); return; }

  if (t.dataset.delevent) {
    const ev = DOC().events.find(x => x.id === t.dataset.delevent);
    if (ev) { ev.deleted = true; ev.mtime = Date.now(); persist(); render(); sync(true); }
    return;
  }
  if (t.dataset.collapse != null) {
    const sec = t.closest('section');
    const now = !sec.classList.contains('closed');
    sec.classList.toggle('closed');
    localStorage.setItem('c:' + buildKey + ':' + t.dataset.collapse, now ? '1' : '0');
    return;
  }
  if (t.dataset.check) {
    const m = DOC().checks[buildKey] || (DOC().checks[buildKey] = {});
    const id = t.dataset.check;
    m[id] = m[id] ? 0 : 1;
    t.classList.toggle('done', !!m[id]);
    const sec = t.closest('section');
    if (sec) {
      const gi = sec.querySelector('[data-collapse]').dataset.collapse;
      const g = CHECKLISTS[buildKey][gi];
      sec.querySelector('.cnt').textContent =
        g.items.filter(it => m[stableId(g.g, it.n)]).length + '/' + g.items.length;
    }
    persist(); sync(true);
    return;
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.odo)    { DOC().odo[el.dataset.odo] = Number(el.value) || null; persist(); sync(true); return; }
  if (el.dataset.annual) { DOC().annualKm[el.dataset.annual] = Number(el.value) || null; persist(); sync(true); return; }
  if (el.dataset.photo)  {
    const f = el.files[0]; if (!f) return;
    // downscale so a photo costs ~40 KB in the synced document, not 4 MB
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      DOC().photos[el.dataset.photo] = c.toDataURL('image/jpeg', .72);
      URL.revokeObjectURL(img.src);
      persist(); render(); sync(true);
    };
    img.src = URL.createObjectURL(f);
  }
});

/* chart tooltips — hover on desktop, tap on touch */
const tipEl = $('tip');
document.addEventListener('pointerover', e => {
  const m = e.target.closest && e.target.closest('[data-tip]');
  if (!m) return;
  tipEl.textContent = m.dataset.tip;
  const r = m.getBoundingClientRect();
  tipEl.style.transform = 'none'; tipEl.style.bottom = 'auto';
  tipEl.style.left = Math.min(window.innerWidth - 230, Math.max(8, r.left)) + 'px';
  tipEl.style.top = Math.max(8, r.top - 40) + 'px';
  tipEl.classList.add('on');
  clearTimeout(tipT); tipT = setTimeout(()=>tipEl.classList.remove('on'), 2600);
});

$('sbtn').onclick = openSyncSheet;

/* ============================================================ boot */
const migrated = migrateChecks();   // R1 — before anything touches content
applySeed();                        // R4 — repopulate after storage eviction
render();
if (migrated) toast('Перенесено отмеченных пунктов: ' + migrated);
if (syncUrl && syncTok) sync(true);
window.addEventListener('online', () => sync(true));
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(true); });
</script>
</body>
