function heroScene() {
  const list = [...ownedBikes(), ...soldBikes()];
  const clouds = [[14,'.5',86,'-6s'],[38,'.36',108,'-37s'],[24,'.3',64,'-66s'],[54,'.24',92,'-91s']];
  const drops = Array.from({length: 22}, (_, i) =>
    `<i class="drop" style="left:${(i*4.7+2)%100}%;animation-duration:${(.7+(i%5)*.16).toFixed(2)}s;
      animation-delay:-${(i*0.19).toFixed(2)}s;opacity:${(.1+(i%4)*.05).toFixed(2)}"></i>`).join('');
  return `<div class="scene" id="scene">
    <div class="sunpath layer" data-depth="0.05">
      <div class="sun" title="Солнце. Да, в Петербурге. Ходит редко, но ходит."></div>
    </div>
    <div class="layer" data-depth="0.12" style="top:0;height:110px">
      ${clouds.map(([top,op,w,delay])=>`<i class="cloud" style="top:${top}px;width:${w}px;opacity:${op};
        animation:drift ${64+w}s linear infinite ${delay}"></i>`).join('')}
    </div>
    <div class="rain layer" data-depth="0.08">${drops}</div>

    <svg class="gull" viewBox="0 0 40 16" width="26" height="11" aria-hidden="true">
      <path d="M2 10q7-9 13 0 6-9 13 0" fill="none" stroke="#e9eef5" stroke-width="2" stroke-linecap="round"/>
    </svg>

    <svg class="ridge layer" data-depth="0.2" viewBox="0 0 400 120" preserveAspectRatio="none"
         style="opacity:.96;bottom:114px;height:100px">
      <path d="${SKYLINE}" fill="var(--sil)"/>
    </svg>

    <!-- Нева: разведённый мост и кораблик под ним -->
    <div class="neva layer" data-depth="0.3">
      <svg class="bridge" viewBox="0 0 120 26" width="112" height="24" aria-hidden="true">
        <path d="M0 24h32l12-17v17h2V5" fill="none" stroke="var(--sil)" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M120 24H88L76 7v17h-2V5" fill="none" stroke="var(--sil)" stroke-width="3.4" stroke-linejoin="round"/>
      </svg>
      <svg class="boat" viewBox="0 0 40 20" width="30" height="15" aria-hidden="true">
        <path d="M2 15h34l-4 5H6z M18 14V3h12l-8 5h-4" fill="var(--sil)"/>
      </svg>
    </div>

    <!-- Ленобласть: сосны -->
    <svg class="pines layer" data-depth="0.42" viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true">
      ${Array.from({length: 26}, (_, i) => {
        const x = i * 16 + (i % 3) * 4, hgt = 30 + (i * 7 % 22);
        return `<path d="M${x} 60V${60-hgt/4} M${x-7} ${60-hgt/4}l7-${hgt*0.78}l7 ${hgt*0.78}z" fill="var(--pine)" stroke="var(--pine)" stroke-width="2"/>`;
      }).join('')}
    </svg>

    <div class="road"></div>
    <div class="strip" id="strip">
      ${list.map(b => {
        const gone = !isOwned(b.id);
        const dueN = gone ? 0 : RULES.filter(r => r.bikes.includes(b.id) && dueStatus(b.id, r).state === 'due').length;
        return `<button class="glyph${gone?' gone':''}" data-bike="${b.id}" aria-label="${esc(b.name)}">
          ${dueN?'<i class="alert"></i>':''}
          ${bikeGlyph(b, b.type==='детский' ? 78 : 100)}
          <span class="tagname">${esc(SHORT[b.id])}${gone?' · продан':''}</span>
        </button>`;
      }).join('')}
    </div>
    <span class="mosq" title="Комар. Ленобласть, июнь.">🦟</span>
  </div>`;
}

/* what is still unbought: priced checklist lines nobody has ticked off */
function shoppingList() {
  const out = [];
  for (const [key, groups] of Object.entries(CHECKLISTS)) {
    const checks = DOC().checks[key] || {};
    for (const g of groups)
      for (const it of g.items)
        if (it.p && !checks[stableId(g.g, it.n)])
          out.push({ key, group:g.g, name:it.n, price:it.p, note:it.pn });
  }
  return out.sort((a,b) => b.price - a.price);
}

/* ---------------------------------------------------------- garage */
function viewGarage() {
  if (openBike) return viewBikeDetail(openBike);
  const owned = ownedBikes(), sold = soldBikes();
  const att = attention().slice(0, 5);
  const hasHistory = liveEvents().length > 0;
  const shop = shoppingList();
  const shopSum = shop.reduce((s,x)=>s+x.price, 0);
  const spendOwned = owned.reduce((s,b)=>s+purchaseTotal(b.id), 0);
  const dueN = attention().filter(a => a.st.state === 'due').length;

  let h = heroScene();

  /* the dashboard: three numbers that answer "what have I got, what does it
     owe me, what do I still need to buy" — each one opens where it came from */
  h += `<div class="dash">
  <div class="kpis">
    <button class="kpi" data-tab="garage"><span class="k">В парке</span>
      <span class="v num">${owned.length}</span>
      <span class="s">${sold.length?sold.length+' продан':'все на ходу'}</span></button>
    <button class="kpi" data-tab="service"><span class="k">Сделать</span>
      <span class="v num" style="${dueN?'color:var(--danger)':''}">${att.length}</span>
      <span class="s">${dueN?dueN+' просрочено':'по регламенту'}</span></button>
    <button class="kpi" data-tab="build"><span class="k">Купить</span>
      <span class="v num">${shop.length}</span>
      <span class="s">${shop.length?(SHOWMONEY?rub(shopSum):'позиций'):'всё есть'}</span></button>
  </div>
  ${SHOWMONEY?`<div class="kpi reveal" style="cursor:default">
    <span class="k">Потрачено всего</span>
    <span class="v num" data-count="${spendOwned + yearCost(null, YEAR)}">${rub(spendOwned + yearCost(null, YEAR))}</span>
    <span class="s">закупка и обслуживание · подробнее в «Деньгах»</span>
  </div>`:''}</div>`;

  /* what needs doing — the first thing on screen, because it is the question
     you actually open this page with */
  if (att.length) {
    h += `<div class="lbl">Требует внимания <span class="n">${att.length}</span></div><div class="card">`;
    h += att.map(a => `<button class="att" data-att="${a.bike.id}|${a.rule.id}">
        <span class="dotc" style="background:${HUE(a.bike.id)}"></span>
        <span class="txt">
          <span class="t1">${esc(a.rule.task)}</span>
          <span class="t2">${esc(SHORT[a.bike.id])} · ${a.st.state==='due'
            ? (a.st.left!=null && a.st.left<0 ? 'просрочено на ' + km(-a.st.left) : 'пора менять')
            : (a.st.left!=null ? 'через ' + km(a.st.left) : 'скоро')}</span>
        </span>
        <span class="chip ${a.st.state==='due'?'danger':'warn'}">${a.st.state==='due'?'пора':'скоро'}</span>
        <span class="arw">›</span>
      </button>`).join('');
    h += `</div>`;
  } else {
    h += `<div class="card"><div class="calm">
      <div class="ic">${hasHistory ? '✅' : '🔧'}</div>
      <div class="t">${hasHistory ? 'Всё в норме' : 'Сайт ещё не знает ваш парк'}</div>
      <div class="s">${hasHistory
        ? 'Ни одна работа по регламенту не подошла к сроку. Даже дождь, кажется, перестал.'
        : EDITOR
          ? 'Укажите пробег в карточке велосипеда и запишите первое обслуживание — после этого здесь появится, что и когда пора менять.'
          : `В парке ${ownedBikes().length} велосипеда. Записей об обслуживании пока нет — как появятся, здесь будет видно, что подходит к замене.`}</div>
    </div></div>`;
  }

  /* fleet */
  h += `<div class="lbl">В парке <span class="n">${owned.length}</span></div><div class="stack">`;
  h += owned.map(b => `<span class="reveal">${bikeCard(b)}</span>`).join('');
  h += `</div>`;

  if (sold.length) {
    const net = sold.reduce((s,b)=>s+netCost(b.id), 0);
    h += `<div class="lbl">Продано <span class="n">${sold.length}</span></div>
      <div class="stack">${sold.map(b => `<span class="reveal">${bikeCard(b)}</span>`).join('')}</div>
      ${SHOWMONEY?`<div class="tiny" style="margin-top:10px">Итог по проданным: ${rub(net)} — во столько обошлось владение, уже за вычетом выручки.</div>`:''}`;
  }
  $('v-garage').innerHTML = h;
}

function bikeCard(b) {
  const own = ownershipOf(b.id);
  const spend = purchaseTotal(b.id);
  const odo = DOC().odo[b.id];
  const photo = DOC().photos[b.id];
  const dueN = own.state === 'owned'
    ? RULES.filter(r => r.bikes.includes(b.id) && dueStatus(b.id, r).state === 'due').length : 0;
  return `<button class="bikecard${own.state==='sold'?' sold':''}" data-bike="${b.id}">
    <span class="bar" style="background:${HUE(b.id)}"></span>
    <span class="bikebody">
      <span class="ph">${photo?`<img src="${esc(photo)}" alt="" width="54" height="54" loading="lazy">`:(EMOJI[b.type]||'🚲')}</span>
      <span style="flex:1;min-width:0">
        <span class="bname">${esc(b.name)}</span>
        <span class="bmeta">${esc(b.type)} · ${esc(b.owner)}</span>
        <span class="bstat">
          ${own.state==='sold'
            ? `<span class="chip">продан${(SHOWMONEY&&own.soldPrice)?' · '+rub(own.soldPrice):''}</span>`
            : `${odo?`<span>${km(odo)}</span>`:''}${SHOWMONEY?`<span>${spend?rub(spend):'состав не заведён'}</span>`:''}
               ${b.status==='в сборке'?'<span class="chip warn">в сборке</span>':''}
               ${dueN?`<span class="chip danger">${dueN} к замене</span>`:''}`}
        </span>
      </span>
      <span class="arw" style="color:var(--ink3);font-size:19px">›</span>
    </span>
  </button>`;
}

function viewBikeDetail(id) {
  const b = BIKE[id], own = ownershipOf(id);
  const groups = {};
  for (const c of componentsOf(id)) (groups[c.group] || (groups[c.group] = [])).push(c);
  const spend = purchaseTotal(id);
  const photo = DOC().photos[id];
  const cpk = costPerKm(id, YEAR);

  let h = `<button class="btn ghost sm" data-back="1" style="margin-bottom:14px">‹ Все велосипеды</button>
  <div class="card">
    <div style="height:3px;background:${HUE(id)}"></div>
    <div class="pad">
      <div style="display:flex;gap:14px;align-items:center">
        <label class="ph" style="width:66px;height:66px;font-size:27px;cursor:pointer;margin:0">
          ${photo?`<img src="${esc(photo)}" alt="" width="54" height="54" loading="lazy">`:(EMOJI[b.type]||'🚲')}
          ${EDITOR?`<input type="file" accept="image/*" data-photo="${id}" style="display:none">`:''}
        </label>
        <div style="flex:1;min-width:0">
          <div style="font-size:19px;font-weight:800;letter-spacing:-.025em;line-height:1.2">${esc(b.name)}</div>
          <div class="muted" style="margin-top:3px">${esc(b.type)} · ${esc(b.wheel)} · ${esc(b.owner)}</div>
          <div class="tiny" style="margin-top:4px">Нажмите на иконку, чтобы добавить фото</div>
        </div>
      </div>
    </div>
  </div>`;

  /* ownership */
  h += `<div class="lbl">Владение</div><div class="card pad">
    ${EDITOR ? `<div class="seg" style="margin-bottom:${own.state==='sold'?'14px':'0'}">
      <button data-own="${id}|owned" class="${own.state==='owned'?'on':''}">В парке</button>
      <button data-own="${id}|sold"  class="${own.state==='sold'?'on':''}">Продан</button>
    </div>` : `<span class="chip ${own.state==='sold'?'':'ok'}">${own.state==='sold'?'Продан':'В парке'}</span>`}
    ${own.state==='sold' ? `
      <div class="grid2">
        <div><label for="sd-${id}">Дата продажи</label>
          <input id="sd-${id}" type="date" value="${own.soldDate||''}" data-solddate="${id}" ${EDITOR?"":"readonly"}></div>
        <div><label for="sp-${id}">Продан за, ₽</label>
          <input id="sp-${id}" type="number" inputmode="numeric" value="${own.soldPrice??''}" data-soldprice="${id}" ${EDITOR?"":"readonly"} placeholder="—"></div>
      </div>
      <div class="spread" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
        <span class="muted">Итог владения</span>
        <span class="num" style="font-weight:800;font-size:18px">${rub(netCost(id))}</span>
      </div>
      <div class="tiny" style="margin-top:5px">Вложено ${rub(spend + eventsOf(id).reduce((s,e)=>s+evCost(e),0))}${own.soldPrice?', выручено '+rub(own.soldPrice):', выручка не указана'}.</div>
      <div class="tiny" style="margin-top:8px">Проданный велосипед не попадает в регламент ТО и в прогноз, но его затраты остаются в истории.</div>
    ` : `
      ${EDITOR ? `<div class="grid2" style="margin-top:14px">
        <div><label for="odo-${id}">Пробег, км</label>
          <input id="odo-${id}" type="number" inputmode="numeric" value="${DOC().odo[id]??''}" data-odo="${id}" placeholder="—"></div>
        <div><label for="ann-${id}">Пробег за год, км</label>
          <input id="ann-${id}" type="number" inputmode="numeric" value="${DOC().annualKm[id]??''}" data-annual="${id}" placeholder="—"></div>
      </div>
      <div class="tiny" style="margin-top:9px">Пробег нужен, чтобы считать «пора менять» и стоимость километра. Годовой — только для прогноза.</div>`
      : `<div class="row" style="padding:14px 0 0;border-top:1px solid var(--line);margin-top:14px">
          <span class="rl"><span class="rt">Пробег</span></span>
          <span class="rv num">${DOC().odo[id]?km(DOC().odo[id]):'не указан'}</span></div>`}
    `}
  </div>`;

  /* money */
  h += `<div class="lbl">Затраты</div><div class="card">
    <div class="row"><span class="rl"><span class="rt">Закупка компонентов</span></span><span class="rv num">${rub(spend)}</span></div>
    <div class="row"><span class="rl"><span class="rt">Обслуживание за ${YEAR}</span></span><span class="rv num">${rub(yearCost(id,YEAR))}</span></div>
    <div class="row"><span class="rl"><span class="rt">Стоимость километра</span>
      ${cpk==null?'<span class="rs">нужен пробег</span>':''}</span>
      <span class="rv num">${cpk==null?'—':cpk.toFixed(2)+' ₽/км'}</span></div>
  </div>`;

  /* due now */
  if (own.state === 'owned') {
    const mine = RULES.filter(r => r.bikes.includes(id))
      .map(r => ({ r, st: dueStatus(id, r) }))
      .filter(x => x.st.state === 'due' || x.st.state === 'soon');
    if (mine.length) {
      h += `<div class="lbl">Пора обслужить <span class="n">${mine.length}</span></div><div class="card">`;
      h += mine.map(x => `<button class="att" data-att="${id}|${x.r.id}">
        <span class="txt"><span class="t1">${esc(x.r.task)}</span>
        <span class="t2">${x.st.left!=null ? (x.st.left>0?'через '+km(x.st.left):'просрочено на '+km(-x.st.left)) : 'по календарю'}</span></span>
        <span class="chip ${x.st.state==='due'?'danger':'warn'}">${x.st.text}</span>
        <span class="arw">›</span></button>`).join('');
      h += `</div>`;
    }
  }

  /* велосипед в сборке — покажем, сколько собрано, и уведём в его чек-лист */
  if (b.status === 'в сборке') {
    const key = Object.keys(CHECKLISTS).find(k => k.startsWith(id.replace(/-v?\d*$/, '')) || k.includes(id.split('-')[0]));
    if (key) {
      const gs = CHECKLISTS[key], ch = DOC().checks[key] || {};
      const total = gs.reduce((n,g)=>n+g.items.length,0);
      const done  = gs.reduce((n,g)=>n+g.items.filter(it=>ch[stableId(g.g,it.n)]).length,0);
      const pct = Math.round(done/total*100);
      h += `<div class="lbl">Сборка</div>
      <button class="card pad" data-bkey="${key}" data-tab="build" style="width:100%;text-align:left;border:0;cursor:pointer">
        <div class="spread"><span class="muted">Отмечено по чек-листу</span>
          <span class="num" style="font-weight:700">${done} / ${total}</span></div>
        <div class="track" style="margin-top:10px"><div class="fill" style="width:${Math.max(2,pct)}%;background:var(--accent)"></div></div>
        <div class="tiny" style="margin-top:8px">Открыть чек-лист ›</div>
      </button>`;
    }
  }

  /* спеки: одна таблица — что стоит и сколько стоило, без раскрывашек */
  if (Object.keys(groups).length) {
    const n = componentsOf(id).length;
    h += `<div class="lbl">Текущие спеки <span class="n">${n}</span></div>
    <div class="card scroll"><table class="spec">
      <thead><tr><th>Что стоит</th>${SHOWMONEY?'<th class="n">Цена</th>':''}</tr></thead>
      <tbody>`;
    for (const [g, items] of Object.entries(groups)) {
      const sum = items.reduce((s,c)=>s+(Number(c.purchasePrice)||0),0);
      h += `<tr class="gr"><td>${esc(g)}</td>${SHOWMONEY?`<td class="n">${rub(sum)}</td>`:''}</tr>`;
      h += items.map(c => `<tr${EDITOR?` class="ed" data-part="${esc(id)}|${esc(c.id)}"`:''}>
        <td class="wrap"><b>${esc(c.part)}</b>${c.spec?`<span class="mono" style="display:block;color:var(--ink2);font-size:12.5px">${esc(c.spec)}</span>`:''}</td>
        ${SHOWMONEY?`<td class="n">${c.purchasePrice?rub(c.purchasePrice):'—'}</td>`:''}</tr>`).join('');
    }
    h += `${SHOWMONEY?`<tr class="tot"><td>Итого закупка</td><td class="n">${rub(spend)}</td></tr>`:''}
      </tbody></table></div>
      ${EDITOR?`<div class="tiny" style="margin-top:9px">Нажмите на деталь, чтобы заменить её или поправить цену.</div>
      <div style="margin-top:10px"><button class="btn" data-part="${esc(id)}|new">Добавить деталь</button></div>`:''}`;
  } else {
    h += `<div class="lbl">Текущие спеки</div>
      <div class="card"><div class="empty">Состав не расписан по позициям${b.totalSpend?` — известна только общая сумма ${rub(b.totalSpend)}`:''}</div></div>`;
  }

  /* history */
  const evs = eventsOf(id).sort((a,b)=>b.date.localeCompare(a.date));
  h += `<div class="lbl">История обслуживания${evs.length?` <span class="n">${evs.length}</span>`:''}</div>`;
  h += evs.length
    ? `<div class="card">${evs.map(eventRow).join('')}</div>`
    : `<div class="card"><div class="empty">Пока ничего не записано</div></div>`;
  if (EDITOR) h += `<div style="margin-top:12px"><button class="btn pri" data-addevent="${id}">Записать обслуживание</button></div>`;
  $('v-garage').innerHTML = h;
}

function eventRow(e) {
  const r = RULE[e.rule];
  const cat = e.category || (r && r.category) || 'consumables';
  return `<div class="row">
    <span class="rl">
      <span class="rt">${esc(e.part || (r ? r.task : 'Обслуживание'))}</span>
      <span class="rs">${esc(e.date)}${e.odo?' · '+km(e.odo):''}${e.place?' · '+esc(e.place):''}</span>
      ${e.note?`<span class="rs">${esc(e.note)}</span>`:''}
      <span class="rs"><span class="chip">${esc(CATS[cat].label)}</span></span>
    </span>
    <span style="text-align:right;flex:none">
      <span class="rv num" style="display:block">${rub(evCost(e))}</span>
      <span class="tiny" style="display:block">${rub(e.partCost||0)} + ${rub(e.labourCost||0)} работа</span>
      ${EDITOR?`<button class="btn ghost sm" data-delevent="${e.id}" style="margin-top:8px;font-size:12.5px;min-height:44px">Удалить</button>`:''}
    </span></div>`;
}

/* ---------------------------------------------------------- service */
function viewService() {
  const att = attention();
  const dueN = att.filter(a => a.st.state === 'due').length;
  let h = `<div class="seg">
    <button data-smode="due" class="${serviceMode==='due'?'on':''}">Сейчас${att.length?' · '+att.length:''}</button>
    <button data-smode="all" class="${serviceMode==='all'?'on':''}">Весь регламент</button>
  </div>
  ${EDITOR?'<div style="margin-bottom:16px"><button class="btn pri" data-addevent="">Записать обслуживание</button></div>':''}`;

  if (serviceMode === 'due') {
    if (!att.length) {
      h += `<div class="card"><div class="calm">
        <div class="ic">${liveEvents().length?'✅':'🔧'}</div>
        <div class="t">${liveEvents().length?'Ничего не горит':'Пока нечего показать'}</div>
        <div class="s">${liveEvents().length
          ? 'Все интервалы в норме — можно спокойно ехать в Комарово. Загляните во «Весь регламент», чтобы посмотреть, что предстоит.'
          : 'Сроки считаются от вашей последней записи. Запишите обслуживание — и здесь появится, что подходит к замене.'}</div></div></div>`;
    } else {
      h += `<div class="lbl">${dueN?'Просрочено или пора':'Скоро'} <span class="n">${att.length}</span></div><div class="card">`;
      h += att.map(a => `<button class="att" data-att="${a.bike.id}|${a.rule.id}">
        <span class="dotc" style="background:${HUE(a.bike.id)}"></span>
        <span class="txt"><span class="t1">${esc(a.rule.task)}</span>
          <span class="t2">${esc(a.bike.name)} · ${a.st.left!=null
            ? (a.st.left>0?'через '+km(a.st.left):'просрочено на '+km(-a.st.left)) : 'по календарю'}</span></span>
        <span class="chip ${a.st.state==='due'?'danger':'warn'}">${a.st.text}</span>
        <span class="arw">›</span></button>`).join('');
      h += `</div><div class="tiny" style="margin-top:10px">Нажмите на строку — откроется запись с уже подставленной ценой детали.</div>`;
    }
    $('v-service').innerHTML = h;
    return;
  }

  /* full regimen, grouped, collapsed by default */
  const byCat = {};
  for (const r of RULES) (byCat[r.category] || (byCat[r.category] = [])).push(r);
  h += `<div class="cols wide">`;
  for (const [cat, rules] of Object.entries(byCat)) {
    // section держит подпись и карточку вместе, иначе колонка разорвёт их
    h += `<section><div class="lbl">${esc(CATS[cat].label)} <span class="n">${rules.length}</span></div><div class="card">`;
    h += rules.map(r => {
      const states = r.bikes.filter(isOwned).map(bid => ({ bid, st: dueStatus(bid, r) }));
      const worst = states.some(s=>s.st.state==='due') ? 'due' : states.some(s=>s.st.state==='soon') ? 'soon' : null;
      return `<details><summary><span class="arw">▶</span>
        <span style="flex:1;min-width:0">
          <span style="font-size:14.5px;font-weight:600;display:block;line-height:1.3">${esc(r.task)}</span>
          <span class="tiny">${km(r.interval_km)} или ${r.interval_months} мес</span>
        </span>
        ${worst?`<span class="chip ${worst==='due'?'danger':'warn'}">${worst==='due'?'пора':'скоро'}</span>`:''}
      </summary><div class="dbody">
        <div class="muted"><b>Признак износа.</b> ${esc(r.wear_indicator)}</div>
        <div class="tiny" style="margin-top:10px">
          <span class="chip ${r.source_type==='manufacturer'?'ok':''}">${r.source_type==='manufacturer'?'спецификация производителя':'оценка'}</span>
          <span style="display:block;margin-top:5px">${esc(r.source_note)}</span>
        </div>
        <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:6px">
          ${states.map(s=>`<span class="chip ${s.st.state==='due'?'danger':s.st.state==='soon'?'warn':s.st.state==='ok'?'ok':''}">
            <span class="dotc" style="background:${HUE(s.bid)}"></span>${esc(SHORT[s.bid])}: ${esc(s.st.text)}</span>`).join('')}
        </div>
        ${EDITOR?`<div style="margin-top:14px"><button class="btn sm" data-addevent="" data-rule="${r.id}" style="width:100%">Записать эту работу</button></div>`:''}
      </div></details>`;
    }).join('');
    h += `</div></section>`;
  }
  h += `</div>`;
  $('v-service').innerHTML = h;
}

/* ---------------------------------------------------------- money */
function viewMoney() {
  if (!SHOWMONEY) {
    $('v-money').innerHTML = `<div class="card"><div class="calm">
      <div class="ic">🙈</div>
      <div class="t">Цены скрыты</div>
      <div class="s">Включён режим без цен: суммы, закупка и обслуживание не показываются.</div>
      <div style="margin-top:16px"><button class="btn pri" data-money="1">Показать цены</button></div>
    </div></div>`;
    return;
  }
  const sel = moneyBike === 'all' ? null : moneyBike;
  let h = `<div class="seg">
    <button data-mbike="all" class="${moneyBike==='all'?'on':''}">Все</button>
    ${BIKES.map(b=>`<button data-mbike="${b.id}" class="${moneyBike===b.id?'on':''}">${esc(SHORT[b.id])}</button>`).join('')}
  </div>`;

  const total = yearCost(sel, YEAR);
  const evs = eventsOf(sel, YEAR);

  /* Сначала всё, что вложено, потом уже текущий год: раньше вкладка вела
     нулём за год, пока рядом в гараже стояли сотни тысяч закупки. */
  const buyAll = (sel ? [BIKE[sel]] : BIKES).reduce((a,b)=>a+purchaseTotal(b.id), 0);
  const svcAll = eventsOf(sel).reduce((a,e)=>a+evCost(e), 0);
  h += `<div class="card pad">
    <div class="tiny">Вложено всего</div>
    <div class="hero num" style="margin-top:4px">${rub(buyAll + svcAll)}</div>
    <div class="tiny" style="margin-top:5px">закупка компонентов и всё обслуживание${sel?'':' по всему парку'}</div>
  </div>
  <div class="card">
    <div class="row"><span class="rl"><span class="rt">Закупка компонентов</span></span><span class="rv num">${rub(buyAll)}</span></div>
    <div class="row"><span class="rl"><span class="rt">Обслуживание за всё время</span></span><span class="rv num">${rub(svcAll)}</span></div>
    <div class="row"><span class="rl"><span class="rt">Обслуживание за ${YEAR}</span>
      <span class="rs">${evs.length} ${evs.length===1?'запись':evs.length<5?'записи':'записей'}</span></span>
      <span class="rv num">${rub(total)}</span></div>
  </div>`;

  if (!evs.length) {
    h += `<div class="card" style="margin-top:10px"><div class="calm">
      <div class="ic">📋</div><div class="t">Трат за ${YEAR} нет</div>
      <div class="s">Подозрительно. Графики соберутся сами, как только появится первая запись об обслуживании.</div></div></div>`;
    /* ownership summary is still worth showing */
    h += ownershipSummary(sel);
    $('v-money').innerHTML = h; return;
  }

  /* per bike — colour is bike identity */
  if (!sel) {
    const rows = BIKES.map(b => ({ id:b.id, label:b.name, value:yearCost(b.id,YEAR),
                                   text:rub(yearCost(b.id,YEAR)), color:HUE(b.id) }))
      .filter(r=>r.value>0).sort((a,b)=>b.value-a.value).map((r,i)=>Object.assign(r,{i}));
    if (rows.length) h += `<div class="lbl">По велосипедам</div><div class="card">${barRows(rows)}</div>`;
  }

  /* categories — magnitude, one hue, every bar labelled, table underneath */
  const split = categorySplit(sel, YEAR);
  const used = Object.keys(split).filter(k=>split[k]>0).sort((a,b)=>split[b]-split[a]);
  if (used.length) {
    h += `<div class="lbl">По категориям</div><div class="card">${
      barRows(used.map((k,i)=>({ label:CATS[k].label, value:split[k], text:rub(split[k]),
                                 sub:Math.round(split[k]/total*100)+'% от суммы', i })))}</div>`;
  }

  /* cost per km */
  const bl = sel ? [BIKE[sel]] : ownedBikes();
  h += `<div class="lbl">Стоимость километра</div><div class="card">`;
  h += bl.map(b => {
    const c = costPerKm(b.id, YEAR);
    return `<div class="row"><span class="dotc" style="background:${HUE(b.id)}"></span>
      <span class="rl"><span class="rt">${esc(b.name)}</span>
      <span class="rs">${DOC().odo[b.id]?km(DOC().odo[b.id]):'пробег не указан'}</span></span>
      <span class="rv num">${c==null?'—':c.toFixed(2)+' ₽/км'}</span></div>`;
  }).join('');
  h += `</div><div class="tiny" style="margin-top:9px">Где пробега нет, значение пустое, а не ноль — неизвестное не значит дешёвое.</div>`;

  /* biggest line items */
  const top = evs.slice().sort((a,b)=>evCost(b)-evCost(a)).slice(0,8);
  if (top.length) {
    h += `<div class="lbl">Самые дорогие позиции</div><div class="card">${
      barRows(top.map((e,i)=>({
        label: e.part || (RULE[e.rule]?RULE[e.rule].task:'Работа'),
        sub: (sel?'':BIKE[e.bike].name + ' · ') + e.date,
        value: evCost(e), text: rub(evCost(e)), color: HUE(e.bike), i })))}</div>`;
  }

  /* forecast */
  const fb = (sel ? [BIKE[sel]] : ownedBikes()).filter(b => isOwned(b.id));
  const fRows = fb.map(b => ({ b, rows: forecast(b.id).filter(r=>r.cost>0) })).filter(x => x.rows.length);
  if (fRows.length) {
    h += `<div class="lbl">Прогноз на ${YEAR+1}</div>`;
    for (const {b, rows} of fRows) {
      const annual = Number(DOC().annualKm[b.id]) || 0;
      const sum = rows.reduce((s,r)=>s+r.cost,0);
      h += `<div class="card"><div class="pad" style="padding-bottom:10px">
        <div class="spread"><span style="font-weight:700;display:flex;align-items:center;gap:8px">
          <span class="dotc" style="background:${HUE(b.id)}"></span>${esc(b.name)}</span>
          <span class="num" style="font-weight:800">≈ ${rub(sum)}</span></div>
        <div class="tiny" style="margin-top:5px">${annual
          ? 'При годовом пробеге ' + km(annual) + '.'
          : 'Годовой пробег не задан — считаю только по календарным интервалам. Укажите его в карточке, чтобы учитывались километры.'}</div>
        </div>
        <details><summary><span class="arw">▶</span><span style="flex:1;font-size:14px">Из чего складывается</span></summary>
        <div class="dbody"><div class="scroll"><table>
          <thead><tr><th>Работа</th><th class="n">Раз в год</th><th class="n">Стоимость</th></tr></thead>
          <tbody>${rows.slice(0,10).map(r=>`<tr><td class="wrap">${esc(r.rule.task)}</td>
            <td class="n">${r.times.toFixed(1)}</td><td class="n">${rub(r.cost)}</td></tr>`).join('')}</tbody>
        </table></div></div></details></div>`;
    }
  }

  h += ownershipSummary(sel);
  $('v-money').innerHTML = h;
}

function ownershipSummary(sel) {
  const list = sel ? [BIKE[sel]] : BIKES;
  const sold = list.filter(b => !isOwned(b.id));
  if (!sold.length) return '';
  let h = `<div class="lbl">Проданные — итог владения</div><div class="card">`;
  h += sold.map(b => {
    const own = ownershipOf(b.id);
    const inv = purchaseTotal(b.id) + eventsOf(b.id).reduce((s,e)=>s+evCost(e),0);
    return `<div class="row"><span class="dotc" style="background:${HUE(b.id)}"></span>
      <span class="rl"><span class="rt">${esc(b.name)}</span>
      <span class="rs">вложено ${rub(inv)}${own.soldPrice?' · продан за '+rub(own.soldPrice):' · цена продажи не указана'}${own.soldDate?' · '+own.soldDate:''}</span></span>
      <span class="rv num">${rub(netCost(b.id))}</span></div>`;
  }).join('');
  h += `</div><div class="tiny" style="margin-top:9px">Итог — сколько велосипед стоил за всё время: вложено минус выручено. Цену продажи впишите в его карточке.</div>`;
  return h;
}

function viewFrames() {
  const ranked = FRAMES.filter(f => f.total != null).sort((a,b)=>b.total-a.total);
  const excluded = FRAMES.filter(f => f.total == null);
  const cohorts = {};
  for (const f of ranked) (cohorts[f.price_basis || 'frame'] || (cohorts[f.price_basis||'frame'] = [])).push(f);

  let h = `<div class="seg">
    <button data-fmode="short" class="${framesMode==='short'?'on':''}">Шорт-лист</button>
    <button data-fmode="ranked" class="${framesMode==='ranked'?'on':''}">База · рейтинг</button>
    <button data-fmode="excluded" class="${framesMode==='excluded'?'on':''}">Исключено · ${excluded.length}</button>
    <button data-fmode="all" class="${framesMode==='all'?'on':''}">Все · ${FRAMES.length}</button>
  </div>`;

  if (framesMode === 'short') { $('v-frames').innerHTML = h + viewChoice(); return; }

  h += `<div class="warnbox" style="margin-bottom:14px">
    <b>Балл — мой расчёт, а не оценка автора таблицы.</b><br>
    В исходном файле есть легенда с категориями top / ok / nah, но автор не проставил их ни в одной строке — эти заливки встречаются только в самой легенде. Его настоящее мнение — в комментариях, они показаны у каждой рамы.
  </div>
  <div class="tiny" style="margin-bottom:14px">База из ${FRAMES.length} рам: ${ranked.length} в рейтинге, ${excluded.length} исключены из-за TBD.</div>`;

  if (framesMode === 'ranked') {
    const best = ranked[0];
    h += `<div class="lbl">Лучший гравел по расчёту</div>
    <div class="card"><div style="height:3px;background:var(--accent)"></div><div class="pad">
      <div style="font-size:20px;font-weight:800;letter-spacing:-.025em">${esc(best.brand)} ${esc(best.name)}</div>
      <div class="muted" style="margin-top:5px">${best.sum_weight_g?best.sum_weight_g+' г (рама+вилка)':'вес TBD'} · до ${best.tyre_back_mm} мм · ${rub(best.price)}
        <span class="chip">${esc(best.price_basis||'frame')}</span></div>
      ${best.comment?`<div class="muted" style="margin-top:10px"><b>Комментарий автора.</b> «${esc(best.comment)}»</div>`:''}
      <div class="spread" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
        <span class="tiny">Расчётный балл · пропусков ${best.tbd_count}</span>
        <span class="num" style="font-weight:800;font-size:21px">${best.total.toFixed(2)}</span></div>
      ${best.link?`<a href="${esc(best.link)}" target="_blank" rel="noopener"
        style="display:inline-flex;align-items:center;min-height:44px;font-size:13.5px;font-weight:600;margin-top:6px">Сайт производителя ›</a>`:''}
    </div></div>`;

    for (const [basis, list] of Object.entries(cohorts)) {
      h += `<div class="lbl">${basis==='bike'?'Велосипед целиком':basis==='frame+'?'Фреймсет расширенный':'Фреймсет'} <span class="n">${list.length}</span></div>

        <tbody>${list.map(frameRow).join('')}</tbody></table></div>`;

  if (framesMode === 'excluded') {

    <div class="tiny" style="margin:-4px 0 9px">Не хватает данных для честного сравнения. Медиану вместо TBD не подставляю — это придумало бы цифры, которых нет.</div>
    <div class="card scroll"><table>
      <thead><tr><th>Рама</th><th>Чего не хватает</th><th class="n">Цена</th><th>Комментарий автора</th></tr></thead>
      <tbody>${excluded.map(f=>{
        const miss = [];
        if (!f.sum_weight_g) miss.push('вес');
        if (!f.price) miss.push('цена');
        if (!f.tyre_back_mm) miss.push('покрышка');
        return `<tr><td class="wrap">${esc(f.brand)} ${esc(f.name)}${catTag(f)}</td>
          <td>${miss.join(', ')||'—'}</td><td class="n">${f.price?rub(f.price):'TBD'}</td>
          <td class="wrap">${f.comment?esc(f.comment):'—'}</td></tr>`;
      }).join('')}</tbody></table></div>
    <div class="tiny" style="margin-top:12px">Про вес отдельно: в исходной таблице сумма веса — формула SUM(), которая молча пропускает ячейки с TBD. У Argon 18 Anti Matter вилка TBD, поэтому сумма показывала 950 г — вес одной рамы. Он выглядел бы самым лёгким и выиграл бы по весу. Такие суммы обнулены.</div>`;
  }

  if (framesMode === 'all') {
    h += `<div class="card scroll"><table>
      <thead><tr><th>Рама</th><th class="n">Балл</th><th class="n">Вес</th><th class="n">Цена</th><th>Комментарий автора</th></tr></thead>
      <tbody>${FRAMES.slice().sort((a,b)=>(b.total??-1)-(a.total??-1)).map(f=>
        `<tr><td class="wrap">${esc(f.brand)} ${esc(f.name)}${catTag(f)}</td>
         <td class="n">${f.total!=null?f.total.toFixed(2):'—'}</td>
         <td class="n">${f.sum_weight_g?f.sum_weight_g+' г':'TBD'}</td>
         <td class="n">${f.price?rub(f.price):'TBD'}</td>
         <td class="wrap">${f.comment?esc(f.comment):'—'}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  $('v-frames').innerHTML = h;
}

function catTag(f) {
  if (f.category === 'not_released') return ' <span class="chip">не вышла / устарела</span>';
  if (f.category === 'upcoming') return ' <span class="chip warn">скоро выйдет</span>';
  return '';
}
function frameRow(f) {
  return `<tr><td class="wrap">${esc(f.brand)} ${esc(f.name)}${catTag(f)}</td>
    <td class="n">${f.total.toFixed(2)}</td>
    <td class="n">${f.sum_weight_g?f.sum_weight_g+' г':'TBD'}</td>
    <td class="n">${f.tyre_back_mm?f.tyre_back_mm+' мм':'TBD'}</td>
    <td class="n">${rub(f.price)}${f.price_basis_assumed?' <span class="chip warn">базис не указан</span>':''}</td>
    <td class="n">${f.tbd_count}</td>
    <td class="wrap">${f.comment?esc(f.comment):'—'}</td></tr>`;
}

/* ---------------------------------------------------------- build */
function viewBuild() {
  const groups = CHECKLISTS[buildKey];
  const checks = DOC().checks[buildKey] || {};
  const names = { 'faraoll-g50-checklist-v3':'Faraoll G50', 'speedone-275-checklist-v1':'Speedone 27.5' };
  const total = groups.reduce((n,g)=>n+g.items.length,0);
  const done = groups.reduce((n,g)=>n+g.items.filter(it=>checks[stableId(g.g,it.n)]).length,0);
  const money = groups.reduce((s,g)=>s+g.items.reduce((t,i)=>t+(i.p||0),0),0);
  const pct = Math.round(done/total*100);

  let h = `<div class="seg">${Object.keys(CHECKLISTS).map(k=>
    `<button data-bkey="${k}" class="${k===buildKey?'on':''}">${esc(names[k]||k)}</button>`).join('')}</div>
  <div class="card pad">
    <div class="spread"><span class="tiny">Отмечено</span>
      <span class="num" style="font-size:15px;font-weight:700">${done} / ${total}</span></div>
    <div class="hero num" style="margin-top:2px">${pct}%</div>
    <div class="track" style="height:10px;margin-top:10px"><div class="fill" style="width:${Math.max(2,pct)}%;background:var(--accent)"></div></div>
    ${(money&&SHOWMONEY)?`<div class="spread" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
      <span class="muted">Сумма по чек-листу</span><span class="num" style="font-weight:700">${rub(money)}</span></div>`:''}
  </div>`;

  const shop = shoppingList().filter(x => x.key === buildKey);
  if (shop.length) {
    const sum = shop.reduce((a,x)=>a+x.price, 0);
    h += `<div class="lbl">Надо купить <span class="n">${shop.length}</span></div>
    <div class="card"><div class="pad" style="padding-bottom:12px">
      <div class="spread"><span class="muted">Не отмечено позиций</span>
        <span class="num" style="font-weight:800;font-size:19px">${SHOWMONEY?rub(sum):shop.length}</span></div>
      <div class="tiny" style="margin-top:5px">${shavas(sum) ? shavas(sum).replace(' — это','Это') : 'Отметьте купленное — позиция уйдёт из списка.'}</div>
    </div>
    <details><summary><span class="arw">▶</span><span style="flex:1;font-size:14px">Показать список</span></summary><div>` +
    shop.map(x => `<div class="row"><span class="rl"><span class="rt">${esc(x.name)}</span>
      <span class="rs">${esc(x.group)}</span></span>
      ${SHOWMONEY?`<span class="rv num">${rub(x.price)}</span>`:''}</div>`).join('') +
    `</div></details></div>`;
  }

  h += `<div class="cols">`;
  groups.forEach((g, gi) => {
    const dn = g.items.filter(it=>checks[stableId(g.g,it.n)]).length;
    const isOpen = localStorage.getItem('c:'+buildKey+':'+gi) !== '1';
    h += `<section><div class="lbl">${esc(g.g)} <span class="n">${dn}/${g.items.length}</span></div>
      <div class="card"><details data-gi="${gi}"${isOpen?' open':''}>
      <summary><span class="arw">▶</span><span style="flex:1;font-size:14px;color:var(--ink2)">${dn}/${g.items.length}${dn===g.items.length?' · всё отмечено':''}</span></summary>
      <div>` +
      g.items.map(it => {
        const id = stableId(g.g, it.n);
        return `<${EDITOR?'button type="button"':'div'} class="it${checks[id]?' done':''}"${EDITOR?` data-check="${esc(id)}" aria-pressed="${checks[id]?'true':'false'}"`:' style="cursor:default"'}>
          ${EDITOR
            ? `<span class="box"><svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg></span>`
            : `<span class="box" style="border-color:transparent;background:${checks[id] ? 'var(--accent)' : 'var(--surface2)'}"></span>`}
          <span style="flex:1;min-width:0">
            <span class="nm" style="display:block">${esc(it.n)}${it.x?'<span class="chip warn" style="margin-left:7px">проверить</span>':''}</span>
            ${it.d?`<span class="dt" style="display:block">${esc(it.d)}</span>`:''}
            ${it.note?`<span class="note" style="display:block">${esc(it.note)}</span>`:''}
          </span>
          ${(it.p&&SHOWMONEY)?`<span class="pr">${rub(it.p)}${it.pn?`<small>${esc(it.pn)}</small>`:''}</span>`:''}
        </div>`;
      }).join('') + `</div></details></div></section>`;
  });
  h += `</div>`;
  $('v-build').innerHTML = h;
}

/* Замена детали — это два действия сразу: в спеках появляется новая деталь,
   а в журнале обслуживания запись с ценой. Делать их порознь пришлось бы
   дважды вводить одно и то же. */
function openPartSheet(bikeId, partId) {
  const isNew = partId === 'new';
  const c = isNew ? { part:'', spec:'', purchasePrice:'', group:'' } :
            componentsOf(bikeId).find(x => x.id === partId);
  if (!c) return;
  const groups = [...new Set(componentsOf(bikeId).map(x => x.group))];
  $('sheetbody').innerHTML = `<div class="grab"></div>
    <h3>${isNew ? 'Новая деталь' : esc(c.part)}</h3>
    <p class="tiny">${isNew ? 'Появится в спеках и в закупке.'
      : 'Правка меняет спеки. Замена ещё и запишет работу в журнал.'}</p>
    <label for="p-group">Узел</label>
    <input id="p-group" list="p-groups" value="${esc(c.group||'')}" placeholder="например, Тормоза">
    <datalist id="p-groups">${groups.map(g=>`<option value="${esc(g)}">`).join('')}</datalist>
    <label for="p-part">Деталь</label>
    <input id="p-part" value="${esc(c.part||'')}" placeholder="Кассета">
    <label for="p-spec">Характеристика</label>
    <input id="p-spec" value="${esc(c.spec||'')}" placeholder="Shimano XT CS-M8200 10-51">
    <label for="p-price">Цена, ₽</label>
    <input id="p-price" type="number" inputmode="decimal" value="${c.purchasePrice??''}">
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn ghost" id="p-cancel">Отмена</button>
      <button class="btn pri" id="p-save">${isNew?'Добавить':'Сохранить'}</button>
    </div>
    ${isNew?'':`
      <div class="lbl" style="margin-top:26px">Замена</div>
      <p class="tiny">Впишите выше новую деталь и цену, а здесь — когда и где меняли. Старая заменится, а в журнал уйдёт запись.</p>
      <div class="grid2">
        <div><label for="p-date">Дата</label><input id="p-date" type="date" value="${today()}"></div>
        <div><label for="p-labour">Работа, ₽</label><input id="p-labour" type="number" inputmode="decimal" placeholder="0"></div>
      </div>
      <label for="p-place">Где меняли</label><input id="p-place" placeholder="дома / мастерская">
      <div style="margin-top:14px"><button class="btn" id="p-replace">Заменить и записать</button></div>
      <div style="margin-top:22px"><button class="btn ghost" id="p-del">Снять деталь</button></div>`}`;

  const read = () => ({
    group: $('p-group').value.trim() || 'Прочее',
    part:  $('p-part').value.trim(),
    spec:  $('p-spec').value.trim(),
    purchasePrice: $('p-price').value === '' ? null : Number($('p-price').value)
  });
  const write = patch => {
    const parts = DOC().parts || (DOC().parts = {});
    const forBike = parts[bikeId] || (parts[bikeId] = {});
    const key = isNew ? 'p' + uid() : partId;
    forBike[key] = Object.assign({}, forBike[key], patch, isNew ? { added:true } : null);
    persist(); closeSheet(); render(); sync(true);
  };

  $('p-cancel').onclick = closeSheet;
  $('p-save').onclick = () => {
    const v = read();
    if (!v.part) { toast('Впишите название детали'); return; }
    write(v); toast(isNew ? 'Деталь добавлена' : 'Сохранено');
  };
  if (!isNew) {
    $('p-del').onclick = () => {
      if (!confirm(`Снять «${c.part}» с велосипеда? В затратах она останется.`)) return;
      write({ deleted:true }); toast('Деталь снята');
    };
    $('p-replace').onclick = () => {
      const v = read();
      if (!v.part) { toast('Впишите название новой детали'); return; }
      DOC().events.push({
        id: uid(), mtime: Date.now(), bike: bikeId, rule: null, category: 'consumables',
        date: $('p-date').value || today(), odo: DOC().odo[bikeId] ?? null,
        part: v.part + (v.spec ? ' — ' + v.spec : ''),
        partCost: Number(v.purchasePrice) || 0,
        labourCost: Number($('p-labour').value) || 0,
        place: $('p-place').value.trim(), note: 'Замена: ' + c.part
      });
      write(v); toast('Заменено и записано');
    };
  }
  $('sheet').classList.add('on');
}

function openSyncSheet() {
  $('sheetbody').innerHTML = `<div class="grab"></div>
    <h3>${EDITOR ? 'Вы вошли' : 'Вход'}</h3>
    <p class="tiny">${EDITOR
      ? 'Изменения сохраняются и разлетаются на все ваши устройства. Ссылку можно кидать кому угодно — гости видят то же самое, но менять ничего не могут.'
      : 'Сейчас режим просмотра: данные видны, но правки недоступны. Введите пароль, чтобы редактировать. Устройство запомнит вас надолго.'}</p>
    ${EDITOR ? `
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn ghost" id="s-cancel">Закрыть</button>
        <button class="btn" id="s-logout">Выйти</button>
      </div>` : `
      <label for="s-pw">Пароль</label>
      <input id="s-pw" type="password" autocomplete="current-password"
             autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="••••••••">
      <div id="s-err" class="tiny" style="color:var(--danger);min-height:17px;margin-top:6px"></div>
      <div style="display:flex;gap:10px;margin-top:12px">
        <button class="btn ghost" id="s-cancel">Отмена</button>
        <button class="btn pri" id="s-login">Войти</button>
      </div>`}
    <div class="lbl" style="margin-top:26px">Режимы</div>
    <button class="sw-row ${SHOWMONEY?'':'on'}" id="s-money">
      <span class="t"><b>Жена mode</b><span id="s-money-h">${SHOWMONEY
        ? 'выключен — видно, во сколько всё обошлось'
        : 'включён — цены и вкладка «Деньги» спрятаны'}</span></span>
      <span class="sw-track"><span class="sw-knob">${SHOWMONEY?'💸':'🙈'}</span></span>
    </button>
    <p class="tiny" style="margin-top:8px">По умолчанию включён. Настройка своя на каждом устройстве и никуда не синхронизируется.</p>

    <div class="lbl" style="margin-top:26px">Резервная копия файлом</div>
    <p class="tiny">Выгружает всё в файл — на телефоне уходит через «Поделиться» в Файлы или iCloud.</p>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn" id="s-export">Выгрузить</button>
      ${EDITOR?`<button class="btn" id="s-import">Загрузить</button>
      <input type="file" id="s-file" accept="application/json" style="display:none">`:''}
    </div>`;
  $('s-cancel').onclick = closeSheet;
  $('s-money').onclick = () => {
    toggleMoney();                       // render() перерисует всё под шторкой
    const row = $('s-money');
    row.classList.toggle('on', !SHOWMONEY);
    row.querySelector('.sw-knob').textContent = SHOWMONEY ? '💸' : '🙈';
    $('s-money-h').textContent = SHOWMONEY
      ? 'выключен — видно, во сколько всё обошлось'
      : 'включён — цены и вкладка «Деньги» спрятаны';
  };
  if (EDITOR) $('s-logout').onclick = () => { closeSheet(); logout(); toast('Вы вышли'); };
  else {
    const go = async () => {
      const pw = $('s-pw').value;
      if (!pw) return;
      $('s-login').disabled = true; $('s-err').textContent = '';
      try { await login(pw); closeSheet(); await sync(); render(); toast('С возвращением'); }
      catch (err) { $('s-err').textContent = err.message; $('s-login').disabled = false; }
    };
    $('s-login').onclick = go;
    $('s-pw').onkeydown = e => { if (e.key === 'Enter') go(); };
    setTimeout(()=>$('s-pw').focus(), 120);
  }
  $('s-export').onclick = () => {
    const blob = new Blob([JSON.stringify(local.doc, null, 1)], {type:'application/json'});
    const file = new File([blob], 'bikes-backup-' + today() + '.json', {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file]}).catch(()=>{});
    else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    }
  };
  if (EDITOR) {
  $('s-import').onclick = () => $('s-file').click();
  $('s-file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        local.doc = mergeDocs(local.doc, Object.assign(blankDoc(), JSON.parse(rd.result)));
        persist(); closeSheet(); render(); sync(true); toast('Загружено');
      } catch(err) { toast('Файл не читается'); }
    };
    rd.readAsText(f);
  };
  }
  $('sheet').classList.add('on');
}

function closeSheet(){ $('sheet').classList.remove('on'); }

let tipT;
function toast(msg) {
  const t = $('tip');
  t.textContent = msg;
  t.style.left = '50%'; t.style.top = 'auto';
  t.style.bottom = 'calc(88px + var(--safe-b))';
  t.style.transform = 'translateX(-50%)';
  t.classList.add('on');
  clearTimeout(tipT); tipT = setTimeout(()=>t.classList.remove('on'), 2800);
}

/* ============================================================ render */
/* Раздел живёт в адресе: ссылку на «Выбор велосипеда» можно кинуть, и она
   откроется там же, а «Назад» возвращает по разделам, а не уводит с сайта. */
function routeTo() {
  const want = (tab === 'garage' && openBike) ? 'garage/' + openBike : tab;
  if (location.hash.slice(1) !== want) history.pushState({ tab, openBike }, '', '#' + want);
}

function routeFrom() {
  const [t, b] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (TABS.some(x => x.id === t)) tab = t;
  openBike = (tab === 'garage' && b && BIKE[b]) ? b : null;
}

window.addEventListener('popstate', () => { routeFrom(); render(true); });

function render(fromHistory) {
  if (!fromHistory) routeTo();
  renderNav();
  const t = TABS.find(x => x.id === tab);
  const inDetail = openBike && tab === 'garage';
  $('h1').textContent = inDetail ? BIKE[openBike].name : t.title;
  const att = attention();
  $('sub').textContent = inDetail ? (isOwned(openBike) ? BIKE[openBike].owner : 'продан')
    : tab === 'garage' ? `${ownedBikes().length} в парке${soldBikes().length?' · '+soldBikes().length+' продан':''}`
    : tab === 'service' ? (att.length ? `${att.length} к работе` : RULES.length + ' пунктов регламента')
    : tab === 'money' ? YEAR + ' год'
    : tab === 'frames' ? (framesMode === 'short' ? 'гравел под рост 180 · шорт-лист' : FRAMES.length + ' рам в базе')
    : 'Faraoll G50 и Speedone Floater';
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('v-' + tab).classList.add('on');
  ({garage:viewGarage, service:viewService, money:viewMoney, frames:viewFrames, build:viewBuild})[tab]();
  paintSync();
  const swapped = (tab + '/' + (openBike||'')) !== lastScreen;
  lastScreen = tab + '/' + (openBike||'');
  afterRender(swapped);
}
let lastScreen = '';

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-bike],[data-back],[data-addevent],[data-delevent],[data-mbike],[data-fmode],[data-smode],[data-bkey],[data-check],[data-att],[data-own],[data-sheet],[data-money],[data-part]');
  if (!t) { if (e.target === $('sheet')) closeSheet(); return; }

  if (t.dataset.part) {
    if (!EDITOR) return openSyncSheet();
    const [bid, pid] = t.dataset.part.split('|');
    openPartSheet(bid, pid); return;
  }
  if (t.dataset.sheet) { openSyncSheet(); return; }
  if (t.dataset.money) { toggleMoney(); return; }
  if (t.dataset.tab)   { tab = t.dataset.tab; openBike = null; render(); window.scrollTo(0,0); return; }
  if (t.dataset.bike)  { openBike = t.dataset.bike; tab = 'garage'; render(); window.scrollTo(0,0); return; }
  if (t.dataset.back)  { openBike = null; render(); return; }
  if (t.dataset.mbike) { moneyBike = t.dataset.mbike; render(); return; }
  if (t.dataset.fmode) { framesMode = t.dataset.fmode; render(); window.scrollTo(0,0); return; }
  if (t.dataset.smode) { serviceMode = t.dataset.smode; render(); window.scrollTo(0,0); return; }
  if (t.dataset.bkey)  { buildKey = t.dataset.bkey; render(); return; }
  if (t.dataset.att && !EDITOR) { openRuleSheet(t.dataset.att.split('|')[1]); return; }
  if (t.dataset.att || t.hasAttribute('data-addevent')) {
    if (!EDITOR) return openSyncSheet();
    if (t.dataset.att) { const [b,r] = t.dataset.att.split('|'); openEventSheet(b, r); }
    else openEventSheet(t.dataset.addevent || openBike, t.dataset.rule);
    return;
  }

  if (t.dataset.own) {
    if (!EDITOR) return openSyncSheet();
    const [id, state] = t.dataset.own.split('|');
    const o = DOC().ownership[id] || (DOC().ownership[id] = {});
    o.state = state;
    persist(); render(); sync(true);
    return;
  }
  if (t.dataset.delevent) {
    if (!EDITOR) return openSyncSheet();
    const ev = DOC().events.find(x => x.id === t.dataset.delevent);
    if (ev && !confirm(`Удалить запись «${ev.part || 'обслуживание'}» от ${ev.date}?`)) return;
    if (ev) { ev.deleted = true; ev.mtime = Date.now(); persist(); render(); sync(true); }
    return;
  }
  if (t.dataset.check) {
    if (!EDITOR) return openSyncSheet();
    const m = DOC().checks[buildKey] || (DOC().checks[buildKey] = {});
    const id = t.dataset.check;
    // an unchecked box is a recorded 0, not a missing key — a key-by-key merge
    // cannot otherwise tell "unchecked here" from "never seen here"
    m[id] = m[id] ? 0 : 1;
    t.classList.toggle('done', !!m[id]);
    persist(); sync(true);
    const d = t.closest('details');
    if (d) {
      const g = CHECKLISTS[buildKey][d.dataset.gi];
      const dn = g.items.filter(it => m[stableId(g.g, it.n)]).length;
      const lbl = d.closest('.card').previousElementSibling;
      if (lbl && lbl.classList.contains('lbl')) lbl.querySelector('.n').textContent = dn + '/' + g.items.length;
    }
    return;
  }
});

document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.tagName === 'DETAILS' && d.dataset.gi != null)
    localStorage.setItem('c:' + buildKey + ':' + d.dataset.gi, d.open ? '0' : '1');
}, true);

document.addEventListener('change', e => {
  const el = e.target;
  if (!EDITOR) return;
  const num = v => v === '' ? null : Number(v);
  if (el.dataset.odo)       { DOC().odo[el.dataset.odo] = num(el.value); persist(); render(); sync(true); return; }
  if (el.dataset.annual)    { DOC().annualKm[el.dataset.annual] = num(el.value); persist(); sync(true); return; }
  if (el.dataset.solddate)  { (DOC().ownership[el.dataset.solddate] ||= {}).soldDate = el.value || null; persist(); render(); sync(true); return; }
  if (el.dataset.soldprice) { (DOC().ownership[el.dataset.soldprice] ||= {}).soldPrice = num(el.value); persist(); render(); sync(true); return; }
  if (el.dataset.photo)     {
    const f = el.files[0]; if (!f) return;
    // downscale so a photo costs ~40 KB in the synced document, not 4 MB
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 640 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      DOC().photos[el.dataset.photo] = c.toDataURL('image/jpeg', .72);
      URL.revokeObjectURL(img.src);
      persist(); render(); sync(true);
    };
    img.src = URL.createObjectURL(f);
  }
});

$('sbtn').onclick = openSyncSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ============================================================ motion
   Everything here is decoration: if any of it fails, or the reader asked the OS
   for less motion, the page still shows the same numbers. */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* scroll parallax — layers drift at their own depth, transform only */
let parallaxRaf = 0;
function parallax() {
  if (REDUCED) return;
  const y = window.scrollY;
  document.querySelectorAll('#scene .layer').forEach(el => {
    el.style.transform = 'translate3d(0,' + (y * Number(el.dataset.depth)).toFixed(1) + 'px,0)';
  });
  parallaxRaf = 0;
}
window.addEventListener('scroll', () => {
  if (!parallaxRaf) parallaxRaf = requestAnimationFrame(parallax);
}, { passive:true });

/* reveal on entry, staggered by position in the list */
let observer = null;
function watchReveals() {
  if (REDUCED) { document.querySelectorAll('.reveal').forEach(el => el.classList.add('in')); return; }
  if (!observer) observer = new IntersectionObserver(entries => {
    entries.forEach((en, i) => {
      if (!en.isIntersecting) return;
      setTimeout(() => en.target.classList.add('in'), Math.min(i, 6) * 45);
      observer.unobserve(en.target);
    });
  }, { rootMargin:'0px 0px -8% 0px' });
  document.querySelectorAll('.reveal:not(.in)').forEach(el => observer.observe(el));
}

/* count up to the real number — the label is written before the animation runs,
   so a failure here leaves the correct value on screen, not a zero */
function countUp() {
  if (REDUCED || !SHOWMONEY) return;
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = Number(el.dataset.count);
    if (!isFinite(to) || to <= 0 || el.dataset.done) return;
    el.dataset.done = '1';
    const t0 = performance.now(), dur = 850;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      el.textContent = rub(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

/* bars animate from zero once they are on screen */
function growBars() {
  if (REDUCED) return;
  document.querySelectorAll('.fill:not([data-grown])').forEach(el => {
    const w = el.style.width;
    el.dataset.grown = '1'; el.style.width = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.width = w; }));
  });
}

function afterRender(swapped) {
  if (swapped && !REDUCED) {
    const v = $('v-' + tab);
    v.classList.remove('swap'); void v.offsetWidth; v.classList.add('swap');
  }
  watchReveals(); countUp(); growBars(); parallax();
}

/* ============================================================ boot */
routeFrom();                        // раздел из адреса до первой отрисовки
const migrated = migrateChecks();   // R1 — before anything touches content
applyRenames();                     // перенос галочек с переименованных пунктов
applySeed();                        // R4 — repopulate after storage eviction
render();
if (migrated) toast('Перенесено отмеченных пунктов: ' + migrated);
sync(true);
window.addEventListener('online', () => sync(true));
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(true); });
</script>
</body>
</html>
