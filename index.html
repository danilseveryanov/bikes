function updateScene() {
  let sc = $('scene');
  if (!sc) { $('scene-slot').innerHTML = sceneHTML(); sc = $('scene'); }
  const idx = Math.max(0, PLACES.findIndex(p => p.tab === tab));
  sc.style.setProperty('--i', idx);
  sc.querySelector('.placename').textContent = PLACES[idx].name;
  // чижик живёт только на набережной, над списком велосипедов
  sc.classList.toggle('away', !(tab === 'garage' && !openBike));
}

/* Время суток. Живой сайт идёт по часам; ручной выбор его перекрывает. */
function partNow(){ const h = new Date().getHours();
  return h < 5 ? "night" : h < 8 ? "dawn" : h < 17 ? "day" : h < 21 ? "dusk" : "night"; }
let PART = localStorage.getItem("bikes:part") || "auto";
function applyPart(){
  const p = PART === "auto" ? partNow() : PART;
  document.documentElement.dataset.part = p;
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--s1').trim() || '#05070b';
}
function setPart(p){ PART = p; localStorage.setItem("bikes:part", p); applyPart(); render(); }

/* what is still unbought: priced checklist lines nobody has ticked off */
function shoppingList() {
  const out = [];
  for (const [key, groups] of Object.entries(CHECKLISTS)) {
    const checks = DOC().checks[key] || {};
    for (const g of groups)
      for (const it of g.items)
        if (it.p && !checks[stableId(g.g, it.n)])
          out.push({ key, group:g.g, name:it.n, price:it.p, note:it.pn });
  }
  return out.sort((a,b) => b.price - a.price);
}

/* чек-лист, привязанный к велосипеду в сборке */
const checklistKeyOf = id => Object.keys(CHECKLISTS)
  .find(k => k.startsWith(id.replace(/-v?\d*$/, '')) || k.includes(id.split('-')[0]));
function progressOf(key) {
  const gs = CHECKLISTS[key], ch = DOC().checks[key] || {};
  const total = gs.reduce((n,g)=>n+g.items.length,0);
  const done  = gs.reduce((n,g)=>n+g.items.filter(it=>ch[stableId(g.g,it.n)]).length,0);
  return { total, done, pct: total ? Math.round(done/total*100) : 0 };
}

/* ---------------------------------------------------------- garage */
function attRow(a, withBike) {
  return `<button class="row ind" data-att="${a.bike.id}|${a.rule.id}">
    <span class="dot" style="background:${HUE(a.bike.id)}"></span>
    <span class="txt"><span class="t">${esc(a.rule.task)}</span>
      <span class="s">${withBike ? esc(withBike === 'full' ? a.bike.name : SHORT[a.bike.id]) + ' · ' : ''}${esc(leftText(a.st))}</span></span>
    ${stateBadge(a.st)}${CHEV}</button>`;
}

function viewGarage() {
  if (openBike) return viewBikeDetail(openBike);
  const owned = ownedBikes(), sold = soldBikes();
  const all = attention(), dueN = all.filter(a => a.st.state === 'due').length;
  const shop = shoppingList(), shopSum = shop.reduce((s,x)=>s+x.price, 0);
  const spendOwned = owned.reduce((s,b)=>s+purchaseTotal(b.id), 0);
  const hasHistory = liveEvents().length > 0;

  /* три вопроса, с которыми открывают гараж: что есть, что сделать, что купить */
  let h = `<div class="tiles">
    <div class="tile"><span class="k">${ic('garage')}В парке</span>
      <span class="v">${owned.length}</span>
      <span class="s">${sold.length ? sold.length + ' ' + plural(sold.length,'продан','продано','продано') : 'все на ходу'}</span></div>
    <button class="tile${dueN ? ' alert' : ''}" data-tab="service"><span class="k">${ic(dueN ? 'alert' : 'service')}Сделать</span>
      <span class="v">${all.length}</span>
      <span class="s">${dueN ? dueN + ' просрочено' : all.length ? 'скоро по регламенту' : 'всё в норме'}</span></button>
    <button class="tile" data-tab="build"><span class="k">${ic('cart')}Купить</span>
      <span class="v">${shop.length}</span>
      <span class="s">${shop.length ? (SHOWMONEY ? rub(shopSum) : plural(shop.length,'позиция','позиции','позиций')) : 'всё куплено'}</span></button>
    ${SHOWMONEY ? `<button class="tile wide" data-tab="money"><span class="k">${ic('sum')}Вложено</span>
      <span class="v" data-count="${spendOwned + yearCost(null, YEAR)}">${rub(spendOwned + yearCost(null, YEAR))}</span>
      <span class="s">закупка парка и ТО за ${YEAR}</span></button>` : ''}
  </div>`;

  /* что горит — первым, это и есть вопрос, с которым открывают страницу */
  if (all.length) {
    h += sec('Требует внимания', group(all.slice(0, 5).map(a => attRow(a, 'short')).join('')), {
      count: all.length,
      more: all.length > 5 ? '<button class="more" data-tab="service">Все</button>' : ''
    });
  } else {
    h += `<section class="sec">${calm(hasHistory ? '✅' : '🔧',
      hasHistory ? 'Всё в норме' : 'Сайт ещё не знает ваш парк',
      hasHistory ? 'Ни одна работа по регламенту не подошла к сроку. Даже дождь, кажется, перестал.'
        : EDITOR ? 'Укажите пробег в карточке велосипеда и запишите первое обслуживание — после этого здесь появится, что и когда пора менять.'
        : `В парке ${owned.length} ${plural(owned.length,'велосипед','велосипеда','велосипедов')}. Записей об обслуживании пока нет — как появятся, здесь будет видно, что подходит к замене.`)}</section>`;
  }

  h += sec('Велосипеды', `<div class="bikes">${owned.map(b => `<div class="reveal">${bikeCard(b)}</div>`).join('')}</div>`,
    { count: owned.length, id: 'bikes' });

  if (sold.length) {
    const net = sold.reduce((s,b)=>s+netCost(b.id), 0);
    h += sec('Проданные', `<div class="bikes">${sold.map(b => `<div class="reveal">${bikeCard(b)}</div>`).join('')}</div>`, {
      count: sold.length,
      foot: SHOWMONEY ? `Итог по проданным: ${rub(net)} — во столько обошлось владение, уже за вычетом выручки.` : ''
    });
  }
  $('v-garage').innerHTML = h;
}

/* Кадр под настоящее фото. Пока фото нет — намеренное состояние: поле в цвете
   велосипеда и его имя призраком, а не серая заглушка. */
const shotArt = (b, photo) => photo
  ? `<img src="${esc(photo)}" alt="${esc(b.name)}">`
  : `<span class="field-art" style="background:radial-gradient(90% 80% at 24% 16%,color-mix(in srgb,${HUE(b.id)} 46%,transparent),transparent 70%),linear-gradient(160deg,color-mix(in srgb,${HUE(b.id)} 18%,var(--card2)),var(--card2) 72%)"></span>
     <span class="ghost" aria-hidden="true">${esc(b.name)}</span>`;

/* Кнопка фото — подпись с настоящим полем выбора файла внутри. Она лежит над
   ссылкой карточки, поэтому открывает выбор снимка, а не велосипед. */
const photoBtn = (id, label) => `<label class="photo-btn glass">${ic('camera')}<span>${esc(label)}</span>
  <input type="file" accept="image/*" data-photo="${id}"></label>`;

function bikeCard(b) {
  const own = ownershipOf(b.id), gone = own.state === 'sold';
  const spend = purchaseTotal(b.id), odo = DOC().odo[b.id], photo = DOC().photos[b.id];
  const dueN = gone ? 0 : RULES.filter(r => r.bikes.includes(b.id) && dueStatus(b.id, r).state === 'due').length;
  const badges = gone
    ? `<span class="badge">продан${(SHOWMONEY && own.soldPrice) ? ' · ' + rub(own.soldPrice) : ''}</span>`
    : [odo ? `<span class="badge">${km(odo)}</span>` : '',
       SHOWMONEY && spend ? `<span class="badge">${rub(spend)}</span>` : '',
       b.status === 'в сборке' ? '<span class="badge orange">в сборке</span>' : '',
       dueN ? `<span class="badge red">${dueN} к замене</span>` : ''].join('');
  return `<article class="bikecard${gone ? ' sold' : ''}">
    <button class="cardlink" data-bike="${b.id}" aria-label="${esc(b.name)}, открыть"></button>
    <span class="shot" style="view-transition-name:shot-${b.id}">${shotArt(b, photo)}</span>
    ${EDITOR && !photo ? photoBtn(b.id, 'Добавить фото') : ''}
    <div class="binfo"><div class="txt">
      <span class="bnm" style="view-transition-name:bname-${b.id}">${esc(b.name)}</span>
      <span class="bmt">${esc(b.type)} · ${esc(b.owner)}</span>
      <div class="bfoot">${badges}</div></div>${CHEV}</div>
  </article>`;
}

function viewBikeDetail(id) {
  const b = BIKE[id], own = ownershipOf(id), gone = own.state === 'sold';
  const photo = DOC().photos[id], spend = purchaseTotal(id), cpk = costPerKm(id, YEAR);
  const odo = DOC().odo[id], evs = eventsOf(id).sort((a,b)=>b.date.localeCompare(a.date));
  const mine = gone ? [] : RULES.filter(r => r.bikes.includes(id))
    .map(r => ({ bike:b, rule:r, st: dueStatus(id, r) }))
    .filter(x => x.st.state === 'due' || x.st.state === 'soon');

  let h = `<div class="dhero" style="view-transition-name:shot-${id}">${shotArt(b, photo)}
    ${EDITOR ? photoBtn(id, photo ? 'Заменить фото' : 'Добавить фото') : ''}</div>`;

  /* три цифры под фото; при «Жена mode» денежные уступают место бытовым */
  const stat = (k, v) => `<div class="stat"><div class="k">${esc(k)}</div><div class="v num">${v}</div></div>`;
  h += `<div class="stats">
    ${stat('Пробег', odo ? fmtN(odo) + ' <small>км</small>' : '—')}
    ${SHOWMONEY
      ? stat('Закупка', esc(rubShort(spend))) + stat('Километр', cpk == null ? '—' : cpk.toFixed(1).replace('.', ',') + ' <small>₽</small>')
      : stat('К работе', gone ? '—' : String(mine.length)) + stat('Записей', String(evs.length))}
  </div>`;

  if (mine.length)
    h += sec('Пора обслужить', group(mine.map(a => attRow(a, false)).join('')), { count: mine.length });

  /* велосипед в сборке — сколько собрано, и сразу в его чек-лист */
  if (b.status === 'в сборке') {
    const key = checklistKeyOf(id);
    if (key) {
      const p = progressOf(key);
      h += sec('Сборка', group(`<button class="row" data-tab="build" data-bkey="${key}">
        <span class="txt"><span class="t">Чек-лист сборки</span>
          <span class="s">${p.done} из ${p.total} · ${p.pct}%</span>
          <span class="bar"><i class="fill" style="width:${Math.max(2, p.pct)}%"></i></span></span>${CHEV}</button>`));
    }
  }

  /* пробег и владение — правятся прямо в строках, как в «Настройках» */
  let own_ = '';
  if (EDITOR) own_ += `<div class="seg" role="radiogroup" aria-label="Владение" style="margin-bottom:12px">
      <button data-own="${id}|owned" role="radio" aria-checked="${!gone}" class="${!gone ? 'on' : ''}">В парке</button>
      <button data-own="${id}|sold" role="radio" aria-checked="${gone}" class="${gone ? 'on' : ''}">Продан</button></div>`;
  if (gone) {
    const inv = spend + eventsOf(id).reduce((s,e)=>s+evCost(e),0);
    own_ += group(`<div class="field"><label for="sd-${id}">Дата продажи</label>
        <input id="sd-${id}" type="date" value="${esc(own.soldDate || '')}" data-solddate="${id}" ${EDITOR ? '' : 'readonly'}></div>
      ${SHOWMONEY ? `<div class="field"><label for="sp-${id}">Продан за, ₽</label>
        <input id="sp-${id}" type="number" inputmode="numeric" value="${esc(own.soldPrice ?? '')}" data-soldprice="${id}" ${EDITOR ? '' : 'readonly'} placeholder="—"></div>
      <div class="row"><span class="txt"><span class="t">Итог владения</span></span><span class="v strong num">${rub(netCost(id))}</span></div>` : ''}`);
    own_ += `<p class="foot">${SHOWMONEY ? `Вложено ${rub(inv)}${own.soldPrice ? ', выручено ' + rub(own.soldPrice) : ', выручка не указана'}. ` : ''}Проданный велосипед не попадает в регламент ТО и в прогноз, но его затраты остаются в истории.</p>`;
    h += sec('Владение', own_);
  } else {
    own_ += group(EDITOR
      ? `<div class="field"><label for="odo-${id}">Пробег, км</label>
           <input id="odo-${id}" type="number" inputmode="numeric" value="${esc(odo ?? '')}" data-odo="${id}" placeholder="не указан"></div>
         <div class="field"><label for="ann-${id}">За год, км</label>
           <input id="ann-${id}" type="number" inputmode="numeric" value="${esc(DOC().annualKm[id] ?? '')}" data-annual="${id}" placeholder="не указан"></div>`
      : `<div class="row"><span class="txt"><span class="t">Пробег</span></span><span class="v num">${odo ? km(odo) : 'не указан'}</span></div>
         <div class="row"><span class="txt"><span class="t">Статус</span></span><span class="badge green">в парке</span></div>`);
    if (EDITOR) own_ += '<p class="foot">Пробег нужен, чтобы считать «пора менять» и стоимость километра. Годовой — только для прогноза.</p>';
    h += sec('Пробег и владение', own_);
  }

  if (SHOWMONEY) h += sec('Затраты', group(`
    <div class="row"><span class="txt"><span class="t">Закупка компонентов</span></span><span class="v num">${rub(spend)}</span></div>
    <div class="row"><span class="txt"><span class="t">Обслуживание за ${YEAR}</span></span><span class="v num">${rub(yearCost(id, YEAR))}</span></div>
    <div class="row"><span class="txt"><span class="t">Стоимость километра</span>${cpk == null ? '<span class="s">нужен пробег</span>' : ''}</span>
      <span class="v num">${cpk == null ? '—' : cpk.toFixed(2).replace('.', ',') + ' ₽/км'}</span></div>`));

  /* спецификация: по узлам, цена справа, нажатие — замена или правка */
  const list = componentsOf(id), groups = {};
  for (const c of list) (groups[c.group || 'Прочее'] || (groups[c.group || 'Прочее'] = [])).push(c);
  let spec = '';
  if (list.length) {
    for (const [g, items] of Object.entries(groups)) {
      const sum = items.reduce((s,c)=>s+(Number(c.purchasePrice)||0),0);
      spec += `<div class="subh"><span>${esc(g)}</span>${SHOWMONEY && sum ? `<span class="num">${rub(sum)}</span>` : ''}</div>`
        + group(items.map(c => {
          const inner = `<span class="txt"><span class="t">${esc(c.part)}</span>${c.spec ? `<span class="spec-sub">${esc(c.spec)}</span>` : ''}</span>
            ${SHOWMONEY ? `<span class="v num">${c.purchasePrice ? rub(c.purchasePrice) : '—'}</span>` : ''}`;
          return EDITOR
            ? `<button class="row" data-editpart="${esc(id)}|${esc(c.id)}">${inner}${CHEV}</button>`
            : `<div class="row">${inner}</div>`;
        }).join(''));
    }
    if (SHOWMONEY) spec += `<div class="group" style="margin-top:12px"><div class="total"><span>Итого закупка</span><span class="num">${rub(spend)}</span></div></div>`;
  } else {
    spec += group(`<div class="empty"><div class="s">Состав не расписан по позициям${b.totalSpend && SHOWMONEY ? ` — известна только общая сумма ${rub(b.totalSpend)}` : ''}.</div></div>`);
  }
  if (EDITOR) spec += `<div class="group" style="margin-top:12px"><button class="row action" data-editpart="${esc(id)}|new">${ic('plus')}<span>Добавить деталь</span></button></div>`;
  h += sec('Спецификация', spec, { count: list.length || null,
    foot: EDITOR && list.length ? 'Нажмите на деталь, чтобы заменить её или поправить цену — замена сама попадёт в журнал.' : '' });

  h += sec('История обслуживания', evs.length ? group(evs.map(e => eventRow(e)).join(''))
      : calm('📋', 'Пока ничего не записано', EDITOR ? 'Первая запись — и сроки замены начнут считаться сами.' : 'Как только появятся записи, здесь будет вся история.'),
    { count: evs.length || null });
  if (EDITOR) h += `<div style="margin-top:14px"><button class="btn pri block" data-addevent="${id}">${ic('plus')}Записать обслуживание</button></div>`;
  $('v-garage').innerHTML = h;
}

function eventRow(e, withBike) {
  const r = RULE[e.rule];
  const cat = CATS[e.category || (r && r.category)] || CATS.consumables;
  return `<button class="row" data-event="${esc(e.id)}">
    <span class="txt"><span class="t">${esc(e.part || (r ? r.task : 'Обслуживание'))}</span>
      <span class="s">${esc(fmtDate(e.date))}${e.odo ? ' · ' + km(e.odo) : ''}${withBike && BIKE[e.bike] ? ' · ' + esc(SHORT[e.bike]) : ''} · ${esc(cat.label)}</span></span>
    ${SHOWMONEY ? `<span class="v num">${rub(evCost(e))}</span>` : ''}${CHEV}</button>`;
}

/* ---------------------------------------------------------- service */
function viewService() {
  const all = attention(), dueN = all.filter(a => a.st.state === 'due').length;
  const evs = liveEvents().slice().sort((a,b)=>b.date.localeCompare(a.date));
  let h = `<div class="seg" role="tablist">
    <button role="tab" aria-selected="${serviceMode==='due'}" data-smode="due" class="${serviceMode==='due'?'on':''}">Сейчас${all.length ? ' · ' + all.length : ''}</button>
    <button role="tab" aria-selected="${serviceMode==='all'}" data-smode="all" class="${serviceMode==='all'?'on':''}">Регламент</button>
    <button role="tab" aria-selected="${serviceMode==='log'}" data-smode="log" class="${serviceMode==='log'?'on':''}">Журнал${evs.length ? ' · ' + evs.length : ''}</button>
  </div>
  ${EDITOR ? `<div style="margin-bottom:24px"><button class="btn pri block" data-addevent="">${ic('plus')}Записать обслуживание</button></div>` : ''}`;

  if (serviceMode === 'due') {
    h += all.length
      ? sec(dueN ? 'Просрочено или пора' : 'Скоро', group(all.map(a => attRow(a, 'full')).join('')), {
          count: all.length,
          foot: EDITOR ? 'Нажмите на строку — откроется запись с уже подставленной ценой детали.'
                       : 'Нажмите на строку, чтобы узнать, по какому признаку менять.' })
      : calm(liveEvents().length ? '✅' : '🔧',
          liveEvents().length ? 'Ничего не горит' : 'Пока нечего показать',
          liveEvents().length ? 'Все интервалы в норме — можно спокойно ехать в Комарово. Во вкладке «Регламент» видно, что предстоит.'
            : 'Сроки считаются от вашей последней записи. Запишите обслуживание — и здесь появится, что подходит к замене.');
  } else if (serviceMode === 'log') {
    h += evs.length ? sec('Все записи', group(evs.map(e => eventRow(e, true)).join('')), {
        count: evs.length,
        foot: SHOWMONEY ? `Всего по журналу: ${rub(evs.reduce((s,e)=>s+evCost(e),0))}${esc(shavas(evs.reduce((s,e)=>s+evCost(e),0)))}.` : '' })
      : calm('📋', 'Журнал пуст', 'Каждая работа — замена цепи, прокачка тормозов, новая покрышка — попадает сюда и в карточку велосипеда.');
  } else {
    const byCat = {};
    for (const r of RULES) (byCat[r.category] || (byCat[r.category] = [])).push(r);
    h += '<div class="cols three">';
    for (const [cat, rules] of Object.entries(byCat)) {
      h += sec((CATS[cat] || CATS.consumables).label, group(rules.map(r => {
        const states = r.bikes.filter(isOwned).map(bid => dueStatus(bid, r).state);
        const worst = states.includes('due') ? 'due' : states.includes('soon') ? 'soon' : null;
        return `<button class="row" data-rule-open="${r.id}">
          <span class="txt"><span class="t">${esc(r.task)}</span>
            <span class="s">${km(r.interval_km)} или ${r.interval_months} мес</span></span>
          ${worst ? stateBadge({state: worst}) : ''}${CHEV}</button>`;
      }).join('')), { count: rules.length });
    }
    h += '</div>';
  }
  $('v-service').innerHTML = h;
}

/* ---------------------------------------------------------- money */
function viewMoney() {
  if (!SHOWMONEY) {
    $('v-money').innerHTML = calm('🙈', 'Цены спрятаны',
      'Работает «Жена mode». Выключается там же, где включался: на набережной, над списком велосипедов, сидит чижик.');
    return;
  }
  const sel = moneyBike === 'all' ? null : moneyBike;
  let h = `<div class="chips" role="tablist" aria-label="Велосипед">
    <button role="tab" aria-selected="${!sel}" data-mbike="all" class="${!sel ? 'on' : ''}">Весь парк</button>
    ${BIKES.map(b => `<button role="tab" aria-selected="${moneyBike===b.id}" data-mbike="${b.id}" class="${moneyBike===b.id ? 'on' : ''}"><span class="dot" style="background:${HUE(b.id)}"></span>${esc(SHORT[b.id])}</button>`).join('')}
  </div>`;

  const total = yearCost(sel, YEAR), evs = eventsOf(sel, YEAR);
  const buyAll = (sel ? [BIKE[sel]] : BIKES).reduce((a,b)=>a+purchaseTotal(b.id), 0);
  const svcAll = eventsOf(sel).reduce((a,e)=>a+evCost(e), 0);
  h += group(`<div class="bighero"><div class="k">Вложено всего</div>
      <div class="v" data-count="${buyAll + svcAll}">${rub(buyAll + svcAll)}</div>
      <div class="s">закупка компонентов и всё обслуживание${sel ? '' : ' по всему парку'}${esc(shavas(buyAll + svcAll))}</div></div>`)
    + group(`<div class="row"><span class="txt"><span class="t">Закупка компонентов</span></span><span class="v num">${rub(buyAll)}</span></div>
      <div class="row"><span class="txt"><span class="t">Обслуживание за всё время</span></span><span class="v num">${rub(svcAll)}</span></div>
      <div class="row"><span class="txt"><span class="t">Обслуживание за ${YEAR}</span>
        <span class="s">${evs.length} ${plural(evs.length,'запись','записи','записей')}</span></span><span class="v num">${rub(total)}</span></div>`);

  if (!evs.length) {
    h += `<section class="sec">${calm('📋', `Трат за ${YEAR} нет`, 'Подозрительно. Графики соберутся сами, как только появится первая запись об обслуживании.')}</section>`;
    $('v-money').innerHTML = h + ownershipSummary(sel);
    return;
  }

  h += '<div class="cols">';
  if (!sel) {
    const rows = BIKES.map(b => ({ label:b.name, value:yearCost(b.id,YEAR), text:rub(yearCost(b.id,YEAR)), color:HUE(b.id) }))
      .filter(r=>r.value>0).sort((a,b)=>b.value-a.value);
    if (rows.length) h += sec(`По велосипедам за ${YEAR}`, group(barRows(rows)));
  }
  const split = categorySplit(sel, YEAR);
  const used = Object.keys(split).filter(k=>split[k]>0).sort((a,b)=>split[b]-split[a]);
  if (used.length) h += sec('По категориям', group(barRows(used.map(k => ({
    label:CATS[k].label, value:split[k], text:rub(split[k]), sub:Math.round(split[k]/total*100) + '% от суммы' })))));

  const bl = sel ? [BIKE[sel]] : ownedBikes();
  h += sec('Стоимость километра', group(bl.map(b => {
    const c = costPerKm(b.id, YEAR);
    return `<div class="row ind"><span class="dot" style="background:${HUE(b.id)}"></span>
      <span class="txt"><span class="t">${esc(b.name)}</span>
      <span class="s">${DOC().odo[b.id] ? km(DOC().odo[b.id]) : 'пробег не указан'}</span></span>
      <span class="v num">${c == null ? '—' : c.toFixed(2).replace('.', ',') + ' ₽/км'}</span></div>`;
  }).join('')), { foot: 'Где пробега нет, значение пустое, а не ноль — неизвестное не значит дешёвое.' });

  const top = evs.slice().sort((a,b)=>evCost(b)-evCost(a)).slice(0,8);
  if (top.length) h += sec('Самые дорогие позиции', group(barRows(top.map(e => ({
    label: e.part || (RULE[e.rule] ? RULE[e.rule].task : 'Работа'),
    sub: (sel ? '' : BIKE[e.bike].name + ' · ') + fmtDate(e.date),
    value: evCost(e), text: rub(evCost(e)), color: HUE(e.bike) })))));
  h += '</div>';

  const fb = (sel ? [BIKE[sel]] : ownedBikes()).filter(b => isOwned(b.id));
  const fRows = fb.map(b => ({ b, rows: forecast(b.id).filter(r=>r.cost>0) })).filter(x => x.rows.length);
  if (fRows.length) {
    h += sec(`Прогноз на ${YEAR + 1}`, '<div class="cards">' + fRows.map(({b, rows}) => {
      const annual = Number(DOC().annualKm[b.id]) || 0, sum = rows.reduce((s,r)=>s+r.cost,0);
      return group(`<div class="row ind"><span class="dot" style="background:${HUE(b.id)}"></span>
          <span class="txt"><span class="t" style="font-weight:600">${esc(b.name)}</span>
          <span class="s">${annual ? 'при годовом пробеге ' + km(annual) : 'только по календарным интервалам — годовой пробег не задан'}</span></span>
          <span class="v strong num">≈ ${rub(sum)}</span></div>
        <details><summary>${DCHEV}<span>Из чего складывается</span></summary>
          <div class="scroll"><table>
            <thead><tr><th>Работа</th><th class="n">Раз в год</th><th class="n">Стоимость</th></tr></thead>
            <tbody>${rows.slice(0,10).map(r=>`<tr><td class="wrap">${esc(r.rule.task)}</td>
              <td class="n">${r.times.toFixed(1).replace('.', ',')}</td><td class="n">${rub(r.cost)}</td></tr>`).join('')}</tbody>
          </table></div></details>`);
    }).join('') + '</div>');
  }
  h += ownershipSummary(sel);
  $('v-money').innerHTML = h;
}

function ownershipSummary(sel) {
  const sold = (sel ? [BIKE[sel]] : BIKES).filter(b => !isOwned(b.id));
  if (!sold.length) return '';
  return sec('Проданные — итог владения', group(sold.map(b => {
    const own = ownershipOf(b.id);
    const inv = purchaseTotal(b.id) + eventsOf(b.id).reduce((s,e)=>s+evCost(e),0);
    return `<div class="row ind"><span class="dot" style="background:${HUE(b.id)}"></span>
      <span class="txt"><span class="t">${esc(b.name)}</span>
      <span class="s">вложено ${rub(inv)}${own.soldPrice ? ' · продан за ' + rub(own.soldPrice) : ' · цена продажи не указана'}${own.soldDate ? ' · ' + esc(fmtDate(own.soldDate)) : ''}</span></span>
      <span class="v strong num">${rub(netCost(b.id))}</span></div>`;
  }).join('')), { foot: 'Итог — сколько велосипед стоил за всё время: вложено минус выручено. Цену продажи впишите в его карточке.' });
}

function catTag(f) {
  if (f.category === 'not_released') return ' <span class="badge">не вышла / устарела</span>';
  if (f.category === 'upcoming') return ' <span class="badge orange">скоро выйдет</span>';
  return '';
}
function frameRow(f) {
  return `<tr><td class="wrap">${esc(f.brand)} ${esc(f.name)}${catTag(f)}</td>
    <td class="n">${f.total.toFixed(2)}</td>
    <td class="n">${f.sum_weight_g?esc(f.sum_weight_g)+' г':'TBD'}</td>
    <td class="n">${f.tyre_back_mm?esc(f.tyre_back_mm)+' мм':'TBD'}</td>
    <td class="n">${rub(f.price)}${f.price_basis_assumed?' <span class="badge orange">базис не указан</span>':''}</td>
    <td class="n">${esc(f.tbd_count)}</td>
    <td class="wrap">${f.comment?esc(f.comment):'—'}</td></tr>`;
}

        <span class="badge">${esc(best.price_basis||'frame')}</span></div>
      ${best.comment?`<div class="muted" style="margin-top:10px"><b>Комментарий автора.</b> «${esc(best.comment)}»</div>`:''}

        <span class="txt"><span class="s" style="margin:0">Расчётный балл · пропусков ${esc(best.tbd_count)}</span></span>
        <span class="v strong num" style="font-size:1.4rem">${best.total.toFixed(2)}</span></div>
      ${best.link?`<a href="${esc(best.link)}" target="_blank" rel="noopener" class="btn" style="margin-top:12px">Сайт производителя</a>`:''}
    </div>`);
    for (const [basis, list] of Object.entries(cohorts)) {
      h += sec(basis==='bike'?'Велосипед целиком':basis==='frame+'?'Фреймсет расширенный':'Фреймсет', `<div class="group scroll"><table>
        <thead><tr><th>Рама</th><th class="n">Балл</th><th class="n">Вес</th><th class="n">Покрышка</th><th class="n">Цена</th><th class="n">TBD</th><th>Комментарий автора</th></tr></thead>

    }
    h += '<p class="foot">Балл: вес 25%, покрышка 25%, цена 20% (внутри своей ценовой группы), год 15%, каретка 10%, багажный отсек 5%. Без веса, цены или покрышки рама в рейтинг не попадает — иначе она выигрывала бы за счёт отсутствующих данных.</p>';
  }

  if (framesMode === 'excluded') {
    h += sec('Исключены из рейтинга', `<div class="group scroll"><table>
      <thead><tr><th>Рама</th><th>Чего не хватает</th><th class="n">Цена</th><th>Комментарий автора</th></tr></thead>
      <tbody>${excluded.map(f => {
        const miss = [];
        if (!f.sum_weight_g) miss.push('вес');
        if (!f.price) miss.push('цена');
        if (!f.tyre_back_mm) miss.push('покрышка');
        return `<tr><td class="wrap">${esc(f.brand)} ${esc(f.name)}${catTag(f)}</td>
          <td>${esc(miss.join(', ')||'—')}</td><td class="n">${f.price?rub(f.price):'TBD'}</td>
          <td class="wrap">${f.comment?esc(f.comment):'—'}</td></tr>`;

      foot: 'Про вес отдельно: в исходной таблице сумма веса — формула SUM(), которая молча пропускает ячейки с TBD. У Argon 18 Anti Matter вилка TBD, поэтому сумма показывала 950 г — вес одной рамы. Он выглядел бы самым лёгким и выиграл бы по весу. Такие суммы обнулены.' });
  }

  if (framesMode === 'all') {
    h += sec('Все рамы', `<div class="group scroll"><table>
      <thead><tr><th>Рама</th><th class="n">Балл</th><th class="n">Вес</th><th class="n">Цена</th><th>Комментарий автора</th></tr></thead>
      <tbody>${FRAMES.slice().sort((a,b)=>(b.total??-1)-(a.total??-1)).map(f =>
        `<tr><td class="wrap">${esc(f.brand)} ${esc(f.name)}${catTag(f)}</td>
         <td class="n">${f.total!=null?f.total.toFixed(2):'—'}</td>
         <td class="n">${f.sum_weight_g?esc(f.sum_weight_g)+' г':'TBD'}</td>
         <td class="n">${f.price?rub(f.price):'TBD'}</td>
         <td class="wrap">${f.comment?esc(f.comment):'—'}</td></tr>`).join('')}
      </tbody></table></div>`, { count: FRAMES.length });
  }
  $('v-frames').innerHTML = h;
}

    const isOpen = localStorage.getItem('c:'+buildKey+':'+gi) !== '1';
    h += sec(g.g, group(`<details data-gi="${gi}"${isOpen ? ' open' : ''}>
      <summary>${DCHEV}<span class="gsum">${dn === g.items.length ? 'Всё отмечено' : `Осталось ${g.items.length - dn}`}</span></summary>` +
      g.items.map(it => {
        const id = stableId(g.g, it.n), done = !!checks[id];
        const tag = EDITOR ? 'button' : 'div';
        return `<${tag}${EDITOR ? ' type="button"' : ''} class="check${done ? ' done' : ''}"${EDITOR ? ` data-check="${esc(id)}" aria-pressed="${done}"` : ''}>
          <span class="circ" aria-hidden="true"><svg viewBox="0 0 24 24"><polyline points="5.5,12.5 10,17 18.5,7.5"/></svg></span>
          <span class="txt" style="flex:1;min-width:0">
            <span class="nm">${esc(it.n)}${it.x ? ' <span class="badge orange">проверить</span>' : ''}</span>
            ${it.d ? `<span class="dt">${esc(it.d)}</span>` : ''}
            ${it.note ? `<span class="note">${esc(it.note)}</span>` : ''}
          </span>
          ${(it.p && SHOWMONEY) ? `<span class="pr">${rub(it.p)}${it.pn ? `<small>${esc(it.pn)}</small>` : ''}</span>` : ''}
        </${tag}>`;
      }).join('') + `</details>`), { count: `${dn}/${g.items.length}` });
  });
  h += '</div>';
  $('v-build').innerHTML = h;
}

/* ============================================================ sheets */
let lastFocus = null;
function openSheet(html) {
  lastFocus = document.activeElement;
  $('sheetbody').innerHTML = '<div class="grab" aria-hidden="true"></div>' + html;
  $('sheet').classList.add('on');
  $('sheetbody').setAttribute('tabindex', '-1');
  setTimeout(() => $('sheetbody').focus({ preventScroll:true }), 30);
}
function closeSheet() {
  if (!$('sheet').classList.contains('on')) return;
  $('sheet').classList.remove('on');
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll:true });
}
const shead = (title, left, right) => `<div class="shead"><span>${left || ''}</span>
  <h3 id="sheettitle">${esc(title)}</h3><span>${right || ''}</span></div>`;
const DONE = '<button class="r" data-close="1">Готово</button>';
const CANCEL = '<button class="l" data-close="1">Отмена</button>';

function openEventSheet(bikeId, ruleId) {
  const bid = bikeId || (ownedBikes()[0] || BIKES[0]).id;
  openSheet(shead('Новая запись', CANCEL, '<button class="r" id="f-save">Сохранить</button>') + `
    <p class="lead">Цена детали подставляется из закупочной цены этого велосипеда, если такая деталь есть в составе.</p>
    ${group(`<div class="field"><label for="f-bike">Велосипед</label>
        <select id="f-bike">${BIKES.map(b=>`<option value="${b.id}"${b.id===bid?' selected':''}>${esc(b.name)}${isOwned(b.id)?'':' (продан)'}</option>`).join('')}</select></div>
      <div class="field"><label for="f-rule">Работа</label><select id="f-rule"></select></div>`)}
    ${group(`<div class="field"><label for="f-date">Дата</label><input id="f-date" type="date" value="${today()}"></div>
      <div class="field"><label for="f-odo">Пробег, км</label><input id="f-odo" type="number" inputmode="numeric"></div>`)}
    ${group(`<div class="field stack"><label for="f-part">Что делали / деталь</label><input id="f-part"></div>
      <div class="field"><label for="f-pc">Деталь, ₽</label><input id="f-pc" type="number" inputmode="decimal" placeholder="0"></div>
      <div class="field"><label for="f-lc">Работа, ₽</label><input id="f-lc" type="number" inputmode="decimal" placeholder="0"></div>`)}
    ${group(`<div class="field"><label for="f-place">Где делали</label><input id="f-place" placeholder="дома / мастерская"></div>
      <div class="field stack"><label for="f-note">Заметка</label><textarea id="f-note"></textarea></div>`)}`);
  const fillRules = () => {
    const b = $('f-bike').value;
    const rs = RULES.filter(r => r.bikes.includes(b));
    $('f-rule').innerHTML = rs.map(r=>`<option value="${r.id}"${r.id===ruleId?' selected':''}>${esc(r.task)}</option>`).join('')
      + '<option value="">Своё, вне регламента</option>';
    fillDefaults();
  };
  const fillDefaults = () => {
    const b = $('f-bike').value, r = RULE[$('f-rule').value];
    $('f-odo').placeholder = DOC().odo[b] || 'не указан';
    if (!r) return;
    const c = matchComponent(b, r);
    $('f-pc').value = defaultPartCost(b, r) || '';
    $('f-lc').value = r.est_labour_cost || '';
    $('f-part').value = c ? c.part + (c.spec ? ' — ' + c.spec : '') : r.task;
  };
  $('f-bike').onchange = fillRules;
  $('f-rule').onchange = fillDefaults;
  fillRules();
  $('f-save').onclick = () => {
    const b = $('f-bike').value, r = $('f-rule').value;
    const odo = $('f-odo').value ? Number($('f-odo').value) : (DOC().odo[b] ?? null);
    DOC().events.push({
      id: uid(), mtime: Date.now(), bike: b, rule: r || null,
      category: r ? RULE[r].category : 'consumables',
      date: $('f-date').value || today(), odo,
      part: $('f-part').value.trim(),
      partCost: Number($('f-pc').value) || 0,
      labourCost: Number($('f-lc').value) || 0,
      place: $('f-place').value.trim(),
      note: $('f-note').value.trim()
    });
    if (odo && (!DOC().odo[b] || odo > DOC().odo[b])) DOC().odo[b] = odo;
    persist(); closeSheet(); render(); sync(true); toast('Записано');
  };
}

/* запись журнала целиком: деталь, место, заметка, из чего сложилась цена */
function openEventView(eventId) {

/* Замена детали — это два действия сразу: в спеках появляется новая деталь,
   а в журнале обслуживания запись с ценой. Делать их порознь пришлось бы
   дважды вводить одно и то же. */
function openPartSheet(bikeId, partId) {
  const isNew = partId === 'new';
  const c = isNew ? { part:'', spec:'', purchasePrice:'', group:'' } :
            componentsOf(bikeId).find(x => x.id === partId);
  if (!c) return;
  const groups = [...new Set(componentsOf(bikeId).map(x => x.group).filter(Boolean))];
  openSheet(shead(isNew ? 'Новая деталь' : c.part, CANCEL, `<button class="r" id="p-save">${isNew ? 'Добавить' : 'Сохранить'}</button>`) + `
    <p class="lead">${isNew ? 'Появится в спецификации и в закупке.' : 'Правка меняет спецификацию. Замена ещё и запишет работу в журнал.'}</p>
    ${group(`<div class="field"><label for="p-group">Узел</label>
        <input id="p-group" list="p-groups" value="${esc(c.group||'')}" placeholder="Тормоза"></div>
      <div class="field"><label for="p-part">Деталь</label><input id="p-part" value="${esc(c.part||'')}" placeholder="Кассета"></div>
      <div class="field stack"><label for="p-spec">Характеристика</label><input id="p-spec" value="${esc(c.spec||'')}" placeholder="Shimano XT CS-M8200 10-51"></div>
      <div class="field"><label for="p-price">Цена, ₽</label><input id="p-price" type="number" inputmode="decimal" value="${esc(c.purchasePrice??'')}" placeholder="0"></div>`)}
    <datalist id="p-groups">${groups.map(g=>`<option value="${esc(g)}">`).join('')}</datalist>
    ${isNew ? '' : sec('Замена', group(`<div class="field"><label for="p-date">Дата</label><input id="p-date" type="date" value="${today()}"></div>
        <div class="field"><label for="p-labour">Работа, ₽</label><input id="p-labour" type="number" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label for="p-place">Где меняли</label><input id="p-place" placeholder="дома / мастерская"></div>`)
      + `<div style="margin-top:12px"><button class="btn pri block" id="p-replace">Заменить и записать</button></div>`,
      { lead: 'Впишите выше новую деталь и цену, а здесь — когда и где меняли. Старая заменится, а в журнал уйдёт запись.' })
      + `<div class="group" style="margin-top:24px"><button class="row destructive" id="p-del">Снять деталь</button></div>`}`);

  const read = () => ({
    group: $('p-group').value.trim() || 'Прочее',
    part:  $('p-part').value.trim(),
    spec:  $('p-spec').value.trim(),
    purchasePrice: $('p-price').value === '' ? null : Number($('p-price').value)
  });
  const write = patch => {
    const parts = DOC().parts || (DOC().parts = {});
    const forBike = parts[bikeId] || (parts[bikeId] = {});
    const key = isNew ? 'p' + uid() : partId;
    forBike[key] = Object.assign({}, forBike[key], patch, isNew ? { added:true } : null);
    persist(); closeSheet(); render(); sync(true);
  };
  $('p-save').onclick = () => {
    const v = read();
    if (!v.part) { toast('Впишите название детали'); return; }
    write(v); toast(isNew ? 'Деталь добавлена' : 'Сохранено');
  };
  if (!isNew) {
    $('p-del').onclick = () => {
      if (!confirm(`Снять «${c.part}» с велосипеда? В затратах она останется.`)) return;
      write({ deleted:true }); toast('Деталь снята');
    };
    $('p-replace').onclick = () => {
      const v = read();
      if (!v.part) { toast('Впишите название новой детали'); return; }
      DOC().events.push({
        id: uid(), mtime: Date.now(), bike: bikeId, rule: null, category: 'consumables',
        date: $('p-date').value || today(), odo: DOC().odo[bikeId] ?? null,
        part: v.part + (v.spec ? ' — ' + v.spec : ''),
        partCost: Number(v.purchasePrice) || 0,
        labourCost: Number($('p-labour').value) || 0,
        place: $('p-place').value.trim(), note: 'Замена: ' + c.part
      });
      write(v); toast('Заменено и записано');
    };
  }
}

/* Чижик-Пыжик: настоящий памятник на Фонтанке размером с ладонь, который
   ищут и не сразу находят. Подходящее место, чтобы спрятать переключатель. */
const WIFE_STATES = [
  { e:'💸', b:'Жена mode выключен', s:'Цены видно — все суммы и вкладка «Деньги» на месте.', v:'В Зеленогорске' },
  { e:'🙈', b:'Жена mode включён', s:'Цены спрятаны. На всякий случай.', v:'В соседней комнате' },
  { e:'🤫', b:'Жена mode на максимуме', s:'Цены спрятаны, а вкладка «Деньги» делает вид, что её не было.', v:'Смотрит в экран' }
];
function openChizhik() {
  openSheet(shead('Жена mode', '', DONE) + `
    <p class="lead">🐦 Чижик-Пыжик, как известно, ничего не рассказывает.</p>
    <div class="wife">
      <div class="q" id="w-q">Где сейчас жена?</div>
      <input type="range" id="w-range" min="0" max="2" step="1" value="${WIFE}" aria-labelledby="w-q" aria-valuetext="${esc(WIFE_STATES[WIFE].v)}">
      <div class="ticks" aria-hidden="true">${WIFE_STATES.map((w, i) => `<span class="${i === WIFE ? 'on' : ''}">${esc(w.v)}</span>`).join('')}</div>
      <div class="res"><span class="e" id="w-e" aria-hidden="true">${WIFE_STATES[WIFE].e}</span>
        <div><b id="w-b">${esc(WIFE_STATES[WIFE].b)}</b><span id="w-s">${esc(WIFE_STATES[WIFE].s)}</span></div></div>
    </div>
    <p class="foot">Включён по умолчанию. Настройка своя на каждом устройстве и никуда не уезжает.</p>`);
  const rg = $('w-range');
  const paint = pos => {
    const w = WIFE_STATES[pos];
    $('w-e').textContent = w.e; $('w-b').textContent = w.b; $('w-s').textContent = w.s;
    rg.setAttribute('aria-valuetext', w.v);
    $('sheetbody').querySelectorAll('.ticks span').forEach((s, i) => s.classList.toggle('on', i === pos));
    if (!REDUCED) $('w-e').animate([{ transform:'scale(.6) rotate(-12deg)' }, { transform:'scale(1.15)' }, { transform:'none' }],
      { duration:420, easing:'cubic-bezier(.32,1.28,.54,1)' });
  };
  rg.oninput = () => paint(Number(rg.value));
  rg.onchange = () => setWife(Number(rg.value));
}

function openSyncSheet() {
  openSheet(shead(EDITOR ? 'Профиль' : 'Вход', '', DONE) + (EDITOR
    ? group(`<div class="row"><span class="txt"><span class="t">Вы вошли как владелец</span>
          <span class="s" id="s-state">${esc(syncLine())}</span></span></div>`)
      + '<p class="foot">Изменения сохраняются и разлетаются на все ваши устройства. Ссылку можно кидать кому угодно — гости видят то же самое, но менять ничего не могут.</p>'
    : `<p class="lead">Сейчас режим просмотра: данные видны, но правки недоступны. Введите пароль — устройство запомнит вас на 120 дней.</p>
      ${group(`<div class="field"><label for="s-pw">Пароль</label>
        <input id="s-pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="обязательно"></div>`)}
      <div class="err" id="s-err" role="alert"></div>
      <div style="margin-top:10px"><button class="btn pri block" id="s-login">Войти</button></div>`)
    + sec('Время суток', `<div class="seg" role="radiogroup" aria-label="Время суток" id="s-part" style="margin:0">
        ${[['auto','По часам'],['dawn','Рассвет'],['day','День'],['dusk','Закат'],['night','Ночь']].map(([k,l]) =>
          `<button role="radio" aria-checked="${PART===k}" data-daypart="${k}" class="${PART===k?'on':''}">${l}</button>`).join('')}</div>`,
      { foot: 'Оформление меняется само по часам: рассвет, день, закат, ночь. Можно закрепить одно.' })
    + sec('Резервная копия', group(`<button class="row action" id="s-export">Выгрузить в файл</button>
        ${EDITOR ? `<label class="row action">Загрузить из файла<input type="file" id="s-file" accept="application/json" class="sr"></label>` : ''}`),
      { foot: 'На телефоне файл уходит через «Поделиться» в Файлы или iCloud.' })
    + (EDITOR ? `<div class="group" style="margin-top:28px"><button class="row destructive" id="s-logout">Выйти</button></div>` : ''));

  if (EDITOR) $('s-logout').onclick = () => { closeSheet(); logout(); toast('Вы вышли'); };
  else {
    const go = async () => {
      const pw = $('s-pw').value;
      if (!pw) { $('s-err').textContent = 'Введите пароль'; return; }
      $('s-login').disabled = true; $('s-err').textContent = '';
      try { await login(pw); closeSheet(); await sync(); render(); toast('С возвращением'); }
      catch (err) { $('s-err').textContent = err.message; $('s-login').disabled = false; }
    };
    $('s-login').onclick = go;
    $('s-pw').onkeydown = e => { if (e.key === 'Enter') go(); };
    setTimeout(() => $('s-pw').focus(), 120);
  }
  $('s-export').onclick = () => {
    const blob = new Blob([JSON.stringify(local.doc, null, 1)], {type:'application/json'});
    const file = new File([blob], 'bikes-backup-' + today() + '.json', {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file]}).catch(()=>{});
    else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    }
  };
  if (EDITOR) $('s-file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        local.doc = mergeDocs(local.doc, sanitizeDoc(JSON.parse(rd.result)));
        persist(); closeSheet(); render(); sync(true); toast('Загружено');
      } catch(err) { toast('Файл не читается'); }
    };
    rd.readAsText(f);
  };
}

let tipT;
function toast(msg) {
  const t = $('tip');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(tipT); tipT = setTimeout(()=>t.classList.remove('on'), 2600);
}

/* ============================================================ render */
/* Раздел живёт в адресе: ссылку на «Выбор велосипеда» можно кинуть, и она
   откроется там же, а «Назад» возвращает по разделам, а не уводит с сайта. */
function routeTo() {
  const want = (tab === 'garage' && openBike) ? 'garage/' + openBike : tab;
  if (location.hash.slice(1) !== want) history.pushState({ tab, openBike }, '', '#' + want);
}
function routeFrom() {
  const [t, b] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (TABS.some(x => x.id === t)) tab = t;
  openBike = (tab === 'garage' && b && BIKE[b]) ? b : null;
}
window.addEventListener('popstate', () => { routeFrom(); navigate(true); });

/* Переход между экранами — не перерисовка, а смена кадра: фото велосипеда
   перелетает из карточки на его страницу, имя — в заголовок, а город внизу
   доезжает до следующего места. Без API или при «меньше движения» —
   просто рисуем, поведение то же. */
let vtRunning = false;
function navigate(fromHistory) {
  if (REDUCED || !document.startViewTransition || vtRunning) return render(fromHistory);
  vtRunning = true;
  const vt = document.startViewTransition(() => render(fromHistory));
  vt.ready.catch(() => {});
  vt.updateCallbackDone.catch(() => {});
  vt.finished.catch(() => {}).then(() => { vtRunning = false; });
}

function subtitle(inDetail) {
  const att = attention();
  if (inDetail) {
    const b = BIKE[openBike];
    return isOwned(openBike) ? `${b.type} · ${b.wheel} · ${b.owner}` : `${b.type} · продан`;
  }
  return tab === 'garage' ? `${ownedBikes().length} в парке${soldBikes().length ? ' · ' + soldBikes().length + ' ' + plural(soldBikes().length,'продан','продано','продано') : ''}`
    : tab === 'service' ? (att.length ? `${att.length} к работе` : RULES.length + ' пунктов регламента')
    : tab === 'money' ? (SHOWMONEY ? 'закупка, обслуживание и прогноз' : 'цены спрятаны')
    : tab === 'frames' ? (framesMode === 'short' ? 'гравел под рост 180 · шорт-лист' : FRAMES.length + ' рам в базе')
    : 'Faraoll G50 и Speedone Floater';
}

let lastScreen = '';
function render(fromHistory) {
  if (tab === 'money' && WIFE === 2) tab = 'garage';
  if (!fromHistory) routeTo();
  renderNav();
  const inDetail = !!(openBike && tab === 'garage');
  const title = inDetail ? BIKE[openBike].name : TABS.find(x => x.id === tab).title;
  $('h1').textContent = title;
  $('h1').style.viewTransitionName = inDetail ? 'bname-' + openBike : 'none';
  $('bartitle').textContent = title;
  $('back').hidden = !inDetail;
  $('sub').textContent = subtitle(inDetail);
  document.title = (tab === 'garage' && !inDetail) ? 'Гараж — велосипеды, ТО и затраты' : title + ' — Гараж';
  updateScene();
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('v-' + tab).classList.add('on');
  ({garage:viewGarage, service:viewService, money:viewMoney, frames:viewFrames, build:viewBuild})[tab]();
  paintSync();
  const screen = tab + '/' + (openBike || '');
  const swapped = screen !== lastScreen;
  lastScreen = screen;
  afterRender(swapped);
}

let checkT = 0;
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-bike],[data-back],[data-addevent],[data-delevent],[data-mbike],[data-fmode],[data-smode],[data-bkey],[data-check],[data-att],[data-own],[data-sheet],[data-daypart],[data-editpart],[data-chizhik],[data-event],[data-rule-open],[data-close]');
  if (!t) { if (e.target === $('sheet')) closeSheet(); return; }

  if (t.dataset.close)   { closeSheet(); return; }
  if (t.dataset.chizhik) { openChizhik(); return; }
  if (t.dataset.daypart) {
    setPart(t.dataset.daypart);
    t.parentElement.querySelectorAll('button').forEach(b => {
      b.classList.toggle('on', b === t); b.setAttribute('aria-checked', b === t);
    });
    return;
  }
  if (t.dataset.editpart) {
    if (!EDITOR) return openSyncSheet();
    const [bid, pid] = t.dataset.editpart.split('|');
    openPartSheet(bid, pid); return;
  }
  if (t.dataset.sheet) { openSyncSheet(); return; }
  if (t.dataset.tab) {
    closeSheet();
    if (t.dataset.bkey) buildKey = t.dataset.bkey;       // из карточки велосипеда — сразу в его чек-лист
    tab = t.dataset.tab; openBike = null; navigate(); window.scrollTo(0,0); return;
  }
  if (t.dataset.bike)  { openBike = t.dataset.bike; tab = 'garage'; navigate(); window.scrollTo(0,0); return; }
  if (t.dataset.back)  { openBike = null; navigate(); return; }
  if (t.dataset.mbike) { moneyBike = t.dataset.mbike; render(); return; }
  if (t.dataset.fmode) { framesMode = t.dataset.fmode; navigate(); return; }
  if (t.dataset.smode) { serviceMode = t.dataset.smode; navigate(); return; }
  if (t.dataset.bkey)  { buildKey = t.dataset.bkey; navigate(); return; }
  if (t.dataset.ruleOpen) { openRuleSheet(t.dataset.ruleOpen); return; }
  if (t.dataset.event) { openEventView(t.dataset.event); return; }
  if (t.dataset.att && !EDITOR) { openRuleSheet(t.dataset.att.split('|')[1]); return; }
  if (t.dataset.att || t.hasAttribute('data-addevent')) {
    if (!EDITOR) return openSyncSheet();
    if (t.dataset.att) { const [b,r] = t.dataset.att.split('|'); openEventSheet(b, r); }
    else openEventSheet(t.dataset.addevent || openBike, t.dataset.rule);
    return;
  }
  if (t.dataset.own) {
    if (!EDITOR) return openSyncSheet();
    const [id, state] = t.dataset.own.split('|');
    const o = DOC().ownership[id] || (DOC().ownership[id] = {});
    o.state = state;
    persist(); render(); sync(true);
    return;
  }
  if (t.dataset.delevent) {
    if (!EDITOR) return openSyncSheet();
    const ev = DOC().events.find(x => x.id === t.dataset.delevent);
    if (ev && !confirm(`Удалить запись «${ev.part || 'обслуживание'}» от ${fmtDate(ev.date)}?`)) return;
    if (ev) { ev.deleted = true; ev.mtime = Date.now(); persist(); closeSheet(); render(); sync(true); toast('Запись удалена'); }
    return;
  }
  if (t.dataset.check) {
    if (!EDITOR) return openSyncSheet();
    const m = DOC().checks[buildKey] || (DOC().checks[buildKey] = {});
    const id = t.dataset.check;
    // an unchecked box is a recorded 0, not a missing key — a key-by-key merge
    // cannot otherwise tell "unchecked here" from "never seen here"
    m[id] = m[id] ? 0 : 1;
    t.classList.toggle('done', !!m[id]);
    t.setAttribute('aria-pressed', !!m[id]);
    persist(); sync(true);
    // счётчики, кольцо и список покупок догоняют после того, как галочка дорисуется
    clearTimeout(checkT); checkT = setTimeout(() => render(), 650);
    return;
  }
});

document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.tagName === 'DETAILS' && d.dataset.gi != null)
    localStorage.setItem('c:' + buildKey + ':' + d.dataset.gi, d.open ? '0' : '1');
}, true);

document.addEventListener('change', e => {
  const el = e.target;
  if (!EDITOR) return;
  const num = v => v === '' ? null : Number(v);
  if (el.dataset.odo)       { DOC().odo[el.dataset.odo] = num(el.value); persist(); render(); sync(true); return; }
  if (el.dataset.annual)    { DOC().annualKm[el.dataset.annual] = num(el.value); persist(); sync(true); return; }
  if (el.dataset.solddate)  { (DOC().ownership[el.dataset.solddate] ||= {}).soldDate = el.value || null; persist(); render(); sync(true); return; }
  if (el.dataset.soldprice) { (DOC().ownership[el.dataset.soldprice] ||= {}).soldPrice = num(el.value); persist(); render(); sync(true); return; }
  if (el.dataset.photo)     {
    const f = el.files[0]; if (!f) return;
    const id = el.dataset.photo;
    // Читаем файл как data:, а не через createObjectURL. Политика безопасности
    // разрешает картинки только из 'self' и data: — blob: она молча блокирует,
    // и onload не срабатывал вовсе. Это и был баг «фото не добавляются».
    const fr = new FileReader();
    fr.onerror = () => toast('Файл не читается');
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => toast('Такой формат не открывается — сохраните как JPEG');
      img.onload = () => {
        // ужимаем до 1200 px по длинной стороне: карточка на телефоне — 390 точек
        // при тройной плотности, меньше выглядит мыльно. Выходит ~150–250 КБ
        // вместо 4 МБ с камеры; пять велосипедов — около мегабайта в документе.
        const k = Math.min(1, 1200 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        DOC().photos[id] = c.toDataURL('image/jpeg', .72);
        persist(); render(); sync(true); toast('Фото добавлено');
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  }
});

/* Клавиатура на компьютере: цифры — разделы, N — новая запись, Esc — закрыть. */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest('input,textarea,select,[contenteditable]')) return;
  if ($('sheet').classList.contains('on')) return;
  const tabs = visibleTabs(), n = Number(e.key);
  if (n >= 1 && n <= tabs.length) { tab = tabs[n - 1].id; openBike = null; navigate(); window.scrollTo(0,0); return; }
  if ((e.key === 'n' || e.key === 'т') && EDITOR) { e.preventDefault(); openEventSheet(openBike); }
});

/* ============================================================ motion
   Всё здесь — украшение: если что-то не сработает или человек попросил
   меньше движения, на экране останутся те же цифры. */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* небо уезжает медленнее страницы — глубина, а не плоская картинка */
let scrollRaf = 0;
function onScroll() {
  scrollRaf = 0;
  if (REDUCED) return;
  const sc = $('scene'); if (!sc) return;
  const y = Math.min(window.scrollY, 400);
  sc.style.transform = `translate3d(0,${(-y * .35).toFixed(1)}px,0)`;
}
window.addEventListener('scroll', () => { if (!scrollRaf) scrollRaf = requestAnimationFrame(onScroll); }, { passive:true });

/* крупный заголовок ушёл под край — показываем компактный в стеклянной полосе */
new IntersectionObserver(([en]) => document.body.classList.toggle('scrolled', !en.isIntersecting),
  { rootMargin:`-${$('bar').offsetHeight}px 0px 0px 0px` }).observe($('h1'));

let observer = null;
function watchReveals(swapped) {
  if (REDUCED || !swapped) { document.querySelectorAll('.reveal').forEach(el => el.classList.add('in')); return; }
  if (!observer) observer = new IntersectionObserver(entries => {
    entries.forEach((en, i) => {
      if (!en.isIntersecting) return;
      setTimeout(() => en.target.classList.add('in'), Math.min(i, 6) * 55);
      observer.unobserve(en.target);
    });
  }, { rootMargin:'0px 0px -6% 0px' });
  document.querySelectorAll('.reveal:not(.in)').forEach(el => observer.observe(el));
}

/* count up to the real number — the label is written before the animation runs,
   so a failure here leaves the correct value on screen, not a zero */
function countUp() {
  if (REDUCED || !SHOWMONEY) return;
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = Number(el.dataset.count);
    if (!isFinite(to) || to <= 0 || el.dataset.done) return;
    el.dataset.done = '1';
    const t0 = performance.now(), dur = 850;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      el.textContent = rub(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

/* полосы и кольцо растут от нуля, когда экран сменился */
function growBars(swapped) {
  if (REDUCED || !swapped) return;
  document.querySelectorAll('.view.on .fill').forEach(el => {
    const w = el.style.width; el.style.width = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.width = w; }));
  });
  document.querySelectorAll('.view.on .ring .pr').forEach(el => {
    const o = el.getAttribute('stroke-dashoffset'); el.style.strokeDashoffset = RING_C.toFixed(1);
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.strokeDashoffset = o; }));
  });
}

function afterRender(swapped) {
  if (swapped && !REDUCED) {
    const v = $('v-' + tab);
    v.classList.remove('swap'); void v.offsetWidth; v.classList.add('swap');
  }
  watchReveals(swapped); countUp(); growBars(swapped); onScroll();
}

/* ============================================================ boot */
routeFrom();                        // раздел из адреса до первой отрисовки
applyPart();
setInterval(() => { if (PART === 'auto') { const was = document.documentElement.dataset.part; applyPart();
  if (was !== document.documentElement.dataset.part) renderNav(); } }, 60000);
if (!REDUCED) {
  document.documentElement.classList.add('booting');
  setTimeout(() => document.documentElement.classList.remove('booting'), 1400);
}
const migrated = migrateChecks();   // R1 — before anything touches content
applyRenames();                     // перенос галочек с переименованных пунктов
applySeed();                        // R4 — repopulate after storage eviction
render();
if (migrated) toast('Перенесено отмеченных пунктов: ' + migrated);
sync(true);
window.addEventListener('online', () => sync(true));
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(true); });
</script>
</body>
</html>
