<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070b">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-5XMIBFtVWeP5aQPumIHFXoRO+HBPb/cpEI3QDw126LQ='; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="description" content="Парк велосипедов: состав, регламент ТО, затраты, выбор велосипеда 26/27 и чек-листы сборки">
<title>Гараж — велосипеды, ТО и затраты</title>
<style>
/* ============================================================ tokens
   Язык — Apple HIG и Liquid Glass: системный шрифт, сгруппированные списки,
   стеклянные панели поверх живого фона. Фон — Петербург в своё время суток:
   рассвет, день, закат, ночь меняют не только небо, а всю палитру.
   Цвета семантические: --label/--label2 — текст, --tint — действие,
   --red/--orange/--green — состояние. Каждая пара проверена на контраст
   4.5:1 (scripts/hig_checker.py), вторичный текст темнее системного iOS:
   штатный secondaryLabel на белом не дотягивает. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro",system-ui,"Segoe UI",Roboto,sans-serif;
  /* цифры — скруглённым SF, как в «Здоровье» и «Фитнесе» */
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --spring:cubic-bezier(.32,1.28,.54,1);
  --ease:cubic-bezier(.22,.68,0,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --r-group:22px; --r-card:26px; --r-sheet:30px;
  --scene-h:318px;
  --side:0px;
}
:root,[data-part="night"]{
  color-scheme:dark;
  --s1:#05070c;--s2:#0a1220;--s3:#132234;--s4:#1d3247;--s5:#0e1a28;
  --orb:#e9eff8;--orbGlow:rgba(186,208,240,.16);--orbX:74%;--orbY:92px;--orbSize:44px;
  --city:#070e18;--lamp:1;--w1:#16293c;--w2:#0b1622;--w3:#080f18;
  --bg:#05070b;--card:#141821;--card2:#1c212c;--fill:rgba(120,130,150,.20);
  --label:#f5f7fa;--label2:#a3abb8;--label3:#6b7380;--sep:rgba(160,170,190,.16);
  --tint:#9d9bff;--segOn:rgba(255,255,255,.17);--onTint:#0b0a24;--tintSoft:rgba(157,155,255,.16);
  --red:#ff6961;--orange:#ffb340;--green:#4cd964;
  --redSoft:rgba(255,105,97,.16);--orangeSoft:rgba(255,179,64,.16);--greenSoft:rgba(76,217,100,.14);
  --glass:rgba(22,26,36,.58);--glassEdge:rgba(255,255,255,.14);--glassHi:rgba(255,255,255,.10);
  --titleOnSky:#f5f7fa;--subOnSky:#c9d3e2;--shadow:0 18px 48px rgba(0,0,0,.45);
  --b1:#0a84ff;--b2:#ff9f0a;--b3:#30d158;--b4:#ffd60a;--b5:#ff375f;
}
[data-part="dawn"]{
  color-scheme:dark;
  --s1:#0f1523;--s2:#232c46;--s3:#5b4d6b;--s4:#b8836f;--s5:#d8a184;
  --orb:#ffd9c4;--orbGlow:rgba(255,205,180,.32);--orbX:20%;--orbY:204px;--orbSize:50px;
  --city:#0a0f1c;--lamp:.45;--w1:#3b4560;--w2:#1a2135;--w3:#10141f;
  --bg:#080912;--card:#171a28;--card2:#20243a;--fill:rgba(150,150,190,.20);
  --label:#f2f3f8;--label2:#a9aec4;--label3:#6c7089;--sep:rgba(170,175,210,.16);
  --tint:#ff94a8;--segOn:rgba(255,255,255,.17);--onTint:#24070e;--tintSoft:rgba(255,148,168,.16);
  --red:#ff6961;--orange:#ffb340;--green:#5fd98a;
  --redSoft:rgba(255,105,97,.16);--orangeSoft:rgba(255,179,64,.16);--greenSoft:rgba(95,217,138,.14);
  --glass:rgba(26,28,44,.56);--glassEdge:rgba(255,255,255,.15);--glassHi:rgba(255,255,255,.10);
  --titleOnSky:#f7f3f6;--subOnSky:#e6e0ee;--shadow:0 18px 48px rgba(0,0,0,.45);
  --b1:#0a84ff;--b2:#ff9f0a;--b3:#30d158;--b4:#ffd60a;--b5:#ff375f;
}
[data-part="day"]{
  color-scheme:light;
  --s1:#7fb2e0;--s2:#a4cbe9;--s3:#c8e0f0;--s4:#dceaf3;--s5:#cfe0ec;
  --orb:#fffdf2;--orbGlow:rgba(255,253,235,.6);--orbX:72%;--orbY:70px;--orbSize:56px;
  --city:#7f97ad;--lamp:0;--w1:#87b0cf;--w2:#6b95b6;--w3:#5b86a8;
  --bg:#f2f4f8;--card:#ffffff;--card2:#eef1f6;--fill:rgba(120,130,150,.14);
  --label:#0b0f14;--label2:#5a616d;--label3:#8a919c;--sep:rgba(60,70,90,.14);
  --tint:#0064d2;--segOn:#ffffff;--onTint:#ffffff;--tintSoft:rgba(0,100,210,.10);
  --red:#d70015;--orange:#b25000;--green:#1e7a34;
  --redSoft:rgba(215,0,21,.09);--orangeSoft:rgba(178,80,0,.10);--greenSoft:rgba(30,122,52,.10);
  --glass:rgba(255,255,255,.62);--glassEdge:rgba(255,255,255,.75);--glassHi:rgba(255,255,255,.55);
  --titleOnSky:#0b0f14;--subOnSky:#1f2a36;--shadow:0 16px 40px rgba(40,70,110,.16);
  --b1:#007aff;--b2:#ff9500;--b3:#34c759;--b4:#e0a800;--b5:#ff2d55;
}
[data-part="dusk"]{
  color-scheme:dark;
  --s1:#150f1d;--s2:#3a2340;--s3:#7d3f45;--s4:#c2673f;--s5:#e59a4e;
  --orb:#fff0c9;--orbGlow:rgba(255,190,110,.42);--orbX:76%;--orbY:214px;--orbSize:64px;
  --city:#0e0912;--lamp:.7;--w1:#5a3a3c;--w2:#2a1a22;--w3:#170f16;
  --bg:#0c0908;--card:#1c1716;--card2:#261f1e;--fill:rgba(170,140,130,.18);
  --label:#faf5f0;--label2:#b8aca5;--label3:#7c706a;--sep:rgba(210,180,170,.15);
  --tint:#ffa53d;--segOn:rgba(255,255,255,.17);--onTint:#1f1206;--tintSoft:rgba(255,165,61,.16);
  --red:#ff6961;--orange:#ffb340;--green:#6fd98a;
  --redSoft:rgba(255,105,97,.16);--orangeSoft:rgba(255,179,64,.15);--greenSoft:rgba(111,217,138,.14);
  --glass:rgba(34,26,26,.56);--glassEdge:rgba(255,235,220,.15);--glassHi:rgba(255,240,230,.10);
  --titleOnSky:#fff8f1;--subOnSky:#f2dccb;--shadow:0 18px 48px rgba(0,0,0,.5);
  --b1:#0a84ff;--b2:#ff9f0a;--b3:#30d158;--b4:#ffd60a;--b5:#ff375f;
}

/* ============================================================ base
   Dynamic Type: в Safari базовый размер берётся из настроек iOS, всё остальное
   в rem — крупный шрифт в системе делает крупным и сайт. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:100%;-webkit-text-size-adjust:100%}
@supports (font:-apple-system-body){html{font:-apple-system-body}}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--label);
  font:400 1rem/1.35 var(--font);letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background-color .8s var(--ease),color .8s var(--ease);
}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--tint)}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:8px}
.num{font-family:var(--rounded);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-size:.82em;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,a,summary,label,.row{touch-action:manipulation}
svg.i{width:1.3rem;height:1.3rem;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ============================================================ glass
   Стекло — только у навигации и управления, у содержимого сплошной фон:
   так текст всегда читается, а стекло остаётся слоем «над» страницей. */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--glassHi),inset 0 0 0 1px var(--glassEdge),0 8px 30px rgba(0,0,0,.18);
}
@media (prefers-reduced-transparency:reduce){
  .glass{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}
}

/* ============================================================ scene
   Окно в Петербург. Небо общее; земля — три плана, которые едут с разной
   скоростью, когда переходишь между разделами: набережная → двор-колодец →
   проспект → мастерская → грунтовка в Ленобласти. */
#scene{position:fixed;top:0;left:0;right:0;height:var(--scene-h);z-index:0;
  overflow:hidden;view-transition-name:scene}
.sky-base{position:absolute;inset:0;
  background:linear-gradient(var(--s1) 0%,var(--s2) 34%,var(--s3) 58%,var(--s4) 80%,var(--s5) 100%);
  transition:background 1s var(--ease)}
.bloom{position:absolute;left:calc(var(--orbX) - 36%);top:calc(var(--orbY) - 120px);width:80%;height:300px;
  background:radial-gradient(58% 54% at 46% 42%,var(--orbGlow),transparent 72%);transition:all 1s var(--ease)}
.orb{position:absolute;left:var(--orbX);top:var(--orbY);width:var(--orbSize);height:var(--orbSize);
  border-radius:50%;background:radial-gradient(circle,var(--orb) 0%,var(--orb) 42%,transparent 72%);
  transition:all 1s var(--ease)}
/* луна — не перекрашенное солнце: холодный диск с кратерами */
[data-part="night"] .orb{
  background:
    radial-gradient(circle at 62% 62%,rgba(120,140,175,.34) 0 6%,transparent 7%),
    radial-gradient(circle at 38% 34%,rgba(120,140,175,.28) 0 8%,transparent 9%),
    radial-gradient(circle at 52% 24%,rgba(120,140,175,.2) 0 4%,transparent 5%),
    radial-gradient(circle at 34% 68%,rgba(120,140,175,.16) 0 5%,transparent 6%),
    radial-gradient(circle at 40% 36%,#f4f7fc 0%,#dfe7f2 62%,#c3cfe1 88%,#b3c1d6 100%);
  box-shadow:0 0 34px 6px rgba(190,212,245,.16),inset -6px -7px 12px -6px rgba(60,78,110,.55)}
.world{position:absolute;left:0;right:0;bottom:58px;height:140px}
.band{position:absolute;left:0;bottom:0;width:500%;height:100%;display:flex;
  transition:transform 1.05s cubic-bezier(.32,.74,.06,1)}
.band>.place{width:20%;height:100%;position:relative;flex:none}
.band.far{transform:translateX(calc(var(--i,0) * -6%))}
.band.mid{transform:translateX(calc(var(--i,0) * -13%))}
.band.near{transform:translateX(calc(var(--i,0) * -20%))}
.band svg{position:absolute;bottom:0;left:0;width:100%;height:100%}
.far-p{fill:var(--city);opacity:.42}.mid-p{fill:var(--city);opacity:.78}
.near-p{fill:color-mix(in srgb,var(--city) 88%,black)}
.far-p,.mid-p,.near-p{transition:fill 1s var(--ease)}
.warm{fill:var(--orb);opacity:calc(var(--lamp) * .85);transition:opacity 1s}
.water{position:absolute;left:0;right:0;bottom:0;height:46px;
  background:linear-gradient(var(--w1),var(--w2) 70%,var(--w3));transition:background 1s var(--ease)}
.ground{position:absolute;left:0;right:0;bottom:0;height:34px;
  background:linear-gradient(color-mix(in srgb,var(--city) 55%,#3a3a3a),color-mix(in srgb,var(--city) 80%,#1a1a1a))}
.placename{position:absolute;left:calc(var(--safe-l) + 20px);bottom:68px;z-index:3;
  font:600 .7rem/1 var(--font);letter-spacing:.08em;text-transform:uppercase;
  color:color-mix(in srgb,var(--titleOnSky) 62%,transparent)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:overlay}
[data-part="day"] .grain{opacity:.18}

/* Чижик-Пыжик сидит на ограде набережной. Это и есть вход в «Жена mode». */
#chizhik{position:absolute;left:58%;bottom:75px;z-index:4;
  width:44px;height:44px;padding:0;border:0;background:none;display:flex;align-items:flex-end;justify-content:center;
  transition:transform .6s var(--spring),opacity .4s}
#chizhik svg{width:24px;height:22px;transform-origin:50% 90%}
#chizhik:hover svg,#chizhik:focus-visible svg{animation:peck .5s var(--spring)}
@keyframes peck{30%{transform:rotate(-14deg)}60%{transform:rotate(6deg)}}
.away #chizhik{opacity:0;pointer-events:none;transform:translateY(-30px) translateX(40px)}

/* ============================================================ top bar
   Крупный заголовок лежит прямо на небе. Когда он уезжает под край,
   появляется компактная стеклянная полоса с тем же заголовком — как в iOS. */
#bar{position:fixed;top:0;left:var(--side);right:0;z-index:40;height:calc(var(--safe-t) + 52px);
  padding:var(--safe-t) calc(var(--safe-r) + 10px) 0 calc(var(--safe-l) + 10px);
  display:flex;align-items:center;justify-content:center;pointer-events:none}
#bar::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .25s;
  background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 -1px 0 var(--sep)}
.scrolled #bar::before{opacity:1}
#bartitle{position:relative;font:600 1.0625rem/1.2 var(--font);opacity:0;transform:translateY(6px);
  transition:opacity .2s,transform .25s var(--spring);max-width:60%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.scrolled #bartitle{opacity:1;transform:none}
.barbtn{position:absolute;top:calc(var(--safe-t) + 4px);pointer-events:auto;
  min-width:44px;height:44px;border:0;border-radius:22px;color:var(--label);
  display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}
#back{left:calc(var(--safe-l) + 10px);font-weight:600;color:var(--tint);padding:0 14px 0 8px}
#back svg{stroke-width:2.4}
#back[hidden]{display:none}
#prof{right:calc(var(--safe-r) + 10px);width:44px;padding:0}
#sdot{position:absolute;right:7px;top:7px;width:9px;height:9px;border-radius:50%;
  background:var(--label3);box-shadow:0 0 0 2px var(--glass)}
#sdot.on{background:var(--green)}#sdot.dirty{background:var(--orange)}#sdot.err{background:var(--red)}
#sdot.off{display:none}

/* ============================================================ page */
/* шапка прозрачна для нажатий: сквозь неё достаётся чижик в сцене */
main{position:relative;z-index:2;padding-bottom:calc(var(--safe-b) + 110px);pointer-events:none}
.panel{pointer-events:auto}
.head{padding:calc(var(--safe-t) + 64px) calc(var(--safe-r) + 20px) 0 calc(var(--safe-l) + 20px);
  min-height:calc(var(--scene-h) - 58px);max-width:1120px;margin:0 auto}
h1{margin:0;font:700 2.05rem/1.12 var(--display);letter-spacing:-.025em;color:var(--titleOnSky);
  text-wrap:balance;text-shadow:0 1px 18px color-mix(in srgb,var(--s2) 70%,transparent)}
.sub{margin:6px 0 0;font:500 .94rem/1.35 var(--font);color:var(--subOnSky);
  text-shadow:0 1px 12px color-mix(in srgb,var(--s2) 70%,transparent)}
.panel{position:relative;background:var(--bg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  min-height:70vh;box-shadow:0 -1px 0 var(--glassEdge),0 -24px 60px rgba(0,0,0,.18);
  transition:background-color .8s var(--ease)}
.wrap{max-width:1120px;margin:0 auto;padding:22px calc(var(--safe-r) + 16px) 24px calc(var(--safe-l) + 16px)}
.view{display:none}.view.on{display:block}

/* ============================================================ sections
   Сгруппированные списки iOS: заголовок раздела обычным регистром, строки
   высотой от 44 пт, разделитель от текста, а не от края. */
.sec{margin-top:30px}
.view>.sec:first-child{margin-top:0}
.sech{display:flex;align-items:baseline;gap:8px;margin:0 4px 10px}
.sech h2{margin:0;font:700 1.3rem/1.2 var(--display);letter-spacing:-.02em;flex:1;min-width:0}
.sech .cnt{font:500 .94rem/1 var(--rounded);color:var(--label2)}
.sech .more{font-size:.94rem;color:var(--tint);border:0;background:none;padding:10px 0;min-height:44px}
.subh{display:flex;justify-content:space-between;gap:12px;margin:20px 16px 7px;
  font:600 .76rem/1.2 var(--font);color:var(--label2);text-transform:uppercase;letter-spacing:.04em}
.sech+.subh{margin-top:4px}
.gsum{font-size:.94rem;color:var(--label2)}
.foot{margin:8px 16px 0;font-size:.8rem;line-height:1.4;color:var(--label2)}
.group{background:var(--card);border-radius:var(--r-group);overflow:hidden}
.group+.group{margin-top:12px}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:11px 16px;width:100%;
  border:0;background:none;text-align:left;position:relative;color:inherit;font:inherit}
button.row,a.row,label.row{cursor:pointer}
.row+.row::before,.row+details::before,details+.row::before,details+details::before{
  content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.row.ind+.row.ind::before{left:38px}
.row .txt{flex:1;min-width:0}
.row .t{display:block;font-size:1rem;line-height:1.3}
.row .s{display:block;font-size:.82rem;line-height:1.35;color:var(--label2);margin-top:2px}
.row .v{flex:none;text-align:right;font-size:1rem;color:var(--label2);white-space:nowrap}
.row .v.strong{color:var(--label);font-weight:600}
.row .chev{flex:none;width:.6rem;height:1rem;color:var(--label3)}
.row .dot{width:10px;height:10px;border-radius:50%;flex:none}
@media (hover:hover){button.row:hover,label.row:hover{background:var(--fill)}}
button.row:active,label.row:active{background:var(--fill)}
.row.action{color:var(--tint);font-weight:500;justify-content:flex-start}
.row.destructive{color:var(--red);justify-content:center;font-weight:500}
.row.center{justify-content:center}
.pad{padding:16px}
.empty{padding:28px 20px;text-align:center}
.empty .ic{font-size:2rem;line-height:1}
.empty .t{font:600 1.06rem/1.3 var(--font);margin-top:10px}
.empty .s{font-size:.9rem;color:var(--label2);margin-top:6px;line-height:1.45;max-width:36ch;margin-inline:auto}

/* плашки состояния: цвет + слово, не один цвет */
.badge{display:inline-flex;align-items:center;gap:5px;flex:none;
  padding:3px 9px;border-radius:999px;font:600 .76rem/1.4 var(--font);white-space:nowrap;
  background:var(--fill);color:var(--label2)}
.badge.red{background:var(--redSoft);color:var(--red)}
.badge.orange{background:var(--orangeSoft);color:var(--orange)}
.badge.green{background:var(--greenSoft);color:var(--green)}
.badge.tint{background:var(--tintSoft);color:var(--tint)}

/* ============================================================ controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:50px;padding:0 22px;border-radius:999px;border:0;
  font:600 1.0625rem/1 var(--font);background:var(--fill);color:var(--tint);
  transition:transform .15s var(--spring),filter .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--tint);color:var(--onTint)}
.btn.block{width:100%}
.btn.red{color:var(--red)}
.btns{display:flex;gap:10px;margin-top:16px}
.btns .btn{flex:1}

.seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--fill);
  margin:0 0 20px;overflow-x:auto;scrollbar-width:none;position:relative}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-height:44px;padding:0 16px;border:0;border-radius:999px;background:none;
  font:500 .9rem/1 var(--font);color:var(--label);white-space:nowrap;
  transition:background-color .2s,box-shadow .2s}
.seg button.on{background:var(--segOn);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.14),inset 0 0 0 .5px var(--glassEdge)}

/* фильтр-капсулы, прокручиваются вбок */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 20px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:0;
  background:var(--card);font:500 .9rem/1 var(--font);display:inline-flex;align-items:center;gap:7px;
  box-shadow:inset 0 0 0 1px var(--sep)}
.chips button.on{background:var(--label);color:var(--bg);box-shadow:none}
.chips .dot{width:8px;height:8px;border-radius:50%}

/* поля в строках: подпись слева, значение справа, как в «Настройках» */
.field{display:flex;align-items:center;gap:12px;min-height:48px;padding:4px 16px;position:relative}
.field+.field::before,.row+.field::before,.field+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.field>label{flex:none;font-size:1rem;color:var(--label);min-width:7.5em}
.field input,.field select{flex:1;min-width:0;min-height:44px;border:0;background:none;
  text-align:right;font-size:1rem;color:var(--label2);padding:0;-webkit-appearance:none;appearance:none}
.field input::placeholder{color:var(--label3)}
.field input:focus,.field select:focus{outline:none;color:var(--tint)}
.field select{text-align:right;text-align-last:right;cursor:pointer}
.field.stack{flex-direction:column;align-items:stretch;gap:2px;padding:10px 16px}
.field.stack>label{font-size:.82rem;color:var(--label2)}
.field.stack input,.field.stack textarea{text-align:left;color:var(--label)}
.field textarea{width:100%;min-height:72px;border:0;background:none;resize:vertical;padding:4px 0;
  font-size:1rem;color:var(--label)}
.field textarea:focus{outline:none}
.field input[readonly]{color:var(--label2)}

/* iOS-переключатель */
.switch{position:relative;flex:none;width:51px;height:31px;border-radius:999px;background:var(--fill);
  transition:background-color .25s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18);transition:transform .3s var(--spring)}
.on>.switch{background:var(--green)}.on>.switch::after{transform:translateX(20px)}

/* ============================================================ tab bar
   Плавающая стеклянная капсула под большим пальцем. Выбранная вкладка —
   светлая «капля» под значком; она перетекает между вкладками. */
nav#nav{position:fixed;z-index:50;left:50%;bottom:calc(var(--safe-b) + 10px);transform:translateX(-50%);
  width:min(calc(100% - 24px),460px);height:64px;border-radius:999px;padding:6px;
  display:flex}
nav#nav .drop{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 5);
  border-radius:999px;background:var(--fill);transform:translateX(calc(var(--ti,0) * 100%));
  transition:transform .45s var(--spring)}
nav#nav button.tab{position:relative;flex:1;border:0;background:none;border-radius:999px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font:600 .66rem/1 var(--font);color:var(--label);letter-spacing:0;min-width:0}
nav#nav button.tab svg{width:1.45rem;height:1.45rem}
nav#nav button.tab.on{color:var(--tint)}
nav#nav .nb{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;
  border-radius:9px;background:var(--red);color:#fff;font:700 .68rem/18px var(--rounded);text-align:center}
nav#nav .side-only{display:none}

/* ============================================================ home widgets */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:var(--r-group);padding:14px 14px 13px;border:0;text-align:left;
  display:flex;flex-direction:column;gap:2px;min-height:96px;color:inherit;transition:transform .15s var(--spring)}
button.tile:active{transform:scale(.97)}
.tile .k{font:600 .78rem/1.2 var(--font);color:var(--label2);display:flex;align-items:center;gap:6px}
.tile .k svg{width:1rem;height:1rem;stroke-width:2}
.tile .v{font:600 1.9rem/1.1 var(--rounded);letter-spacing:-.02em;margin-top:auto}
.tile .s{font-size:.76rem;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.wide{grid-column:1 / -1;min-height:0}
.tiles.fit{grid-template-columns:repeat(2,1fr)}
.tile.wide .v{font-size:1.6rem}
.tile.alert .v,.tile.alert .k{color:var(--red)}

/* ============================================================ bike cards */
.bikes{display:grid;grid-template-columns:1fr;gap:14px}
.bikecard{position:relative;background:var(--card);border-radius:var(--r-card);overflow:hidden;
  transition:transform .18s var(--spring)}
.bikecard:has(.cardlink:active){transform:scale(.985)}
.cardlink{position:absolute;inset:0;z-index:2;border:0;background:none;border-radius:inherit;padding:0}
.shot{position:relative;display:block;aspect-ratio:16/10;overflow:hidden;background:var(--card2)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.field-art{position:absolute;inset:0}
.ghost{position:absolute;left:18px;right:18px;bottom:16px;font:800 1.9rem/.95 var(--display);
  letter-spacing:-.04em;text-transform:uppercase;color:color-mix(in srgb,var(--label) 13%,transparent)}
.bikecard.sold .shot{filter:grayscale(.8) brightness(.9)}
.binfo{display:flex;align-items:center;gap:12px;padding:14px 16px 15px}
.binfo .txt{flex:1;min-width:0}
.bnm{display:block;font:600 1.12rem/1.25 var(--font);letter-spacing:-.015em}
.bmt{display:block;font-size:.84rem;color:var(--label2);margin-top:2px}
.bfoot{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.bfoot:empty{display:none}
.binfo .chev{width:.6rem;height:1rem;color:var(--label3);flex:none}
/* кнопка фото лежит над ссылкой карточки: нажатие на неё открывает выбор
   файла, а не велосипед */
.photo-btn{position:absolute;z-index:3;top:12px;right:12px;min-height:44px;padding:0 14px 0 11px;
  border-radius:999px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  font:600 .84rem/1 var(--font);color:var(--label)}
.photo-btn svg{width:1.1rem;height:1.1rem}
.photo-btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ============================================================ bike detail */
.dhero{position:relative;border-radius:var(--r-card);overflow:hidden;background:var(--card2);aspect-ratio:4/3;max-height:62vh;width:100%}
.dhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dhero .ghost{font-size:2.6rem;bottom:22px}
.dhero .photo-btn{min-height:44px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--card);border-radius:18px;padding:12px 13px}
.stat .k{font-size:.74rem;color:var(--label2);font-weight:600}
.stat .v{font:600 1.25rem/1.2 var(--rounded);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:.72rem;font-weight:500;color:var(--label2)}
.spec-sub{display:block;font-family:var(--mono);font-size:.78rem;color:var(--label2);margin-top:3px;letter-spacing:-.02em;word-break:break-word}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;
  font-weight:600;background:var(--card2)}

/* ============================================================ progress */
.ring{width:84px;height:84px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .tr{stroke:var(--fill)}
.ring .pr{stroke:var(--tint);transition:stroke-dashoffset 1s var(--ease)}
.bar{display:block;height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--tint);transition:width .8s var(--ease)}
.brow{padding:12px 16px;position:relative}
.brow+.brow::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.brow .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.brow .l{font-size:.96rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .r{font:600 .96rem/1 var(--rounded);white-space:nowrap}
.brow .s{font-size:.78rem;color:var(--label2);margin-top:2px}
.bighero{padding:18px 16px}
.bighero .k{font-size:.82rem;color:var(--label2);font-weight:600}
.bighero .v{font:600 2.4rem/1.1 var(--rounded);letter-spacing:-.03em;margin-top:4px}
.bighero .s{font-size:.82rem;color:var(--label2);margin-top:4px}

/* ============================================================ checklist
   Как в «Напоминаниях»: пустой круг, при отметке заливается и рисует галочку. */
.check{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;min-height:52px;width:100%;
  border:0;background:none;text-align:left;position:relative;color:inherit}
.check+.check::before{content:"";position:absolute;top:0;left:52px;right:0;height:1px;background:var(--sep)}
.check .circ{width:24px;height:24px;border-radius:50%;flex:none;margin-top:0;
  box-shadow:inset 0 0 0 2px var(--label3);display:grid;place-items:center;
  transition:background-color .2s,box-shadow .2s,transform .25s var(--spring)}
.check .circ svg{width:14px;height:14px;fill:none;stroke:var(--onTint);stroke-width:3;stroke-linecap:round;
  stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24}
.check.done .circ{background:var(--tint);box-shadow:none}
.check.done .circ svg{stroke-dashoffset:0;transition:stroke-dashoffset .3s .08s var(--ease)}
button.check:active .circ{transform:scale(.88)}
.check .nm{display:block;font-size:1rem;line-height:1.3}
.check.done .nm{color:var(--label2)}
.check .dt{display:block;font-size:.82rem;color:var(--label2);margin-top:2px}
.check .note{display:block;font-size:.8rem;color:var(--label2);margin-top:6px;padding-left:10px;
  border-left:2px solid var(--sep);line-height:1.45}
.check .pr{margin-left:auto;padding-left:8px;text-align:right;font:600 .9rem/1.2 var(--rounded);white-space:nowrap;flex:none}
.check .pr small{display:block;font:400 .72rem/1.3 var(--font);color:var(--label2);white-space:normal;max-width:9em}

/* ============================================================ disclosure */
details>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 16px;min-height:48px;cursor:pointer;position:relative}
details>summary::-webkit-details-marker{display:none}
details>summary .chev{width:.7rem;height:.7rem;color:var(--tint);transition:transform .25s var(--spring);flex:none}
details[open]>summary .chev{transform:rotate(90deg)}
details{position:relative}
.dbody{padding:0 16px 14px}

/* ============================================================ tables
   Широкие таблицы «Выбора» прокручиваются вбок сами, страница — нет. */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:11px 12px;white-space:nowrap;border-bottom:1px solid var(--sep)}
th{font:600 .74rem/1.2 var(--font);color:var(--label2);background:var(--card2)}
td.n,th.n{text-align:right;font-family:var(--rounded);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:240px}
th:first-child,td:first-child{position:sticky;left:0;background:var(--card);z-index:1}
th:first-child{background:var(--card2)}
.rank{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;
  background:var(--tint);color:var(--onTint);font:700 .7rem/1 var(--rounded);margin-right:7px}
.dots{display:block;letter-spacing:1px;font-size:.55rem;color:var(--tint);margin-top:2px}
.strbar{height:6px;border-radius:3px;margin:12px 4px 4px;background:linear-gradient(90deg,var(--red),var(--orange),var(--green))}
ul.pm{margin:10px 0 0;padding:0;list-style:none}
ul.pm li{position:relative;padding-left:18px;margin-bottom:6px;font-size:.88rem;line-height:1.45;color:var(--label2)}
ul.pm li::before{position:absolute;left:0;top:0;font-weight:700}
ul.pm li.p::before{content:"+";color:var(--green)}ul.pm li.m::before{content:"–";color:var(--red)}
.note-box{background:var(--orangeSoft);border-radius:var(--r-group);padding:14px 16px;font-size:.9rem;line-height:1.5}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
.card-t{font:700 1.1rem/1.25 var(--font);letter-spacing:-.015em;margin-top:8px}
.muted{color:var(--label2);font-size:.9rem;line-height:1.5}

/* ============================================================ sheet
   Шторка снизу с «ручкой», на широком экране — окно по центру. */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet>.body{width:100%;max-width:620px;max-height:calc(100% - var(--safe-t) - 12px);overflow-y:auto;
  overscroll-behavior:contain;background:var(--bg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  padding:0 calc(var(--safe-r) + 16px) calc(var(--safe-b) + 24px) calc(var(--safe-l) + 16px);
  transform:translateY(40px);transition:transform .45s var(--spring);box-shadow:var(--shadow)}
.sheet.on>.body{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);opacity:.5;margin:8px auto 4px}
.shead{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:8px;margin:0 -16px 14px;padding:4px 8px 8px;background:var(--bg)}
.shead h3{margin:0;font:600 1.0625rem/1.25 var(--font);text-align:center;max-width:15em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead>span{display:flex}.shead>span:last-child{justify-content:flex-end}
.shead .l,.shead .r{border:0;background:none;min-height:44px;padding:0 8px;font-size:1.0625rem;color:var(--tint)}
.shead .l{justify-self:start}.shead .r{justify-self:end;font-weight:600}
.shead .r:disabled{color:var(--label3)}
.lead{margin:0 4px 16px;font-size:.9rem;line-height:1.45;color:var(--label2)}
.err{color:var(--red);font-size:.86rem;min-height:1.2em;margin:8px 16px 0}

/* «Жена mode» — ползунок с тремя положениями */
.wife{background:var(--card);border-radius:var(--r-group);padding:18px 16px 14px}
.wife .q{font:600 1rem/1.3 var(--font)}
.wife input[type=range]{width:100%;margin:18px 0 6px;accent-color:var(--tint);height:44px;cursor:pointer}
.wife .ticks{display:flex;justify-content:space-between;gap:8px;font-size:.76rem;color:var(--label2)}
.wife .ticks span{flex:1;text-align:center}.wife .ticks span:first-child{text-align:left}.wife .ticks span:last-child{text-align:right}
.wife .ticks span.on{color:var(--label);font-weight:600}
.wife .res{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--sep)}
.wife .res .e{font-size:2rem;line-height:1;transition:transform .35s var(--spring)}
.wife .res b{display:block;font-size:1rem}
.wife .res span{display:block;font-size:.84rem;color:var(--label2);margin-top:2px}

.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 88px);z-index:99;transform:translate(-50%,16px);
  opacity:0;pointer-events:none;padding:12px 18px;border-radius:999px;font:600 .9rem/1.3 var(--font);
  max-width:calc(100% - 40px);text-align:center;color:var(--label);transition:opacity .2s,transform .35s var(--spring)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ============================================================ motion */
.view.swap{animation:swapin .42s var(--spring) both}
@keyframes swapin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(12px)}
.reveal.in{opacity:1;transform:none;transition:opacity .45s ease,transform .5s var(--spring)}
::view-transition-old(scene){display:none}
::view-transition-new(scene){animation:none}
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s}
@keyframes boot{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.booting .head{animation:boot .6s var(--spring) both}
.booting .panel{animation:boot .7s var(--spring) .08s both}
.booting nav#nav{animation:boot .6s var(--spring) .18s both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
}

/* ============================================================ wide screens
   Под курсор, а не под палец: вкладки уходят в плавающую боковую панель
   слева, как в iPadOS и macOS; карточки раскладываются в сетку. */
@media (min-width:720px){
  .bikes,.cards{grid-template-columns:repeat(2,1fr)}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .tile.wide{grid-column:auto}
  .tile.wide .v{font-size:1.9rem}
  .tiles.fit{grid-template-columns:repeat(4,1fr)}
  .sheet{align-items:center}
  .sheet>.body{border-radius:var(--r-sheet);max-height:86vh;padding-bottom:24px}
  .grab{display:none}
  .shead{padding-top:12px}
}
@media (min-width:1024px){
  :root{--side:284px;--scene-h:330px}
  nav#nav{left:12px;top:12px;bottom:12px;transform:none;width:260px;height:auto;
    border-radius:28px;flex-direction:column;padding:14px 10px}
  nav#nav .drop{display:none}
  nav#nav .side-only{display:block}
  nav#nav .brand{padding:10px 12px 14px;font:700 1.35rem/1.1 var(--display);letter-spacing:-.02em}
  nav#nav .brand small{display:block;font:500 .78rem/1.3 var(--font);color:var(--label2);margin-top:4px;letter-spacing:0}
  nav#nav button.tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:44px;
    padding:0 12px;font:500 1rem/1 var(--font);border-radius:12px;color:var(--label)}
  nav#nav button.tab svg{width:1.3rem;height:1.3rem;color:var(--tint)}
  nav#nav button.tab.on{background:var(--fill);color:var(--label);font-weight:600}
  nav#nav button.tab:hover{background:var(--fill)}
  nav#nav .nb{position:static;margin-left:auto}
  nav#nav .sidefoot{margin-top:auto;border-top:1px solid var(--sep);padding-top:10px}
  nav#nav .sidefoot .tab svg{color:var(--label2)}
  nav#nav .state{padding:6px 12px 0;font-size:.76rem;color:var(--label2)}
  nav#nav .keys{padding:4px 12px 2px;font-size:.72rem;color:var(--label3)}
  #prof{display:none}
  .head{padding-top:calc(var(--safe-t) + 70px);padding-left:40px;padding-right:40px}
  h1{font-size:2.6rem}
  .wrap{padding:28px 40px 40px}
  main{margin-left:var(--side);padding-bottom:40px}
  .toast{left:calc(50% + var(--side) / 2);bottom:28px}
  .bikes{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-items:start}
  .cols>.sec{margin-top:30px}
}
@media (min-width:1500px){.cols.three{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<div id="scene-slot"></div>

<div id="bar">
  <button id="back" class="barbtn glass" hidden data-back="1" aria-label="Назад в гараж">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Гараж</span>
  </button>
  <span id="bartitle" aria-hidden="true"></span>
  <button id="prof" class="barbtn glass" data-sheet="1" aria-label="Профиль и настройки">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.9-3.6 3.8-5.6 7.2-5.6s6.3 2 7.2 5.6"/></svg>
    <span id="sdot" class="off"></span>
  </button>
</div>

<main>
  <div class="head">
    <h1 id="h1">Гараж</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="panel">
    <div class="wrap">
      <div class="view on" id="v-garage"></div>
      <div class="view" id="v-service"></div>
      <div class="view" id="v-money"></div>
      <div class="view" id="v-frames"></div>
      <div class="view" id="v-build"></div>
    </div>
  </div>
</main>

<nav id="nav" class="glass" aria-label="Разделы"></nav>

чок, влезает пуховка","MyO даёт выбрать длину выноса при заказе — фит настраивается на заводе"],"minus":["STR 1,483 — на 1,5 см ниже, чем Giant. Нужны 15–20 мм проставок","Тесты отмечают жёсткий перед на разбитых спусках"]},{"tag":"Лучший фит, худший статус","kind":"val","title":"Giant Revolt Advanced 0 ML · Snow Drift","meta":"$3 950 · ~9,0 кг · пафос 4/10","plus":["STR 1,540 — попадает в endurance-зону без проставок","BB drop 80 мм + флип-чип: перья 435 мм и полные 53 мм резины в «long»","D-Fuse руль и подседел гасят вибрацию без подвижных частей","Дешевле всех вдвое — остаётся бюджет на группу и колёса"],"minus":["Пафос на дне: Giant никто не считает статусным брендом","Рама Advanced-grade, механика GRX, несовместим с задником SRAM XPLR"]},{"tag":"Максимальный статус","kind":"","title":"ENVE MOG 56 · Aspen White","meta":"$11 250 · рама 950 г · пафос 10/10","plus":["Единственный бутиковый бренд с белым и бардачком в каталоге","Полукастомная сборка: вынос, руль, шатуны, ширина седла — всё под тебя","T47, три разных выноса вилки по размерам — инженерия на уровне"],"minus":["STR 1,479, перья 420, база 1042 — это рейсовая геометрия, не endurance","Втрое дороже Giant за велосипед, который хуже подходит под задачу"]}],"fitNotes":[{"b":"Giant: бери ML, не L.","t":"Сетка Giant даёт для 180 см оба варианта (ML 174–186, L 179–191), но L со stack 616 и reach 397 — это уже под рост 184+. ML со standover 774 мм оставляет 60 мм запаса при твоём inseam."},{"b":"Orbea: бери L, не M.","t":"M со stack 580 и подседом 74° сядет слишком по-рейсовому. L даёт stack 602 — те же цифры, что у Giant ML, только reach на 15 мм длиннее. Компенсируется выносом на 10 мм короче, который Orbea поставит с завода через MyO."},{"b":"Проставки решают 20 мм, не больше.","t":"Разница между Orbea L и Giant ML по посадке — примерно 15 мм высоты руля. Это ровно та величина, которая закрывается стеком проставок без уродства. Разница с Revolt Advanced SL (45 мм) — уже не закрывается ничем."},{"b":"Высота сед <script>
"use strict";
/* ============================================================ data */
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const BIKES = DATA.bikes, RULES = DATA.maintenance, FRAMES = DATA.frames, CHECKLISTS = DATA.checklists;
const CHOICE = DATA.choice;
const BIKE = Object.fromEntries(BIKES.map(b => [b.id, b]));
const RULE = Object.fromEntries(RULES.map(r => [r.id, r]));
const CATS = {
  drivetrain:  {label:'Трансмиссия'},
  brakes:      {label:'Тормоза'},
  wheels:      {label:'Колёса'},
  suspension:  {label:'Подвеска'},
  consumables: {label:'Расходники'}
};
const EMOJI = {'гравий':'🚵','МТБ хардтейл':'⛰️','детский':'🧒'};
/* one hue per bike, fixed, never reused for anything else */
const HUE = id => 'var(--b' + (BIKE[id] ? BIKE[id].colorSlot : 1) + ')';
const SHORT = (() => {
  const first = {};
  for (const b of BIKES) first[b.name.split(' ')[0]] = (first[b.name.split(' ')[0]] || 0) + 1;
  return Object.fromEntries(BIKES.map(b => {
    const w = b.name.split(' ');
    return [b.id, first[w[0]] > 1 ? (w[1] || w[0]) : w[0]];
  }));
})();

/* ============================================================ utils */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Цены скрыты по умолчанию. Всё денежное в интерфейсе форматируется здесь,
   поэтому переключается одним флагом и ни одна цифра не проскакивает мимо. */
let SHOWMONEY = localStorage.getItem('bikes:money') === '1';


const rub = n => !SHOWMONEY ? '—'
  : (n==null ? '—' : Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ') + ' ₽');
function toggleMoney() {
  SHOWMONEY = !SHOWMONEY;
  localStorage.setItem('bikes:money', SHOWMONEY ? '1' : '0');
  render();
}
const km  = n => (n==null ? '—' : Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ') + ' км');
const slug = s => String(s).toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,48);
const uid = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const YEAR = new Date().getFullYear();
/* Народная единица измерения. Только для крупных сумм, и только шёпотом. */
const SHAVA = 350;
const shavas = n => (SHOWMONEY && n >= SHAVA * 20) ? ` — это ${Math.round(n/SHAVA)} шаверм` : '';

/* ============================================================ storage */
const LS = 'bikes:v1';
/* Адрес хранилища зашит: гость открывает ссылку и сразу видит данные,
   ничего не настраивая. Токен появляется только после входа по паролю. */
// Свой сервер отдаёт и страницу, и данные — один источник, никакого CORS.
// Cloudflare пришлось оставить: зона workers.dev в России заблокирована,
// и синхронизация работала только через VPN.
const API = '/api';
const TOK_KEY = 'bikes:token';
const blankDoc = () => ({ v:1, mtime:0, odo:{}, annualKm:{}, ownership:{}, parts:{},
                          events:[], checks:{}, photos:{}, migratedAt:null });

let local = { rev:0, doc:blankDoc(), dirty:false, lastSync:null };
try {
  const raw = localStorage.getItem(LS);
  if (raw) { const p = JSON.parse(raw); local = Object.assign(local, p); local.doc = sanitizeDoc(p.doc); }
} catch(e) { /* corrupt cache — start blank, the cloud copy and seed refill it */ }

const DOC = () => local.doc;

/* Документ приходит из облака и из файла резервной копии. Файл пользователь
   может получить откуда угодно, поэтому это недоверенный ввод: числа делаем
   числами, строки — строками, а фото пускаем только как картинку в data:.
   Экранирование при выводе остаётся первой линией; это вторая. */
function sanitizeDoc(d) {
  const str = v => typeof v === 'string' ? v.slice(0, 2000) : (v == null ? null : String(v).slice(0, 2000));
  const num = v => { const n = Number(v); return Number.isFinite(n) ? n : null; };
  const out = blankDoc();
  out.mtime = num(d && d.mtime) || 0;
  out.migratedAt = str(d && d.migratedAt);
  for (const k of ['odo', 'annualKm'])
    for (const [id, v] of Object.entries((d && d[k]) || {})) {
      const n = num(v); if (n != null) out[k][id] = n;
    }
  for (const [id, o] of Object.entries((d && d.ownership) || {}))
    if (o && typeof o === 'object') out.ownership[id] = {
      state: o.state === 'sold' ? 'sold' : 'owned',
      soldDate: str(o.soldDate), soldPrice: num(o.soldPrice)
    };
  for (const [id, v] of Object.entries((d && d.photos) || {}))
    if (typeof v === 'string' && /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]*$/.test(v))
      out.photos[id] = v;
  for (const [bid, map] of Object.entries((d && d.parts) || {})) {
    if (!map || typeof map !== 'object') continue;
    out.parts[bid] = {};
    for (const [pid, o] of Object.entries(map))
      if (o && typeof o === 'object') out.parts[bid][pid] = {
        group: str(o.group), part: str(o.part), spec: str(o.spec),
        purchasePrice: num(o.purchasePrice),
        added: !!o.added, deleted: !!o.deleted
      };
  }
  for (const [key, map] of Object.entries((d && d.checks) || {})) {
    if (!map || typeof map !== 'object') continue;
    out.checks[key] = {};
    for (const [k, v] of Object.entries(map)) out.checks[key][k] = v ? 1 : 0;
  }
  for (const e of (d && d.events) || []) {
    if (!e || typeof e !== 'object' || !e.id) continue;
    out.events.push({
      id: String(e.id).slice(0, 64), mtime: num(e.mtime) || 0,
      bike: str(e.bike), rule: str(e.rule), category: str(e.category),
      date: str(e.date), odo: num(e.odo),
      part: str(e.part), partCost: num(e.partCost) || 0, labourCost: num(e.labourCost) || 0,
      place: str(e.place), note: str(e.note), deleted: !!e.deleted
    });
  }
  return out;
}

function persist(markDirty) {
  if (markDirty !== false) { local.dirty = true; local.doc.mtime = Date.now(); }
  if (!EDITOR) local.dirty = false;        // гость ничего не отправляет на сервер
  try { localStorage.setItem(LS, JSON.stringify(local)); }
  catch(e) { toast('Не хватило места в браузере — уменьшите число фото'); }
  paintSync();
}

function stableId(groupName, itemName){ return slug(groupName) + '/' + slug(itemName); }

/* R1 — positional "gi-ii" ticks resolve only against the UNMODIFIED arrays, so
   this runs before anything touches content. Old keys stay as the only rollback. */
function migrateChecks() {
  if (DOC().migratedAt) return 0;
  let n = 0;
  for (const [key, groups] of Object.entries(CHECKLISTS)) {
    let old = {};
    try { old = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) { old = {}; }
    const map = DOC().checks[key] || (DOC().checks[key] = {});
    groups.forEach((g, gi) => g.items.forEach((it, ii) => {
      if (old[gi + '-' + ii]) { map[stableId(g.g, it.n)] = 1; n++; }
    }));
  }
  DOC().migratedAt = new Date().toISOString();
  persist(n > 0);   // nothing migrated => no fresh mtime, or an empty doc outranks the cloud
  return n;
}

/* Переименования пунктов чек-листа.
   Устойчивый id — это slug(группа)/slug(пункт), поэтому правка текста пункта
   отвязывает поставленную на нём галочку. Каждое переименование записывается
   сюда и переносится при загрузке: сначала переносим, потом уже правим текст.
   Идемпотентно — новый ключ не перезаписывается, старый не удаляется. */
const RENAMES = {
  'speedone-275-checklist-v1': {
    // рама называется Floater, а не Destroyer (уточнено 15.08.2026)
    'куплено-под-этот-проект/рама-speedone-destroyer-27-5':
    'куплено-под-этот-проект/рама-speedone-floater-27-5'
  }
};

function applyRenames() {
  let n = 0;
  for (const [key, map] of Object.entries(RENAMES)) {
    const checks = DOC().checks[key];
    if (!checks) continue;
    for (const [from, to] of Object.entries(map))
      if (checks[from] != null && checks[to] == null) { checks[to] = checks[from]; n++; }
  }
  if (n) persist(true);
  return n;
}

/* R4 — if storage was evicted and we are offline, the committed seed refills history */
function applySeed() {
  const seed = DATA.log || {};
  const d = DOC();
  const have = new Set(d.events.map(e => e.id));
  let n = 0;
  (seed.events || []).forEach(e => { if (!have.has(e.id)) { d.events.push(e); n++; } });
  for (const [k, v] of Object.entries(seed.odo || {})) if (d.odo[k] == null) { d.odo[k] = v; n++; }
  if (n) persist(true);
  return n;
}

/* ============================================================ sync */
let syncTok = localStorage.getItem(TOK_KEY) || '';
let syncState = 'off', syncMsg = '';
let EDITOR = false;                       // право записи приходит с сервера, не из localStorage

function mergeDocs(mine, theirs) {
  const newer = (theirs.mtime || 0) >= (mine.mtime || 0) ? theirs : mine;
  const older = newer === theirs ? mine : theirs;
  const out = Object.assign({}, newer);

  // events: union by id, latest write per id wins (tombstones included, so a
  // delete survives the merge instead of being resurrected by the other side)
  const byId = new Map();
  for (const e of [...(theirs.events||[]), ...(mine.events||[])]) {
    const prev = byId.get(e.id);
    if (!prev || (e.mtime||0) >= (prev.mtime||0)) byId.set(e.id, e);
  }
  out.events = [...byId.values()];

  // Maps merge KEY BY KEY, never wholesale. A device whose storage Safari just
  // evicted boots with empty maps and a fresh mtime — replacing the map wholesale
  // would let it blank out the odometer for every bike in the cloud.
  for (const k of ['odo', 'annualKm', 'photos', 'ownership'])
    out[k] = Object.assign({}, older[k] || {}, newer[k] || {});

  // правки состава сливаются по каждому велосипеду отдельно, иначе правка
  // одного затирала бы правки другого
  out.parts = {};
  for (const id of new Set([...Object.keys(older.parts||{}), ...Object.keys(newer.parts||{})]))
    out.parts[id] = Object.assign({}, (older.parts||{})[id], (newer.parts||{})[id]);

  out.checks = {};
  for (const key of new Set([...Object.keys(older.checks||{}), ...Object.keys(newer.checks||{})]))
    out.checks[key] = Object.assign({}, (older.checks||{})[key], (newer.checks||{})[key]);

  out.migratedAt = mine.migratedAt || theirs.migratedAt || null;
  out.mtime = Math.max(mine.mtime||0, theirs.mtime||0);
  return out;
}

async function pull() {
  const r = await fetch(API + '/doc', syncTok ? { headers:{ 'authorization':'Bearer ' + syncTok } } : undefined);
  if (!r.ok) throw new Error('Сервер ответил ' + r.status);
  const j = await r.json();
  EDITOR = !!j.editor;                    // сервер решает, кто редактор
  return j;
}

async function login(password) {
  const r = await fetch(API + '/login', {
    method:'POST', headers:{ 'content-type':'application/json' },
    body: JSON.stringify({ password })
  });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('Сервер ответил ' + r.status));
  syncTok = j.token;
  localStorage.setItem(TOK_KEY, syncTok);
  EDITOR = true;
  return true;
}

function logout() {
  syncTok = ''; EDITOR = false;
  localStorage.removeItem(TOK_KEY);
  sync(true); render();
}

async function push(rev, doc) {
  const r = await fetch(API + '/doc', {
    method:'PUT',
    headers:{ 'authorization':'Bearer ' + syncTok, 'content-type':'application/json', 'if-match':String(rev) },
    body: JSON.stringify(doc)
  });
  if (r.status === 409) return null;
  if (r.status === 401) { EDITOR = false; throw new Error('Сессия истекла — войдите заново'); }
  if (!r.ok) throw new Error('Сервер ответил ' + r.status);
  return r.json();
}

let syncing = false;
async function sync(silent) {
  if (syncing) return;
  syncing = true; syncState = 'busy'; paintSync();
  try {
    const remote = await pull();
    if (remote.rev !== local.rev || local.dirty) {
      local.doc = remote.doc ? mergeDocs(local.doc, sanitizeDoc(remote.doc)) : local.doc;
      local.rev = remote.rev;
    }
    if (EDITOR && (local.dirty || (remote.doc && JSON.stringify(remote.doc) !== JSON.stringify(local.doc)))) {
      let res = await push(local.rev, local.doc);
      if (res === null) {
        const again = await pull();
        local.doc = mergeDocs(local.doc, again.doc ? sanitizeDoc(again.doc) : blankDoc());
        local.rev = again.rev;
        res = await push(local.rev, local.doc);
        if (res === null) throw new Error('Конфликт записи, попробуйте ещё раз');
      }
      local.rev = res.rev;
    }
    if (EDITOR) local.dirty = false;
    local.lastSync = Date.now(); syncState = 'on'; syncMsg = '';
    try { localStorage.setItem(LS, JSON.stringify(local)); } catch(e){}
    render();
  } catch (err) {
    syncState = 'err'; syncMsg = err.message;
    if (!silent) toast(err.message);
  } finally {
    syncing = false; paintSync();
  }
}

function paintSync() {
  const dot = $('sdot');
  if (dot) dot.className = !EDITOR ? 'off' : syncState === 'busy' ? '' : syncState === 'err' ? 'err'
                         : local.dirty ? 'dirty' : 'on';
  for (const id of ['navstate', 's-state']) { const el = $(id); if (el) el.textContent = syncLine(); }
  const p = $('prof'); if (p) p.setAttribute('aria-label', EDITOR ? 'Профиль: ' + syncLine() : 'Войти');
}


function syncLine() {
  if (!EDITOR) return 'Режим просмотра';
  if (syncState === 'busy') return 'Синхронизирую…';
  if (syncState === 'err') return syncMsg || 'Ошибка синхронизации';
  if (local.dirty) return 'Есть несохранённые изменения';
  const ago = local.lastSync ? Math.round((Date.now() - local.lastSync)/60000) : null;
  return ago == null ? 'Синхронизировано'
    : ago < 1 ? 'Синхронизировано только что'
    : ago < 60 ? 'Синхронизировано ' + ago + ' мин назад'
    : 'Синхронизировано ' + Math.round(ago/60) + ' ч назад';
}

/* ============================================================ aggregation */
const evCost = e => (Number(e.partCost)||0) + (Number(e.labourCost)||0);
const liveEvents = () => DOC().events.filter(e => !e.deleted);
const eventsOf = (bikeId, year) => liveEvents().filter(e =>
  (!bikeId || e.bike === bikeId) && (!year || Number(e.date.slice(0,4)) === year));

/* Ownership: the static file carries the baseline, the synced doc carries the
   user's edits (sale date and price). A sold bike keeps its spend history but
   drops out of maintenance and forecasting — you do not service what you sold. */
function ownershipOf(id) {
  const o = (DOC().ownership || {})[id] || {};
  const base = (BIKE[id] && BIKE[id].ownership) || 'owned';
  return { state: o.state || base, soldDate: o.soldDate || null,
           soldPrice: o.soldPrice == null ? null : Number(o.soldPrice) };
}
const isOwned = id => ownershipOf(id).state === 'owned';
const ownedBikes = () => BIKES.filter(b => isOwned(b.id));
const soldBikes  = () => BIKES.filter(b => !isOwned(b.id));

function yearCost(bikeId, year){ return eventsOf(bikeId, year).reduce((s,e)=>s+evCost(e), 0); }

function categorySplit(bikeId, year) {
  const out = {};
  for (const k of Object.keys(CATS)) out[k] = 0;
  for (const e of eventsOf(bikeId, year)) {
    const c = e.category || (RULE[e.rule] && RULE[e.rule].category) || 'consumables';
    out[c] = (out[c] || 0) + evCost(e);
  }
  return out;
}

/* null, never 0 or Infinity, when the odometer is unset — an unknown ratio is
   not a cheap one. */
function costPerKm(bikeId, year) {
  const odo = Number(DOC().odo[bikeId]);
  if (!odo || odo <= 0) return null;
  return yearCost(bikeId, year) / odo;
}

/* Состав живёт в двух слоях: неизменяемый сид в bikes.json и правки владельца
   в синхронизируемом документе. Ключ — стабильный id детали, а не её название,
   поэтому переименование не рвёт привязку. */
function componentsOf(bikeId) {
  const over = (DOC().parts || {})[bikeId] || {};
  const out = [];
  for (const c of (BIKE[bikeId] && BIKE[bikeId].components) || []) {
    const o = over[c.id];
    if (o && o.deleted) continue;
    out.push(o ? Object.assign({}, c, o) : c);
  }
  for (const [id, o] of Object.entries(over))
    if (o && o.added && !o.deleted) out.push(Object.assign({ id }, o));
  return out;
}

function purchaseTotal(bikeId){
  const b = BIKE[bikeId];
  const list = componentsOf(bikeId);
  const items = list.reduce((s,c)=>s+(Number(c.purchasePrice)||0), 0);
  // велосипед, купленный целиком, не расписан по позициям — у него только сумма
  return items || Number(b.totalSpend) || 0;
}

/* what the bike actually cost: everything put in, minus what it sold for */
function netCost(bikeId) {
  const sold = ownershipOf(bikeId).soldPrice;
  return purchaseTotal(bikeId) + eventsOf(bikeId).reduce((s,e)=>s+evCost(e), 0) - (sold || 0);
}

function forecast(bikeId) {
  if (!isOwned(bikeId)) return [];
  const annual = Number(DOC().annualKm[bikeId]) || 0;
  const rows = [];
  for (const r of RULES) {
    if (!r.bikes.includes(bikeId)) continue;
    const last = eventsOf(bikeId).filter(e => e.rule === r.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    // "каждые N км или M месяцев — что наступит раньше" = whichever trigger fires
    // more often over a year. Backlog already accrued is not a recurring cost.
    const perYear = Math.max(12 / r.interval_months, annual ? annual / r.interval_km : 0);
    const unit = defaultPartCost(bikeId, r) + (Number(r.est_labour_cost) || 0);
    rows.push({ rule:r, times:perYear, cost:perYear * unit, unit, last });
  }
  return rows.sort((a,b)=>b.cost-a.cost);
}

function matchComponent(bikeId, rule) {
  const b = BIKE[bikeId]; if (!b || !rule.part_keywords || !rule.part_keywords.length) return null;
  const list = componentsOf(bikeId);
  for (const kw of rule.part_keywords) {
    const hit = list.find(c => (c.part||'').toLowerCase().includes(kw.toLowerCase()));
    if (hit && hit.purchasePrice) return hit;
  }
  return null;
}

/* A rule with est_part_cost 0 consumes no part — it is an inspection or an
   adjustment. It must never inherit the price of the component it inspects,
   or a headset check gets billed at the price of the frameset. */
function defaultPartCost(bikeId, rule) {
  if (!Number(rule.est_part_cost)) return 0;
  const c = matchComponent(bikeId, rule);
  return c ? Number(c.purchasePrice) : Number(rule.est_part_cost);
}

function dueStatus(bikeId, rule) {
  const odo = Number(DOC().odo[bikeId]);
  const last = eventsOf(bikeId).filter(e => e.rule === rule.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if (!last) return { state:'unknown', text:'нет записей' };
  const lastOdo = Number(last.odo);
  const months = (Date.now() - new Date(last.date).getTime()) / (1000*60*60*24*30.44);
  const byMon = months / rule.interval_months;
  const byKm  = (odo && lastOdo != null) ? (odo - lastOdo) / rule.interval_km : 0;
  const p = Math.max(byMon, byKm);
  const left = (odo && lastOdo != null) ? Math.round(rule.interval_km - (odo - lastOdo)) : null;
  if (p >= 1) return { state:'due',  text:'пора', p, left };
  if (p >= .8) return { state:'soon', text:'скоро', p, left };
  return { state:'ok', text:'в норме', p, left };
}

/* everything that wants doing, worst first — this drives the home screen */
function attention() {
  const out = [];
  for (const b of ownedBikes())
    for (const r of RULES) {
      if (!r.bikes.includes(b.id)) continue;
      const st = dueStatus(b.id, r);
      if (st.state === 'due' || st.state === 'soon') out.push({ bike:b, rule:r, st });
    }
  return out.sort((a,b) => (a.st.state === b.st.state) ? b.st.p - a.st.p
                          : a.st.state === 'due' ? -1 : 1);
}

/* ============================================================ charts
   Colour encodes the BIKE everywhere — it is this app's entity. Magnitude
   comparisons that are not per-bike use one hue and length, plus a value label
   on every bar and a table underneath. */
function barRows(rows) {
  const max = Math.max(1, ...rows.map(r => r.value));
  return rows.map(r => `<div class="brow">
      <div class="top"><span class="l">${esc(r.label)}</span><span class="r">${esc(r.text)}</span></div>
      ${r.sub ? `<div class="s">${esc(r.sub)}</div>` : ''}
      <div class="bar"><i class="fill" style="width:${Math.max(2, r.value/max*100)}%;background:${r.color||'var(--tint)'}"></i></div>
    </div>`).join('');
}

        <path d="M8 12.5c1.6 2.4 4.2 3.4 7.5 2.4" stroke="#6b6a1d" stroke-width="1.3" fill="none" stroke-linecap="round"/>

        <path d="M12 5.8c.6-1.2 1.8-1.9 3.2-1.8" stroke="#2a2a18" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M9 18l-.4 2.6M11.4 17.6l-.2 2.8" stroke="#3a3520" stroke-width="1.1" stroke-linecap="round"/>
