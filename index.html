<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0c">
<meta name="description" content="Парк велосипедов: состав, регламент ТО, затраты, обзор гравийных рам 2027 и чек-листы сборки">
<title>Гараж — велосипеды, ТО и затраты</title>
<style>
/* ============================================================ tokens
   Dark is the primary look; light is a courtesy for daylight. Bike identity
   colours are the validated categorical slots — one hue per bike, never cycled,
   never reused for anything else. */
:root{
  color-scheme: dark;
  --bg:#0a0a0c;
  --surface:#141417;
  --surface2:#1c1c21;
  --line:#26262c;
  --line2:#34343d;
  --ink:#f4f4f6;
  --ink2:#9e9ea8;
  --ink3:#6a6a74;
  --accent:#2dd4bf;
  --accent-dim:rgba(45,212,191,.14);
  --danger:#fb7185;
  --danger-dim:rgba(251,113,133,.13);
  --warn:#fbbf24;
  --warn-dim:rgba(251,191,36,.13);
  --ok:#4ade80;
  --ok-dim:rgba(74,222,128,.13);
  --b1:#3987e5; --b2:#d95926; --b3:#199e70; --b4:#c98500; --b5:#d55181;
  --hdr:#0a0a0c;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --r-card:0px; --r-in:0px; --r-ctl:0px;
  --spring:cubic-bezier(.34,1.4,.64,1);
}
@media (prefers-color-scheme: light){
  :root{
    color-scheme: light;
    --bg:#f6f6f7;
    --surface:#ffffff;
    --surface2:#f1f1f3;
    --line:#e5e5e9;
    --line2:#d3d3da;
    --ink:#141417;
    --ink2:#5f5f6b;
    --ink3:#8e8e9a;
    --accent:#0d9488;
    --accent-dim:rgba(13,148,136,.1);
    --danger:#dc2626;
    --danger-dim:rgba(220,38,38,.09);
    --warn:#b45309;
    --warn-dim:rgba(180,83,9,.1);
    --ok:#15803d;
    --ok-dim:rgba(21,128,61,.1);
    --b1:#2a78d6; --b2:#eb6834; --b3:#1baf7a; --b4:#eda100; --b5:#e87ba4;
    --hdr:#f6f6f7;
  }
}
:root{ --mono: ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono","Cascadia Mono",monospace; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
button,a,summary,.it,.att,.kpi,.bikecard,.glyph{touch-action:manipulation;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
/* Две гарнитуры на две роли. Моноширинная — не приём, а язык предмета:
   приложение состоит из артикулов (CS-M8200), пределов износа (1.5 мм),
   интервалов и дат. В моноширинном они выравниваются по разрядам и читаются
   как спецификация, а не как проза. */
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(72px + var(--safe-b));
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;}
.num,.mono{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.lbl{font-family:var(--mono);}
th{font-family:var(--mono);}
.chip{font-family:var(--mono); letter-spacing:-.01em;}
.kpi .k{font-family:var(--mono);}
.glyph .tagname{font-family:var(--mono);}
.tiny .chip{letter-spacing:-.01em;}

/* ============================================================ header */
header{
  position:sticky; top:0; z-index:50; background:var(--hdr);
  border-bottom:1px solid var(--line2);
  padding:calc(var(--safe-t) + 12px) calc(var(--safe-r) + 18px) 12px calc(var(--safe-l) + 18px);
}
.hrow{display:flex; align-items:center; gap:12px;}
h1{margin:0; font-size:24px; font-weight:750; letter-spacing:-.035em; flex:1; min-width:0; text-wrap:balance;
   overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hrow{gap:8px;}
#mbtn{
  flex:none; min-height:44px; padding:0 12px; border:1px solid var(--line2); background:var(--surface);
  cursor:pointer; display:flex; align-items:center; gap:7px; color:var(--ink);
  font-size:13.5px; font-weight:700;
}
#mbtn.on{background:var(--accent); border-color:var(--accent); color:#04201d;}
#mbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
#mbtn:active,#sbtn{
  flex:none; min-height:44px; padding:0 13px; border:1px solid var(--line2); background:var(--surface);
  cursor:pointer; display:flex; align-items:center; gap:8px; position:relative; color:var(--ink);
  font-size:13.5px; font-weight:700;
}
#sbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;}
#sdot{width:8px; height:8px; border-radius:50%; background:var(--ink3); flex:none;}
#sdot.on{background:var(--ok);} #sdot.dirty{background:var(--warn);} #sdot.err{background:var(--danger);}
.sub{margin:2px 0 0; font-size:13.5px; color:var(--ink2);}

/* ============================================================ layout */
main{padding:18px calc(var(--safe-r) + 18px) 28px calc(var(--safe-l) + 18px); max-width:820px; margin:0 auto;}
.view{display:none;} .view.on{display:block;}
/* Подпись раздела — штамп на сервисной карте: моноширинный, разрядка,
   тонкая черта. Раньше это была толстая цветная полоса, спорившая со сценой. */
.lbl{
  font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink2); margin:28px 0 10px; display:flex; align-items:center; gap:9px;
  border-left:2px solid var(--line2); padding-left:10px; line-height:1.6;
}
.lbl:first-child{margin-top:0;}
.lbl .n{ background:var(--surface2); color:var(--ink); padding:1px 7px; font-size:11px; letter-spacing:0; }
.card{background:var(--surface); overflow:hidden;}
.card + .card{margin-top:10px;}
.pad{padding:16px;}
.muted{color:var(--ink2); font-size:14px; line-height:1.5;}
.tiny{color:var(--ink3); font-size:12.5px; line-height:1.45;}
.spread{display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
.hero{font-family:var(--mono); font-size:34px; font-weight:700; letter-spacing:-.045em; line-height:1.05;}
.stack{display:flex; flex-direction:column; gap:10px;}

/* ============================================================ chips */
.chip{
  display:inline-flex; align-items:center; gap:5px; background:var(--surface2);
  color:var(--ink2); padding:3px 8px; font-size:11.5px; font-weight:700;
  white-space:nowrap;
}
.chip.danger{background:var(--danger); color:#20060c;}
.chip.warn{background:var(--warn); color:#231800;}
.chip.ok{background:var(--ok); color:#04210f;}
.chip.accent{background:var(--accent-dim); color:var(--accent);}
.dotc{width:7px;height:7px;border-radius:50%;flex:none;}

/* ============================================================ controls */
.btn{
  min-height:48px; padding:0 18px; border-radius:var(--r-ctl); border:1px solid var(--line2);
  background:var(--surface); color:var(--ink); font-size:15px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:7px; width:100%;
  transition:transform .12s var(--spring);
}
.btn:active{transform:scale(.975);}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#04201d; font-weight:700;}
.btn.sm{min-height:44px; font-size:14px; padding:0 14px; width:auto;}
.btn.ghost{background:none; border-color:var(--line);}
label{display:block; font-size:13px; font-weight:600; color:var(--ink2); margin:16px 0 6px;}
input,select,textarea{
  width:100%; min-height:48px; padding:12px 14px; border:1px solid var(--line2);
  border-radius:var(--r-ctl); background:var(--surface2); -webkit-appearance:none; appearance:none;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent;}
select{
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 19px) 22px,calc(100% - 14px) 22px;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:40px;
}
textarea{min-height:78px; resize:vertical;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.grid2 > div > label{margin-top:16px;}
.seg{
  display:flex; background:var(--surface2); border-radius:var(--r-ctl); padding:3px;
  margin-bottom:16px; overflow-x:auto; scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none;}
.seg button{
  flex:1 0 auto; min-height:44px; border:0; border-radius:9px; background:none; color:var(--ink2);
  font-size:13.5px; font-weight:600; cursor:pointer; padding:0 14px; white-space:nowrap;
}
.seg button.on{background:var(--ink); color:var(--bg);}

/* ============================================================ tabbar */
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex; background:var(--hdr);
  border-top:1px solid var(--line2);
  padding:5px calc(var(--safe-r) + 4px) calc(var(--safe-b) + 5px) calc(var(--safe-l) + 4px);
}
nav button{
  flex:1; min-height:50px; border:0; background:none; cursor:pointer; color:var(--ink3);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:10px; font-weight:600; padding:2px; position:relative;
}
nav button.on{color:var(--accent);}
.navfoot{display:none;}
@media (min-width:900px){ .navfoot{display:block;} }
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
nav .badge{
  position:absolute; top:2px; right:50%; margin-right:-20px; min-width:17px; height:17px;
  border-radius:9px; background:var(--danger); color:#fff; font-size:10.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; padding:0 4px;
}

/* ============================================================ bike card */
.bikecard{
  display:flex; width:100%; border:0; padding:0; background:var(--surface); cursor:pointer;
  text-align:left; overflow:hidden;
  transition:transform .12s var(--spring);
}
.bikecard:active{transform:scale(.985);}
.bar{width:8px; flex:none; align-self:stretch;}
.bikebody{flex:1; min-width:0; padding:15px 16px; display:flex; gap:13px; align-items:center;}
.ph{
  width:54px; height:54px; flex:none; overflow:hidden;
  display:flex; align-items:center; justify-content:center; font-size:23px;
  background:var(--surface2);
}
.ph img{width:100%;height:100%;object-fit:cover;}
.bname{display:block; font-size:16.5px; font-weight:700; letter-spacing:-.015em; line-height:1.25;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bmeta{display:block; font-size:13px; color:var(--ink2); margin-top:3px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bstat{font-size:12.5px; color:var(--ink3); margin-top:5px; display:flex; gap:8px; flex-wrap:wrap;}
.sold .bikebody{opacity:.62;}

/* ============================================================ attention */
.att{display:flex; align-items:center; gap:12px; padding:14px 16px; width:100%;
  border:0; background:none; cursor:pointer; text-align:left; min-height:48px;}
.att + .att{border-top:1px solid var(--line);}
.att .txt{flex:1; min-width:0;}
/* ellipsis needs a block box — a bare inline span just overflows onto the chip */
.att .t1{display:block; font-size:15px; font-weight:600; line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.att .t2{display:block; font-size:12.5px; color:var(--ink2); margin-top:3px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.att .chip{flex:none;}
.att .arw{color:var(--ink3); font-size:19px; flex:none;}
.calm{padding:26px 18px; text-align:center;}
.calm .ic{font-size:30px;}
.calm .t{font-size:15px; font-weight:600; margin-top:8px;}
.calm .s{font-size:13px; color:var(--ink2); margin-top:4px; line-height:1.5;}

/* ============================================================ rows / tables */
.row{display:flex; align-items:center; gap:12px; padding:13px 16px; min-height:48px;}
.row + .row{border-top:1px solid var(--line);}
.row .rl{flex:1; min-width:0;}
.row .rt{font-size:14.5px; line-height:1.3;}
.row .rs{font-size:12.5px; color:var(--ink2); margin-top:2px;}
.att .t2{font-family:var(--mono); letter-spacing:-.01em;}
.row .rv{font-size:14.5px; font-weight:600; text-align:right; white-space:nowrap; flex:none;}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
table{border-collapse:collapse; width:100%; font-size:13px;}
th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
th{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink3); font-weight:700;}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums;}
tr:last-child td{border-bottom:0;}
td.wrap{white-space:normal; min-width:190px;}
.spec tr.gr td{background:var(--surface2); font-weight:800; font-size:11px;
  text-transform:uppercase; letter-spacing:.07em; border-bottom:0;}
.spec tr.tot td{background:var(--ink); color:var(--bg); font-weight:800; border-bottom:0;}
.spec td{vertical-align:top;}
.spec tr.ed{cursor:pointer;}
@media (hover:hover){ .spec tr.ed:hover td{background:var(--surface2);} }

/* ============================================================ charts */
.track{height:10px; background:var(--surface2); overflow:hidden; margin-top:7px;}
.fill{height:100%;}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:12px;}
.legend span{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink2);}
.sw{width:11px;height:11px;flex:none;}

/* ============================================================ disclosure */
details{border-top:1px solid var(--line);}
details:first-of-type{border-top:0;}
summary{
  list-style:none; cursor:pointer; padding:14px 16px; min-height:48px;
  display:flex; align-items:center; gap:11px;
}
summary::-webkit-details-marker{display:none;}
summary .arw{color:var(--ink3); font-size:11px; transition:transform .2s; flex:none;}
details[open] summary .arw{transform:rotate(90deg);}
.dbody{padding:0 16px 16px; }

/* ============================================================ checklist */
.it{display:flex; gap:13px; padding:14px 16px; cursor:pointer; align-items:flex-start; min-height:48px;
  width:100%; border:0; background:none; text-align:left; font:inherit; color:inherit;}
.it + .it{border-top:1px solid var(--line);}
.it .box{
  width:25px;height:25px;border:2px solid var(--line2); flex:none; margin-top:1px;
  display:flex;align-items:center;justify-content:center; transition:.18s var(--spring);
}
.it .box svg{width:15px;height:15px;stroke:#04201d;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
.it.done .box{background:var(--accent); border-color:var(--accent);}
.it.done .box svg{opacity:1;}
.it.done .nm{text-decoration:line-through; color:var(--ink3);}
.it .nm{font-size:15px; line-height:1.3; font-weight:500;}
.it .dt{font-size:13px; color:var(--ink2); margin-top:3px;}
.it .note{font-size:12.5px; color:var(--ink2); margin-top:7px; padding-left:11px;
  border-left:2px solid var(--line2); line-height:1.5;}
.it .pr{margin-left:auto; font-size:13.5px; font-weight:700; text-align:right; white-space:nowrap; flex:none;}
.it .pr small{display:block; font-weight:400; font-size:11px; color:var(--ink3); white-space:normal; max-width:105px;}

/* ============================================================ scene
   Layered flat illustration: sky, clouds, two ridges, a road with the bikes on
   it. Layers drift at different speeds on scroll, which is what makes it read
   as depth rather than as a picture. */
.scene{
  position:relative; height:268px; margin:-18px calc(var(--safe-l) * -1 - 18px) 20px calc(var(--safe-r) * -1 - 18px);
  overflow:hidden; background:linear-gradient(#0c1a2f 0%, #182d49 40%, #2f5279 68%, #20395c 100%);
  border-bottom:1px solid var(--line);
}
@media (prefers-color-scheme: light){
  .scene{background:linear-gradient(#7fb4e2 0%, #a8d0ea 42%, #d9ecf8 70%, #c2dff0 100%);}
}
.scene .layer{position:absolute; left:0; right:0; will-change:transform;}
.sunpath{position:absolute; top:0; left:0; width:100%; height:150px; pointer-events:none;}
.sun{
  position:absolute; width:42px; height:42px; border-radius:50%;
  background:#f6d365; box-shadow:0 0 34px 12px rgba(246,211,101,.28); opacity:.92;
  animation:sunride 150s linear infinite;
}
/* восход слева, зенит по центру, закат справа — один медленный проход */
@keyframes sunride{
  0%  { left:-9%;  top:104px; }
  25% { top:40px; }
  50% { left:47%;  top:16px; }
  75% { top:40px; }
  100%{ left:103%; top:104px; }
}
@media (prefers-color-scheme: light){ .sun{background:#fff3c4; box-shadow:0 0 44px 18px rgba(255,243,196,.8);} }
.cloud{position:absolute; background:rgba(255,255,255,.13); border-radius:100px; height:13px;}
.cloud::before,.cloud::after{content:''; position:absolute; background:inherit; border-radius:50%;}
.cloud::before{width:19px;height:19px;top:-8px;left:12px;}
.cloud::after{width:13px;height:13px;top:-5px;left:33px;}
@media (prefers-color-scheme: light){ .cloud{background:rgba(255,255,255,.85);} }
@keyframes drift{ from{transform:translateX(-90px);} to{transform:translateX(460px);} }
.ridge{position:absolute; bottom:60px; left:0; width:100%; height:120px; display:block;}
:root{ --sil:#0b1727; --pine:#0d2033; --neva:#16304d; }
@media (prefers-color-scheme: light){ :root{ --sil:#5b7fa6; --pine:#4a7a63; --neva:#a7cbe4; } }
/* морось — в Петербурге это состояние по умолчанию */
.rain{top:0; height:150px; pointer-events:none;}
.drop{
  position:absolute; top:-14px; width:1px; height:13px;
  background:linear-gradient(rgba(255,255,255,0), rgba(255,255,255,.75));
  animation-name:fall; animation-timing-function:linear; animation-iteration-count:infinite;
}
@keyframes fall{ to{ transform:translateY(168px); } }
.gull{position:absolute; top:34px; left:0; opacity:.75; animation:gullfly 34s linear infinite;}
@keyframes gullfly{
  0%{transform:translate(-40px,0);} 45%{transform:translate(220px,-14px);}
  70%{transform:translate(330px,6px);} 100%{transform:translate(480px,-8px);}
}
.neva{bottom:92px; height:24px; background:var(--neva);}
.neva::after{
  content:''; position:absolute; inset:auto 0 0 0; height:10px;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.09) 0 9px, transparent 9px 22px);
}
.bridge{position:absolute; right:12px; bottom:0; opacity:.95;}
.boat{position:absolute; bottom:2px; left:0; animation:sail 46s linear infinite;}
@keyframes sail{ from{transform:translateX(-40px);} to{transform:translateX(470px);} }
.pines{position:absolute; bottom:54px; left:0; width:100%; height:38px;}
.mosq{
  position:absolute; left:14%; bottom:98px; font-size:14px; opacity:.9;
  animation:buzz 6s ease-in-out infinite; transform-origin:center;
}
@keyframes buzz{
  0%,100%{transform:translate(0,0) rotate(0);}
  25%{transform:translate(-13px,-9px) rotate(-12deg);}
  50%{transform:translate(7px,-15px) rotate(9deg);}
  75%{transform:translate(-6px,-4px) rotate(-6deg);}
}
.road{
  position:absolute; bottom:0; left:0; right:0; height:54px;
  background:linear-gradient(#2f4a6b 0%, #263d59 100%); border-top:2px solid rgba(255,255,255,.14);
}
@media (prefers-color-scheme: light){ .road{background:linear-gradient(#7c8fa3 0%,#68798c 100%);} }
.road::after{
  content:''; position:absolute; top:26px; left:0; right:0; height:2px;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.32) 0 14px, transparent 14px 30px);
}
.strip{
  position:absolute; left:0; right:0; bottom:8px; display:flex; align-items:flex-end; gap:6px;
  padding:0 14px; overflow-x:auto; scroll-snap-type:x proximity;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.strip::-webkit-scrollbar{display:none;}
.glyph{
  flex:0 0 auto; border:0; background:none; padding:0 2px 2px; cursor:pointer;
  scroll-snap-align:center; display:flex; flex-direction:column; align-items:center; gap:3px;
  min-height:48px; transition:transform .22s var(--spring);
}
.glyph:active{transform:translateY(-4px) scale(1.04);}
.glyph svg{display:block; overflow:visible;}
.glyph .tagname{
  font-size:10.5px; font-weight:800; letter-spacing:.02em; color:#fff;
  background:rgba(0,0,0,.45); padding:3px 8px; white-space:nowrap;
  max-width:112px; overflow:hidden; text-overflow:ellipsis;
}
@media (prefers-color-scheme: light){ .glyph .tagname{background:rgba(0,0,0,.42);} }
.glyph.gone svg{opacity:.4; filter:grayscale(.7);}
.glyph.gone .tagname{opacity:.6;}
.glyph .alert{
  position:absolute; margin-top:-6px; margin-left:34px; width:9px; height:9px;
  border-radius:50%; background:var(--danger); box-shadow:0 0 0 2px rgba(0,0,0,.3);
}
@keyframes ride{ from{transform:translateX(-70px);} to{transform:translateX(470px);} }
.rider{position:absolute; bottom:22px; left:0; opacity:.55;}
@keyframes spin{ to{transform:rotate(360deg);} }
.wh{transform-box:fill-box; transform-origin:center; }

/* ============================================================ motion */
.view{opacity:1;}
.view.swap{animation:swapin .34s var(--spring) both;}
@keyframes swapin{ from{opacity:0; transform:translateY(9px);} to{opacity:1; transform:none;} }
.reveal{opacity:0; transform:translateY(11px);}
.reveal.in{opacity:1; transform:none; transition:opacity .42s ease, transform .42s var(--spring);}
.fill{transition:width .65s var(--spring);}
.bikecard{transition:transform .16s var(--spring), border-color .2s;}
.bikecard:active{transform:scale(.982);}
.att{transition:background .18s;}
.att:active{background:var(--surface2);}
@media (hover:hover){
  .bikecard:hover,.att:hover,.kpi:hover,.it:hover,summary:hover{background:var(--surface2);}
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  .cloud,.rider,.wh,.drop,.gull,.boat,.mosq,.sun{animation:none !important;}
  .sun{left:78%; top:26px;}
  .rain{display:none;}
  .view.swap{animation:none;}
  .reveal{opacity:1; transform:none;}
  .fill{transition:none;}
  .scene .layer{transform:none !important;}
}

/* ============================================================ KPI */
.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:8px;}
.kpi{
  background:var(--surface); border:0; border-top:4px solid var(--accent);
  padding:13px 12px; text-align:left; width:100%; cursor:pointer; display:block;
  min-height:48px; transition:transform .16s var(--spring);
}
.kpi:active{transform:scale(.97);}
/* block boxes: as inline spans these run together on one line */
.kpi .k{display:block; font-size:10.5px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.kpi .v{display:block; font-family:var(--mono); font-size:22px; font-weight:700;
  letter-spacing:-.04em; margin-top:5px; line-height:1.1;}
.kpi .s{display:block; font-size:11px; color:var(--ink3); margin-top:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

.rank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  background:var(--ink);color:var(--bg);font-size:11px;font-weight:800;margin-right:7px;flex:none;}
.dots{display:block;letter-spacing:1px;font-size:9px;color:var(--accent);line-height:1;margin-top:2px;}
.strbar{height:8px;margin-top:14px;
  background:linear-gradient(90deg,var(--danger),var(--warn),var(--ok));}
ul.pm{margin:12px 0 0;padding:0;list-style:none;}
ul.pm li{position:relative;padding-left:20px;margin-bottom:7px;font-size:13.5px;line-height:1.5;color:var(--ink2);}
ul.pm li::before{position:absolute;left:0;top:0;font-weight:800;}
ul.pm li.p::before{content:'+';color:var(--ok);}
ul.pm li.m::before{content:'–';color:var(--danger);}

/* ============================================================ переключатель */
.sw-row{display:flex; align-items:center; gap:14px; background:var(--surface);
  padding:14px 16px; margin-top:10px; cursor:pointer; width:100%; border:0; text-align:left;
  border-left:5px solid var(--accent); min-height:48px;}
.sw-row .t{flex:1; min-width:0;}
.sw-row .t b{display:block; font-size:15px; font-weight:800; letter-spacing:-.01em;}
.sw-row .t span{display:block; font-size:12.5px; color:var(--ink2); margin-top:2px;}
.sw-track{
  flex:none; width:64px; height:34px; background:var(--line2); position:relative;
  transition:background .28s var(--spring);
}
.sw-row.on .sw-track{background:var(--accent);}
.sw-knob{
  position:absolute; top:3px; left:3px; width:28px; height:28px; background:var(--bg);
  display:flex; align-items:center; justify-content:center; font-size:15px;
  transition:transform .32s var(--spring);
}
.sw-row.on .sw-knob{transform:translateX(30px);}
@media (prefers-reduced-motion: reduce){ .sw-knob,.sw-track{transition:none;} }

/* ============================================================ десктоп

смотри размер: 160 или 180 — под него подбираются адаптеры"},{"n":"Лишние камеры, ободные ленты, ниппеля","d":"","x":1},{"n":"Болты, шайбы, заглушки из коробок других сборок","d":"","x":1}]},{"g":"Чего в стоке нет — докупить","items":[{"n":"Лапка переключателя под Speedone","d":"","x":1,"note":"Уникальна для каждой рамы, со стока не переставить. Самая частая причина, почему сборка встаёт на неделю"},{"n":"Хомут подседельного штыря","d":"","x":1,"note":"Если не в комплекте рамы — под замеренный диаметр"},{"n":"Звёздочка (или expander) в шток + крышка + спейсеры","d":"","x":1,"note":"Под алюминиевый шток — звёздочка, под карбон — expander"},{"n":"Тросы и рубашки переключения","d":"Deore 12s — механика","x":1,"note":"Старый трос после перетяжки лучше не ставить, стоит копейки"},{"n":"Цепь — проверить длину","d":"","x":1,"note":"Задний треугольник другой длины: звеньев может не хватить"},{"n":"Замок цепи","d":"","x":1},{"n":"Ось 12×148 Boost","d":"","x":1,"note":"Если не пришла в комплекте с рамой — без неё колесо не поставить"},{"n":"Адаптеры калиперов под post mount 74","d":"Под 160 — без адаптера, под 180 — +20 мм","x":1},{"n":"Спейсеры каретки под стакан 68 мм","d":"","x":1,"note":"Стоковый набор был под 73 мм — комплект под 68 другой"},{"n":"Оливы, инсерты, минеральное масло","d":"","x":1,"note":"Геометрия рамы другая — гидролинии почти наверняка резать и прокачивать"},{"n":"Флягодержатель + болты","d":"","x":1},{"n":"Смазка цепи, карбоновая паста, Loctite","d":"","x":1}]}]},"log":{"_comment":"Seed for the maintenance history. If Safari evicts localStorage and the device is offline, the page repopulates from here. Real records normally live in the synced cloud copy; commit them here when you want an offline-proof baseline.","odo":{},"events":[]},"choice":{"title":"Гравел под рост 180–181 см","subtitle":"Белая рама с завода, бардачок, покрышка 50 мм, endurance-посадка","meta":"Модельные годы 2026–2027 · август 2026 · бюджет без ограничений · перекрас не рассматриваем","conflict":{"lead":"Главный конфликт","text":"Велосипед, который лучше всех подходит по посадке и требованиям, — самый непафосный бренд в списке. Giant делает рамы для половины индустрии, но статуса у него ноль.","text2":"Единственный способ получить и белый с завода, и статус выше среднего — Orbea с MyO: это заводская покраска в любой белый, а не перекрас. Цена вопроса — посадка на 1,5 см ниже, лечится проставками."},"fit":[{"k":"Рост","v":"180–181 см"},{"k":"Inseam","v":"83,5 см"},{"k":"Высота седла (расч.)","v":"~737 мм"},{"k":"Запас по standover","v":"60+ мм везде"}],"fitNote":"Inseam 83,5 при росте 180 — пропорции средние, без перекоса в ноги или корпус. Значит ориентируемся на середину размерной сетки каждого бренда, без сдвига вверх или вниз. Высота седла считана как inseam × 0,883 от центра каретки.","geoNote":"Не «размер 56 у всех», а тот размер, который каждый бренд даёт под 180–181 см. STR = stack ÷ reach: ≥1,52 — endurance, 1,47–1,51 — универсал, ≤1,45 — рейс.","geo":[{"rank":1,"model":"Cannondale Topstone Carbon","size":"56","stack":597,"reach":383,"str":1.559,"cls":"e","head":"70,7°","stays":"420","wb":"1036","bb":"76","standover":"—","feel":"Самый короткий reach + KingPin 30 мм. Диван, но рулится вяло"},{"rank":2,"model":"Giant Revolt Advanced 0","size":"ML","stack":602,"reach":391,"str":1.54,"cls":"e","head":"72°","stays":"425 / 435*","wb":"1031 / 1041*","bb":"80","standover":"774","feel":"Endurance-посадка с живым рулением. *флип-чип short / long","hl":true},{"rank":3,"model":"Specialized Diverge 4","size":"56","stack":610,"reach":400,"str":1.525,"cls":"e","head":"71°","stays":"430","wb":"1060","bb":"85","standover":"—","bbBest":true,"feel":"Самое низкое BB в тесте + Future Shock 20 мм. Эталон «расслабленно»"},{"rank":4,"model":"Trek Checkpoint SL Gen 3","size":"56 (ML)","stack":601,"reach":397,"str":1.514,"cls":"e","head":"72°","stays":"430","wb":"1042","bb":"76","standover":"—","feel":"Trek сам называет это «Gravel Endurance geometry»"},{"rank":5,"model":"Orbea Terra","size":"L","stack":602,"reach":406,"str":1.483,"cls":"m","head":"70,5°","stays":"430","wb":"1061","bb":"80","standover":"772","feel":"Универсал: подсед 74° тянет вперёд. Правится проставками"},{"rank":6,"model":"ENVE MOG","size":"56","stack":587,"reach":397,"str":1.479,"cls":"m","head":"71,25°","stays":"420","wb":"1042","bb":"75","standover":"—","feel":"Короткие перья + короткая база = острый рейсер"},{"rank":7,"model":"Canyon Grizl CF","size":"M","stack":596,"reach":404,"str":1.475,"cls":"m","head":"71°","stays":"440","wb":"1076","bb":"75","standover":"—","feel":"Длинный reach под короткий вынос, база-лимузин 1076 мм"},{"model":"Giant Revolt Advanced SL","note":"калибровка «рейс»","size":"M/L","stack":557,"reach":395,"str":1.41,"cls":"r","head":"71,5°","stays":"433","wb":"1026","bb":"—","standover":"—","dim":true,"feel":"Тот же Revolt, но stack ниже на 4,5 см. Бардачка нет"}],"pathosNote":"Пафос — субъективная шкала: как бренд читается в среде, насколько редкий, оборачиваются ли на парковке у старта. Не имеет отношения к качеству: Giant объективно делает одни из лучших рам в мире и производит их для доброй половины конкурентов — статуса это ему не приносит.","req":[{"model":"ENVE MOG","white":"Aspen White","whiteOk":true,"clr":"50 мм","box":"0,6 л","str":1.479,"cls":"m","weight":"рама 950 г","price":"$11 250","pathos":10,"why":"Бутик, США, полукастом. ENVE — это культ колёс. Таких на старте будет один"},{"model":"Santa Cruz Stigmata V4","white":"белого нет","whiteOk":false,"clr":"50 мм","box":"Glovebox","str":null,"weight":"—","price":"$4 149+","pathos":8,"dim":true,"why":"Культовый калифорнийский бренд, пожизненная гарантия на раму. Выбывает по цвету"},{"model":"Specialized Diverge 4","white":"белого нет","whiteOk":false,"clr":"50 мм / 2.2\"","box":"SWAT 4.0","str":1.525,"cls":"e","weight":"8,6 кг","price":"$5 999","pathos":7,"dim":true,"why":"Топ-бренд, но массовый; в 2026 у Diverge отменили S-Works — потолок пафоса просел"},{"model":"Orbea Terra","white":"MyO — любой белый","whiteOk":true,"clr":"50 мм","box":"LOCKR XXL","str":1.483,"cls":"m","weight":"8,1 кг","weightBest":true,"price":"€5 999","pathos":7,"hl":true,"why":"Баскский производитель со своей окраской под заказ. «Не как у всех» — отдельный вид пафоса"},{"model":"Trek Checkpoint SL Gen 3","white":"белого нет","whiteOk":false,"clr":"50 мм","box":"увелич. люк","str":1.514,"cls":"e","weight":"9,0 кг","price":"$5 700","pathos":6,"dim":true,"why":"Солидно и узнаваемо, но без вау. Палитра 2026 — только зелёные и Lava"},{"model":"Cannondale Topstone Carbon","white":"Chalk (молочный)","whiteOk":true,"clr":"52 / 56 мм","box":"StashPort","str":1.559,"cls":"e","weight":"—","price":"Ltd…3","pathos":6,"why":"Уважаемая инженерия, KingPin и Lefty дают экзотику. Но Topstone читается как «комфорт», не как «топ»"},{"model":"Canyon Grizl CF","white":"Acid / Nebula White","whiteOk":true,"clr":"54 мм","box":"LOAD","str":1.475,"cls":"m","weight":"~10 кг","price":"$4 999","pathos":5,"why":"Отличная инженерия, но D2C и репутация «умной покупки» статуса не добавляют"},{"model":"Giant Revolt Advanced 0","white":"Snow Drift","whiteOk":true,"clr":"53 мм*","box":"даунтьюб","str":1.54,"cls":"e","weight":"~9,0 кг","price":"$3 950","pathos":4,"why":"Крупнейший производитель рам в мире, делает их для конкурентов. Качество топ, узнаваемость нулевая"},{"model":"Ari Shafer 3.0","white":"White Gold","whiteOk":true,"clr":"58 мм","box":"Cache","str":null,"weight":"рама 928 г","price":"до $8 499","pathos":2,"why":"Бывший Fezzari, D2C из Юты. Инженерно интересно, но бренд не знает никто"}],"reqNote":"* 53 мм у Giant — только в положении флип-чипа «long»; в заводском «short» 45 мм.","scenarios":[{"tag":"Баланс всего","kind":"win","title":"Orbea Terra L · MyO White","meta":"€5 999 · 8,1 кг · пафос 7/10","plus":["Заводская покраска в любой белый — мат или глянец, свои декали, бесплатно","Самый лёгкий из всех: 8,1 кг против ~9–10 кг у остальных","LOCKR XXL — самый вместительный бардачок, влезает пуховка","MyO даёт выбрать длину выноса при заказе — фит настраивается на заводе"],"minus":["STR 1,483 — на 1,5 см ниже, чем Giant. Нужны 15–20 мм проставок","Тесты отмечают жёсткий перед на разбитых спусках"]},{"tag":"Лучший фит, худший статус","kind":"val","title":"Giant Revolt Advanced 0 ML · Snow Drift","meta":"$3 950 · ~9,0 кг · пафос 4/10","plus":["STR 1,540 — попадает в endurance-зону без проставок","BB drop 80 мм + флип-чип: перья 435 мм и полные 53 мм резины в «long»","D-Fuse руль и подседел гасят вибрацию без подвижных частей","Дешевле всех вдвое — остаётся бюджет на группу и колёса"],"minus":["Пафос на дне: Giant никто не считает статусным брендом","Рама Advanced-grade, механика GRX, несовместим с задником SRAM XPLR"]},{"tag":"Максимальный статус","kind":"","title":"ENVE MOG 56 · Aspen White","meta":"$11 250 · рама 950 г · пафос 10/10","plus":["Единственный бутиковый бренд с белым и бардачком в каталоге","Полукастомная сборка: вынос, руль, шатуны, ширина седла — всё под тебя","T47, три разных выноса вилки по размерам — инженерия на уровне"],"minus":["STR 1,479, перья 420, база 1042 — это рейсовая геометрия, не endurance","Втрое дороже Giant за велосипед, который хуже подходит под задачу"]}],"fitNotes":[{"b":"Giant: бери ML, не L.","t":"Сетка Giant даёт для 180 см оба варианта (ML 174–186, L 179–191), но L со stack 616 и reach 397 — это уже под рост 184+. ML со standover 774 мм оставляет 60 мм запаса при твоём inseam."},{"b":"Orbea: бери L, не M.","t":"M со stack 580 и подседом 74° сядет слишком по-рейсовому. L даёт stack 602 — те же цифры, что у Giant ML, только reach на 15 мм длиннее. Компенсируется выносом на 10 мм короче, который Orbea поставит с завода через MyO."},{"b":"Проставки решают 20 мм, не больше.","t":"Разница между Orbea L и Giant ML по посадке — примерно 15 мм высоты руля. Это ровно та величина, которая закрывается стеком проставок без уродства. Разница с Revolt Advanced SL (45 мм) — уже не закрывается ничем."},{"b":"Высота седла ~737 мм","t":"от центра каретки. У Giant ML подседельная труба 490 мм, у Orbea L — 505 мм: выхода штыря хватает с запасом на обоих, ни один не окажется «на минимуме»."}],"verdict":["Если пафос вообще не участвует в решении — <b>Giant Revolt Advanced 0 в размере ML<\/b> объективно лучший: точная endurance-посадка, самое низкое BB после Diverge, все четыре требования с завода и цена вдвое ниже конкурентов.","Но раз статус в уравнении — <b>Orbea Terra L в MyO-белом<\/b> становится честным оптимумом. Заводская покраска в любой белый, 8,1 кг, самый большой бардачок, пафос 7 против 4, и всего 15 мм разницы в посадке, которые закрываются проставками. Переплата к Giant — около €2 000.","<b>Diverge выбывает только по цвету<\/b> — по всему остальному он идеален и имеет самое низкое BB (85 мм). Если когда-нибудь передумаешь насчёт перекраса, это первый кандидат. <b>ENVE MOG снимаю<\/b>: платить втрое больше за рейсовую геометрию, когда просил endurance, — покупка статуса в ущерб задаче."],"sources":"Геометрия: Bike Insights (Giant Revolt Advanced ML/L, Trek Checkpoint Gen 3, ENVE MOG, Cannondale Topstone Carbon, Orbea Terra, Specialized Diverge 4) · geometrics.mtb-news.de (Canyon Grizl, Diverge) · road.cc (Revolt Advanced SL). Размерная сетка Giant — Ivanhoe Cycles. Вес Revolt Advanced 0 — замер Velomotion (8,96 кг, размер M). Комплектации, цвета и цены: giant-bicycles.com, 99spokes, enve.com, cyclefit.co.uk, canyon.com, trekbikes.com, bikepacking.com, GRAN FONDO, Cycling Weekly.","disclaimer":"Оценка «пафос» субъективна и отражает восприятие брендов в велосреде, а не качество продукта. Цены — рекомендованные розничные на август 2026, различаются по рынкам."}}</script>
<script>
"use strict";
/* ============================================================ data */
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const BIKES = DATA.bikes, RULES = DATA.maintenance, FRAMES = DATA.frames, CHECKLISTS = DATA.checklists;
const CHOICE = DATA.choice;
const BIKE = Object.fromEntries(BIKES.map(b => [b.id, b]));
const RULE = Object.fromEntries(RULES.map(r => [r.id, r]));
const CATS = {
  drivetrain:  {label:'Трансмиссия'},
  brakes:      {label:'Тормоза'},
  wheels:      {label:'Колёса'},
  suspension:  {label:'Подвеска'},
  consumables: {label:'Расходники'}
};
const EMOJI = {'гравий':'🚵','МТБ хардтейл':'⛰️','детский':'🧒'};
/* one hue per bike, fixed, never reused for anything else */
const HUE = id => 'var(--b' + (BIKE[id] ? BIKE[id].colorSlot : 1) + ')';
const SHORT = (() => {
  const first = {};
  for (const b of BIKES) first[b.name.split(' ')[0]] = (first[b.name.split(' ')[0]] || 0) + 1;
  return Object.fromEntries(BIKES.map(b => {
    const w = b.name.split(' ');
    return [b.id, first[w[0]] > 1 ? (w[1] || w[0]) : w[0]];
  }));
})();

/* ============================================================ utils */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Цены скрыты по умолчанию. Всё денежное в интерфейсе форматируется здесь,
   поэтому переключается одним флагом и ни одна цифра не проскакивает мимо. */
let SHOWMONEY = localStorage.getItem('bikes:money') === '1';
const rub = n => !SHOWMONEY ? '—'
  : (n==null ? '—' : Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ') + ' ₽');
function toggleMoney() {
  SHOWMONEY = !SHOWMONEY;
  localStorage.setItem('bikes:money', SHOWMONEY ? '1' : '0');
  render();
}
const km  = n => (n==null ? '—' : Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ') + ' км');
const slug = s => String(s).toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,48);
const uid = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const YEAR = new Date().getFullYear();
/* Народная единица измерения. Только для крупных сумм, и только шёпотом. */
const SHAVA = 350;
const shavas = n => (SHOWMONEY && n >= SHAVA * 20) ? ` — это ${Math.round(n/SHAVA)} шаверм` : '';

/* ============================================================ storage */
const LS = 'bikes:v1';
/* Адрес хранилища зашит: гость открывает ссылку и сразу видит данные,
   ничего не настраивая. Токен появляется только после входа по паролю. */
const API = 'https://bikes-sync.severyanov.workers.dev';
const TOK_KEY = 'bikes:token';
const blankDoc = () => ({ v:1, mtime:0, odo:{}, annualKm:{}, ownership:{}, parts:{},
                          events:[], checks:{}, photos:{}, migratedAt:null });

let local = { rev:0, doc:blankDoc(), dirty:false, lastSync:null };
try {
  const raw = localStorage.getItem(LS);
  if (raw) { const p = JSON.parse(raw); local = Object.assign(local, p); local.doc = Object.assign(blankDoc(), p.doc); }
} catch(e) { /* corrupt cache — start blank, the cloud copy and seed refill it */ }

const DOC = () => local.doc;

function persist(markDirty) {
  if (markDirty !== false) { local.dirty = true; local.doc.mtime = Date.now(); }
  if (!EDITOR) local.dirty = false;        // гость ничего не отправляет на сервер
  try { localStorage.setItem(LS, JSON.stringify(local)); }
  catch(e) { toast('Не хватило места в браузере — уменьшите число фото'); }
  paintSync();
}

function stableId(groupName, itemName){ return slug(groupName) + '/' + slug(itemName); }

/* R1 — positional "gi-ii" ticks resolve only against the UNMODIFIED arrays, so
   this runs before anything touches content. Old keys stay as the only rollback. */
function migrateChecks() {
  if (DOC().migratedAt) return 0;
  let n = 0;
  for (const [key, groups] of Object.entries(CHECKLISTS)) {
    let old = {};
    try { old = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) { old = {}; }
    const map = DOC().checks[key] || (DOC().checks[key] = {});
    groups.forEach((g, gi) => g.items.forEach((it, ii) => {
      if (old[gi + '-' + ii]) { map[stableId(g.g, it.n)] = 1; n++; }
    }));
  }
  DOC().migratedAt = new Date().toISOString();
  persist(n > 0);   // nothing migrated => no fresh mtime, or an empty doc outranks the cloud
  return n;
}

/* Переименования пунктов чек-листа.
   Устойчивый id — это slug(группа)/slug(пункт), поэтому правка текста пункта
   отвязывает поставленную на нём галочку. Каждое переименование записывается
   сюда и переносится при загрузке: сначала переносим, потом уже правим текст.
   Идемпотентно — новый ключ не перезаписывается, старый не удаляется. */
const RENAMES = {
  'speedone-275-checklist-v1': {
    // рама называется Floater, а не Destroyer (уточнено 15.08.2026)
    'куплено-под-этот-проект/рама-speedone-destroyer-27-5':
    'куплено-под-этот-проект/рама-speedone-floater-27-5'
  }
};

function applyRenames() {
  let n = 0;
  for (const [key, map] of Object.entries(RENAMES)) {
    const checks = DOC().checks[key];
    if (!checks) continue;
    for (const [from, to] of Object.entries(map))
      if (checks[from] != null && checks[to] == null) { checks[to] = checks[from]; n++; }
  }
  if (n) persist(true);
  return n;
}

/* R4 — if storage was evicted and we are offline, the committed seed refills history */
function applySeed() {
  const seed = DATA.log || {};
  const d = DOC();
  const have = new Set(d.events.map(e => e.id));
  let n = 0;
  (seed.events || []).forEach(e => { if (!have.has(e.id)) { d.events.push(e); n++; } });
  for (const [k, v] of Object.entries(seed.odo || {})) if (d.odo[k] == null) { d.odo[k] = v; n++; }
  if (n) persist(true);
  return n;
}

/* ============================================================ sync */
let syncTok = localStorage.getItem(TOK_KEY) || '';
let syncState = 'off', syncMsg = '';
let EDITOR = false;                       // право записи приходит с сервера, не из localStorage

function mergeDocs(mine, theirs) {
  const newer = (theirs.mtime || 0) >= (mine.mtime || 0) ? theirs : mine;
  const older = newer === theirs ? mine : theirs;
  const out = Object.assign({}, newer);

  // events: union by id, latest write per id wins (tombstones included, so a
  // delete survives the merge instead of being resurrected by the other side)
  const byId = new Map();
  for (const e of [...(theirs.events||[]), ...(mine.events||[])]) {
    const prev = byId.get(e.id);
    if (!prev || (e.mtime||0) >= (prev.mtime||0)) byId.set(e.id, e);
  }
  out.events = [...byId.values()];

  // Maps merge KEY BY KEY, never wholesale. A device whose storage Safari just
  // evicted boots with empty maps and a fresh mtime — replacing the map wholesale
  // would let it blank out the odometer for every bike in the cloud.
  for (const k of ['odo', 'annualKm', 'photos', 'ownership'])
    out[k] = Object.assign({}, older[k] || {}, newer[k] || {});

  // правки состава сливаются по каждому велосипеду отдельно, иначе правка
  // одного затирала бы правки другого
  out.parts = {};
  for (const id of new Set([...Object.keys(older.parts||{}), ...Object.keys(newer.parts||{})]))
    out.parts[id] = Object.assign({}, (older.parts||{})[id], (newer.parts||{})[id]);

  out.checks = {};
  for (const key of new Set([...Object.keys(older.checks||{}), ...Object.keys(newer.checks||{})]))
    out.checks[key] = Object.assign({}, (older.checks||{})[key], (newer.checks||{})[key]);

  out.migratedAt = mine.migratedAt || theirs.migratedAt || null;
  out.mtime = Math.max(mine.mtime||0, theirs.mtime||0);
  return out;
}

async function pull() {
  const r = await fetch(API + '/doc', syncTok ? { headers:{ 'authorization':'Bearer ' + syncTok } } : undefined);
  if (!r.ok) throw new Error('Сервер ответил ' + r.status);
  const j = await r.json();
  EDITOR = !!j.editor;                    // сервер решает, кто редактор
  return j;
}

async function login(password) {
  const r = await fetch(API + '/login', {
    method:'POST', headers:{ 'content-type':'application/json' },
    body: JSON.stringify({ password })
  });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('Сервер ответил ' + r.status));
  syncTok = j.token;
  localStorage.setItem(TOK_KEY, syncTok);
  EDITOR = true;
  return true;
}

function logout() {
  syncTok = ''; EDITOR = false;
  localStorage.removeItem(TOK_KEY);
  sync(true); render();
}

async function push(rev, doc) {
  const r = await fetch(API + '/doc', {
    method:'PUT',
    headers:{ 'authorization':'Bearer ' + syncTok, 'content-type':'application/json', 'if-match':String(rev) },
    body: JSON.stringify(doc)
  });
  if (r.status === 409) return null;
  if (r.status === 401) { EDITOR = false; throw new Error('Сессия истекла — войдите заново'); }
  if (!r.ok) throw new Error('Сервер ответил ' + r.status);
  return r.json();
}

let syncing = false;
async function sync(silent) {
  if (syncing) return;
  syncing = true; syncState = 'busy'; paintSync();
  try {
    const remote = await pull();
    if (remote.rev !== local.rev || local.dirty) {
      local.doc = remote.doc ? mergeDocs(local.doc, remote.doc) : local.doc;
      local.rev = remote.rev;
    }
    if (EDITOR && (local.dirty || (remote.doc && JSON.stringify(remote.doc) !== JSON.stringify(local.doc)))) {
      let res = await push(local.rev, local.doc);
      if (res === null) {
        const again = await pull();
        local.doc = mergeDocs(local.doc, again.doc || blankDoc());
        local.rev = again.rev;
        res = await push(local.rev, local.doc);
        if (res === null) throw new Error('Конфликт записи, попробуйте ещё раз');
      }
      local.rev = res.rev;
    }
    if (EDITOR) local.dirty = false;
    local.lastSync = Date.now(); syncState = 'on'; syncMsg = '';
    try { localStorage.setItem(LS, JSON.stringify(local)); } catch(e){}
    render();
  } catch (err) {
    syncState = 'err'; syncMsg = err.message;
    if (!silent) toast(err.message);
  } finally {
    syncing = false; paintSync();
  }
}

function paintSync() {
  const dot = $('sdot'), lbl = $('slabel');
  if (lbl) lbl.textContent = EDITOR ? 'Профиль' : 'Вход';
  const mb = $('mbtn');
  if (mb) { mb.classList.toggle('on', SHOWMONEY); $('mlabel').textContent = SHOWMONEY ? 'Цены' : 'Цены'; }
  // подвал бокового меню рисуется только в renderNav(), поэтому без этой
  // строки он держал «Режим просмотра» даже во время синхронизации
  const ns = document.querySelector('.navstate');
  if (ns) ns.textContent = syncLine();
  if (!EDITOR) dot.className = '';
  else if (syncState === 'busy') dot.className = '';
  else if (syncState === 'err') dot.className = 'err';
  else if (local.dirty) dot.className = 'dirty';
  else dot.className = 'on';
}

function syncLine() {
  if (!EDITOR) return 'Режим просмотра';
  if (syncState === 'busy') return 'Синхронизирую…';
  if (syncState === 'err') return syncMsg || 'Ошибка синхронизации';
  if (local.dirty) return 'Есть несохранённые изменения';
  const ago = local.lastSync ? Math.round((Date.now() - local.lastSync)/60000) : null;
  return ago == null ? 'Синхронизировано'
    : ago < 1 ? 'Синхронизировано только что'
    : ago < 60 ? 'Синхронизировано ' + ago + ' мин назад'
    : 'Синхронизировано ' + Math.round(ago/60) + ' ч назад';
}

/* ============================================================ aggregation */
const evCost = e => (Number(e.partCost)||0) + (Number(e.labourCost)||0);
const liveEvents = () => DOC().events.filter(e => !e.deleted);
const eventsOf = (bikeId, year) => liveEvents().filter(e =>
  (!bikeId || e.bike === bikeId) && (!year || Number(e.date.slice(0,4)) === year));

/* Ownership: the static file carries the baseline, the synced doc carries the
   user's edits (sale date and price). A sold bike keeps its spend history but
   drops out of maintenance and forecasting — you do not service what you sold. */
function ownershipOf(id) {
  const o = (DOC().ownership || {})[id] || {};
  const base = (BIKE[id] && BIKE[id].ownership) || 'owned';
  return { state: o.state || base, soldDate: o.soldDate || null,
           soldPrice: o.soldPrice == null ? null : Number(o.soldPrice) };
}
const isOwned = id => ownershipOf(id).state === 'owned';
const ownedBikes = () => BIKES.filter(b => isOwned(b.id));
const soldBikes  = () => BIKES.filter(b => !isOwned(b.id));

function yearCost(bikeId, year){ return eventsOf(bikeId, year).reduce((s,e)=>s+evCost(e), 0); }

function categorySplit(bikeId, year) {
  const out = {};
  for (const k of Object.keys(CATS)) out[k] = 0;
  for (const e of eventsOf(bikeId, year)) {
    const c = e.category || (RULE[e.rule] && RULE[e.rule].category) || 'consumables';
    out[c] = (out[c] || 0) + evCost(e);
  }
  return out;
}

/* null, never 0 or Infinity, when the odometer is unset — an unknown ratio is
   not a cheap one. */
function costPerKm(bikeId, year) {
  const odo = Number(DOC().odo[bikeId]);
  if (!odo || odo <= 0) return null;
  return yearCost(bikeId, year) / odo;
}

/* Состав живёт в двух слоях: неизменяемый сид в bikes.json и правки владельца
   в синхронизируемом документе. Ключ — стабильный id детали, а не её название,
   поэтому переименование не рвёт привязку. */
function componentsOf(bikeId) {
  const over = (DOC().parts || {})[bikeId] || {};
  const out = [];
  for (const c of (BIKE[bikeId] && BIKE[bikeId].components) || []) {
    const o = over[c.id];
    if (o && o.deleted) continue;
    out.push(o ? Object.assign({}, c, o) : c);
  }
  for (const [id, o] of Object.entries(over))
    if (o && o.added && !o.deleted) out.push(Object.assign({ id }, o));
  return out;
}

function purchaseTotal(bikeId){
  const b = BIKE[bikeId];
  const list = componentsOf(bikeId);
  const items = list.reduce((s,c)=>s+(Number(c.purchasePrice)||0), 0);
  // велосипед, купленный целиком, не расписан по позициям — у него только сумма
  return items || Number(b.totalSpend) || 0;
}

/* what the bike actually cost: everything put in, minus what it sold for */
function netCost(bikeId) {
  const sold = ownershipOf(bikeId).soldPrice;
  return purchaseTotal(bikeId) + eventsOf(bikeId).reduce((s,e)=>s+evCost(e), 0) - (sold || 0);
}

function forecast(bikeId) {
  if (!isOwned(bikeId)) return [];
  const annual = Number(DOC().annualKm[bikeId]) || 0;
  const rows = [];
  for (const r of RULES) {
    if (!r.bikes.includes(bikeId)) continue;
    const last = eventsOf(bikeId).filter(e => e.rule === r.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    // "каждые N км или M месяцев — что наступит раньше" = whichever trigger fires
    // more often over a year. Backlog already accrued is not a recurring cost.
    const perYear = Math.max(12 / r.interval_months, annual ? annual / r.interval_km : 0);
    const unit = defaultPartCost(bikeId, r) + (Number(r.est_labour_cost) || 0);
    rows.push({ rule:r, times:perYear, cost:perYear * unit, unit, last });
  }
  return rows.sort((a,b)=>b.cost-a.cost);
}

function matchComponent(bikeId, rule) {
  const b = BIKE[bikeId]; if (!b || !rule.part_keywords || !rule.part_keywords.length) return null;
  const list = componentsOf(bikeId);
  for (const kw of rule.part_keywords) {
    const hit = list.find(c => (c.part||'').toLowerCase().includes(kw.toLowerCase()));
    if (hit && hit.purchasePrice) return hit;
  }
  return null;
}

/* A rule with est_part_cost 0 consumes no part — it is an inspection or an
   adjustment. It must never inherit the price of the component it inspects,
   or a headset check gets billed at the price of the frameset. */
function defaultPartCost(bikeId, rule) {
  if (!Number(rule.est_part_cost)) return 0;
  const c = matchComponent(bikeId, rule);
  return c ? Number(c.purchasePrice) : Number(rule.est_part_cost);
}

function dueStatus(bikeId, rule) {
  const odo = Number(DOC().odo[bikeId]);
  const last = eventsOf(bikeId).filter(e => e.rule === rule.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if (!last) return { state:'unknown', text:'нет записей' };
  const lastOdo = Number(last.odo);
  const months = (Date.now() - new Date(last.date).getTime()) / (1000*60*60*24*30.44);
  const byMon = months / rule.interval_months;
  const byKm  = (odo && lastOdo != null) ? (odo - lastOdo) / rule.interval_km : 0;
  const p = Math.max(byMon, byKm);
  const left = (odo && lastOdo != null) ? Math.round(rule.interval_km - (odo - lastOdo)) : null;
  if (p >= 1) return { state:'due',  text:'пора', p, left };
  if (p >= .8) return { state:'soon', text:'скоро', p, left };
  return { state:'ok', text:'в норме', p, left };
}

/* everything that wants doing, worst first — this drives the home screen */
function attention() {
  const out = [];
  for (const b of ownedBikes())
    for (const r of RULES) {
      if (!r.bikes.includes(b.id)) continue;
      const st = dueStatus(b.id, r);
      if (st.state === 'due' || st.state === 'soon') out.push({ bike:b, rule:r, st });
    }
  return out.sort((a,b) => (a.st.state === b.st.state) ? b.st.p - a.st.p
                          : a.st.state === 'due' ? -1 : 1);
}

/* ============================================================ charts
   Colour encodes the BIKE everywhere — it is this app's entity. Magnitude
   comparisons that are not per-bike use one hue and length, plus a value label
   on every bar and a table underneath. */
function barRows(rows) {
  const max = Math.max(1, ...rows.map(r => r.value));
  return rows.map(r => `
    <div style="padding:12px 16px${r.i ? ';border-top:1px solid var(--line)' : ''}">
      <div class="spread">
        <span style="font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%">${esc(r.label)}</span>
        <span class="num" style="font-size:14.5px;font-weight:700">${esc(r.text)}</span>
      </div>
      ${r.sub ? `<div class="tiny" style="margin-top:2px">${esc(r.sub)}</div>` : ''}
      <div class="track"><div class="fill" style="width:${Math.max(2, r.value/max*100)}%;background:${r.color||'var(--accent)'}"></div></div>
    </div>`).join('');
}

/* ---------------------------------------------------------- scene
   Each bike is drawn, not photographed: same flat side view, but the silhouette
   follows the real machine — drop bar for gravel, suspension fork and flat bar
   for the hardtails, small wheels for the 20". Painted in the bike's own hue. */
function bikeGlyph(b, w) {
  const c = HUE(b.id);
  const kid = b.type === 'детский';
  const mtb = b.type === 'МТБ хардтейл';
  const R = kid ? 13 : 17;                      // wheel radius
  const y = 50, rx = 22, fx = 78;               // hub positions
  const bb = [50, y], seat = [38, kid ? 30 : 26], head = [68, kid ? 31 : 28];
  const L = (a, z, sw) => `<path d="M${a[0]} ${a[1]}L${z[0]} ${z[1]}" stroke="${c}" stroke-width="${sw||3}" stroke-linecap="round"/>`;
  const wheel = cx => `
    <g class="wh" style="animation:spin 5.5s linear infinite">
      ${[0,60,120].map(a=>`<line x1="${cx-R*0.82*Math.cos(a*Math.PI/180)}" y1="${y-R*0.82*Math.sin(a*Math.PI/180)}"
         x2="${cx+R*0.82*Math.cos(a*Math.PI/180)}" y2="${y+R*0.82*Math.sin(a*Math.PI/180)}"
         stroke="${c}" stroke-width="1" opacity=".45"/>`).join('')}
    </g>
    <circle cx="${cx}" cy="${y}" r="${R}" fill="none" stroke="${c}" stroke-width="3"/>`;
  const bar = mtb || kid
    ? `<path d="M${head[0]-1} ${head[1]-9}h11" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`
    : `<path d="M${head[0]-1} ${head[1]-9}h8q4 0 4 4v4" stroke="${c}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  return `<svg width="${w}" height="${Math.round(w*0.72)}" viewBox="0 0 100 72" aria-hidden="true">
    ${wheel(rx)}${wheel(fx)}
    ${L(bb, [rx, y], 2.6)}${L(seat, [rx, y], 2.6)}
    ${L(bb, seat)}${L(bb, head)}${L(seat, head)}
    ${mtb ? `<path d="M${head[0]} ${head[1]}L${fx} ${y}" stroke="${c}" stroke-width="5" stroke-linecap="round" opacity=".85"/>`
          : L(head, [fx, y], 2.6)}
    <path d="M${head[0]-2} ${head[1]}L${head[0]+1} ${head[1]-9}" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/>
    ${bar}
    <path d="M${seat[0]-6} ${seat[1]-3}h12" stroke="${c}" stroke-width="4" stroke-linecap="round"/>
    <circle cx="${bb[0]}" cy="${bb[1]}" r="3.4" fill="${c}"/>
  </svg>`;
}

  'M246 120V90h24v30z M252 90V70h12v20z M258 24l5 46h-10z M257 24h2v-9h-2z '
    + 'M259 15c4-1 7-3 9-5v6c-2 2-5 3-9 3z',                                // Адмиралтейство с корабликом
  'M280 120V98h30v22z M314 120V92h18v28z',

  'M362 120V100h34v20z'
