<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0c">
<meta name="description" content="Парк велосипедов: состав, регламент ТО, затраты, обзор гравийных рам 2027 и чек-листы сборки">
<title>Гараж — велосипеды, ТО и затраты</title>
<style>
/* ============================================================ tokens
   Dark is the primary look; light is a courtesy for daylight. Bike identity
   colours are the validated categorical slots — one hue per bike, never cycled,
   never reused for anything else. */
:root{
  color-scheme: dark;
  --bg:#0a0a0c;
  --surface:#141417;
  --surface2:#1c1c21;
  --line:#26262c;
  --line2:#34343d;
  --ink:#f4f4f6;
  --ink2:#9e9ea8;
  --ink3:#6a6a74;
  --accent:#2dd4bf;
  --accent-dim:rgba(45,212,191,.14);
  --danger:#fb7185;
  --danger-dim:rgba(251,113,133,.13);
  --warn:#fbbf24;
  --warn-dim:rgba(251,191,36,.13);
  --ok:#4ade80;
  --ok-dim:rgba(74,222,128,.13);
  --b1:#3987e5; --b2:#d95926; --b3:#199e70; --b4:#c98500; --b5:#d55181;
  --hdr:rgba(10,10,12,.72);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --r-card:16px; --r-in:12px; --r-ctl:11px;
  --spring:cubic-bezier(.34,1.4,.64,1);
}
@media (prefers-color-scheme: light){
  :root{
    color-scheme: light;
    --bg:#f6f6f7;
    --surface:#ffffff;
    --surface2:#f1f1f3;
    --line:#e5e5e9;
    --line2:#d3d3da;
    --ink:#141417;
    --ink2:#5f5f6b;
    --ink3:#8e8e9a;
    --accent:#0d9488;
    --accent-dim:rgba(13,148,136,.1);
    --danger:#dc2626;
    --danger-dim:rgba(220,38,38,.09);
    --warn:#b45309;
    --warn-dim:rgba(180,83,9,.1);
    --ok:#15803d;
    --ok-dim:rgba(21,128,61,.1);
    --b1:#2a78d6; --b2:#eb6834; --b3:#1baf7a; --b4:#eda100; --b5:#e87ba4;
    --hdr:rgba(246,246,247,.75);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(72px + var(--safe-b));
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;}
.num{font-variant-numeric:tabular-nums;}

/* ============================================================ header */
header{
  position:sticky; top:0; z-index:50; background:var(--hdr);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
  backdrop-filter:saturate(180%) blur(22px);
  border-bottom:1px solid var(--line);
  padding:calc(var(--safe-t) + 12px) calc(var(--safe-r) + 18px) 12px calc(var(--safe-l) + 18px);
}
.hrow{display:flex; align-items:center; gap:12px;}
h1{margin:0; font-size:26px; font-weight:800; letter-spacing:-.03em; flex:1; min-width:0;
   overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
#sbtn{
  flex:none; width:44px; height:44px; margin-right:-8px; border:0; background:none;
  cursor:pointer; display:flex; align-items:center; justify-content:center; position:relative;
}
#sbtn svg{width:21px;height:21px;fill:none;stroke:var(--ink2);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
#sdot{
  position:absolute; top:7px; right:7px; width:9px; height:9px; border-radius:50%;
  background:var(--ink3); border:2px solid var(--bg);
}
#sdot.on{background:var(--ok);} #sdot.dirty{background:var(--warn);} #sdot.err{background:var(--danger);}
.sub{margin:2px 0 0; font-size:13.5px; color:var(--ink2);}

/* ============================================================ layout */
main{padding:18px calc(var(--safe-r) + 18px) 28px calc(var(--safe-l) + 18px); max-width:820px; margin:0 auto;}
.view{display:none;} .view.on{display:block;}
.lbl{
  font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink3); margin:26px 0 10px; display:flex; align-items:center; gap:8px;
}
.lbl:first-child{margin-top:0;}
.lbl .n{
  background:var(--surface2); color:var(--ink2); border-radius:20px;
  padding:1px 7px; font-size:11px; letter-spacing:0;
}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); overflow:hidden;}
.card + .card{margin-top:10px;}
.pad{padding:16px;}
.muted{color:var(--ink2); font-size:14px; line-height:1.5;}
.tiny{color:var(--ink3); font-size:12.5px; line-height:1.45;}
.spread{display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
.hero{font-size:38px; font-weight:800; letter-spacing:-.035em; line-height:1.05;}
.stack{display:flex; flex-direction:column; gap:10px;}

/* ============================================================ chips */
.chip{
  display:inline-flex; align-items:center; gap:5px; background:var(--surface2);
  color:var(--ink2); border-radius:8px; padding:3px 8px; font-size:11.5px; font-weight:600;
  white-space:nowrap;
}
.chip.danger{background:var(--danger-dim); color:var(--danger);}
.chip.warn{background:var(--warn-dim); color:var(--warn);}
.chip.ok{background:var(--ok-dim); color:var(--ok);}
.chip.accent{background:var(--accent-dim); color:var(--accent);}
.dotc{width:7px;height:7px;border-radius:50%;flex:none;}

/* ============================================================ controls */
.btn{
  min-height:48px; padding:0 18px; border-radius:var(--r-ctl); border:1px solid var(--line2);
  background:var(--surface); color:var(--ink); font-size:15px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:7px; width:100%;
  transition:transform .12s var(--spring);
}
.btn:active{transform:scale(.975);}
.btn.pri{background:var(--accent); border-color:var(--accent); color:#04201d; font-weight:700;}
.btn.sm{min-height:44px; font-size:14px; padding:0 14px; width:auto;}
.btn.ghost{background:none; border-color:var(--line);}
label{display:block; font-size:13px; font-weight:600; color:var(--ink2); margin:16px 0 6px;}
input,select,textarea{
  width:100%; min-height:48px; padding:12px 14px; border:1px solid var(--line2);
  border-radius:var(--r-ctl); background:var(--surface2); -webkit-appearance:none; appearance:none;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent;}
select{
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 19px) 22px,calc(100% - 14px) 22px;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:40px;
}
textarea{min-height:78px; resize:vertical;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.grid2 > div > label{margin-top:16px;}
.seg{
  display:flex; background:var(--surface2); border-radius:var(--r-ctl); padding:3px;
  margin-bottom:16px; overflow-x:auto; scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none;}
.seg button{
  flex:1 0 auto; min-height:44px; border:0; border-radius:9px; background:none; color:var(--ink2);
  font-size:13.5px; font-weight:600; cursor:pointer; padding:0 14px; white-space:nowrap;
}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.25);}

/* ============================================================ tabbar */
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex; background:var(--hdr);
  -webkit-backdrop-filter:saturate(180%) blur(22px); backdrop-filter:saturate(180%) blur(22px);
  border-top:1px solid var(--line);
  padding:5px calc(var(--safe-r) + 4px) calc(var(--safe-b) + 5px) calc(var(--safe-l) + 4px);
}
nav button{
  flex:1; min-height:50px; border:0; background:none; cursor:pointer; color:var(--ink3);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:10px; font-weight:600; padding:2px; position:relative;
}
nav button.on{color:var(--accent);}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
nav .badge{
  position:absolute; top:2px; right:50%; margin-right:-20px; min-width:17px; height:17px;
  border-radius:9px; background:var(--danger); color:#fff; font-size:10.5px; font-weight:700;
  display:flex; align-items:center; justify-content:center; padding:0 4px;
}

/* ============================================================ bike card */
.bikecard{
  display:flex; width:100%; border:0; padding:0; background:var(--surface); cursor:pointer;
  text-align:left; border-radius:var(--r-card); overflow:hidden; border:1px solid var(--line);
  transition:transform .12s var(--spring);
}
.bikecard:active{transform:scale(.985);}
.bar{width:4px; flex:none; align-self:stretch;}
.bikebody{flex:1; min-width:0; padding:15px 16px; display:flex; gap:13px; align-items:center;}
.ph{
  width:52px; height:52px; border-radius:13px; flex:none; overflow:hidden;
  display:flex; align-items:center; justify-content:center; font-size:23px;
  background:var(--surface2);
}
.ph img{width:100%;height:100%;object-fit:cover;}
.bname{display:block; font-size:16.5px; font-weight:700; letter-spacing:-.015em; line-height:1.25;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bmeta{display:block; font-size:13px; color:var(--ink2); margin-top:3px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bstat{font-size:12.5px; color:var(--ink3); margin-top:5px; display:flex; gap:8px; flex-wrap:wrap;}
.sold .bikebody{opacity:.62;}

/* ============================================================ attention */
.att{display:flex; align-items:center; gap:12px; padding:14px 16px; width:100%;
  border:0; background:none; cursor:pointer; text-align:left; min-height:48px;}
.att + .att{border-top:1px solid var(--line);}
.att .txt{flex:1; min-width:0;}
/* ellipsis needs a block box — a bare inline span just overflows onto the chip */
.att .t1{display:block; font-size:15px; font-weight:600; line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.att .t2{display:block; font-size:12.5px; color:var(--ink2); margin-top:3px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.att .chip{flex:none;}
.att .arw{color:var(--ink3); font-size:19px; flex:none;}
.calm{padding:26px 18px; text-align:center;}
.calm .ic{font-size:30px;}
.calm .t{font-size:15px; font-weight:600; margin-top:8px;}
.calm .s{font-size:13px; color:var(--ink2); margin-top:4px; line-height:1.5;}

/* ============================================================ rows / tables */
.row{display:flex; align-items:center; gap:12px; padding:13px 16px; min-height:48px;}
.row + .row{border-top:1px solid var(--line);}
.row .rl{flex:1; min-width:0;}
.row .rt{font-size:14.5px; line-height:1.3;}
.row .rs{font-size:12.5px; color:var(--ink2); margin-top:2px;}
.row .rv{font-size:14.5px; font-weight:600; text-align:right; white-space:nowrap; flex:none;}
.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
table{border-collapse:collapse; width:100%; font-size:13px;}
th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
th{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink3); font-weight:700;}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums;}
tr:last-child td{border-bottom:0;}
td.wrap{white-space:normal; min-width:190px;}

/* ============================================================ charts */
.track{height:8px; border-radius:4px; background:var(--surface2); overflow:hidden; margin-top:7px;}
.fill{height:100%; border-radius:4px;}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:12px;}
.legend span{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink2);}
.sw{width:11px;height:11px;border-radius:3px;flex:none;}

/* ============================================================ disclosure */
details{border-top:1px solid var(--line);}
details:first-of-type{border-top:0;}
summary{
  list-style:none; cursor:pointer; padding:14px 16px; min-height:48px;
  display:flex; align-items:center; gap:11px;
}
summary::-webkit-details-marker{display:none;}
summary .arw{color:var(--ink3); font-size:11px; transition:transform .2s; flex:none;}
details[open] summary .arw{transform:rotate(90deg);}
.dbody{padding:0 16px 16px; }

/* ============================================================ checklist */
.it{display:flex; gap:13px; padding:14px 16px; cursor:pointer; align-items:flex-start; min-height:48px;}
.it + .it{border-top:1px solid var(--line);}
.it .box{
  width:25px;height:25px;border-radius:8px;border:2px solid var(--line2); flex:none; margin-top:1px;
  display:flex;align-items:center;justify-content:center; transition:.18s var(--spring);
}
.it .box svg{width:15px;height:15px;stroke:#04201d;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
.it.done .box{background:var(--accent); border-color:var(--accent);}
.it.done .box svg{opacity:1;}
.it.done .nm{text-decoration:line-through; color:var(--ink3);}
.it .nm{font-size:15px; line-height:1.3; font-weight:500;}
.it .dt{font-size:13px; color:var(--ink2); margin-top:3px;}
.it .note{font-size:12.5px; color:var(--ink2); margin-top:7px; padding-left:11px;
  border-left:2px solid var(--line2); line-height:1.5;}
.it .pr{margin-left:auto; font-size:13.5px; font-weight:700; text-align:right; white-space:nowrap; flex:none;}
.it .pr small{display:block; font-weight:400; font-size:11px; color:var(--ink3); white-space:normal; max-width:105px;}

/* ============================================================ sheet */
.sheet{position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.55); display:flex;
  align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .22s;
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);}
.sheet.on{opacity:1; pointer-events:auto;}
.sheet > div{
  background:var(--bg); width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
  border-radius:22px 22px 0 0; border-top:1px solid var(--line);
  padding:8px calc(var(--safe-r) + 18px) calc(var(--safe-b) + 20px) calc(var(--safe-l) + 18px);
  transform:translateY(26px); transition:transform .28s var(--spring);
  -webkit-overflow-scrolling:touch;
}
.sheet.on > div{transform:none;}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px;}
.sheet h3{margin:0 0 6px; font-size:21px; font-weight:800; letter-spacing:-.025em;}
.warnbox{
  background:var(--warn-dim); border:1px solid color-mix(in srgb, var(--warn) 26%, transparent);
  border-radius:var(--r-in); padding:13px 15px; font-size:13.5px; line-height:1.55;
}
.empty{padding:30px 18px; text-align:center; color:var(--ink3); font-size:14px; line-height:1.5;}
a{color:var(--accent);}
.tip{position:fixed; z-index:99; pointer-events:none; opacity:0; background:var(--ink); color:var(--bg);
  font-size:12.5px; line-height:1.4; padding:9px 12px; border-radius:10px; max-width:250px;
  transition:opacity .14s; font-weight:500;}
.tip.on{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1 id="h1">Гараж</h1>
    <button id="sbtn" aria-label="Синхронизация">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 01-9 9 9 9 0 01-7.5-4M3 12a9 9 0 019-9 9 9 0 017.5 4"/><path d="M21 3v4h-4M3 21v-4h4"/></svg>
      <span id="sdot"></span>

</header>

<main>

  <div class="view" id="v-service"></div>
  <div class="view" id="v-money"></div>
  <div class="view" id="v-frames"></div>
  <div class="view" id="v-build"></div>
</main>

<nav id="nav"></nav>
<div class="sheet" id="sheet"><div id="sheetbody"></div></div>
<div class="tip" id="tip"></div>

e":"Освобождаются: вместо них XT M8120"},{"n":"Роторы стоковые","d":"","note":"Освобождаются: вместо них XT SM RT86"},{"n":"Руль стоковый","d":"","note":"Освобождается: вместо него Toseek Carbon 720"},{"n":"Вынос стоковый","d":"","x":1,"note":"В смете замены нет — похоже, остаётся на Twitter. Уточни, свободен ли, иначе вынос придётся купить"},{"n":"Подседельный штырь стоковый","d":"","note":"Освобождается: вместо него Seat post 31.6×350"},{"n":"Седло стоковое","d":"","note":"Освобождается: вместо него Selle Royal Vivo Relaxed"},{"n":"Грипсы стоковые","d":"","note":"Освобождаются: вместо них ODI"},{"n":"Педали стоковые","d":"","note":"Освобождаются: вместо них HT PA12"}]},{"g":"Порыться в остатках","items":[{"n":"Тормоза Shimano Deore M6100","d":"","x":1,"note":"В ранней версии сметы стояли у Наташи, в финальной у неё XT M8120. Если комплект куплен и не пригодился — он свободен"},{"n":"Роторы из остатков","d":"RT-76 / RT86 / что осталось","x":1,"note":"Посмотри размер: 160 или 180 — под него подбираются адаптеры"},{"n":"Лишние камеры, ободные ленты, ниппеля","d":"","x":1},{"n":"Болты, шайбы, заглушки из коробок других сборок","d":"","x":1}]},{"g":"Чего в стоке нет — докупить","items":[{"n":"Лапка переключателя под Speedone","d":"","x":1,"note":"Уникальна для каждой рамы, со стока не переставить. Самая частая причина, почему сборка встаёт на неделю"},{"n":"Хомут подседельного штыря","d":"","x":1,"note":"Если не в комплекте рамы — под замеренный диаметр"},{"n":"Звёздочка (или expander) в шток + крышка + спейсеры","d":"","x":1,"note":"Под алюминиевый шток — звёздочка, под карбон — expander"},{"n":"Тросы и рубашки переключения","d":"Deore 12s — механика","x":1,"note":"Старый трос после перетяжки лучше не ставить, стоит копейки"},{"n":"Цепь — проверить длину","d":"","x":1,"note":"Задний треугольник другой длины: звеньев может не хватить"},{"n":"Замок цепи","d":"","x":1},{"n":"Ось 12×148 Boost","d":"","x":1,"note":"Если не пришла в комплекте с рамой — без неё колесо не пос <script>
"use strict";
/* ============================================================ data */
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const BIKES = DATA.bikes, RULES = DATA.maintenance, FRAMES = DATA.frames, CHECKLISTS = DATA.checklists;
const BIKE = Object.fromEntries(BIKES.map(b => [b.id, b]));
const RULE = Object.fromEntries(RULES.map(r => [r.id, r]));
const CATS = {
  drivetrain:  {label:'Трансмиссия'},
  brakes:      {label:'Тормоза'},
  wheels:      {label:'Колёса'},
  suspension:  {label:'Подвеска'},
  consumables: {label:'Расходники'}
};
const EMOJI = {'гравий':'🚵','МТБ хардтейл':'⛰️','детский':'🧒'};
/* one hue per bike, fixed, never reused for anything else */
const HUE = id => 'var(--b' + (BIKE[id] ? BIKE[id].colorSlot : 1) + ')';
const SHORT = (() => {
  const first = {};
  for (const b of BIKES) first[b.name.split(' ')[0]] = (first[b.name.split(' ')[0]] || 0) + 1;
  return Object.fromEntries(BIKES.map(b => {
    const w = b.name.split(' ');
    return [b.id, first[w[0]] > 1 ? (w[1] || w[0]) : w[0]];
  }));
})();

/* ============================================================ utils */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rub = n => (n==null ? '—' : Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ') + ' ₽');
const km  = n => (n==null ? '—' : Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ') + ' км');
const slug = s => String(s).toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'-').replace(/^-|-$/g,'').slice(0,48);
const uid = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const YEAR = new Date().getFullYear();

/* ============================================================ storage */
const LS = 'bikes:v1';
const SYNC_URL_KEY = 'bikes:syncUrl', SYNC_TOK_KEY = 'bikes:syncKey';
const blankDoc = () => ({ v:1, mtime:0, odo:{}, annualKm:{}, ownership:{}, events:[], checks:{}, photos:{}, migratedAt:null });

let local = { rev:0, doc:blankDoc(), dirty:false, lastSync:null };
try {
  const raw = localStorage.getItem(LS);
  if (raw) { const p = JSON.parse(raw); local = Object.assign(local, p); local.doc = Object.assign(blankDoc(), p.doc); }
} catch(e) { /* corrupt cache — start blank, the cloud copy and seed refill it */ }

const DOC = () => local.doc;

function persist(markDirty) {
  if (markDirty !== false) { local.dirty = true; local.doc.mtime = Date.now(); }
  try { localStorage.setItem(LS, JSON.stringify(local)); }
  catch(e) { toast('Не хватило места в браузере — уменьшите число фото'); }
  paintSync();
}

function stableId(groupName, itemName){ return slug(groupName) + '/' + slug(itemName); }

/* R1 — positional "gi-ii" ticks resolve only against the UNMODIFIED arrays, so
   this runs before anything touches content. Old keys stay as the only rollback. */
function migrateChecks() {
  if (DOC().migratedAt) return 0;
  let n = 0;
  for (const [key, groups] of Object.entries(CHECKLISTS)) {
    let old = {};
    try { old = JSON.parse(localStorage.getItem(key) || '{}'); } catch(e) { old = {}; }
    const map = DOC().checks[key] || (DOC().checks[key] = {});
    groups.forEach((g, gi) => g.items.forEach((it, ii) => {
      if (old[gi + '-' + ii]) { map[stableId(g.g, it.n)] = 1; n++; }
    }));
  }
  DOC().migratedAt = new Date().toISOString();
  persist(n > 0);   // nothing migrated => no fresh mtime, or an empty doc outranks the cloud
  return n;
}

/* R4 — if storage was evicted and we are offline, the committed seed refills history */
function applySeed() {
  const seed = DATA.log || {};
  const d = DOC();
  const have = new Set(d.events.map(e => e.id));
  let n = 0;
  (seed.events || []).forEach(e => { if (!have.has(e.id)) { d.events.push(e); n++; } });
  for (const [k, v] of Object.entries(seed.odo || {})) if (d.odo[k] == null) { d.odo[k] = v; n++; }
  if (n) persist(true);
  return n;
}

/* ============================================================ sync */
let syncUrl = localStorage.getItem(SYNC_URL_KEY) || '';
let syncTok = localStorage.getItem(SYNC_TOK_KEY) || '';
let syncState = 'off', syncMsg = '';

function mergeDocs(mine, theirs) {
  const newer = (theirs.mtime || 0) >= (mine.mtime || 0) ? theirs : mine;
  const older = newer === theirs ? mine : theirs;
  const out = Object.assign({}, newer);

  // events: union by id, latest write per id wins (tombstones included, so a
  // delete survives the merge instead of being resurrected by the other side)
  const byId = new Map();
  for (const e of [...(theirs.events||[]), ...(mine.events||[])]) {
    const prev = byId.get(e.id);
    if (!prev || (e.mtime||0) >= (prev.mtime||0)) byId.set(e.id, e);
  }
  out.events = [...byId.values()];

  // Maps merge KEY BY KEY, never wholesale. A device whose storage Safari just
  // evicted boots with empty maps and a fresh mtime — replacing the map wholesale
  // would let it blank out the odometer for every bike in the cloud.
  for (const k of ['odo', 'annualKm', 'photos', 'ownership'])
    out[k] = Object.assign({}, older[k] || {}, newer[k] || {});

  out.checks = {};
  for (const key of new Set([...Object.keys(older.checks||{}), ...Object.keys(newer.checks||{})]))
    out.checks[key] = Object.assign({}, (older.checks||{})[key], (newer.checks||{})[key]);

  out.migratedAt = mine.migratedAt || theirs.migratedAt || null;
  out.mtime = Math.max(mine.mtime||0, theirs.mtime||0);
  return out;
}

async function pull() {
  const r = await fetch(syncUrl, { headers:{ 'authorization':'Bearer ' + syncTok } });
  if (r.status === 401) throw new Error('Ключ синхронизации не подошёл');
  if (!r.ok) throw new Error('Сервер ответил ' + r.status);
  return r.json();
}

async function push(rev, doc) {
  const r = await fetch(syncUrl, {
    method:'PUT',
    headers:{ 'authorization':'Bearer ' + syncTok, 'content-type':'application/json', 'if-match':String(rev) },
    body: JSON.stringify(doc)
  });
  if (r.status === 409) return null;
  if (r.status === 401) throw new Error('Ключ синхронизации не подошёл');
  if (!r.ok) throw new Error('Сервер ответил ' + r.status);
  return r.json();
}

let syncing = false;
async function sync(silent) {
  if (!syncUrl || !syncTok) { syncState = 'off'; paintSync(); return; }
  if (syncing) return;
  syncing = true; syncState = 'busy'; paintSync();
  try {
    const remote = await pull();
    if (remote.rev !== local.rev || local.dirty) {
      local.doc = remote.doc ? mergeDocs(local.doc, remote.doc) : local.doc;
      local.rev = remote.rev;
    }
    if (local.dirty || (remote.doc && JSON.stringify(remote.doc) !== JSON.stringify(local.doc))) {
      let res = await push(local.rev, local.doc);
      if (res === null) {
        const again = await pull();
        local.doc = mergeDocs(local.doc, again.doc || blankDoc());
        local.rev = again.rev;
        res = await push(local.rev, local.doc);
        if (res === null) throw new Error('Конфликт записи, попробуйте ещё раз');
      }
      local.rev = res.rev;
    }
    local.dirty = false; local.lastSync = Date.now(); syncState = 'on'; syncMsg = '';
    try { localStorage.setItem(LS, JSON.stringify(local)); } catch(e){}
    render();
  } catch (err) {
    syncState = 'err'; syncMsg = err.message;
    if (!silent) toast(err.message);
  } finally {
    syncing = false; paintSync();
  }
}

function paintSync() {
  const dot = $('sdot');
  if (!syncUrl || !syncTok) dot.className = '';
  else if (syncState === 'busy') dot.className = '';
  else if (syncState === 'err') dot.className = 'err';
  else if (local.dirty) dot.className = 'dirty';
  else dot.className = 'on';
}

function syncLine() {
  if (!syncUrl || !syncTok) return 'Только на этом устройстве';
  if (syncState === 'busy') return 'Синхронизирую…';
  if (syncState === 'err') return syncMsg || 'Ошибка синхронизации';
  if (local.dirty) return 'Есть несохранённые изменения';
  const ago = local.lastSync ? Math.round((Date.now() - local.lastSync)/60000) : null;
  return ago == null ? 'Синхронизировано'
    : ago < 1 ? 'Синхронизировано только что'
    : ago < 60 ? 'Синхронизировано ' + ago + ' мин назад'
    : 'Синхронизировано ' + Math.round(ago/60) + ' ч назад';
}

/* ============================================================ aggregation */
const evCost = e => (Number(e.partCost)||0) + (Number(e.labourCost)||0);
const liveEvents = () => DOC().events.filter(e => !e.deleted);
const eventsOf = (bikeId, year) => liveEvents().filter(e =>
  (!bikeId || e.bike === bikeId) && (!year || Number(e.date.slice(0,4)) === year));

/* Ownership: the static file carries the baseline, the synced doc carries the
   user's edits (sale date and price). A sold bike keeps its spend history but
   drops out of maintenance and forecasting — you do not service what you sold. */
function ownershipOf(id) {
  const o = (DOC().ownership || {})[id] || {};
  const base = (BIKE[id] && BIKE[id].ownership) || 'owned';
  return { state: o.state || base, soldDate: o.soldDate || null,
           soldPrice: o.soldPrice == null ? null : Number(o.soldPrice) };
}
const isOwned = id => ownershipOf(id).state === 'owned';
const ownedBikes = () => BIKES.filter(b => isOwned(b.id));
const soldBikes  = () => BIKES.filter(b => !isOwned(b.id));

function yearCost(bikeId, year){ return eventsOf(bikeId, year).reduce((s,e)=>s+evCost(e), 0); }

function categorySplit(bikeId, year) {
  const out = {};
  for (const k of Object.keys(CATS)) out[k] = 0;
  for (const e of eventsOf(bikeId, year)) {
    const c = e.category || (RULE[e.rule] && RULE[e.rule].category) || 'consumables';
    out[c] = (out[c] || 0) + evCost(e);
  }
  return out;
}

/* null, never 0 or Infinity, when the odometer is unset — an unknown ratio is
   not a cheap one. */
function costPerKm(bikeId, year) {
  const odo = Number(DOC().odo[bikeId]);
  if (!odo || odo <= 0) return null;
  return yearCost(bikeId, year) / odo;
}

function purchaseTotal(bikeId){
  const b = BIKE[bikeId];
  const items = (b.components||[]).reduce((s,c)=>s+(Number(c.purchasePrice)||0), 0);
  // bikes bought whole have no itemised list, only a total
  return items || Number(b.totalSpend) || 0;
}

/* what the bike actually cost: everything put in, minus what it sold for */
function netCost(bikeId) {
  const sold = ownershipOf(bikeId).soldPrice;
  return purchaseTotal(bikeId) + eventsOf(bikeId).reduce((s,e)=>s+evCost(e), 0) - (sold || 0);
}

function forecast(bikeId) {
  if (!isOwned(bikeId)) return [];
  const annual = Number(DOC().annualKm[bikeId]) || 0;
  const rows = [];
  for (const r of RULES) {
    if (!r.bikes.includes(bikeId)) continue;
    const last = eventsOf(bikeId).filter(e => e.rule === r.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
    // "каждые N км или M месяцев — что наступит раньше" = whichever trigger fires
    // more often over a year. Backlog already accrued is not a recurring cost.
    const perYear = Math.max(12 / r.interval_months, annual ? annual / r.interval_km : 0);
    const unit = defaultPartCost(bikeId, r) + (Number(r.est_labour_cost) || 0);
    rows.push({ rule:r, times:perYear, cost:perYear * unit, unit, last });
  }
  return rows.sort((a,b)=>b.cost-a.cost);
}

function matchComponent(bikeId, rule) {
  const b = BIKE[bikeId]; if (!b || !rule.part_keywords || !rule.part_keywords.length) return null;
  for (const kw of rule.part_keywords) {
    const hit = (b.components||[]).find(c => (c.part||'').toLowerCase().includes(kw.toLowerCase()));
    if (hit && hit.purchasePrice) return hit;
  }
  return null;
}

/* A rule with est_part_cost 0 consumes no part — it is an inspection or an
   adjustment. It must never inherit the price of the component it inspects,
   or a headset check gets billed at the price of the frameset. */
function defaultPartCost(bikeId, rule) {
  if (!Number(rule.est_part_cost)) return 0;
  const c = matchComponent(bikeId, rule);
  return c ? Number(c.purchasePrice) : Number(rule.est_part_cost);
}

function dueStatus(bikeId, rule) {
  const odo = Number(DOC().odo[bikeId]);
  const last = eventsOf(bikeId).filter(e => e.rule === rule.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if (!last) return { state:'unknown', text:'нет записей' };
  const lastOdo = Number(last.odo);
  const months = (Date.now() - new Date(last.date).getTime()) / (1000*60*60*24*30.44);
  const byMon = months / rule.interval_months;
  const byKm  = (odo && lastOdo != null) ? (odo - lastOdo) / rule.interval_km : 0;
  const p = Math.max(byMon, byKm);
  const left = (odo && lastOdo != null) ? Math.round(rule.interval_km - (odo - lastOdo)) : null;
  if (p >= 1) return { state:'due',  text:'пора', p, left };
  if (p >= .8) return { state:'soon', text:'скоро', p, left };
  return { state:'ok', text:'в норме', p, left };
}

/* everything that wants doing, worst first — this drives the home screen */
function attention() {
  const out = [];
  for (const b of ownedBikes())
    for (const r of RULES) {
      if (!r.bikes.includes(b.id)) continue;
      const st = dueStatus(b.id, r);
      if (st.state === 'due' || st.state === 'soon') out.push({ bike:b, rule:r, st });
    }
  return out.sort((a,b) => (a.st.state === b.st.state) ? b.st.p - a.st.p
                          : a.st.state === 'due' ? -1 : 1);
}

/* ============================================================ charts
   Colour encodes the BIKE everywhere — it is this app's entity. Magnitude
   comparisons that are not per-bike use one hue and length, plus a value label
   on every bar and a table underneath. */
function barRows(rows) {
  const max = Math.max(1, ...rows.map(r => r.value));
  return rows.map(r => `
    <div style="padding:12px 16px${r.i ? ';border-top:1px solid var(--line)' : ''}">
      <div class="spread">
        <span style="font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%">${esc(r.label)}</span>
        <span class="num" style="font-size:14.5px;font-weight:700">${esc(r.text)}</span>
      </div>
      ${r.sub ? `<div class="tiny" style="margin-top:2px">${esc(r.sub)}</div>` : ''}
      <div class="track"><div class="fill" style="width:${Math.max(2, r.value/max*100)}%;background:${r.color||'var(--accent)'}"></div></div>
    </div>`).join('');
}

  h += `<div class="lbl">История обслуживания${evs.length?` <span class="n">${evs.length}</span>`:''}</div>`;

function viewMoney() {
  const sel = moneyBike === 'all' ? null : moneyBike;
  let h = `<div class="seg">
    <button data-mbike="all" class="${moneyBike==='all'?'on':''}">Все</button>
    ${BIKES.map(b=>`<button data-mbike="${b.id}" class="${moneyBike===b.id?'on':''}">${esc(SHORT[b.id])}</button>`).join('')}
  </div>`;

  const total = yearCost(sel, YEAR);
  const evs = eventsOf(sel, YEAR);

  h += `<div class="card pad">
    <div class="tiny">Обслуживание за ${YEAR}</div>
    <div class="hero num" style="margin-top:4px">${rub(total)}</div>
    <div class="tiny" style="margin-top:5px">${evs.length} ${evs.length===1?'запись':evs.length<5?'записи':'записей'}${sel?'':' по всем велосипедам'}</div>
  </div>`;

  if (!evs.length) {
    h += `<div class="card" style="margin-top:10px"><div class="calm">
      <div class="ic">📋</div><div class="t">Записей за ${YEAR} пока нет</div>
      <div class="s">Графики соберутся сами, как только появится первая запись об обслуживании.</div></div></div>`;
    /* ownership summary is still worth showing */
    h += ownershipSummary(sel);
    $('v-money').innerHTML = h; return;
  }

  /* per bike — colour is bike identity */
  if (!sel) {
    const rows = BIKES.map(b => ({ id:b.id, label:b.name, value:yearCost(b.id,YEAR),
                                   text:rub(yearCost(b.id,YEAR)), color:HUE(b.id) }))
      .filter(r=>r.value>0).sort((a,b)=>b.value-a.value).map((r,i)=>Object.assign(r,{i}));
    if (rows.length) h += `<div class="lbl">По велосипедам</div><div class="card">${barRows(rows)}</div>`;
  }

  /* categories — magnitude, one hue, every bar labelled, table underneath */
  const split = categorySplit(sel, YEAR);
  const used = Object.keys(split).filter(k=>split[k]>0).sort((a,b)=>split[b]-split[a]);
  if (used.length) {
    h += `<div class="lbl">По категориям</div><div class="card">${
      barRows(used.map((k,i)=>({ label:CATS[k].label, value:split[k], text:rub(split[k]),
                                 sub:Math.round(split[k]/total*100)+'% от суммы', i })))}</div>`;
  }

  /* cost per km */
  const bl = sel ? [BIKE[sel]] : ownedBikes();
  h += `<div class="lbl">Стоимость километра</div><div class="card">`;
  h += bl.map(b => {
    const c = costPerKm(b.id, YEAR);
    return `<div class="row"><span class="dotc" style="background:${HUE(b.id)}"></span>
      <span class="rl"><span class="rt">${esc(b.name)}</span>
      <span class="rs">${DOC().odo[b.id]?km(DOC().odo[b.id]):'пробег не указан'}</span></span>
      <span class="rv num">${c==null?'—':c.toFixed(2)+' ₽/км'}</span></div>`;
  }).join('');
  h += `</div><div class="tiny" style="margin-top:9px">Где пробега нет, значение пустое, а не ноль — неизвестное не значит дешёвое.</div>`;

  /* biggest line items */
  const top = evs.slice().sort((a,b)=>evCost(b)-evCost(a)).slice(0,8);
  if (top.length) {
    h += `<div class="lbl">Самые дорогие позиции</div><div class="card">${
      barRows(top.map((e,i)=>({
        label: e.part || (RULE[e.rule]?RULE[e.rule].task:'Работа'),
        sub: (sel?'':BIKE[e.bike].name + ' · ') + e.date,
        value: evCost(e), text: rub(evCost(e)), color: HUE(e.bike), i })))}</div>`;
  }

  /* forecast */
  const fb = (sel ? [BIKE[sel]] : ownedBikes()).filter(b => isOwned(b.id));
  const fRows = fb.map(b => ({ b, rows: forecast(b.id).filter(r=>r.cost>0) })).filter(x => x.rows.length);
  if (fRows.length) {
    h += `<div class="lbl">Прогноз на ${YEAR+1}</div>`;
    for (const {b, rows} of fRows) {
      const annual = Number(DOC().annualKm[b.id]) || 0;
      const sum = rows.reduce((s,r)=>s+r.cost,0);
      h += `<div class="card"><div class="pad" style="padding-bottom:10px">
        <div class="spread"><span style="font-weight:700;display:flex;align-items:center;gap:8px">
          <span class="dotc" style="background:${HUE(b.id)}"></span>${esc(b.name)}</span>
          <span class="num" style="font-weight:800">≈ ${rub(sum)}</span></div>
        <div class="tiny" style="margin-top:5px">${annual
          ? 'При годовом пробеге ' + km(annual) + '.'
          : 'Годовой пробег не задан — считаю только по календарным интервалам. Укажите его в карточке, чтобы учитывались километры.'}</div>
        </div>
        <details><summary><span class="arw">▶</span><span style="flex:1;font-size:14px">Из чего складывается</span></summary>
        <div class="dbody"><div class="scroll"><table>
          <thead><tr><th>Работа</th><th class="n">Раз в год</th><th class="n">Стоимость</th></tr></thead>
          <tbody>${rows.slice(0,10).map(r=>`<tr><td class="wrap">${esc(r.rule.task)}</td>
            <td class="n">${r.times.toFixed(1)}</td><td class="n">${rub(r.cost)}</td></tr>`).join('')}</tbody>
        </table></div></div></details></div>`;
    }
  }

  h += ownershipSummary(sel);
  $('v-money').innerHTML = h;
}

function ownershipSummary(sel) {
  const list = sel ? [BIKE[sel]] : BIKES;
  const sold = list.filter(b => !isOwned(b.id));
  if (!sold.length) return '';
  let h = `<div class="lbl">Проданные — итог владения</div><div class="card">`;
  h += sold.map(b => {
    const own = ownershipOf(b.id);
    const inv = purchaseTotal(b.id) + eventsOf(b.id).reduce((s,e)=>s+evCost(e),0);
    return `<div class="row"><span class="dotc" style="background:${HUE(b.id)}"></span>
      <span class="rl"><span class="rt">${esc(b.name)}</span>
      <span class="rs">вложено ${rub(inv)}${own.soldPrice?' · продан за '+rub(own.soldPrice):' · цена продажи не указана'}${own.soldDate?' · '+own.soldDate:''}</span></span>
      <span class="rv num">${rub(netCost(b.id))}</span></div>`;
  }).join('');
  h += `</div><div class="tiny" style="margin-top:9px">Итог — сколько велосипед стоил за всё время: вложено минус выручено. Цену продажи впишите в его карточке.</div>`;
  return h;
}

/* ---------------------------------------------------------- frames */
function viewFrames() {
  const ranked = FRAMES.filter(f => f.total != null).sort((a,b)=>b.total-a.total);
  const excluded = FRAMES.filter(f => f.total == null);
  const cohorts = {};
  for (const f of ranked) (cohorts[f.price_basis || 'frame'] || (cohorts[f.price_basis||'frame'] = [])).push(f);

  let h = `<div class="card pad">
    <div class="tiny">Рам в таблице</div>
    <div class="hero num" style="margin-top:4px">${FRAMES.length}</div>
    <div class="tiny" style="margin-top:5px">${ranked.length} в рейтинге · ${excluded.length} исключены из-за TBD</div>
  </div>
  <div class="warnbox" style="margin-top:12px">
    <b>Балл — мой расчёт, а не оценка автора таблицы.</b><br>
    В исходном файле есть легенда с категориями top / ok / nah, но автор не проставил их ни в одной строке — эти заливки встречаются только в самой легенде. Его настоящее мнение — в комментариях, они показаны у каждой рамы.
  </div>
  <div class="seg" style="margin-top:16px">
    <button data-fmode="ranked" class="${framesMode==='ranked'?'on':''}">Рейтинг</button>
    <button data-fmode="excluded" class="${framesMode==='excluded'?'on':''}">Исключено · ${excluded.length}</button>
    <button data-fmode="all" class="${framesMode==='all'?'on':''}">Все · ${FRAMES.length}</button>
  </div>`;

  if (framesMode === 'ranked') {
    const best = ranked[0];
    h += `<div class="lbl">Лучший гравел по расчёту</div>
    <div class="card"><div style="height:3px;background:var(--accent)"></div><div class="pad">
      <div style="font-size:20px;font-weight:800;letter-spacing:-.025em">${esc(best.brand)} ${esc(best.name)}</div>
      <div class="muted" style="margin-top:5px">${best.sum_weight_g?best.sum_weight_g+' г (рама+вилка)':'вес TBD'} · до ${best.tyre_back_mm} мм · ${rub(best.price)}
        <span class="chip">${esc(best.price_basis||'frame')}</span></div>
      ${best.comment?`<div class="muted" style="margin-top:10px"><b>Комментарий автора.</b> «${esc(best.comment)}»</div>`:''}
      <div class="spread" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
        <span class="tiny">Расчётный балл · пропусков ${best.tbd_count}</span>
        <span class="num" style="font-weight:800;font-size:21px">${best.total.toFixed(2)}</span></div>
      ${best.link?`<a href="${esc(best.link)}" target="_blank" rel="noopener"
        style="display:inline-flex;align-items:center;min-height:44px;font-size:13.5px;font-weight:600;margin-top:6px">Сайт производителя ›</a>`:''}
    </div></div>`;

    for (const [basis, list] of Object.entries(cohorts)) {
      h += `<div class="lbl">${basis==='bike'?'Велосипед целиком':basis==='frame+'?'Фреймсет расширенный':'Фреймсет'} <span class="n">${list.length}</span></div>
      <div class="tiny" style="margin:-4px 0 9px">Фреймсеты и целые велосипеды не стоят в одном списке — сравнивать их по одной ценовой шкале нельзя.</div>
      <div class="card scroll"><table>
        <thead><tr><th>Рама</th><th class="n">Балл</th><th class="n">Вес</th><th class="n">Покрышка</th><th class="n">Цена</th><th class="n">TBD</th><th>Комментарий автора</th></tr></thead>
        <tbody>${list.map(frameRow).join('')}</tbody></table></div>`;
    }
    h += `<div class="tiny" style="margin-top:12px">Балл: вес 25%, покрышка 25%, цена 20% (внутри своей ценовой группы), год 15%, каретка 10%, багажный отсек 5%. Без веса, цены или покрышки рама в рейтинг не попадает — иначе она выигрывала бы за счёт отсутствующих данных.</div>`;
  }

  if (framesMode === 'excluded') {
    h += `<div class="lbl">Исключены из рейтинга <span class="n">${excluded.length}</span></div>
    <div class="tiny" style="margin:-4px 0 9px">Не хватает данных для честного сравнения. Медиану вместо TBD не подставляю — это придумало бы цифры, которых нет.</div>
    <div class="card scroll"><table>
      <thead><tr><th>Рама</th><th>Чего не хватает</th><th class="n">Цена</th><th>Комментарий автора</th></tr></thead>
      <tbody>${excluded.map(f=>{
        const miss = [];
        if (!f.sum_weight_g) miss.push('вес');
        if (!f.price) miss.push('цена');
        if (!f.tyre_back_mm) miss.push('покрышка');
        return `<tr><td class="wrap">${esc(f.brand)} ${esc(f.name)}${catTag(f)}</td>
          <td>${miss.join(', ')||'—'}</td><td class="n">${f.price?rub(f.price):'TBD'}</td>
          <td class="wrap">${f.comment?esc(f.comment):'—'}</td></tr>`;
      }).join('')}</tbody></table></div>
    <div class="tiny" style="margin-top:12px">Про вес отдельно: в исходной таблице сумма веса — формула SUM(), которая молча пропускает ячейки с TBD. У Argon 18 Anti Matter вилка TBD, поэтому сумма показывала 950 г — вес одной рамы. Он выглядел бы самым лёгким и выиграл бы по весу. Такие суммы обнулены.</div>`;
  }

  if (framesMode === 'all') {
    h += `<div class="card scroll"><table>
      <thead><tr><th>Рама</th><th class="n">Балл</th><th class="n">Вес</th><th class="n">Цена</th><th>Комментарий автора</th></tr></thead>
      <tbody>${FRAMES.slice().sort((a,b)=>(b.total??-1)-(a.total??-1)).map(f=>
        `<tr><td class="wrap">${esc(f.brand)} ${esc(f.name)}${catTag(f)}</td>
         <td class="n">${f.total!=null?f.total.toFixed(2):'—'}</td>
         <td class="n">${f.sum_weight_g?f.sum_weight_g+' г':'TBD'}</td>
         <td class="n">${f.price?rub(f.price):'TBD'}</td>
         <td class="wrap">${f.comment?esc(f.comment):'—'}</td></tr>`).join('')}
      </tbody></table></div>`;
  }
  $('v-frames').innerHTML = h;
}

function catTag(f) {
  if (f.category === 'not_released') return ' <span class="chip">не вышла / устарела</span>';
  if (f.category === 'upcoming') return ' <span class="chip warn">скоро выйдет</span>';
  return '';
}
function frameRow(f) {
  return `<tr><td class="wrap">${esc(f.brand)} ${esc(f.name)}${catTag(f)}</td>
    <td class="n">${f.total.toFixed(2)}</td>
    <td class="n">${f.sum_weight_g?f.sum_weight_g+' г':'TBD'}</td>
    <td class="n">${f.tyre_back_mm?f.tyre_back_mm+' мм':'TBD'}</td>
    <td class="n">${rub(f.price)}${f.price_basis_assumed?' <span class="chip warn">базис не указан</span>':''}</td>
    <td class="n">${f.tbd_count}</td>
    <td class="wrap">${f.comment?esc(f.comment):'—'}</td></tr>`;
}

/* ---------------------------------------------------------- build */
function viewBuild() {
  const groups = CHECKLISTS[buildKey];
  const checks = DOC().checks[buildKey] || {};
  const names = { 'faraoll-g50-checklist-v3':'Faraoll G50', 'speedone-275-checklist-v1':'Speedone 27.5' };
  const total = groups.reduce((n,g)=>n+g.items.length,0);
  const done = groups.reduce((n,g)=>n+g.items.filter(it=>checks[stableId(g.g,it.n)]).length,0);
  const money = groups.reduce((s,g)=>s+g.items.reduce((t,i)=>t+(i.p||0),0),0);
  const pct = Math.round(done/total*100);

  let h = `<div class="seg">${Object.keys(CHECKLISTS).map(k=>
    `<button data-bkey="${k}" class="${k===buildKey?'on':''}">${esc(names[k]||k)}</button>`).join('')}</div>
  <div class="card pad">
    <div class="spread"><span class="tiny">Отмечено</span>
      <span class="num" style="font-size:15px;font-weight:700">${done} / ${total}</span></div>
    <div class="hero num" style="margin-top:2px">${pct}%</div>
    <div class="track" style="height:10px;margin-top:10px"><div class="fill" style="width:${Math.max(2,pct)}%;background:var(--accent)"></div></div>
    ${money?`<div class="spread" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
      <span class="muted">Сумма по чек-листу</span><span class="num" style="font-weight:700">${rub(money)}</span></div>`:''}
  </div>`;

  groups.forEach((g, gi) => {
    const dn = g.items.filter(it=>checks[stableId(g.g,it.n)]).length;
    const isOpen = localStorage.getItem('c:'+buildKey+':'+gi) !== '1';
    h += `<div class="lbl">${esc(g.g)} <span class="n">${dn}/${g.items.length}</span></div>
      <div class="card"><details data-gi="${gi}"${isOpen?' open':''}>
      <summary><span class="arw">▶</span><span style="flex:1;font-size:14px;color:var(--ink2)">${dn===g.items.length?'всё отмечено':'показать пункты'}</span></summary>
      <div>` +
      g.items.map(it => {
        const id = stableId(g.g, it.n);
        return `<div class="it${checks[id]?' done':''}" data-check="${esc(id)}">
          <span class="box"><svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg></span>
          <span style="flex:1;min-width:0">
            <span class="nm" style="display:block">${esc(it.n)}${it.x?'<span class="chip warn" style="margin-left:7px">проверить</span>':''}</span>
            ${it.d?`<span class="dt" style="display:block">${esc(it.d)}</span>`:''}
            ${it.note?`<span class="note" style="display:block">${esc(it.note)}</span>`:''}
          </span>
          ${it.p?`<span class="pr">${rub(it.p)}${it.pn?`<small>${esc(it.pn)}</small>`:''}</span>`:''}
        </div>`;
      }).join('') + `</div></details></div>`;
  });
  $('v-build').innerHTML = h;
}

/* ============================================================ sheets */
function openEventSheet(bikeId, ruleId) {
  const bid = bikeId || (ownedBikes()[0] || BIKES[0]).id;
  $('sheetbody').innerHTML = `<div class="grab"></div>
    <h3>Запись об обслуживании</h3>
    <p class="tiny">Цена детали подставляется из закупочной цены этого велосипеда, если такая деталь есть в составе.</p>
    <label for="f-bike">Велосипед</label>
    <select id="f-bike">${BIKES.map(b=>`<option value="${b.id}"${b.id===bid?' selected':''}>${esc(b.name)}${isOwned(b.id)?'':' (продан)'}</option>`).join('')}</select>
    <label for="f-rule">Работа по регламенту</label>
    <select id="f-rule"></select>
    <div class="grid2">
      <div><label for="f-date">Дата</label><input id="f-date" type="date" value="${today()}"></div>
      <div><label for="f-odo">Пробег, км</label><input id="f-odo" type="number" inputmode="numeric"></div>
    </div>
    <label for="f-part">Что делали / деталь</label><input id="f-part">
    <div class="grid2">
      <div><label for="f-pc">Цена детали, ₽</label><input id="f-pc" type="number" inputmode="decimal"></div>
      <div><label for="f-lc">Цена работы, ₽</label><input id="f-lc" type="number" inputmode="decimal"></div>
    </div>
    <label for="f-place">Где делали</label><input id="f-place" placeholder="дома / название мастерской">
    <label for="f-note">Заметка</label><textarea id="f-note"></textarea>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn ghost" id="f-cancel">Отмена</button>
      <button class="btn pri" id="f-save">Сохранить</button>
    </div>`;
  const fillRules = () => {
    const b = $('f-bike').value;
    const rs = RULES.filter(r => r.bikes.includes(b));
    $('f-rule').innerHTML = rs.map(r=>`<option value="${r.id}"${r.id===ruleId?' selected':''}>${esc(r.task)}</option>`).join('')
      + '<option value="">— своё, вне регламента —</option>';
    fillDefaults();
  };
  const fillDefaults = () => {
    const b = $('f-bike').value, r = RULE[$('f-rule').value];
    $('f-odo').placeholder = DOC().odo[b] || '';
    if (!r) return;
    const c = matchComponent(b, r);
    $('f-pc').value = defaultPartCost(b, r) || '';
    $('f-lc').value = r.est_labour_cost || '';
    $('f-part').value = c ? c.part + (c.spec ? ' — ' + c.spec : '') : r.task;
  };
  $('f-bike').onchange = fillRules;
  $('f-rule').onchange = fillDefaults;
  fillRules();
  $('f-cancel').onclick = closeSheet;
  $('f-save').onclick = () => {
    const b = $('f-bike').value, r = $('f-rule').value;
    const odo = $('f-odo').value ? Number($('f-odo').value) : (DOC().odo[b] ?? null);
    DOC().events.push({
      id: uid(), mtime: Date.now(), bike: b, rule: r || null,
      category: r ? RULE[r].category : 'consumables',
      date: $('f-date').value || today(), odo,
      part: $('f-part').value.trim(),
      partCost: Number($('f-pc').value) || 0,
      labourCost: Number($('f-lc').value) || 0,
      place: $('f-place').value.trim(),
      note: $('f-note').value.trim()
    });
    if (odo && (!DOC().odo[b] || odo > DOC().odo[b])) DOC().odo[b] = odo;
    persist(); closeSheet(); render(); sync(true);
  };
  $('sheet').classList.add('on');
}

function openSyncSheet() {
  $('sheetbody').innerHTML = `<div class="grab"></div>
    <h3>Синхронизация</h3>
    <p class="tiny">${esc(syncLine())}. Введите адрес и ключ на каждом устройстве — телефон и компьютер будут видеть одни и те же данные. Ключ открывает только этот документ: ни репозиторий, ни аккаунт он не даёт.</p>
    <label for="s-url">Адрес хранилища</label>
    <input id="s-url" value="${esc(syncUrl)}" placeholder="https://…workers.dev" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label for="s-key">Ключ</label>
    <input id="s-key" value="${esc(syncTok)}" placeholder="вставьте ключ" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn ghost" id="s-cancel">Отмена</button>
      <button class="btn pri" id="s-save">Подключить</button>
    </div>
    <div class="lbl" style="margin-top:26px">Резервная копия файлом</div>
    <p class="tiny">Работает и без синхронизации: выгрузит всё в файл — на телефоне уходит через «Поделиться» в Файлы или iCloud.</p>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn" id="s-export">Выгрузить</button>
      <button class="btn" id="s-import">Загрузить</button>
      <input type="file" id="s-file" accept="application/json" style="display:none">
    </div>`;
  $('s-cancel').onclick = closeSheet;
  $('s-save').onclick = () => {
    syncUrl = $('s-url').value.trim().replace(/\/+$/,'');
    syncTok = $('s-key').value.trim();
    localStorage.setItem(SYNC_URL_KEY, syncUrl);
    localStorage.setItem(SYNC_TOK_KEY, syncTok);
    closeSheet(); local.dirty = true; sync();
  };
  $('s-export').onclick = () => {
    const blob = new Blob([JSON.stringify(local.doc, null, 1)], {type:'application/json'});
    const file = new File([blob], 'bikes-backup-' + today() + '.json', {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file]}).catch(()=>{});
    else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    }
  };
  $('s-import').onclick = () => $('s-file').click();
  $('s-file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        local.doc = mergeDocs(local.doc, Object.assign(blankDoc(), JSON.parse(rd.result)));
        persist(); closeSheet(); render(); sync(true); toast('Загружено');
      } catch(err) { toast('Файл не читается'); }
    };
    rd.readAsText(f);
  };
  $('sheet').classList.add('on');
}

function closeSheet(){ $('sheet').classList.remove('on'); }

let tipT;
function toast(msg) {
  const t = $('tip');
  t.textContent = msg;
  t.style.left = '50%'; t.style.top = 'auto';
  t.style.bottom = 'calc(88px + var(--safe-b))';
  t.style.transform = 'translateX(-50%)';
  t.classList.add('on');
  clearTimeout(tipT); tipT = setTimeout(()=>t.classList.remove('on'), 2800);
}

/* ============================================================ render */
function render() {
  renderNav();
  const t = TABS.find(x => x.id === tab);
  const inDetail = openBike && tab === 'garage';
  $('h1').textContent = inDetail ? BIKE[openBike].name : t.title;
  const att = attention();
  $('sub').textContent = inDetail ? (isOwned(openBike) ? BIKE[openBike].owner : 'продан')
    : tab === 'garage' ? `${ownedBikes().length} в парке${soldBikes().length?' · '+soldBikes().length+' продан':''}`
    : tab === 'service' ? (att.length ? `${att.length} к работе` : RULES.length + ' пунктов регламента')
    : tab === 'money' ? YEAR + ' год'
    : tab === 'frames' ? FRAMES.length + ' рам'
    : 'Faraoll G50 и Speedone';
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('v-' + tab).classList.add('on');
  ({garage:viewGarage, service:viewService, money:viewMoney, frames:viewFrames, build:viewBuild})[tab]();
  paintSync();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-bike],[data-back],[data-addevent],[data-delevent],[data-mbike],[data-fmode],[data-smode],[data-bkey],[data-check],[data-att],[data-own]');
  if (!t) { if (e.target === $('sheet')) closeSheet(); return; }

  if (t.dataset.tab)   { tab = t.dataset.tab; openBike = null; render(); window.scrollTo(0,0); return; }
  if (t.dataset.bike)  { openBike = t.dataset.bike; tab = 'garage'; render(); window.scrollTo(0,0); return; }
  if (t.dataset.back)  { openBike = null; render(); return; }
  if (t.dataset.mbike) { moneyBike = t.dataset.mbike; render(); return; }
  if (t.dataset.fmode) { framesMode = t.dataset.fmode; render(); window.scrollTo(0,0); return; }
  if (t.dataset.smode) { serviceMode = t.dataset.smode; render(); window.scrollTo(0,0); return; }
  if (t.dataset.bkey)  { buildKey = t.dataset.bkey; render(); return; }
  if (t.dataset.att)   { const [b,r] = t.dataset.att.split('|'); openEventSheet(b, r); return; }
  if (t.hasAttribute('data-addevent')) { openEventSheet(t.dataset.addevent || openBike, t.dataset.rule); return; }

  if (t.dataset.own) {
    const [id, state] = t.dataset.own.split('|');
    const o = DOC().ownership[id] || (DOC().ownership[id] = {});
    o.state = state;
    persist(); render(); sync(true);
    return;
  }
  if (t.dataset.delevent) {
    const ev = DOC().events.find(x => x.id === t.dataset.delevent);
    if (ev) { ev.deleted = true; ev.mtime = Date.now(); persist(); render(); sync(true); }
    return;
  }
  if (t.dataset.check) {
    const m = DOC().checks[buildKey] || (DOC().checks[buildKey] = {});
    const id = t.dataset.check;
    // an unchecked box is a recorded 0, not a missing key — a key-by-key merge
    // cannot otherwise tell "unchecked here" from "never seen here"
    m[id] = m[id] ? 0 : 1;
    t.classList.toggle('done', !!m[id]);
    persist(); sync(true);
    const d = t.closest('details');
    if (d) {
      const g = CHECKLISTS[buildKey][d.dataset.gi];
      const dn = g.items.filter(it => m[stableId(g.g, it.n)]).length;
      const lbl = d.closest('.card').previousElementSibling;
      if (lbl && lbl.classList.contains('lbl')) lbl.querySelector('.n').textContent = dn + '/' + g.items.length;
    }
    return;
  }
});

document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.tagName === 'DETAILS' && d.dataset.gi != null)
    localStorage.setItem('c:' + buildKey + ':' + d.dataset.gi, d.open ? '0' : '1');
}, true);

document.addEventListener('change', e => {
  const el = e.target;
  const num = v => v === '' ? null : Number(v);
  if (el.dataset.odo)       { DOC().odo[el.dataset.odo] = num(el.value); persist(); render(); sync(true); return; }
  if (el.dataset.annual)    { DOC().annualKm[el.dataset.annual] = num(el.value); persist(); sync(true); return; }
  if (el.dataset.solddate)  { (DOC().ownership[el.dataset.solddate] ||= {}).soldDate = el.value || null; persist(); render(); sync(true); return; }
  if (el.dataset.soldprice) { (DOC().ownership[el.dataset.soldprice] ||= {}).soldPrice = num(el.value); persist(); render(); sync(true); return; }
  if (el.dataset.photo)     {
    const f = el.files[0]; if (!f) return;
    // downscale so a photo costs ~40 KB in the synced document, not 4 MB
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 640 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      DOC().photos[el.dataset.photo] = c.toDataURL('image/jpeg', .72);
      URL.revokeObjectURL(img.src);
      persist(); render(); sync(true);
    };
    img.src = URL.createObjectURL(f);
  }
});

$('sbtn').onclick = openSyncSheet;

/* ============================================================ boot */
const migrated = migrateChecks();   // R1 — before anything touches content
applySeed();                        // R4 — repopulate after storage eviction
render();
if (migrated) toast('Перенесено отмеченных пунктов: ' + migrated);
if (syncUrl && syncTok) sync(true);
window.addEventListener('online', () => sync(true));
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(true); });
</script>
</body>
</html>
